# Render Blueprint for the ELT Guide app (elt-app/). See elt-app/README.md, "Put it online".
services:
  - type: web
    name: elt-guide
    runtime: node
    plan: free
    rootDir: elt-app
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /api/manifest
    envVars:
      - key: NODE_VERSION
        value: "22"
