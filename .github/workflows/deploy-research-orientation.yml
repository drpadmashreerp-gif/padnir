# Builds the Research Methodology Orientation book and publishes it on GitHub Pages.
# One-time setup (repository Settings): Pages → Source: "GitHub Actions";
# Secrets and variables → Actions → Variables: VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY.
name: Deploy book to GitHub Pages

on:
  push:
    paths: ['research-orientation-app/**', '.github/workflows/deploy-research-orientation.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Publishes only from the repository's default branch (GitHub Pages allows only that branch by default).
    # Skipped when the repository is private (the book is then hosted on Netlify; see SETUP.md).
    if: github.ref_name == github.event.repository.default_branch && !github.event.repository.private
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-orientation-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: research-orientation-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PRIVATE_CONTENT: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research-orientation-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
