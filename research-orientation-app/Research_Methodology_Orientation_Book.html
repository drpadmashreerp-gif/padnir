omplete:"ಪೂರ್ಣ",search:"ಪುಸ್ತಕದಲ್ಲಿ ಹುಡುಕಿ…"},se={en:Np,kn:Cp},M=[{id:"m1",no:1,hours:5,title:"Foundations of Educational Research",titleKn:"ಶೈಕ್ಷಣಿಕ ಸಂಶೋಧನೆಯ ಅಡಿಪಾಯ",objectives:['Explain what makes an inquiry "research" rather than opinion or reporting.',"Distinguish basic, applied, evaluation and action research.","Relate research paradigms (positivist, interpretivist, critical, pragmatic) to questions DIETs ask.","Describe the research mandate of DIETs, DSERT and the State research ecosystem."],lessons:[{title:"What is educational research?",body:["Educational research is systematic, transparent inquiry into teaching, learning and the systems around them. It starts with a question, gathers evidence in a planned way, analyses it openly, and reports so that others can check and use the findings.","Three tests help separate research from routine reporting: (1) Is there a clear question? (2) Is the method planned before data are collected? (3) Can another person follow the steps and judge the conclusion?"]},{title:"Types and paradigms",body:["Basic research builds theory (e.g. how children acquire reading in a second script). Applied research solves a known problem (why Grade 6 mathematics scores dip). Evaluation research judges a programme against its goals. Action research is done by practitioners to improve their own practice in cycles.","Paradigms are beliefs about knowledge. Positivist studies measure and test; interpretivist studies seek meanings people give to experience; critical studies examine power and equity; pragmatic studies use whatever method answers the question best. Most DIET studies are pragmatic."]},{title:"The research cycle",body:["Identify a problem → review literature → frame questions or hypotheses → choose design and sample → build and pilot tools → seek ethical clearance → collect data → analyse → interpret → report and share → use findings.","A study is only as strong as its weakest step. The commonest weakness in district studies is a vague question, which then produces a tool that measures everything and answers nothing."]}],karnataka:[{title:"The research mandate in Karnataka",text:["DSERT is the State academic authority for school education in Karnataka. It sets the research agenda, trains DIET faculty and publishes research compendia. Each DIET is expected to carry out district-level studies that inform teacher education and classroom practice, often with CRPs and BRPs as field partners.","Ask: of the studies your DIET completed in the last three years, how many changed a training module, a district plan or a classroom practice? That is the real test of research use."]},{title:"Classifying real district questions",text:['"Does Sethubandha (the start-of-year bridge programme) close learning gaps in Grade 4?" — evaluation research.','"How do teachers in Lambani tandas in Vijayapura use the home language during Kannada lessons?" — interpretivist, qualitative.',`"Can I raise my D.El.Ed. trainees' questioning skills through micro-teaching?" — action research by a DIET lecturer.`]}],activity:{title:"Sort the studies",prompt:"List three studies done at your DIET. For each, note its type (basic / applied / evaluation / action), its paradigm, and one decision it informed (or could have)."},tools:["rq"],quiz:[{q:"A DIET studies whether Kalika Chetarike learning-recovery materials met their stated goals. This is best called…",options:["Basic research","Evaluation research","Historical research","Action research"],answer:1,why:"It judges a programme against its own objectives."},{q:"Which feature most separates research from a monitoring report?",options:["Use of tables","A planned method to answer a stated question","Length of the report","Signature of an officer"],answer:1,why:"Research begins from a question and a method fixed before data collection."},{q:'A study of the meanings SDMC members give to "a good school" sits mainly in which paradigm?',options:["Positivist","Interpretivist","Experimental","Econometric"],answer:1,why:"It seeks participants' meanings, not measurement."},{q:"The pragmatic paradigm means…",options:["Only surveys are allowed","The question decides the method","Qualitative data are ignored","No theory is needed"],answer:1,why:"Pragmatists choose methods for fitness to the question."}]},{id:"m2",no:2,hours:3,title:"Research Ethics and Integrity",titleKn:"ಸಂಶೋಧನಾ ನೈತಿಕತೆ ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆ",objectives:["Apply respect, beneficence and justice to studies with children and teachers.","Obtain informed consent from parents and assent from children.","Protect identity and data, including SATS identifiers.","Recognise plagiarism, fabrication and falsification."],lessons:[{title:"Core principles",body:['Respect for persons: people decide freely whether to take part. Beneficence: maximise benefit, minimise harm. Justice: the burden and benefit of research are shared fairly — the same few "convenient" schools should not be studied every year.',"Children cannot consent on their own. Seek written consent from a parent or guardian and simple oral or pictorial assent from the child, in the language the child speaks at home."]},{title:"Ethics review",body:["An ethics (institutional review) process checks the protocol before fieldwork: purpose, risks, consent forms, data storage and how findings return to the community. A DIET can form a small ethics committee with a senior lecturer, an external academic and a community member.","Permission from the Block Education Officer to enter schools is administrative permission. It does not replace informed consent from participants."]},{title:"Integrity",body:["Fabrication (inventing data), falsification (altering data) and plagiarism (using others' words or ideas without credit) are the three serious breaches. Copying a questionnaire from another study is acceptable only with citation and, where required, permission.","Keep raw data, field notes and analysis files so another person can trace any reported figure back to its source."]}],karnataka:[{title:"Using SATS data responsibly",text:["The Student Achievement Tracking System (SATS) holds identifiable records of every child in Karnataka's schools. A DIET may use SATS or LBA portal data for research only with departmental permission, and should replace SATS IDs with study codes before analysis. Never publish a child's name, SATS number or school with a small enrolment that makes children identifiable."]},{title:"Case: photographs in a Nali Kali classroom",text:["A researcher photographs children in a Nali Kali (multigrade, activity-based, Classes 1–3) classroom for a report. Parents were not asked. Is this acceptable? No: images identify children. Seek parental consent, avoid faces where possible, and do not post on social media."]}],activity:{title:"Ethics decision tree",prompt:"Run your planned study through the ethics decision tree. Record which safeguards you need and draft a two-line consent statement in Kannada for parents.",tool:"ethics"},tools:["ethics"],quiz:[{q:"A BEO has approved school visits. Do you still need parental consent to test children?",options:["No, BEO approval is enough","Yes, consent is separate from administrative permission","Only for private schools","Only in urban areas"],answer:1,why:"Administrative permission does not replace individual consent."},{q:"Before analysing SATS records you should…",options:["Publish IDs for transparency","Replace SATS IDs with study codes","Share the file on WhatsApp for team access","Delete all records after one day"],answer:1,why:"Pseudonymisation protects children."},{q:"Changing a few post-test scores so a programme looks effective is…",options:["Fabrication","Falsification","Plagiarism","Triangulation"],answer:1,why:"Altering real data is falsification."},{q:"Assent means…",options:["A child's own agreement in age-appropriate form","A teacher's signature","Approval of the ethics committee","Parental consent"],answer:0,why:"Assent is the child's agreement alongside parental consent."}]},{id:"m3",no:3,hours:4,title:"Identifying Research Problems",titleKn:"ಸಂಶೋಧನಾ ಸಮಸ್ಯೆಗಳ ಗುರುತಿಸುವಿಕೆ",objectives:["Move from a felt difficulty to a researchable problem.","Use existing evidence (NAS, PARAKH, SATS, LBA, earlier DSERT studies) to justify a problem.","Write focused research questions and testable hypotheses.","Define variables operationally."],lessons:[{title:"From concern to problem",body:['A felt difficulty ("children are weak in English") is not yet a problem. Narrow it: who (Grade 5 children in bilingual KPS sections), what (oral comprehension), where (Kalaburagi district), compared with what (Kannada-medium sections), and why it matters (equity for first-generation learners).',"A good problem is significant, researchable with the time and resources you have, ethical, and new enough to add something."]},{title:"Reviewing literature",body:["Search earlier DSERT and DIET compendia, NCERT studies, Shodhganga theses, ERIC and Google Scholar. Read for what is known, how it was measured, and what is still missing (the gap). Keep a reference list from the first day."]},{title:"Questions, hypotheses, variables",body:['Research questions are specific and answerable: "What is the difference in oral reading fluency between Grade 3 children in Nali Kali and non-Nali Kali classrooms in Mysuru district?"','A hypothesis predicts an answer that data can contradict: "Children in classrooms with a functioning library corner will read more words correct per minute than those without." Operational definitions say exactly how each variable is measured (e.g. words correct per minute on a graded Kannada passage).']}],karnataka:[{title:"Finding a gap in State evidence",text:["The State's research background notes (in this repository) report that foundational literacy and numeracy gains made by Grade 3 tend to fade by Grades 6 and 9, especially in mathematics and science. The same notes record that no completed study yet evaluates the LBA portal. Both are ready-made gaps for DIET research.",'Possible question: "Do children who received Sethubandha bridge support in Grade 4 retain their gains at the end of Grade 5?"']},{title:"Narrowing a broad concern",text:['Broad: "Library use is poor." Focused: "How often do Grade 6–8 children in government higher primary schools of Chikkamagaluru district borrow library books, and what school factors are associated with borrowing?"']}],activity:{title:"Build your research question",prompt:"Use the question builder to turn one concern from your district into a focused research question and a hypothesis.",tool:"rq"},tools:["rq","literature"],quiz:[{q:"Which is the most researchable question?",options:["Is education improving in Karnataka?","What is the effect of LBA on Grade 7 mathematics scores in two blocks of Raichur district?","Why are teachers not motivated?","Should English be taught?"],answer:1,why:"It names the population, variable, place and comparison."},{q:'"Reading fluency will be higher where library periods are held weekly" is a…',options:["Research question","Hypothesis","Objective","Limitation"],answer:1,why:"It predicts a testable relationship."},{q:'An operational definition of "reading fluency" would be…',options:["Love of reading","Words correct per minute on a graded passage","Teacher's impression","Number of books in the library"],answer:1,why:"It states exactly how the variable is measured."},{q:'The "gap" in a literature review is…',options:["Missing pages","What is not yet known or not studied in your context","Time between surveys","Difference between boys and girls"],answer:1,why:"The gap justifies the new study."}]},{id:"m4",no:4,hours:6,title:"Quantitative Research Methods",titleKn:"ಪರಿಮಾಣಾತ್ಮಕ ಸಂಶೋಧನಾ ವಿಧಾನಗಳು",objectives:["Choose among survey, correlational, causal-comparative and experimental designs.","Select a sample and calculate its size.","Build reliable and valid tests and questionnaires.","Pick the right statistical test for a question."],lessons:[{title:"Designs",body:["Survey: describes a population (e.g. availability of science labs in high schools). Correlational: examines association (teacher attendance and pupil scores). Causal-comparative: compares existing groups (KPS vs non-KPS schools). Experimental and quasi-experimental: the researcher introduces an intervention and compares with a control or comparison group, ideally with pre- and post-tests.","Correlation is not causation. Schools with libraries may also have better-resourced communities."]},{title:"Sampling",body:["Probability samples (simple random, stratified, cluster, multistage) allow generalisation. Stratify when sub-groups matter — for example by region (Kalyana Karnataka vs others), medium of instruction, or rural/urban. Cluster sampling (choose clusters, then all or some schools within) suits CRC-based fieldwork.","Sample size depends on the confidence level, the margin of error you can accept, and the variability in the population. Use the sample size calculator."]},{title:"Tools and analysis",body:["Reliability is consistency (test–retest, Cronbach's alpha ≥ 0.70 for most scales). Validity is whether a tool measures what it claims (content validity through expert review; construct validity through pattern of results). Always pilot.","Choosing a test: compare two group means → t-test; same group before and after → paired t-test; three or more groups → ANOVA; two categorical variables → chi-square; relationship between two scores → correlation."]}],karnataka:[{title:"Quasi-experiment: Sethubandha in Yadgir",text:["Illustrative design: 20 government lower primary schools in Yadgir district run the Sethubandha bridge programme with an added daily 20-minute reading period (treatment); 20 matched schools run Sethubandha alone (comparison). Grade 4 children take a Kannada reading test in June and again in September. Analyse gain scores with an independent-samples t-test and report effect size (Cohen's d)."]},{title:"Stratified sample of high schools",text:["To survey use of science laboratories across a district with 180 government high schools, stratify by Kannada, English and Urdu medium, then sample randomly within each stratum in proportion to its size."]}],activity:{title:"Plan a sample and a test",prompt:"For a district survey of your choice, calculate the sample size, then enter the illustrative pre/post data in the statistics tool and interpret the result in two sentences.",tool:"sample"},tools:["sample","stats","survey"],quiz:[{q:"You compare SSLC mathematics scores of the same students in a pre-test and post-test. Use…",options:["Chi-square","Paired t-test","Independent t-test","ANOVA"],answer:1,why:"Same students measured twice."},{q:"Comparing mean scores of Kannada, English and Urdu medium schools needs…",options:["Paired t-test","One-way ANOVA","Correlation","Content analysis"],answer:1,why:"Three independent groups."},{q:"Cronbach's alpha tells you about…",options:["Validity","Internal consistency reliability","Sample size","Effect size"],answer:1,why:"Alpha estimates internal consistency."},{q:"A strong correlation between library periods and reading scores proves…",options:["Libraries cause better reading","An association that may have other explanations","Nothing at all","Reading causes libraries"],answer:1,why:"Correlation alone does not establish cause."}]},{id:"m5",no:5,hours:6,title:"Qualitative Research Methods",titleKn:"ಗುಣಾತ್ಮಕ ಸಂಶೋಧನಾ ವಿಧಾನಗಳು",objectives:["Choose among case study, ethnography, phenomenology, narrative and grounded theory.","Conduct semi-structured interviews and focus groups.","Code transcripts and develop themes.","Establish trustworthiness."],lessons:[{title:"Approaches",body:["Case study: in-depth study of a bounded case (one KPS campus). Ethnography: extended observation of a culture (life in an ashram school). Phenomenology: shared lived experience (first-year teachers in single-teacher schools). Narrative: life stories (women head teachers). Grounded theory: building a theory from data."]},{title:"Data collection",body:["Semi-structured interviews use a guide of open questions with probes. Focus groups of 6–8 people suit SDMC members or parents. Observation uses field notes that separate description from interpretation. Record only with consent; transcribe in the original language and translate carefully."]},{title:"Analysis and trustworthiness",body:["Thematic analysis: familiarise → generate initial codes → search for themes → review → define and name themes → write up with quotations. Trustworthiness rests on credibility (member checks, triangulation), transferability (thick description), dependability (audit trail) and confirmability (reflexive notes)."]}],karnataka:[{title:"Case study: a single-teacher school in Uttara Kannada",text:["How does one teacher manage five classes in a hilly-area school? Observe a full week, interview the teacher, SDMC president and three parents, and collect lesson plans. Expect themes such as time-sharing, peer tutoring and use of Nali Kali materials beyond Class 3."]},{title:"Interviews on bilingual sections",text:["The State's notes record that over 60% of tribal students struggled when the medium of instruction differed from their home language. A DIET in Chamarajanagara could interview Soliga parents and teachers about bilingual KPS sections to learn what bridge support children actually need."]}],activity:{title:"Code an interview excerpt",prompt:"Read the teacher interview excerpts in the coding tool, assign codes, and group them into two or three themes.",tool:"coding"},tools:["coding"],quiz:[{q:"Studying one KPS campus in depth over a term is a…",options:["Survey","Case study","Experiment","Meta-analysis"],answer:1,why:"A bounded case studied in depth."},{q:"Member checking means…",options:["Checking attendance","Returning findings to participants to confirm accuracy","Counting codes","Random sampling"],answer:1,why:"Participants confirm interpretations."},{q:"An ideal focus group size is about…",options:["2","6–8","25","50"],answer:1,why:"Large enough for range, small enough for everyone to speak."},{q:"An audit trail supports…",options:["Dependability","Statistical power","Random selection","Generalisation to all States"],answer:0,why:"It lets others follow your decisions."}]},{id:"m6",no:6,hours:4,title:"Mixed Methods Research",titleKn:"ಮಿಶ್ರ ವಿಧಾನ ಸಂಶೋಧನೆ",objectives:["Explain convergent, explanatory sequential and exploratory sequential designs.","Plan the point at which quantitative and qualitative strands meet.","Build a joint display that integrates findings."],lessons:[{title:"Three core designs",body:["Convergent: collect both strands at the same time and compare. Explanatory sequential: quantitative first, then qualitative to explain surprising results. Exploratory sequential: qualitative first to build a tool or hypotheses, then quantitative to test them."]},{title:"Integration",body:["Mixing must happen somewhere — in sampling (choosing interviewees from survey results), in analysis (a joint display table that puts numbers and themes side by side), or in interpretation. Two separate reports stapled together are not mixed methods."]}],karnataka:[{title:"Explanatory sequential: Grade 6 dip",text:['Phase 1: analyse LBA scores for Grades 5 and 6 in a district to find schools where mathematics scores drop sharply. Phase 2: interview teachers and children in four high-drop and four low-drop schools to learn why. Integrate in a joint display: "score pattern | teacher explanation | child explanation".']},{title:"Exploratory sequential: SDMC engagement scale",text:['Focus groups with SDMC members in Bidar identify what "active participation" means locally; those themes become items in a questionnaire that is then administered to SDMCs across the district.']}],activity:{title:"Select your design",prompt:"Answer the design selector questions for your planned study and sketch a joint display with at least three rows.",tool:"mixed"},tools:["mixed"],quiz:[{q:"Interviews are used to explain unexpected survey results. The design is…",options:["Convergent","Explanatory sequential","Exploratory sequential","Embedded experimental"],answer:1,why:"Quantitative first, qualitative explains."},{q:"A joint display is…",options:["A poster","A table placing quantitative and qualitative findings side by side","A bar chart","A consent form"],answer:1,why:"It shows integration visibly."},{q:"Building a questionnaire from focus group themes is…",options:["Exploratory sequential","Explanatory sequential","Convergent","Not mixed methods"],answer:0,why:"Qualitative first informs the quantitative tool."},{q:"Which is NOT genuine mixing?",options:["Joint display","Choosing interviewees from survey results","Two unrelated reports in one cover","Comparing themes with scores"],answer:2,why:"Integration must occur."}]},{id:"m7",no:7,hours:5,title:"Action Research for Education",titleKn:"ಶಿಕ್ಷಣದಲ್ಲಿ ಕ್ರಿಯಾ ಸಂಶೋಧನೆ",objectives:["Run plan–act–observe–reflect cycles on one's own practice.","Collect simple, usable evidence in the classroom or training hall.","Mentor teachers and CRPs in action research."],lessons:[{title:"The cycle",body:["Plan: name a specific problem in your practice and a change to try. Act: carry out the change for a fixed period. Observe: collect evidence (work samples, short tests, observation notes, reflections). Reflect: what changed, for whom, and why? Then plan the next cycle.","Action research is small, local and practical. Its findings are for improving your own setting first; generalisation is not its aim."]},{title:"Evidence that teachers can manage",body:["Use what already exists: notebooks, LBA records, attendance registers. Add one simple tool such as a weekly 5-item quiz or an exit slip. Keep a reflective journal with date, what was done, what happened, and what you think it means."]}],karnataka:[{title:"A D.El.Ed. lecturer's cycle",text:['Problem: trainees ask only recall questions during practice teaching. Action: model "why" and "what if" questions and use peer observation with a question-type checklist for four weeks. Evidence: count of higher-order questions per lesson before and after. Reflection: gains were larger for trainees who saw a video of their own lesson — next cycle adds video review.']},{title:"A teacher in a Kalika Chetarike classroom",text:["A Grade 5 teacher in Koppal notices that children skip the learning-sheet activities in mathematics. She introduces paired work with one stronger and one weaker reader to read the instructions aloud. After three weeks completion rates rise; she records this in her journal and shares it at the cluster meeting."]}],activity:{title:"Plan your first cycle",prompt:"Use the action research journal to write a full plan for one cycle and make your first reflective entry.",tool:"journal"},tools:["journal"],quiz:[{q:"The correct order of an action research cycle is…",options:["Act–plan–reflect–observe","Plan–act–observe–reflect","Observe–publish–plan–act","Reflect–act–plan–publish"],answer:1,why:"Plan, act, observe, reflect, then repeat."},{q:"The main aim of action research is…",options:["Generalising to all schools","Improving one's own practice","Testing theories in labs","Ranking schools"],answer:1,why:"It is practitioner inquiry for improvement."},{q:"Which is a suitable low-burden evidence source for a teacher?",options:["A national survey","Exit slips","MRI scans","Census data"],answer:1,why:"Simple, quick, and close to practice."},{q:"After reflection, the researcher should…",options:["Stop","Plan the next cycle","Delete data","Change the topic"],answer:1,why:"Action research is cyclical."}]},{id:"m8",no:8,hours:4,title:"Classroom Research",titleKn:"ತರಗತಿ ಸಂಶೋಧನೆ",objectives:["Use structured and unstructured classroom observation.","Analyse children's work and assessment data.","Study multigrade and monograde classrooms fairly."],lessons:[{title:"Observation",body:["Structured observation uses a schedule with defined categories (e.g. teacher talk, child talk, group work, silence) recorded at fixed intervals. Unstructured observation uses running notes. Observer presence changes behaviour; visit more than once so the class gets used to you."]},{title:"Children's work and assessment data",body:["Notebooks, worksheets, drawings and portfolios show how children think. Formative records such as LBA and the Holistic Progress Card (HPC) give longitudinal data. Look for error patterns, not just scores."]}],karnataka:[{title:"Observing a Nali Kali classroom",text:["In Nali Kali, children work in groups by milestone using learning cards and track their progress on a ladder. An observation schedule can record every 5 minutes: which groups are teacher-supported, partly supported or self-learning, and what each child is doing. This shows whether self-learning groups are truly engaged."]},{title:"Error analysis in Grade 7 fractions",text:["A DIET lecturer and four teachers in Hassan collect 120 fraction worksheets. Coding the errors shows that most children add numerators and denominators separately (1/2 + 1/3 = 2/5). The finding feeds a CRC workshop on area models."]}],activity:{title:"Run a timed observation",prompt:"Use the observation tool during a 20-minute lesson (real or video) and summarise the pattern of classroom talk.",tool:"observation"},tools:["observation"],quiz:[{q:"Recording a category every 30 seconds is…",options:["Interval-based structured observation","Narrative interview","Document analysis","Survey"],answer:0,why:"Fixed-interval category coding."},{q:"Why visit a classroom several times before recording?",options:["To reduce observer effect","To increase sample size","For payment","It is not needed"],answer:0,why:"The class adapts to the observer."},{q:"Analysing notebook errors is useful because…",options:["It shows thinking patterns","It replaces teaching","It ranks teachers","It is quicker than tests"],answer:0,why:"Errors reveal misconceptions."},{q:"In a Nali Kali class a researcher should observe…",options:["Only the teacher","All groups, including self-learning groups","Only the brightest child","Only the blackboard"],answer:1,why:"Multigrade dynamics involve every group."}]},{id:"m9",no:9,hours:3,title:"Community-Based Research",titleKn:"ಸಮುದಾಯ ಆಧಾರಿತ ಸಂಶೋಧನೆ",objectives:["Map stakeholders and their interests.","Engage communities as partners, not only respondents.","Handle ethics in community settings."],lessons:[{title:"Principles",body:["Community-based participatory research treats community members as co-researchers: they help decide questions, collect data and interpret findings. It builds trust and makes findings more likely to be used."]},{title:"Engagement and ethics",body:["Meet in familiar spaces at times that suit farm and work schedules. Use the local language. Be clear about what the study can and cannot offer. Share results back at a Gram Sabha or SDMC meeting."]}],karnataka:[{title:"SDMCs as research partners",text:["School Development and Monitoring Committees (SDMCs) bring parents and local leaders into school governance. A DIET in Tumakuru can work with SDMC members to study why girls' attendance drops in Grade 8, with SDMC members conducting door-to-door conversations using a short guide."]},{title:"Out-of-school children",text:["In a migrant-labour taluk of Kalaburagi, mapping families who leave for seasonal work helps plan Chinnara Angala bridge courses and seasonal hostels. Partners: anganwadi workers, gram panchayat, SDMCs and CRPs."]}],activity:{title:"Map your stakeholders",prompt:"Use the stakeholder map to list everyone affected by your planned study and decide how each will be involved.",tool:"stakeholder"},tools:["stakeholder"],quiz:[{q:"In participatory research, community members are…",options:["Only respondents","Co-researchers","Excluded from analysis","Paid enumerators only"],answer:1,why:"They share in decisions."},{q:"A good place to return findings in a village is…",options:["A journal only","An SDMC or Gram Sabha meeting","A private email","Nowhere"],answer:1,why:"Findings should return to the community."},{q:"Which is a stakeholder in a study on girls' attendance?",options:["Parents","SDMC","Anganwadi worker","All of these"],answer:3,why:"All have interests and influence."},{q:"Scheduling meetings during harvest is…",options:["Respectful","Likely to exclude farming families","Required","Irrelevant"],answer:1,why:"Timing affects who can take part."}]},{id:"m10",no:10,hours:8,title:"Data Collection and Analysis",titleKn:"ದತ್ತಾಂಶ ಸಂಗ್ರಹ ಮತ್ತು ವಿಶ್ಲೇಷಣೆ",objectives:["Design forms that reduce error.","Train field investigators and monitor quality.","Clean, code and manage data.","Run descriptive and inferential analyses and interpret them."],lessons:[{title:"Planning fieldwork",body:["Pilot every tool in 2–3 schools not in the sample. Write an investigator manual. Train CRPs or student-teachers who will collect data, including mock interviews. Plan visits so that schools are not visited on exam days or festival days."]},{title:"Data management",body:["Create a codebook: variable name, label, values, missing-data codes. Enter data twice or check 10% of forms. Store files with dated versions, keep a master copy read-only, and back up."]},{title:"Analysis and interpretation",body:['Start with descriptives: n, mean, median, SD, frequencies. Then test hypotheses. Report the test, statistic, degrees of freedom, p-value and effect size: "t(38) = 2.41, p = .021, d = 0.76". Statistical significance is not the same as practical importance.',"For qualitative data, use the coding and thematic steps from Module 5. Spreadsheet software such as LibreOffice Calc is enough for most DIET studies; JASP and R are free for more advanced work."]}],karnataka:[{title:"Worked example: chi-square on library borrowing",text:["Illustrative data from 200 Grade 7 children in Mandya district: of 100 girls, 62 borrowed a library book in the past month; of 100 boys, 45 did. Is borrowing associated with gender? Enter the 2×2 table (62, 38 / 45, 55) in the chi-square tool. The result (χ² ≈ 5.8, p ≈ .016) suggests an association; follow up with interviews to understand why."]},{title:"Worked example: ANOVA across mediums",text:["Illustrative LBA mathematics scores (out of 20) from three schools each of Kannada, English and Urdu medium. Run one-way ANOVA; if significant, examine which pairs differ and look for explanations beyond medium (teacher vacancies, enrolment size)."]}],activity:{title:"Analyse the worked data",prompt:"Run the chi-square example and one ANOVA in the statistics tool. Write a results paragraph in APA style.",tool:"stats"},tools:["stats","survey","coding"],quiz:[{q:"A codebook records…",options:["Passwords","Variable names, labels and value codes","Teacher salaries","Only missing data"],answer:1,why:"It documents how data are coded."},{q:"p = .03 means…",options:["The effect is large","If there were no real effect, a result this extreme would occur about 3% of the time","The hypothesis is 97% true","The data are wrong"],answer:1,why:"p is about data under the null hypothesis."},{q:"Effect size is reported because…",options:["It shows practical size of a difference","Journals need numbers","It replaces the mean","It is the p-value"],answer:0,why:"Significance ≠ importance."},{q:"Tools should be piloted in…",options:["Sample schools","Schools similar to but outside the sample","The DIET office","No schools"],answer:1,why:"Avoid contaminating the sample."}]},{id:"m11",no:11,hours:6,title:"Research Communication",titleKn:"ಸಂಶೋಧನಾ ಸಂವಹನ",objectives:["Write a research report with a standard structure.","Cite sources in APA style.","Present findings to teachers, officers and communities.","Prepare a policy brief and a poster."],lessons:[{title:"Report structure",body:["Title, abstract (150–250 words), introduction and problem, review of literature, objectives and questions, method (design, sample, tools, procedure, ethics), results, discussion, recommendations, limitations, references, appendices (tools, consent forms)."]},{title:"Writing for different readers",body:["Officers need a two-page policy brief: the problem, three key findings, three actions, and cost or feasibility. Teachers need practical classroom implications. Communities need a short talk in Kannada with pictures. Academics need the full report or a journal article."]},{title:"Citing and publishing",body:["Use APA 7th edition: Author, A. A. (Year). Title. Publisher. Check journals against the UGC-CARE list and avoid predatory journals that charge fees without real peer review. Share at DSERT research conferences and district review meetings."]}],karnataka:[{title:"From report to decision",text:["A DIET study finds that only a minority of high schools use their science laboratory weekly (illustrative). A good policy brief to the Deputy Director (Administration) and the DIET Principal would recommend: a weekly lab period in the timetable, a short CRC training on low-cost experiments, and a follow-up check in the next academic year."]}],activity:{title:"Draft your proposal",prompt:"Use the proposal builder to draft a complete research proposal. Export it and share it with your facilitator.",tool:"proposal"},tools:["proposal","literature"],quiz:[{q:"A policy brief for officers should be…",options:["100 pages","About two pages with clear actions","Only tables","In academic jargon"],answer:1,why:"Busy decision-makers need brevity and action."},{q:"Where should the ethics procedure be described?",options:["Abstract only","Method section","References","Not at all"],answer:1,why:"Ethics is part of method."},{q:"Predatory journals are those that…",options:["Publish quickly after real peer review","Charge fees without genuine peer review","Are in Kannada","Are on UGC-CARE"],answer:1,why:"They lack genuine review."},{q:"APA reference order is…",options:["Title, Year, Author","Author, Year, Title, Source","Year, Publisher, Author","Any order"],answer:1,why:"Author–date system."}]},{id:"m12",no:12,hours:6,title:"Quality Assurance in Research",titleKn:"ಸಂಶೋಧನೆಯಲ್ಲಿ ಗುಣಮಟ್ಟ ಭರವಸೆ",objectives:["Review a study against quality criteria at each stage.","Conduct and receive constructive peer review.","Identify common threats to validity in district studies."],lessons:[{title:"Quality across the cycle",body:["Question: clear, focused, justified. Design: matches the question. Sample: adequate and well described. Tools: piloted, reliable, valid. Analysis: appropriate tests, effect sizes, honest reporting of non-significant results. Conclusions: follow from evidence; limitations stated."]},{title:"Threats to validity",body:['Selection bias (only "good" schools chosen), history (another programme started at the same time), maturation (children grow anyway), testing effects (same test twice), attrition (children absent at post-test), and Hawthorne effect (people change because they are watched).']},{title:"Peer review",body:["Review the work, not the person. Start with strengths, then the most important problems, then minor points. Suggest specific improvements. Every DIET study can be reviewed by one internal and one external colleague before submission."]}],karnataka:[{title:"Review practice: a weak design",text:['Proposal: "Effect of Kalika Chetarike on learning" using only post-test scores from 5 schools chosen by the BEO. Problems: no baseline, no comparison, selection bias. Improvement: use the Sethubandha baseline as pre-test, add matched comparison schools, select schools randomly within blocks.']},{title:"A shared State agenda",text:["The State's research notes suggest a yearly State research agenda with a few statewide questions — for example, whether FLN gains last beyond Grade 3 — so that districts can pool samples using common tools. Quality improves when DIETs share designs and tools rather than each starting alone."]}],activity:{title:"Peer-review a proposal",prompt:"Apply the quality checklist to your own proposal and to a colleague's. Record three strengths and three specific improvements.",tool:"quality"},tools:["quality"],quiz:[{q:'Schools chosen by an officer because they "perform well" introduce…',options:["Maturation","Selection bias","Reliability","Triangulation"],answer:1,why:"Non-random choice biases results."},{q:"Children improving simply because they grew older over the year is…",options:["Maturation","History","Attrition","Instrumentation"],answer:0,why:"Natural development over time."},{q:"A good peer review begins with…",options:["Personal criticism","Strengths of the work","Rejection","Spelling errors only"],answer:1,why:"Constructive review acknowledges strengths first."},{q:"Reporting non-significant results is…",options:["Dishonest","Part of honest research","Forbidden","Unnecessary"],answer:1,why:"Hiding them biases the evidence base."}]}],In=M.reduce((e,t)=>e+t.hours,0),Ep=[{q:"A hypothesis is…",options:["A summary of findings","A testable prediction","A list of references","A sampling method"],answer:1,why:"It predicts a relationship that data can test."},{q:"Which design best tests whether a new reading programme causes improvement?",options:["Single survey","Quasi-experiment with comparison group and pre-test","One interview","Document review"],answer:1,why:"A comparison group and baseline help rule out other explanations."},{q:"Triangulation means…",options:["Using three schools","Checking findings with different data sources or methods","A geometry test","Three researchers signing"],answer:1,why:"Multiple sources strengthen credibility."},{q:"Which statistic describes spread?",options:["Mean","Standard deviation","Mode","Median"],answer:1,why:"SD measures dispersion."},{q:"Informed consent requires…",options:["Only the head teacher's signature","Participants understanding the study and agreeing freely","Payment","BEO approval only"],answer:1,why:"Understanding and voluntary agreement."}];function Ye({en:e ುತೇಕ ಡಯಟ್ ಅಧ್ಯಯನಗಳು ವ್ಯಾವಹಾರಿಕವಾಗಿವೆ."]},{title:"ಸಂಶೋಧನಾ ಚಕ್ರ",body:["ಸಮಸ್ಯೆ ಗುರುತಿಸುವಿಕೆ → ಸಾಹಿತ್ಯ ಅವಲೋಕನ → ಪ್ರಶ್ನೆಗಳು ಅಥವಾ ಊಹೆಗಳ ರಚನೆ → ವಿನ್ಯಾಸ ಮತ್ತು ಮಾದರಿ ಆಯ್ಕೆ → ಸಾಧನಗಳ ರಚನೆ ಮತ್ತು ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆ → ನೈತಿಕ ಅನುಮತಿ → ದತ್ತಾಂಶ ಸಂಗ್ರಹ → ವಿಶ್ಲೇಷಣೆ → ವ್ಯಾಖ್ಯಾನ → ವರದಿ ಮತ್ತು ಹಂಚಿಕೆ → ಫಲಿತಾಂಶಗಳ ಬಳಕೆ.","ಒಂದು ಅಧ್ಯಯನ ಅದರ ಅತ್ಯಂತ ದುರ್ಬಲ ಹಂತದಷ್ಟೇ ಬಲಿಷ್ಠ. ಜಿಲ್ಲಾ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಸಾಮಾನ್ಯ ದೌರ್ಬಲ್ಯ ಅಸ್ಪಷ್ಟ ಪ್ರಶ್ನೆ; ಅದರಿಂದ ಎಲ್ಲವನ್ನೂ ಅಳೆಯುವ ಆದರೆ ಯಾವುದಕ್ಕೂ ಉತ್ತರಿಸದ ಸಾಧನ ಹುಟ್ಟುತ್ತದೆ."]}],karnataka:[{title:"ಕರ್ನಾಟಕದಲ್ಲಿ ಸಂಶೋಧನಾ ಹೊಣೆಗಾರಿಕೆ",text:["ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಕರ್ನಾಟಕದ ಶಾಲಾ ಶಿಕ್ಷಣದ ರಾಜ್ಯ ಶೈಕ್ಷಣಿಕ ಪ್ರಾಧಿಕಾರ. ಅದು ಸಂಶೋಧನಾ ಕಾರ್ಯಸೂಚಿಯನ್ನು ರೂಪಿಸುತ್ತದೆ, ಡಯಟ್ ಉಪನ್ಯಾಸಕರಿಗೆ ತರಬೇತಿ ನೀಡುತ್ತದೆ ಮತ್ತು ಸಂಶೋಧನಾ ಸಂಗ್ರಹಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ. ಪ್ರತಿ ಡಯಟ್ ಶಿಕ್ಷಕ ಶಿಕ್ಷಣ ಮತ್ತು ತರಗತಿ ಅಭ್ಯಾಸಕ್ಕೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುವ ಜಿಲ್ಲಾ ಮಟ್ಟದ ಅಧ್ಯಯನಗಳನ್ನು ನಡೆಸಬೇಕು; ಸಿಆರ್‌ಪಿ ಮತ್ತು ಬಿಆರ್‌ಪಿಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಕ್ಷೇತ್ರ ಪಾಲುದಾರರು.","ಕೇಳಿಕೊಳ್ಳಿ: ಕಳೆದ ಮೂರು ವರ್ಷಗಳಲ್ಲಿ ನಿಮ್ಮ ಡಯಟ್ ಪೂರ್ಣಗೊಳಿಸಿದ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಎಷ್ಟು ತರಬೇತಿ ಘಟಕ, ಜಿಲ್ಲಾ ಯೋಜನೆ ಅಥವಾ ತರಗತಿ ಅಭ್ಯಾಸವನ್ನು ಬದಲಾಯಿಸಿದವು? ಸಂಶೋಧನೆಯ ಬಳಕೆಗೆ ಇದೇ ನಿಜವಾದ ಪರೀಕ್ಷೆ."]},{title:"ನಿಜವಾದ ಜಿಲ್ಲಾ ಪ್ರಶ್ನೆಗಳ ವರ್ಗೀಕರಣ",text:['"4ನೇ ತರಗತಿಯಲ್ಲಿ ಸೇತುಬಂಧ (ವರ್ಷಾರಂಭದ ಸೇತುಬಂಧ ಕಾರ್ಯಕ್ರಮ) ಕಲಿಕಾ ಅಂತರವನ್ನು ತುಂಬುತ್ತದೆಯೇ?" — ಮೌಲ್ಯಮಾಪನ ಸಂಶೋಧನೆ.','"ವಿಜಯಪುರದ ಲಂಬಾಣಿ ತಾಂಡಾಗಳ ಶಿಕ್ಷಕರು ಕನ್ನಡ ಪಾಠಗಳಲ್ಲಿ ಮನೆಮಾತನ್ನು ಹೇಗೆ ಬಳಸುತ್ತಾರೆ?" — ವ್ಯಾಖ್ಯಾನವಾದಿ, ಗುಣಾತ್ಮಕ.','"ಸೂಕ್ಷ್ಮ ಬೋಧನೆಯ (micro-teaching) ಮೂಲಕ ನನ್ನ ಡಿ.ಇಎಲ್.ಇಡಿ. ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳ ಪ್ರಶ್ನಿಸುವ ಕೌಶಲವನ್ನು ಹೆಚ್ಚಿಸಬಹುದೇ?" — ಡಯಟ್ ಉಪನ್ಯಾಸಕರ ಕ್ರಿಯಾ ಸಂಶೋಧನೆ.']}],activity:{title:"ಅಧ್ಯಯನಗಳನ್ನು ವರ್ಗೀಕರಿಸಿ",prompt:"ನಿಮ್ಮ ಡಯಟ್‌ನಲ್ಲಿ ನಡೆದ ಮೂರು ಅಧ್ಯಯನಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಿ. ಪ್ರತಿಯೊಂದರ ಪ್ರಕಾರ (ಮೂಲ / ಅನ್ವಯಿಕ / ಮೌಲ್ಯಮಾಪನ / ಕ್ರಿಯಾ), ದೃಷ್ಟಿಕೋನ ಮತ್ತು ಅದು ಪ್ರಭಾವಿಸಿದ (ಅಥವಾ ಪ್ರಭಾವಿಸಬಹುದಾಗಿದ್ದ) ಒಂದು ನಿರ್ಧಾರವನ್ನು ಬರೆಯಿರಿ."},quiz:[{q:"ಕಲಿಕಾ ಚೇತರಿಕೆ ಸಾಮಗ್ರಿಗಳು ತಮ್ಮ ಘೋಷಿತ ಗುರಿಗಳನ್ನು ತಲುಪಿದವೇ ಎಂದು ಡಯಟ್ ಅಧ್ಯಯನ ಮಾಡುತ್ತದೆ. ಇದನ್ನು ಹೀಗೆ ಕರೆಯುವುದು ಸೂಕ್ತ…",options:["ಮೂಲ ಸಂಶೋಧನೆ","ಮೌಲ್ಯಮಾಪನ ಸಂಶೋಧನೆ","ಐತಿಹಾಸಿಕ ಸಂಶೋಧನೆ","ಕ್ರಿಯಾ ಸಂಶೋಧನೆ"],why:"ಇದು ಕಾರ್ಯಕ್ರಮವನ್ನು ಅದರದೇ ಉದ್ದೇಶಗಳ ಆಧಾರದಲ್ಲಿ ಅಳೆಯುತ್ತದೆ."},{q:"ಸಂಶೋಧನೆಯನ್ನು ಮೇಲ್ವಿಚಾರಣಾ ವರದಿಯಿಂದ ಹೆಚ್ಚು ಬೇರ್ಪಡಿಸುವ ಲಕ್ಷಣ ಯಾವುದು?",options:["ಕೋಷ್ಟಕಗಳ ಬಳಕೆ","ನಿರ್ದಿಷ್ಟ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸಲು ಯೋಜಿತ ವಿಧಾನ","ವರದಿಯ ಉದ್ದ","ಅಧಿಕಾರಿಯ ಸಹಿ"],why:"ಸಂಶೋಧನೆ ಪ್ರಶ್ನೆಯಿಂದ ಆರಂಭವಾಗುತ್ತದೆ; ವಿಧಾನವನ್ನು ದತ್ತಾಂಶ ಸಂಗ್ರಹಕ್ಕೆ ಮೊದಲೇ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ."},{q:'"ಉತ್ತಮ ಶಾಲೆ" ಎಂಬುದಕ್ಕೆ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ನೀಡುವ ಅರ್ಥಗಳ ಅಧ್ಯಯನ ಮುಖ್ಯವಾಗಿ ಯಾವ ದೃಷ್ಟಿಕೋನಕ್ಕೆ ಸೇರುತ್ತದೆ?',options:["ಪ್ರತ್ಯಕ್ಷವಾದಿ","ವ್ಯಾಖ್ಯಾನವಾದಿ","ಪ್ರಾಯೋಗಿಕ","ಅರ್ಥಮಾಪನ"],why:"ಇದು ಅಳತೆಯಲ್ಲ, ಭಾಗವಹಿಸುವವರ ಅರ್ಥಗಳನ್ನು ಹುಡುಕುತ್ತದೆ."},{q:"ವ್ಯಾವಹಾರಿಕ ದೃಷ್ಟಿಕೋನ ಎಂದರೆ…",options:["ಸಮೀಕ್ಷೆಗಳಿಗೆ ಮಾತ್ರ ಅವಕಾಶ","ಪ್ರಶ್ನೆಯೇ ವಿಧಾನವನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ","ಗುಣಾತ್ಮಕ ದತ್ತಾಂಶ ನಿರ್ಲಕ್ಷಿತ","ಸಿದ್ಧಾಂತ ಬೇಕಿಲ್ಲ"],why:"ಪ್ರಶ್ನೆಗೆ ಸೂಕ್ತವಾದ ವಿಧಾನವನ್ನೇ ಆಯ್ಕೆ ಮಾಡಲಾಗುತ್ತದೆ."}]},m2:{objectives:["ಮಕ್ಕಳು ಮತ್ತು ಶಿಕ್ಷಕರೊಂದಿಗಿನ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಗೌರವ, ಹಿತಸಾಧನೆ ಮತ್ತು ನ್ಯಾಯದ ತತ್ವಗಳನ್ನು ಅನ್ವಯಿಸುವುದು.","ಪೋಷಕರಿಂದ ತಿಳುವಳಿಕೆಯುಳ್ಳ ಒಪ್ಪಿಗೆ ಮತ್ತು ಮಕ್ಕಳಿಂದ ಸಮ್ಮತಿ ಪಡೆಯುವುದು.","ಗುರುತು ಮತ್ತು ದತ್ತಾಂಶವನ್ನು, SATS ಗುರುತುಸಂಖ್ಯೆಗಳನ್ನೂ ಸೇರಿ, ರಕ್ಷಿಸುವುದು.","ಕೃತಿಚೌರ್ಯ, ಕಟ್ಟುಕಥೆ ಮತ್ತು ತಿರುಚುವಿಕೆಯನ್ನು ಗುರುತಿಸುವುದು."],lessons:[{title:"ಮೂಲ ತತ್ವಗಳು",body:['ವ್ಯಕ್ತಿಗಳಿಗೆ ಗೌರವ: ಭಾಗವಹಿಸಬೇಕೇ ಬೇಡವೇ ಎಂಬುದನ್ನು ಜನರು ಸ್ವತಂತ್ರವಾಗಿ ನಿರ್ಧರಿಸುತ್ತಾರೆ. ಹಿತಸಾಧನೆ: ಪ್ರಯೋಜನ ಹೆಚ್ಚಿಸಿ, ಹಾನಿ ಕಡಿಮೆ ಮಾಡಿ. ನ್ಯಾಯ: ಸಂಶೋಧನೆಯ ಹೊರೆ ಮತ್ತು ಲಾಭ ನ್ಯಾಯಯುತವಾಗಿ ಹಂಚಿಕೆಯಾಗಬೇಕು — ಪ್ರತಿವರ್ಷ ಅದೇ ಕೆಲವು "ಅನುಕೂಲಕರ" ಶಾಲೆಗಳನ್ನು ಅಧ್ಯಯನ ಮಾಡಬಾರದು.',"ಮಕ್ಕಳು ತಾವಾಗಿಯೇ ಒಪ್ಪಿಗೆ ನೀಡಲಾರರು. ಪೋಷಕರು ಅಥವಾ ಪಾಲಕರಿಂದ ಲಿಖಿತ ಒಪ್ಪಿಗೆ ಪಡೆಯಿರಿ; ಮಗುವಿನಿಂದ ಅದರ ಮನೆಮಾತಿನಲ್ಲಿ ಸರಳ ಮೌಖಿಕ ಅಥವಾ ಚಿತ್ರ ರೂಪದ ಸಮ್ಮತಿ ಪಡೆಯಿರಿ."]},{title:"ನೈತಿಕ ಪರಿಶೀಲನೆ",body:["ನೈತಿಕ ಪರಿಶೀಲನಾ ಪ್ರಕ್ರಿಯೆ ಕ್ಷೇತ್ರಕಾರ್ಯಕ್ಕೆ ಮುನ್ನ ಯೋಜನೆಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ: ಉದ್ದೇಶ, ಅಪಾಯಗಳು, ಒಪ್ಪಿಗೆ ಪತ್ರಗಳು, ದತ್ತಾಂಶ ಸಂಗ್ರಹಣೆ ಮತ್ತು ಫಲಿತಾಂಶಗಳು ಸಮುದಾಯಕ್ಕೆ ಹೇಗೆ ಮರಳುತ್ತವೆ ಎಂಬುದು. ಡಯಟ್ ಒಬ್ಬ ಹಿರಿಯ ಉಪನ್ಯಾಸಕರು, ಒಬ್ಬ ಹೊರಗಿನ ವಿದ್ವಾಂಸರು ಮತ್ತು ಒಬ್ಬ ಸಮುದಾಯ ಸದಸ್ಯರಿರುವ ಸಣ್ಣ ನೈತಿಕ ಸಮಿತಿಯನ್ನು ರಚಿಸಬಹುದು.","ಶಾಲೆಗಳಿಗೆ ಭೇಟಿ ನೀಡಲು ಕ್ಷೇತ್ರ ಶಿಕ್ಷಣಾಧಿಕಾರಿಗಳ ಅನುಮತಿ ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿ ಮಾತ್ರ. ಅದು ಭಾಗವಹಿಸುವವರ ತಿಳುವಳಿಕೆಯುಳ್ಳ ಒಪ್ಪಿಗೆಗೆ ಬದಲಿಯಲ್ಲ."]},{title:"ಪ್ರಾಮಾಣಿಕತೆ",body:["ಕಟ್ಟುಕಥೆ (ದತ್ತಾಂಶ ಸೃಷ್ಟಿಸುವುದು), ತಿರುಚುವಿಕೆ (ದತ್ತಾಂಶ ಬದಲಿಸುವುದು) ಮತ್ತು ಕೃತಿಚೌರ್ಯ (ಇತರರ ಪದಗಳು ಅಥವಾ ವಿಚಾರಗಳನ್ನು ಉಲ್ಲೇಖವಿಲ್ಲದೆ ಬಳಸುವುದು) — ಇವು ಮೂರು ಗಂಭೀರ ಉಲ್ಲಂಘನೆಗಳು. ಮತ್ತೊಂದು ಅಧ್ಯಯನದ ಪ್ರಶ್ನಾವಳಿಯನ್ನು ಉಲ್ಲೇಖದೊಂದಿಗೆ ಮತ್ತು ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಅನುಮತಿಯೊಂದಿಗೆ ಮಾತ್ರ ಬಳಸಬಹುದು.","ಕಚ್ಚಾ ದತ್ತಾಂಶ, ಕ್ಷೇತ್ರ ಟಿಪ್ಪಣಿಗಳು ಮತ್ತು ವಿಶ್ಲೇಷಣಾ ಕಡತಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಿ; ವರದಿಯ ಯಾವುದೇ ಅಂಕಿಯನ್ನು ಅದರ ಮೂಲದವರೆಗೆ ಮತ್ತೊಬ್ಬರು ಪತ್ತೆಹಚ್ಚುವಂತಿರಬೇಕು."]}],karnataka:[{title:"SATS ದತ್ತಾಂಶದ ಜವಾಬ್ದಾರಿಯುತ ಬಳಕೆ",text:["ವಿದ್ಯಾರ್ಥಿ ಸಾಧನಾ ಟ್ರ್ಯಾಕಿಂಗ್ ವ್ಯವಸ್ಥೆ (SATS) ಕರ್ನಾಟಕದ ಶಾಲೆಗಳ ಪ್ರತಿ ಮಗುವಿನ ಗುರುತಿಸಬಹುದಾದ ದಾಖಲೆಗಳನ್ನು ಹೊಂದಿದೆ. ಡಯಟ್ SATS ಅಥವಾ LBA ಪೋರ್ಟಲ್ ದತ್ತಾಂಶವನ್ನು ಇಲಾಖೆಯ ಅನುಮತಿಯೊಂದಿಗೆ ಮಾತ್ರ ಸಂಶೋಧನೆಗೆ ಬಳಸಬೇಕು ಮತ್ತು ವಿಶ್ಲೇಷಣೆಗೆ ಮುನ್ನ SATS ಸಂಖ್ಯೆಗಳ ಬದಲಿಗೆ ಅಧ್ಯಯನ ಸಂಕೇತಗಳನ್ನು ಬಳಸಬೇಕು. ಮಗುವಿನ ಹೆಸರು, SATS ಸಂಖ್ಯೆ ಅಥವಾ ಮಕ್ಕಳನ್ನು ಗುರುತಿಸಬಹುದಾದಷ್ಟು ಕಡಿಮೆ ದಾಖಲಾತಿಯ ಶಾಲೆಯ ಹೆಸರನ್ನು ಎಂದಿಗೂ ಪ್ರಕಟಿಸಬೇಡಿ."]},{title:"ಪ್ರಕರಣ: ನಲಿ-ಕಲಿ ತರಗತಿಯಲ್ಲಿ ಛಾಯಾಚಿತ್ರಗಳು",text:["ಒಬ್ಬ ಸಂಶೋಧಕರು ವರದಿಗಾಗಿ ನಲಿ-ಕಲಿ (1–3ನೇ ತರಗತಿಯ ಬಹುವರ್ಗ, ಚಟುವಟಿಕೆ ಆಧಾರಿತ) ತರಗತಿಯ ಮಕ್ಕಳ ಫೋಟೋ ತೆಗೆಯುತ್ತಾರೆ. ಪೋಷಕರನ್ನು ಕೇಳಿಲ್ಲ. ಇದು ಸರಿಯೇ? ಇಲ್ಲ: ಚಿತ್ರಗಳು ಮಕ್ಕಳನ್ನು ಗುರುತಿಸುತ್ತವೆ. ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಪಡೆಯಿರಿ, ಸಾಧ್ಯವಾದಲ್ಲಿ ಮುಖಗಳನ್ನು ತಪ್ಪಿಸಿ, ಸಾಮಾಜಿಕ ಜಾಲತಾಣಗಳಲ್ಲಿ ಹಂಚಬೇಡಿ."]}],activity:{title:"ನೈತಿಕ ನಿರ್ಧಾರ ವೃಕ್ಷ",prompt:"ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನವನ್ನು ನೈತಿಕ ನಿರ್ಧಾರ ವೃಕ್ಷದ ಮೂಲಕ ಹಾಯಿಸಿ. ಬೇಕಾದ ಸುರಕ್ಷತಾ ಕ್ರಮಗಳನ್ನು ದಾಖಲಿಸಿ ಮತ್ತು ಪೋಷಕರಿಗಾಗಿ ಕನ್ನಡದಲ್ಲಿ ಎರಡು ಸಾಲಿನ ಒಪ್ಪಿಗೆ ಹೇಳಿಕೆ ರಚಿಸಿ."},quiz:[{q:"ಶಾಲಾ ಭೇಟಿಗೆ ಬಿಇಒ ಅನುಮತಿ ನೀಡಿದ್ದಾರೆ. ಮಕ್ಕಳಿಗೆ ಪರೀಕ್ಷೆ ನಡೆಸಲು ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಇನ್ನೂ ಬೇಕೇ?",options:["ಬೇಡ, ಬಿಇಒ ಅನುಮತಿ ಸಾಕು","ಬೇಕು, ಒಪ್ಪಿಗೆ ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿಗಿಂತ ಪ್ರತ್ಯೇಕ","ಖಾಸಗಿ ಶಾಲೆಗಳಿಗೆ ಮಾತ್ರ","ನಗರ ಪ್ರದೇಶಗಳಲ್ಲಿ ಮಾತ್ರ"],why:"ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿ ವೈಯಕ್ತಿಕ ಒಪ್ಪಿಗೆಗೆ ಬದಲಿಯಲ್ಲ."},{q:"SATS ದಾಖಲೆಗಳನ್ನು ವಿಶ್ಲೇಷಿಸುವ ಮೊದಲು ನೀವು…",options:["ಪಾರದರ್ಶಕತೆಗಾಗಿ ಸಂಖ್ಯೆಗಳನ್ನು ಪ್ರಕಟಿಸಬೇಕು","SATS ಸಂಖ್ಯೆಗಳ ಬದಲಿಗೆ ಅಧ್ಯಯನ ಸಂಕೇತಗಳನ್ನು ಬಳಸಬೇಕು","ತಂಡಕ್ಕಾಗಿ ಕಡತವನ್ನು ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಹಂಚಬೇಕು","ಒಂದೇ ದಿನದಲ್ಲಿ ಎಲ್ಲ ದಾಖಲೆ ಅಳಿಸಬೇಕು"],why:"ಹುಸಿನಾಮೀಕರಣ ಮಕ್ಕಳನ್ನು ರಕ್ಷಿಸುತ್ತದೆ."},{q:"ಕಾರ್ಯಕ್ರಮ ಪರಿಣಾಮಕಾರಿ ಎಂದು ತೋರಿಸಲು ಕೆಲವು ಉತ್ತರ-ಪರೀಕ್ಷಾ ಅಂಕಗಳನ್ನು ಬದಲಿಸುವುದು…",options:["ಕಟ್ಟುಕಥೆ","ತಿರುಚುವಿಕೆ","ಕೃತಿಚೌರ್ಯ","ತ್ರಿಕೋನೀಕರಣ"],why:"ನಿಜವಾದ ದತ್ತಾಂಶವನ್ನು ಬದಲಿಸುವುದು ತಿರುಚುವಿಕೆ."},{q:"ಸಮ್ಮತಿ (assent) ಎಂದರೆ…",options:["ವಯಸ್ಸಿಗೆ ತಕ್ಕ ರೂಪದಲ್ಲಿ ಮಗುವಿನ ಸ್ವಂತ ಒಪ್ಪಿಗೆ","ಶಿಕ್ಷಕರ ಸಹಿ","ನೈತಿಕ ಸಮಿತಿಯ ಅನುಮೋದನೆ","ಪೋಷಕರ ಒಪ್ಪಿಗೆ"],why:"ಪೋಷಕರ ಒಪ್ಪಿಗೆಯ ಜೊತೆಗೆ ಮಗುವಿನ ಸ್ವಂತ ಒಪ್ಪಿಗೆಯೇ ಸಮ್ಮತಿ."}]},m3:{objectives:["ಅನುಭವಿಸಿದ ತೊಂದರೆಯಿಂದ ಸಂಶೋಧಿಸಬಹುದಾದ ಸಮಸ್ಯೆಯತ್ತ ಸಾಗುವುದು.","ಲಭ್ಯ ಪುರಾವೆಗಳನ್ನು (NAS, PARAKH, SATS, LBA, ಹಿಂದಿನ ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಅಧ್ಯಯನಗಳು) ಬಳಸಿ ಸಮಸ್ಯೆಯನ್ನು ಸಮರ್ಥಿಸುವುದು.","ಕೇಂದ್ರೀಕೃತ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಪರೀಕ್ಷಿಸಬಹುದಾದ ಊಹೆಗಳನ್ನು ಬರೆಯುವುದು.","ಚರಾಂಶಗಳನ್ನು ಕಾರ್ಯಾತ್ಮಕವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು."],lessons:[{title:"ಕಾಳಜಿಯಿಂದ ಸಮಸ್ಯೆಯವರೆಗೆ",body:['ಅನುಭವಿಸಿದ ತೊಂದರೆ ("ಮಕ್ಕಳು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ದುರ್ಬಲ") ಇನ್ನೂ ಸಮಸ್ಯೆಯಲ್ಲ. ಅದನ್ನು ಸಂಕುಚಿಸಿ: ಯಾರು (ದ್ವಿಭಾಷಾ KPS ವಿಭಾಗಗಳ 5ನೇ ತರಗತಿ ಮಕ್ಕಳು), ಏನು (ಮೌಖಿಕ ಗ್ರಹಿಕೆ), ಎಲ್ಲಿ (ಕಲಬುರಗಿ ಜಿಲ್ಲೆ), ಯಾರೊಂದಿಗೆ ಹೋಲಿಕೆ (ಕನ್ನಡ ಮಾಧ್ಯಮ ವಿಭಾಗಗಳು), ಏಕೆ ಮುಖ್ಯ (ಮೊದಲ ತಲೆಮಾರಿನ ಕಲಿಕಾರ್ಥಿಗಳಿಗೆ ಸಮಾನತೆ).',"ಉತ್ತಮ ಸಮಸ್ಯೆ ಮಹತ್ವದ್ದು, ಲಭ್ಯ ಸಮಯ ಮತ್ತು ಸಂಪನ್ಮೂಲಗಳಲ್ಲಿ ಸಂಶೋಧಿಸಬಹುದಾದದ್ದು, ನೈತಿಕವಾದದ್ದು ಮತ್ತು ಹೊಸದನ್ನು ಸೇರಿಸುವಷ್ಟು ನವೀನವಾದದ್ದು."]},{title:"ಸಾಹಿತ್ಯ ಅವಲೋಕನ",body:["ಹಿಂದಿನ ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಮತ್ತು ಡಯಟ್ ಸಂಗ್ರಹಗಳು, ಎನ್‌ಸಿಇಆರ್‌ಟಿ ಅಧ್ಯಯನಗಳು, ಶೋಧಗಂಗಾ ಪ್ರಬಂಧಗಳು, ERIC ಮತ್ತು ಗೂಗಲ್ ಸ್ಕಾಲರ್‌ನಲ್ಲಿ ಹುಡುಕಿ. ಏನು ತಿಳಿದಿದೆ, ಅದನ್ನು ಹೇಗೆ ಅಳೆಯಲಾಯಿತು ಮತ್ತು ಇನ್ನೂ ಏನು ಉಳಿದಿದೆ (ಅಂತರ) ಎಂಬುದಕ್ಕಾಗಿ ಓದಿ. ಮೊದಲ ದಿನದಿಂದಲೇ ಉಲ್ಲೇಖ ಪಟ್ಟಿ ಇಟ್ಟುಕೊಳ್ಳಿ."]},{title:"ಪ್ರಶ್ನೆಗಳು, ಊಹೆಗಳು, ಚರಾಂಶಗಳು",body:['ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳು ನಿರ್ದಿಷ್ಟ ಮತ್ತು ಉತ್ತರಿಸಬಹುದಾದವು: "ಮೈಸೂರು ಜಿಲ್ಲೆಯ ನಲಿ-ಕಲಿ ಮತ್ತು ನಲಿ-ಕಲಿಯೇತರ ತರಗತಿಗಳ 3ನೇ ತರಗತಿ ಮಕ್ಕಳ ಮೌಖಿಕ ಓದಿನ ನಿರರ್ಗಳತೆಯಲ್ಲಿ ವ್ಯತ್ಯಾಸವೇನು?"','ಊಹೆ ದತ್ತಾಂಶ ತಳ್ಳಿಹಾಕಬಹುದಾದ ಉತ್ತರವನ್ನು ಮುನ್ನುಡಿಯುತ್ತದೆ: "ಕಾರ್ಯನಿರತ ಗ್ರಂಥಾಲಯ ಮೂಲೆ ಇರುವ ತರಗತಿಗಳ ಮಕ್ಕಳು ಇಲ್ಲದವರಿಗಿಂತ ನಿಮಿಷಕ್ಕೆ ಹೆಚ್ಚು ಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಓದುತ್ತಾರೆ." ಕಾರ್ಯಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನಗಳು ಪ್ರತಿ ಚರಾಂಶವನ್ನು ನಿಖರವಾಗಿ ಹೇಗೆ ಅಳೆಯಲಾಗುತ್ತದೆ ಎಂದು ತಿಳಿಸುತ್ತವೆ (ಉದಾ: ಶ್ರೇಣೀಕೃತ ಕನ್ನಡ ಗದ್ಯಭಾಗದಲ್ಲಿ ನಿಮಿಷಕ್ಕೆ ಸರಿಯಾಗಿ ಓದಿದ ಪದಗಳು).']}],karnataka:[{title:"ರಾಜ್ಯದ ಪುರಾವೆಗಳಲ್ಲಿ ಅಂತರ ಹುಡುಕುವುದು",text:["3ನೇ ತರಗತಿಯ ವೇಳೆಗೆ ಗಳಿಸಿದ ಮೂಲಭೂತ ಸಾಕ್ಷರತೆ ಮತ್ತು ಸಂಖ್ಯಾಜ್ಞಾನದ ಲಾಭಗಳು 6 ಮತ್ತು 9ನೇ ತರಗತಿಗಳ ವೇಳೆಗೆ, ವಿಶೇಷವಾಗಿ ಗಣಿತ ಮತ್ತು ವಿಜ್ಞಾನದಲ್ಲಿ, ಮಸುಕಾಗುತ್ತವೆ ಎಂದು ರಾಜ್ಯದ ಸಂಶೋಧನಾ ಹಿನ್ನೆಲೆ ಟಿಪ್ಪಣಿಗಳು (ಈ ಭಂಡಾರದಲ್ಲಿ) ವರದಿ ಮಾಡುತ್ತವೆ. LBA ಪೋರ್ಟಲ್ ಅನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡಿದ ಯಾವುದೇ ಪೂರ್ಣ ಅಧ್ಯಯನ ಇನ್ನೂ ಇಲ್ಲ ಎಂದೂ ದಾಖಲಿಸುತ್ತವೆ. ಇವೆರಡೂ ಡಯಟ್ ಸಂಶೋಧನೆಗೆ ಸಿದ್ಧ ಅಂತರಗಳು.",'ಸಂಭಾವ್ಯ ಪ್ರಶ್ನೆ: "4ನೇ ತರಗತಿಯಲ್ಲಿ ಸೇತುಬಂಧ ಬೆಂಬಲ ಪಡೆದ ಮಕ್ಕಳು 5ನೇ ತರಗತಿಯ ಕೊನೆಯವರೆಗೆ ತಮ್ಮ ಲಾಭಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತಾರೆಯೇ?"']},{title:"ವಿಶಾಲ ಕಾಳಜಿಯನ್ನು ಸಂಕುಚಿಸುವುದು",text:['ವಿಶಾಲ: "ಗ್ರಂಥಾಲಯ ಬಳಕೆ ಕಡಿಮೆ." ಕೇಂದ್ರೀಕೃತ: "ಚಿಕ್ಕಮಗಳೂರು ಜಿಲ್ಲೆಯ ಸರ್ಕಾರಿ ಹಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆಗಳ 6–8ನೇ ತರಗತಿ ಮಕ್ಕಳು ಎಷ್ಟು ಬಾರಿ ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆಯುತ್ತಾರೆ, ಮತ್ತು ಯಾವ ಶಾಲಾ ಅಂಶಗಳು ಇದಕ್ಕೆ ಸಂಬಂಧಿಸಿವೆ?"']}],activity:{title:"ನಿಮ್ಮ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ ರಚಿಸಿ",prompt:"ಪ್ರಶ್ನೆ ರಚನಾ ಸಾಧನ ಬಳಸಿ ನಿಮ್ಮ ಜಿಲ್ಲೆಯ ಒಂದು ಕಾಳಜಿಯನ್ನು ಕೇಂದ್ರೀಕೃತ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ ಮತ್ತು ಊಹೆಯಾಗಿ ಪರಿವರ್ತಿಸಿ."},quiz:[{q:"ಯಾವುದು ಹೆಚ್ಚು ಸಂಶೋಧಿಸಬಹುದಾದ ಪ್ರಶ್ನೆ?",options:["ಕರ್ನಾಟಕದಲ್ಲಿ ಶಿಕ್ಷಣ ಸುಧಾರಿಸುತ್ತಿದೆಯೇ?","ರಾಯಚೂರು ಜಿಲ್ಲೆಯ ಎರಡು ಬ್ಲಾಕ್‌ಗಳಲ್ಲಿ 7ನೇ ತರಗತಿ ಗಣಿತ ಅಂಕಗಳ ಮೇಲೆ LBA ಪರಿಣಾಮವೇನು?","ಶಿಕ್ಷಕರು ಏಕೆ ಪ್ರೇರಿತರಾಗಿಲ್ಲ?","ಇಂಗ್ಲಿಷ್ ಕಲಿಸಬೇಕೇ?"],why:"ಇದು ಜನಸಂಖ್ಯೆ, ಚರಾಂಶ, ಸ್ಥಳ ಮತ್ತು ಹೋಲಿಕೆಯನ್ನು ಹೆಸರಿಸುತ್ತದೆ."},{q:'"ವಾರಕ್ಕೊಮ್ಮೆ ಗ್ರಂಥಾಲಯ ಅವಧಿ ಇರುವಲ್ಲಿ ಓದಿನ ನಿರರ್ಗಳತೆ ಹೆಚ್ಚಿರುತ್ತದೆ" — ಇದು ಒಂದು…',options:["ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ","ಊಹೆ","ಉದ್ದೇಶ","ಮಿತಿ"],why:"ಇದು ಪರೀಕ್ಷಿಸಬಹುದಾದ ಸಂಬಂಧವನ್ನು ಮುನ್ನುಡಿಯುತ್ತದೆ."},{q:'"ಓದಿನ ನಿರರ್ಗಳತೆ"ಯ ಕಾರ್ಯಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನ…',options:["ಓದಿನ ಮೇಲಿನ ಪ್ರೀತಿ","ಶ್ರೇಣೀಕೃತ ಗದ್ಯಭಾಗದಲ್ಲಿ ನಿಮಿಷಕ್ಕೆ ಸರಿಯಾಗಿ ಓದಿದ ಪದಗಳು","ಶಿಕ್ಷಕರ ಅನಿಸಿಕೆ","ಗ್ರಂಥಾಲಯದ ಪುಸ್ತಕಗಳ ಸಂಖ್ಯೆ"],why:"ಚರಾಂಶವನ್ನು ನಿಖರವಾಗಿ ಹೇಗೆ ಅಳೆಯಲಾಗುತ್ತದೆ ಎಂದು ತಿಳಿಸುತ್ತದೆ."},{q:'ಸಾಹಿತ್ಯ ಅವಲೋಕನದಲ್ಲಿ "ಅಂತರ" ಎಂದರೆ…',options:["ಕಾಣೆಯಾದ ಪುಟಗಳು","ನಿಮ್ಮ ಸಂದರ್ಭದಲ್ಲಿ ಇನ್ನೂ ತಿಳಿಯದ ಅಥವಾ ಅಧ್ಯಯನವಾಗದ ವಿಷಯ","ಸಮೀಕ್ಷೆಗಳ ನಡುವಿನ ಸಮಯ","ಬಾಲಕ-ಬಾಲಕಿಯರ ವ್ಯತ್ಯಾಸ"],why:"ಅಂತರವೇ ಹೊಸ ಅಧ್ಯಯನವನ್ನು ಸಮರ್ಥಿಸುತ್ತದೆ."}]},m4:{objectives:["ಸಮೀಕ್ಷೆ, ಸಹಸಂಬಂಧ, ಕಾರಣ-ತುಲನಾತ್ಮಕ ಮತ್ತು ಪ್ರಾಯೋಗಿಕ ವಿನ್ಯಾಸಗಳಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡುವುದು.","ಮಾದರಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಅದರ ಗಾತ್ರವನ್ನು ಲೆಕ್ಕಹಾಕುವುದು.","ವಿಶ್ವಸನೀಯ ಮತ್ತು ಸಿಂಧುವಾದ ಪರೀಕ್ಷೆಗಳು ಹಾಗೂ ಪ್ರಶ್ನಾವಳಿಗಳನ್ನು ರಚಿಸುವುದು.","ಪ್ರಶ್ನೆಗೆ ಸರಿಯಾದ ಸಾಂಖ್ಯಿಕ ಪರೀಕ್ಷೆಯನ್ನು ಆರಿಸುವುದು."],lessons:[{title:"ವಿನ್ಯಾಸಗಳು",body:["ಸಮೀಕ್ಷೆ: ಜನಸಂಖ್ಯೆಯನ್ನು ವರ್ಣಿಸುತ್ತದೆ (ಉದಾ: ಪ್ರೌಢಶಾಲೆಗಳಲ್ಲಿ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯಗಳ ಲಭ್ಯತೆ). ಸಹಸಂಬಂಧ: ಸಂಬಂಧವನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ (ಶಿಕ್ಷಕರ ಹಾಜರಾತಿ ಮತ್ತು ವಿದ್ಯಾರ್ಥಿ ಅಂಕಗಳು). ಕಾರಣ-ತುಲನಾತ್ಮಕ: ಈಗಿರುವ ಗುಂಪುಗಳನ್ನು ಹೋಲಿಸುತ್ತದೆ (KPS ಮತ್ತು KPS ಅಲ್ಲದ ಶಾಲೆಗಳು). ಪ್ರಾಯೋಗಿಕ ಮತ್ತು ಅರೆ-ಪ್ರಾಯೋಗಿಕ: ಸಂಶೋಧಕರು ಮಧ್ಯಪ್ರವೇಶವನ್ನು ಪರಿಚಯಿಸಿ, ನಿಯಂತ್ರಣ ಅಥವಾ ಹೋಲಿಕೆ ಗುಂಪಿನೊಂದಿಗೆ, ಸಾಧ್ಯವಾದರೆ ಪೂರ್ವ ಮತ್ತು ಉತ್ತರ ಪರೀಕ್ಷೆಗಳೊಂದಿಗೆ ಹೋಲಿಸುತ್ತಾರೆ.","ಸಹಸಂಬಂಧ ಕಾರಣವಲ್ಲ. ಗ್ರಂಥಾಲಯವಿರುವ ಶಾಲೆಗಳ ಸಮುದಾಯಗಳೂ ಹೆಚ್ಚು ಸಂಪನ್ಮೂಲ ಹೊಂದಿರಬಹುದು."]},{title:"ಮಾದರಿ ಆಯ್ಕೆ",body:["ಸಂಭವನೀಯತಾ ಮಾದರಿಗಳು (ಸರಳ ಯಾದೃಚ್ಛಿಕ, ಸ್ತರೀಕೃತ, ಗುಚ್ಛ, ಬಹುಹಂತ) ಸಾಮಾನ್ಯೀಕರಣಕ್ಕೆ ಅವಕಾಶ ನೀಡುತ್ತವೆ. ಉಪಗುಂಪುಗಳು ಮುಖ್ಯವಾದಾಗ ಸ್ತರೀಕರಿಸಿ — ಉದಾ: ಪ್ರದೇಶ (ಕಲ್ಯಾಣ ಕರ್ನಾಟಕ ಮತ್ತು ಇತರೆ), ಬೋಧನಾ ಮಾಧ್ಯಮ ಅಥವಾ ಗ್ರಾಮೀಣ/ನಗರ. ಗುಚ್ಛ ಮಾದರಿ (ಕ್ಲಸ್ಟರ್‌ಗಳನ್ನು ಆರಿಸಿ ನಂತರ ಅವುಗಳೊಳಗಿನ ಶಾಲೆಗಳು) ಸಿಆರ್‌ಸಿ ಆಧಾರಿತ ಕ್ಷೇತ್ರಕಾರ್ಯಕ್ಕೆ ಸೂಕ್ತ.","ಮಾದರಿ ಗಾತ್ರ ವಿಶ್ವಾಸ ಮಟ್ಟ, ನೀವು ಒಪ್ಪಬಹುದಾದ ದೋಷದ ಅಂಚು ಮತ್ತು ಜನಸಂಖ್ಯೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಅವಲಂಬಿಸಿದೆ. ಮಾದರಿ ಗಾತ್ರ ಗಣಕವನ್ನು ಬಳಸಿ."]},{title:"ಸಾಧನಗಳು ಮತ್ತು ವಿಶ್ಲೇಷಣೆ",body:["ವಿಶ್ವಸನೀಯತೆ ಎಂದರೆ ಸ್ಥಿರತೆ (ಪರೀಕ್ಷೆ–ಮರುಪರೀಕ್ಷೆ; ಬಹುತೇಕ ಮಾಪಕಗಳಿಗೆ ಕ್ರಾನ್‌ಬ್ಯಾಕ್ ಆಲ್ಫಾ ≥ 0.70). ಸಿಂಧುತ್ವ ಎಂದರೆ ಸಾಧನವು ಹೇಳಿಕೊಂಡದ್ದನ್ನೇ ಅಳೆಯುತ್ತದೆಯೇ (ತಜ್ಞರ ಪರಿಶೀಲನೆಯ ಮೂಲಕ ವಿಷಯ ಸಿಂಧುತ್ವ; ಫಲಿತಾಂಶಗಳ ಮಾದರಿಯ ಮೂಲಕ ರಚನಾ ಸಿಂಧುತ್ವ). ಯಾವಾಗಲೂ ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆ (pilot) ಮಾಡಿ.","ಪರೀಕ್ಷೆ ಆಯ್ಕೆ: ಎರಡು ಗುಂಪುಗಳ ಸರಾಸರಿ ಹೋಲಿಕೆ → t-ಪರೀಕ್ಷೆ; ಅದೇ ಗುಂಪು ಮೊದಲು ಮತ್ತು ನಂತರ → ಜೋಡಿ t-ಪರೀಕ್ಷೆ; ಮೂರು ಅಥವಾ ಹೆಚ್ಚು ಗುಂಪುಗಳು → ANOVA; ಎರಡು ವರ್ಗೀಯ ಚರಾಂಶಗಳು → ಕೈ-ವರ್ಗ; ಎರಡು ಅಂಕಗಳ ನಡುವಿನ ಸಂಬಂಧ → ಸಹಸಂಬಂಧ."]}],karnataka:[{title:"ಅರೆ-ಪ್ರಯೋಗ: ಯಾದಗಿರಿಯಲ್ಲಿ ಸೇತುಬಂಧ",text:["ಉದಾಹರಣಾ ವಿನ್ಯಾಸ: ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯ 20 ಸರ್ಕಾರಿ ಕಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆಗಳು ದಿನಕ್ಕೆ 20 ನಿಮಿಷಗಳ ಹೆಚ್ಚುವರಿ ಓದಿನ ಅವಧಿಯೊಂದಿಗೆ ಸೇತುಬಂಧ ನಡೆಸುತ್ತವೆ (ಚಿಕಿತ್ಸಾ ಗುಂಪು); 20 ಹೊಂದಾಣಿಕೆಯ ಶಾಲೆಗಳು ಸೇತುಬಂಧ ಮಾತ್ರ ನಡೆಸುತ್ತವೆ (ಹೋಲಿಕೆ ಗುಂಪು). 4ನೇ ತರಗತಿ ಮಕ್ಕಳು ಜೂನ್ ಮತ್ತು ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ಕನ್ನಡ ಓದಿನ ಪರೀಕ್ಷೆ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾರೆ. ಗಳಿಕೆ ಅಂಕಗಳನ್ನು ಸ್ವತಂತ್ರ ಮಾದರಿ t-ಪರೀಕ್ಷೆಯಿಂದ ವಿಶ್ಲೇಷಿಸಿ, ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು (Cohen's d) ವರದಿ ಮಾಡಿ."]},{title:"ಪ್ರೌಢಶಾಲೆಗಳ ಸ್ತರೀಕೃತ ಮಾದರಿ",text:["180 ಸರ್ಕಾರಿ ಪ್ರೌಢಶಾಲೆಗಳಿರುವ ಜಿಲ್ಲೆಯಲ್ಲಿ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯ ಬಳಕೆಯನ್ನು ಸಮೀಕ್ಷಿಸಲು, ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮಗಳ ಆಧಾರದಲ್ಲಿ ಸ್ತರೀಕರಿಸಿ, ಪ್ರತಿ ಸ್ತರದ ಗಾತ್ರಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಯಾದೃಚ್ಛಿಕವಾಗಿ ಆಯ್ಕೆ ಮಾಡಿ."]}],activity:{title:"ಮಾದರಿ ಮತ್ತು ಪರೀಕ್ಷೆಯನ್ನು ಯೋಜಿಸಿ",prompt:"ನಿಮ್ಮ ಆಯ್ಕೆಯ ಜಿಲ್ಲಾ ಸಮೀಕ್ಷೆಗೆ ಮಾದರಿ ಗಾತ್ರವನ್ನು ಲೆಕ್ಕಹಾಕಿ, ನಂತರ ಉದಾಹರಣಾ ಪೂರ್ವ/ಉತ್ತರ ದತ್ತಾಂಶವನ್ನು ಸಾಂಖ್ಯಿಕ ಸಾಧನದಲ್ಲಿ ನಮೂದಿಸಿ ಫಲಿತಾಂಶವನ್ನು ಎರಡು ವಾಕ್ಯಗಳಲ್ಲಿ ವ್ಯಾಖ್ಯಾನಿಸಿ."},quiz:[{q:"ಅದೇ ವಿದ್ಯಾರ್ಥಿಗಳ SSLC ಗಣಿತ ಅಂಕಗಳನ್ನು ಪೂರ್ವ ಮತ್ತು ಉತ್ತರ ಪರೀಕ್ಷೆಗಳಲ್ಲಿ ಹೋಲಿಸುತ್ತೀರಿ. ಬಳಸಬೇಕಾದದ್ದು…",options:["ಕೈ-ವರ್ಗ","ಜೋಡಿ t-ಪರೀಕ್ಷೆ","ಸ್ವತಂತ್ರ t-ಪರೀಕ್ಷೆ","ANOVA"],why:"ಅದೇ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಎರಡು ಬಾರಿ ಅಳೆಯಲಾಗಿದೆ."},{q:"ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮ ಶಾಲೆಗಳ ಸರಾಸರಿ ಅಂಕಗಳ ಹೋಲಿಕೆಗೆ ಬೇಕಾದದ್ದು…",options:["ಜೋಡಿ t-ಪರೀಕ್ಷೆ","ಏಕಮುಖ ANOVA","ಸಹಸಂಬಂಧ","ವಿಷಯ ವಿಶ್ಲೇಷಣೆ"],why:"ಮೂರು ಸ್ವತಂತ್ರ ಗುಂಪುಗಳು."},{q:"ಕ್ರಾನ್‌ಬ್ಯಾಕ್ ಆಲ್ಫಾ ತಿಳಿಸುವುದು…",options:["ಸಿಂಧುತ್ವ","ಆಂತರಿಕ ಸ್ಥಿರತೆಯ ವಿಶ್ವಸನೀಯತೆ","ಮಾದರಿ ಗಾತ್ರ","ಪರಿಣಾಮ ಗಾತ್ರ"],why:"ಆಲ್ಫಾ ಆಂತರಿಕ ಸ್ಥಿರತೆಯನ್ನು ಅಂದಾಜಿಸುತ್ತದೆ."},{q:"ಗ್ರಂಥಾಲಯ ಅವಧಿ ಮತ್ತು ಓದಿನ ಅಂಕಗಳ ನಡುವಿನ ಬಲವಾದ ಸಹಸಂಬಂಧ ಸಾಬೀತುಪಡಿಸುವುದು…",options:["ಗ್ರಂಥಾಲಯಗಳೇ ಉತ್ತಮ ಓದಿಗೆ ಕಾರಣ","ಬೇರೆ ವಿವರಣೆಗಳೂ ಇರಬಹುದಾದ ಒಂದು ಸಂಬಂಧ","ಏನನ್ನೂ ಇಲ್ಲ","ಓದು ಗ್ರಂಥಾಲಯಗಳಿಗೆ ಕಾರಣ"],why:"ಸಹಸಂಬಂಧ ಮಾತ್ರ ಕಾರಣವನ್ನು ಸ್ಥಾಪಿಸುವುದಿಲ್ಲ."}]},m5:{objectives:["ಪ್ರಕರಣ ಅಧ್ಯಯನ, ಜನಾಂಗ ವರ್ಣನೆ, ಅನುಭವ ವಿಜ್ಞಾನ, ನಿರೂಪಣೆ ಮತ್ತು ಆಧಾರಿತ ಸಿದ್ಧಾಂತಗಳಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡುವುದು.","ಅರೆ-ರಚಿತ ಸಂದರ್ಶನಗಳು ಮತ್ತು ಕೇಂದ್ರೀಕೃತ ಗುಂಪು ಚರ್ಚೆಗಳನ್ನು ನಡೆಸುವುದು.","ಪ್ರತಿಲಿಪಿಗಳಿಗೆ ಸಂಕೇತ ನೀಡಿ ವಿಷಯವಸ್ತುಗಳನ್ನು ರೂಪಿಸುವುದು.","ವಿಶ್ವಾಸಾರ್ಹತೆಯನ್ನು ಸ್ಥಾಪಿಸುವುದು."],lessons:[{title:"ಮಾರ್ಗಗಳು",body:["ಪ್ರಕರಣ ಅಧ್ಯಯನ: ಸೀಮಿತ ಪ್ರಕರಣದ ಆಳವಾದ ಅಧ್ಯಯನ (ಒಂದು KPS ಆವರಣ). ಜನಾಂಗ ವರ್ಣನೆ: ಒಂದು ಸಂಸ್ಕೃತಿಯ ದೀರ್ಘಕಾಲದ ವೀಕ್ಷಣೆ (ಆಶ್ರಮ ಶಾಲೆಯ ಜೀವನ). ಅನುಭವ ವಿಜ್ಞಾನ (phenomenology): ಹಂಚಿಕೊಂಡ ಜೀವನಾನುಭವ (ಏಕೋಪಾಧ್ಯಾಯ ಶಾಲೆಗಳ ಮೊದಲ ವರ್ಷದ ಶಿಕ್ಷಕರು). ನಿರೂಪಣೆ: ಜೀವನ ಕಥೆಗಳು (ಮಹಿಳಾ ಮುಖ್ಯ ಶಿಕ್ಷಕರು). ಆಧಾರಿತ ಸಿದ್ಧಾಂತ (grounded theory): ದತ್ತಾಂಶದಿಂದ ಸಿದ್ಧಾಂತ ಕಟ್ಟುವುದು."]},{title:"ದತ್ತಾಂಶ ಸಂಗ್ರಹ",body:["ಅರೆ-ರಚಿತ ಸಂದರ್ಶನಗಳು ಮುಕ್ತ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಉಪಪ್ರಶ್ನೆಗಳಿರುವ ಮಾರ್ಗದರ್ಶಿಯನ್ನು ಬಳಸುತ್ತವೆ. 6–8 ಜನರ ಕೇಂದ್ರೀಕೃತ ಗುಂಪುಗಳು ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ಅಥವಾ ಪೋಷಕರಿಗೆ ಸೂಕ್ತ. ವೀಕ್ಷಣೆಯಲ್ಲಿ ವರ್ಣನೆ ಮತ್ತು ವ್ಯಾಖ್ಯಾನವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿಡುವ ಕ್ಷೇತ್ರ ಟಿಪ್ಪಣಿಗಳನ್ನು ಬರೆಯಿರಿ. ಒಪ್ಪಿಗೆಯೊಂದಿಗೆ ಮಾತ್ರ ಧ್ವನಿಮುದ್ರಿಸಿ; ಮೂಲ ಭಾಷೆಯಲ್ಲಿ ಪ್ರತಿಲಿಪಿ ಮಾಡಿ ಎಚ್ಚರಿಕೆಯಿಂದ ಅನುವಾದಿಸಿ."]},{title:"ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ವಿಶ್ವಾಸಾರ್ಹತೆ",body:["ವಿಷಯವಸ್ತು ವಿಶ್ಲೇಷಣೆ: ಪರಿಚಯ ಮಾಡಿಕೊಳ್ಳಿ → ಆರಂಭಿಕ ಸಂಕೇತಗಳನ್ನು ರಚಿಸಿ → ವಿಷಯವಸ್ತುಗಳನ್ನು ಹುಡುಕಿ → ಪರಿಶೀಲಿಸಿ → ವ್ಯಾಖ್ಯಾನಿಸಿ ಹೆಸರಿಸಿ → ಉಲ್ಲೇಖಗಳೊಂದಿಗೆ ಬರೆಯಿರಿ. ವಿಶ್ವಾಸಾರ್ಹತೆ ನಂಬಲರ್ಹತೆ (ಸದಸ್ಯ ಪರಿಶೀಲನೆ, ತ್ರಿಕೋನೀಕರಣ), ವರ್ಗಾವಣೀಯತೆ (ಸಮೃದ್ಧ ವರ್ಣನೆ), ಅವಲಂಬನೀಯತೆ (ಲೆಕ್ಕಪರಿಶೋಧನಾ ಜಾಡು) ಮತ್ತು ದೃಢೀಕರಣೀಯತೆ (ಆತ್ಮಾವಲೋಕನ ಟಿಪ್ಪಣಿಗಳು) ಮೇಲೆ ನಿಂತಿದೆ."]}],karnataka:[{title:"ಪ್ರಕರಣ ಅಧ್ಯಯನ: ಉತ್ತರ ಕನ್ನಡದ ಏಕೋಪಾಧ್ಯಾಯ ಶಾಲೆ",text:["ಗುಡ್ಡಗಾಡು ಪ್ರದೇಶದ ಶಾಲೆಯಲ್ಲಿ ಒಬ್ಬ ಶಿಕ್ಷಕರು ಐದು ತರಗತಿಗಳನ್ನು ಹೇಗೆ ನಿರ್ವಹಿಸುತ್ತಾರೆ? ಒಂದು ವಾರ ಪೂರ್ತಿ ವೀಕ್ಷಿಸಿ, ಶಿಕ್ಷಕರು, ಎಸ್‌ಡಿಎಂಸಿ ಅಧ್ಯಕ್ಷರು ಮತ್ತು ಮೂವರು ಪೋಷಕರನ್ನು ಸಂದರ್ಶಿಸಿ, ಪಾಠ ಯೋಜನೆಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ. ಸಮಯ ಹಂಚಿಕೆ, ಸಹಪಾಠಿ ಬೋಧನೆ ಮತ್ತು 3ನೇ ತರಗತಿಯ ಆಚೆಗೂ ನಲಿ-ಕಲಿ ಸಾಮಗ್ರಿಗಳ ಬಳಕೆಯಂತಹ ವಿಷಯವಸ್ತುಗಳನ್ನು ನಿರೀಕ್ಷಿಸಿ."]},{title:"ದ್ವಿಭಾಷಾ ವಿಭಾಗಗಳ ಬಗ್ಗೆ ಸಂದರ್ಶನಗಳು",text:["ಬೋಧನಾ ಮಾಧ್ಯಮ ಮನೆಮಾತಿಗಿಂತ ಭಿನ್ನವಾದಾಗ ಶೇ. 60ಕ್ಕೂ ಹೆಚ್ಚು ಬುಡಕಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು ಕಷ್ಟಪಟ್ಟರು ಎಂದು ರಾಜ್ಯದ ಟಿಪ್ಪಣಿಗಳು ದಾಖಲಿಸುತ್ತವೆ. ಚಾಮರಾಜನಗರದ ಡಯಟ್ ದ್ವಿಭಾಷಾ KPS ವಿಭಾಗಗಳ ಬಗ್ಗೆ ಸೋಲಿಗ ಪೋಷಕರು ಮತ್ತು ಶಿಕ್ಷಕರನ್ನು ಸಂದರ್ಶಿಸಿ ಮಕ್ಕಳಿಗೆ ನಿಜವಾಗಿ ಯಾವ ಸೇತು ಬೆಂಬಲ ಬೇಕು ಎಂದು ತಿಳಿಯಬಹುದು."]}],activity:{title:"ಸಂದರ್ಶನ ಭಾಗಕ್ಕೆ ಸಂಕೇತ ನೀಡಿ",prompt:"ಸಂಕೇತೀಕರಣ ಸಾಧನದಲ್ಲಿನ ಶಿಕ್ಷಕರ ಸಂದರ್ಶನ ಭಾಗಗಳನ್ನು ಓದಿ, ಸಂಕೇತಗಳನ್ನು ನೀಡಿ, ಅವುಗಳನ್ನು ಎರಡು ಅಥವಾ ಮೂರು ವಿಷಯವಸ್ತುಗಳಾಗಿ ಗುಂಪು ಮಾಡಿ."},quiz:[{q:"ಒಂದು KPS ಆವರಣವನ್ನು ಒಂದು ಅವಧಿಯಲ್ಲಿ ಆಳವಾಗಿ ಅಧ್ಯಯನ ಮಾಡುವುದು…",options:["ಸಮೀಕ್ಷೆ","ಪ್ರಕರಣ ಅಧ್ಯಯನ","ಪ್ರಯೋಗ","ಮೆಟಾ-ವಿಶ್ಲೇಷಣೆ"],why:"ಸೀಮಿತ ಪ್ರಕರಣದ ಆಳವಾದ ಅಧ್ಯಯನ."},{q:"ಸದಸ್ಯ ಪರಿಶೀಲನೆ (member checking) ಎಂದರೆ…",options:["ಹಾಜರಾತಿ ಪರಿಶೀಲನೆ","ನಿಖರತೆ ದೃಢಪಡಿಸಲು ಫಲಿತಾಂಶಗಳನ್ನು ಭಾಗವಹಿಸಿದವರಿಗೆ ಮರಳಿಸುವುದು","ಸಂಕೇತಗಳನ್ನು ಎಣಿಸುವುದು","ಯಾದೃಚ್ಛಿಕ ಮಾದರಿ"],why:"ಭಾಗವಹಿಸಿದವರು ವ್ಯಾಖ್ಯಾನಗಳನ್ನು ದೃಢಪಡಿಸುತ್ತಾರೆ."},{q:"ಕೇಂದ್ರೀಕೃತ ಗುಂಪಿನ ಆದರ್ಶ ಗಾತ್ರ ಸುಮಾರು…",options:["2","6–8","25","50"],why:"ವೈವಿಧ್ಯಕ್ಕೆ ಸಾಕಷ್ಟು ದೊಡ್ಡದು, ಎಲ್ಲರೂ ಮಾತನಾಡುವಷ್ಟು ಚಿಕ್ಕದು."},{q:"ಲೆಕ್ಕಪರಿಶೋಧನಾ ಜಾಡು (audit trail) ಬೆಂಬಲಿಸುವುದು…",options:["ಅವಲಂಬನೀಯತೆ","ಸಾಂಖ್ಯಿಕ ಶಕ್ತಿ","ಯಾದೃಚ್ಛಿಕ ಆಯ್ಕೆ","ಎಲ್ಲ ರಾಜ್ಯಗಳಿಗೆ ಸಾಮಾನ್ಯೀಕರಣ"],why:"ನಿಮ್ಮ ನಿರ್ಧಾರಗಳನ್ನು ಇತರರು ಅನುಸರಿಸಲು ಸಾಧ್ಯವಾಗುತ್ತದೆ."}]},m6:{objectives:["ಸಮಕೇಂದ್ರಿತ, ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ ಮತ್ತು ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ ವಿನ್ಯಾಸಗಳನ್ನು ವಿವರಿಸುವುದು.","ಪರಿಮಾಣಾತ್ಮಕ ಮತ್ತು ಗುಣಾತ್ಮಕ ಎಳೆಗಳು ಸೇರುವ ಹಂತವನ್ನು ಯೋಜಿಸುವುದು.","ಫಲಿತಾಂಶಗಳನ್ನು ಏಕೀಕರಿಸುವ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ ರಚಿಸುವುದು."],lessons:[{title:"ಮೂರು ಮುಖ್ಯ ವಿನ್ಯಾಸಗಳು",body:["ಸಮಕೇಂದ್ರಿತ: ಎರಡೂ ಎಳೆಗಳನ್ನು ಒಂದೇ ಸಮಯದಲ್ಲಿ ಸಂಗ್ರಹಿಸಿ ಹೋಲಿಸಿ. ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಮೊದಲು ಪರಿಮಾಣಾತ್ಮಕ, ನಂತರ ಅನಿರೀಕ್ಷಿತ ಫಲಿತಾಂಶಗಳನ್ನು ವಿವರಿಸಲು ಗುಣಾತ್ಮಕ. ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಸಾಧನ ಅಥವಾ ಊಹೆಗಳನ್ನು ರೂಪಿಸಲು ಮೊದಲು ಗುಣಾತ್ಮಕ, ನಂತರ ಪರೀಕ್ಷಿಸಲು ಪರಿಮಾಣಾತ್ಮಕ."]},{title:"ಏಕೀಕರಣ",body:["ಮಿಶ್ರಣ ಎಲ್ಲಾದರೂ ನಡೆಯಲೇಬೇಕು — ಮಾದರಿ ಆಯ್ಕೆಯಲ್ಲಿ (ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳಿಂದ ಸಂದರ್ಶಿತರನ್ನು ಆರಿಸುವುದು), ವಿಶ್ಲೇಷಣೆಯಲ್ಲಿ (ಅಂಕಿಗಳು ಮತ್ತು ವಿಷಯವಸ್ತುಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ಇಡುವ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ) ಅಥವಾ ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ. ಎರಡು ಪ್ರತ್ಯೇಕ ವರದಿಗಳನ್ನು ಒಟ್ಟಿಗೆ ಹೊಲಿದರೆ ಅದು ಮಿಶ್ರ ವಿಧಾನವಲ್ಲ."]}],karnataka:[{title:"ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ: 6ನೇ ತರಗತಿಯ ಕುಸಿತ",text:['ಹಂತ 1: ಗಣಿತ ಅಂಕಗಳು ತೀವ್ರವಾಗಿ ಕುಸಿಯುವ ಶಾಲೆಗಳನ್ನು ಕಂಡುಹಿಡಿಯಲು ಜಿಲ್ಲೆಯ 5 ಮತ್ತು 6ನೇ ತರಗತಿಗಳ LBA ಅಂಕಗಳನ್ನು ವಿಶ್ಲೇಷಿಸಿ. ಹಂತ 2: ಕಾರಣ ತಿಳಿಯಲು ತೀವ್ರ ಕುಸಿತದ ನಾಲ್ಕು ಮತ್ತು ಕಡಿಮೆ ಕುಸಿತದ ನಾಲ್ಕು ಶಾಲೆಗಳ ಶಿಕ್ಷಕರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಸಂದರ್ಶಿಸಿ. ಜಂಟಿ ಪ್ರದರ್ಶನದಲ್ಲಿ ಏಕೀಕರಿಸಿ: "ಅಂಕ ಮಾದರಿ | ಶಿಕ್ಷಕರ ವಿವರಣೆ | ಮಕ್ಕಳ ವಿವರಣೆ".']},{title:"ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಎಸ್‌ಡಿಎಂಸಿ ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ ಮಾಪಕ",text:['ಬೀದರ್‌ನ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರೊಂದಿಗಿನ ಕೇಂದ್ರೀಕೃತ ಗುಂಪುಗಳು ಸ್ಥಳೀಯವಾಗಿ "ಸಕ್ರಿಯ ಭಾಗವಹಿಸುವಿಕೆ" ಎಂದರೇನು ಎಂದು ಗುರುತಿಸುತ್ತವೆ; ಆ ವಿಷಯವಸ್ತುಗಳು ಪ್ರಶ್ನಾವಳಿಯ ಅಂಶಗಳಾಗಿ ಜಿಲ್ಲೆಯಾದ್ಯಂತ ಎಸ್‌ಡಿಎಂಸಿಗಳಿಗೆ ನೀಡಲ್ಪಡುತ್ತವೆ.']}],activity:{title:"ನಿಮ್ಮ ವಿನ್ಯಾಸ ಆರಿಸಿ",prompt:"ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನಕ್ಕಾಗಿ ವಿನ್ಯಾಸ ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಮತ್ತು ಕನಿಷ್ಠ ಮೂರು ಸಾಲುಗಳ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ ರಚಿಸಿ."},quiz:[{q:"ಅನಿರೀಕ್ಷಿತ ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳನ್ನು ವಿವರಿಸಲು ಸಂದರ್ಶನಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ವಿನ್ಯಾಸ…",options:["ಸಮಕೇಂದ್ರಿತ","ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಅಂತರ್ಗತ ಪ್ರಾಯೋಗಿಕ"],why:"ಮೊದಲು ಪರಿಮಾಣಾತ್ಮಕ, ನಂತರ ಗುಣಾತ್ಮಕ ವಿವರಿಸುತ್ತದೆ."},{q:"ಜಂಟಿ ಪ್ರದರ್ಶನ (joint display) ಎಂದರೆ…",options:["ಒಂದು ಭಿತ್ತಿಪತ್ರ","ಪರಿಮಾಣಾತ್ಮಕ ಮತ್ತು ಗುಣಾತ್ಮಕ ಫಲಿತಾಂಶಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ಇಡುವ ಕೋಷ್ಟಕ","ಸ್ತಂಭ ನಕ್ಷೆ","ಒಪ್ಪಿಗೆ ಪತ್ರ"],why:"ಇದು ಏಕೀಕರಣವನ್ನು ಕಣ್ಣಿಗೆ ಕಾಣುವಂತೆ ತೋರಿಸುತ್ತದೆ."},{q:"ಕೇಂದ್ರೀಕೃತ ಗುಂಪಿನ ವಿಷಯವಸ್ತುಗಳಿಂದ ಪ್ರಶ್ನಾವಳಿ ರಚಿಸುವುದು…",options:["ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ","ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಸಮಕೇಂದ್ರಿತ","ಮಿಶ್ರ ವಿಧಾನವಲ್ಲ"],why:"ಮೊದಲ ಗುಣಾತ್ಮಕ ಹಂತ ಪರಿಮಾಣಾತ್ಮಕ ಸಾಧನಕ್ಕೆ ಆಧಾರ."},{q:"ಯಾವುದು ನಿಜವಾದ ಮಿಶ್ರಣವಲ್ಲ?",options:["ಜಂಟಿ ಪ್ರದರ್ಶನ","ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳಿಂದ ಸಂದರ್ಶಿತರ ಆಯ್ಕೆ","ಒಂದೇ ಹೊದಿಕೆಯಲ್ಲಿ ಸಂಬಂಧವಿಲ್ಲದ ಎರಡು ವರದಿಗಳು","ವಿಷಯವಸ್ತುಗಳನ್ನು ಅಂಕಗಳೊಂದಿಗೆ ಹೋಲಿಸುವುದು"],why:"ಏಕೀಕರಣ ನಡೆಯಲೇಬೇಕು."}]},m7:{objectives:["ತಮ್ಮದೇ ಅಭ್ಯಾಸದ ಮೇಲೆ ಯೋಜನೆ–ಕ್ರಿಯೆ–ವೀಕ್ಷಣೆ–ಚಿಂತನೆ ಚಕ್ರಗಳನ್ನು ನಡೆಸುವುದು.","ತರಗತಿ ಅಥವಾ ತರಬೇತಿ ಸಭಾಂಗಣದಲ್ಲಿ ಸರಳ, ಬಳಸಬಹುದಾದ ಪುರಾವೆ ಸಂಗ್ರಹಿಸುವುದು.","ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯಲ್ಲಿ ಶಿಕ್ಷಕರು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳಿಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುವುದು."],lessons:[{title:"ಚಕ್ರ",body:["ಯೋಜನೆ: ನಿಮ್ಮ ಅಭ್ಯಾಸದ ನಿರ್ದಿಷ್ಟ ಸಮಸ್ಯೆ ಮತ್ತು ಪ್ರಯತ್ನಿಸಬೇಕಾದ ಬದಲಾವಣೆಯನ್ನು ಹೆಸರಿಸಿ. ಕ್ರಿಯೆ: ನಿಗದಿತ ಅವಧಿಗೆ ಬದಲಾವಣೆಯನ್ನು ಜಾರಿಗೊಳಿಸಿ. ವೀಕ್ಷಣೆ: ಪುರಾವೆ ಸಂಗ್ರಹಿಸಿ (ಕಲಿಕಾ ಮಾದರಿಗಳು, ಕಿರು ಪರೀಕ್ಷೆಗಳು, ವೀಕ್ಷಣಾ ಟಿಪ್ಪಣಿಗಳು, ಚಿಂತನೆಗಳು). ಚಿಂತನೆ: ಏನು ಬದಲಾಯಿತು, ಯಾರಿಗೆ, ಏಕೆ? ನಂತರ ಮುಂದಿನ ಚಕ್ರವನ್ನು ಯೋಜಿಸಿ.","ಕ್ರಿಯಾ ಸಂಶೋಧನೆ ಸಣ್ಣ, ಸ್ಥಳೀಯ ಮತ್ತು ವ್ಯಾವಹಾರಿಕ. ಅದರ ಫಲಿತಾಂಶಗಳು ಮೊದಲು ನಿಮ್ಮದೇ ಪರಿಸರವನ್ನು ಸುಧಾರಿಸಲು; ಸಾಮಾನ್ಯೀಕರಣ ಅದರ ಗುರಿಯಲ್ಲ."]},{title:"ಶಿಕ್ಷಕರು ನಿರ್ವಹಿಸಬಹುದಾದ ಪುರಾವೆ",body:["ಈಗಾಗಲೇ ಇರುವುದನ್ನು ಬಳಸಿ: ನೋಟ್‌ಪುಸ್ತಕಗಳು, LBA ದಾಖಲೆಗಳು, ಹಾಜರಾತಿ ವಹಿಗಳು. ವಾರದ 5-ಅಂಶದ ಕಿರುಪರೀಕ್ಷೆ ಅಥವಾ ನಿರ್ಗಮನ ಚೀಟಿಯಂತಹ ಒಂದು ಸರಳ ಸಾಧನ ಸೇರಿಸಿ. ದಿನಾಂಕ, ಏನು ಮಾಡಲಾಯಿತು, ಏನಾಯಿತು ಮತ್ತು ಅದರ ಅರ್ಥವೇನು ಎಂದು ಬರೆಯುವ ಚಿಂತನಾ ದಿನಚರಿ ಇಟ್ಟುಕೊಳ್ಳಿ."]}],karnataka:[{title:"ಡಿ.ಇಎಲ್.ಇಡಿ. ಉಪನ್ಯಾಸಕರ ಚಕ್ರ",text:['ಸಮಸ್ಯೆ: ಅಭ್ಯಾಸ ಬೋಧನೆಯ ವೇಳೆ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳು ಸ್ಮರಣೆಯ ಪ್ರಶ್ನೆಗಳನ್ನು ಮಾತ್ರ ಕೇಳುತ್ತಾರೆ. ಕ್ರಿಯೆ: ನಾಲ್ಕು ವಾರಗಳ ಕಾಲ "ಏಕೆ" ಮತ್ತು "ಹಾಗಾದರೆ ಏನು" ಪ್ರಶ್ನೆಗಳನ್ನು ಮಾದರಿಯಾಗಿ ತೋರಿಸಿ, ಪ್ರಶ್ನಾ-ಪ್ರಕಾರದ ಪರಿಶೀಲನಾ ಪಟ್ಟಿಯೊಂದಿಗೆ ಸಹಪಾಠಿ ವೀಕ್ಷಣೆ ಬಳಸಿ. ಪುರಾವೆ: ಮೊದಲು ಮತ್ತು ನಂತರ ಪ್ರತಿ ಪಾಠದಲ್ಲಿನ ಉನ್ನತ ಹಂತದ ಪ್ರಶ್ನೆಗಳ ಎಣಿಕೆ. ಚಿಂತನೆ: ತಮ್ಮ ಪಾಠದ ವಿಡಿಯೋ ನೋಡಿದ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳಲ್ಲಿ ಲಾಭ ಹೆಚ್ಚು — ಮುಂದಿನ ಚಕ್ರದಲ್ಲಿ ವಿಡಿಯೋ ಪರಿಶೀಲನೆ ಸೇರುತ್ತದೆ.']},{title:"ಕಲಿಕಾ ಚೇತರಿಕೆ ತರಗತಿಯಲ್ಲಿ ಒಬ್ಬ ಶಿಕ್ಷಕಿ",text:["ಕೊಪ್ಪಳದ 5ನೇ ತರಗತಿ ಶಿಕ್ಷಕಿಯೊಬ್ಬರು ಮಕ್ಕಳು ಗಣಿತದ ಕಲಿಕಾ ಹಾಳೆ ಚಟುವಟಿಕೆಗಳನ್ನು ಬಿಟ್ಟುಬಿಡುತ್ತಿರುವುದನ್ನು ಗಮನಿಸುತ್ತಾರೆ. ಸೂಚನೆಗಳನ್ನು ಗಟ್ಟಿಯಾಗಿ ಓದಲು ಒಬ್ಬ ಉತ್ತಮ ಮತ್ತು ಒಬ್ಬ ದುರ್ಬಲ ಓದುಗರ ಜೋಡಿ ಕೆಲಸ ಪರಿಚಯಿಸುತ್ತಾರೆ. ಮೂರು ವಾರಗಳಲ್ಲಿ ಪೂರ್ಣಗೊಳಿಸುವಿಕೆ ಹೆಚ್ಚುತ್ತದೆ; ಅವರು ಇದನ್ನು ದಿನಚರಿಯಲ್ಲಿ ದಾಖಲಿಸಿ ಕ್ಲಸ್ಟರ್ ಸಭೆಯಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳುತ್ತಾರೆ."]}],activity:{title:"ನಿಮ್ಮ ಮೊದಲ ಚಕ್ರ ಯೋಜಿಸಿ",prompt:"ಕ್ರಿಯಾ ಸಂಶೋಧನಾ ದಿನಚರಿ ಬಳಸಿ ಒಂದು ಚಕ್ರದ ಪೂರ್ಣ ಯೋಜನೆ ಬರೆಯಿರಿ ಮತ್ತು ಮೊದಲ ಚಿಂತನಾ ನಮೂದನ್ನು ಮಾಡಿ."},quiz:[{q:"ಕ್ರಿಯಾ ಸಂಶೋಧನಾ ಚಕ್ರದ ಸರಿಯಾದ ಕ್ರಮ…",options:["ಕ್ರಿಯೆ–ಯೋಜನೆ–ಚಿಂತನೆ–ವೀಕ್ಷಣೆ","ಯೋಜನೆ–ಕ್ರಿಯೆ–ವೀಕ್ಷಣೆ–ಚಿಂತನೆ","ವೀಕ್ಷಣೆ–ಪ್ರಕಟಣೆ–ಯೋಜನೆ–ಕ್ರಿಯೆ","ಚಿಂತನೆ–ಕ್ರಿಯೆ–ಯೋಜನೆ–ಪ್ರಕಟಣೆ"],why:"ಯೋಜನೆ, ಕ್ರಿಯೆ, ವೀಕ್ಷಣೆ, ಚಿಂತನೆ, ನಂತರ ಪುನರಾವರ್ತನೆ."},{q:"ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯ ಮುಖ್ಯ ಗುರಿ…",options:["ಎಲ್ಲ ಶಾಲೆಗಳಿಗೆ ಸಾಮಾನ್ಯೀಕರಣ","ತಮ್ಮದೇ ಅಭ್ಯಾಸದ ಸುಧಾರಣೆ","ಪ್ರಯೋಗಾಲಯದಲ್ಲಿ ಸಿದ್ಧಾಂತ ಪರೀಕ್ಷೆ","ಶಾಲೆಗಳಿಗೆ ಶ್ರೇಣಿ ನೀಡುವುದು"],why:"ಇದು ಸುಧಾರಣೆಗಾಗಿ ವೃತ್ತಿನಿರತರ ಅನ್ವೇಷಣೆ."},{q:"ಶಿಕ್ಷಕರಿಗೆ ಸೂಕ್ತವಾದ ಕಡಿಮೆ ಹೊರೆಯ ಪುರಾವೆ ಮೂಲ ಯಾವುದು?",options:["ರಾಷ್ಟ್ರೀಯ ಸಮೀಕ್ಷೆ","ನಿರ್ಗಮನ ಚೀಟಿಗಳು","ಎಂಆರ್‌ಐ ಸ್ಕ್ಯಾನ್","ಜನಗಣತಿ ದತ್ತಾಂಶ"],why:"ಸರಳ, ತ್ವರಿತ ಮತ್ತು ಅಭ್ಯಾಸಕ್ಕೆ ಹತ್ತಿರ."},{q:"ಚಿಂತನೆಯ ನಂತರ ಸಂಶೋಧಕರು…",options:["ನಿಲ್ಲಿಸಬೇಕು","ಮುಂದಿನ ಚಕ್ರ ಯೋಜಿಸಬೇಕು","ದತ್ತಾಂಶ ಅಳಿಸಬೇಕು","ವಿಷಯ ಬದಲಿಸಬೇಕು"],why:"ಕ್ರಿಯಾ ಸಂಶೋಧನೆ ಚಕ್ರೀಯ."}]},m8:{objectives:["ರಚಿತ ಮತ್ತು ಅರಚಿತ ತರಗತಿ ವೀಕ್ಷಣೆಯನ್ನು ಬಳಸುವುದು.","ಮಕ್ಕಳ ಕೆಲಸ ಮತ್ತು ಮೌಲ್ಯಮಾಪನ ದತ್ತಾಂಶವನ್ನು ವಿಶ್ಲೇಷಿಸುವುದು.","ಬಹುವರ್ಗ ಮತ್ತು ಏಕವರ್ಗ ತರಗತಿಗಳನ್ನು ನ್ಯಾಯಯುತವಾಗಿ ಅಧ್ಯಯನ ಮಾಡುವುದು."],lessons:[{title:"ವೀಕ್ಷಣೆ",body:["ರಚಿತ ವೀಕ್ಷಣೆ ನಿಗದಿತ ವರ್ಗಗಳಿರುವ ವೇಳಾಪಟ್ಟಿಯನ್ನು ಬಳಸುತ್ತದೆ (ಉದಾ: ಶಿಕ್ಷಕರ ಮಾತು, ಮಕ್ಕಳ ಮಾತು, ಗುಂಪು ಕೆಲಸ, ಮೌನ), ನಿಗದಿತ ಅಂತರಗಳಲ್ಲಿ ದಾಖಲಿಸಲಾಗುತ್ತದೆ. ಅರಚಿತ ವೀಕ್ಷಣೆ ನಿರಂತರ ಟಿಪ್ಪಣಿಗಳನ್ನು ಬಳಸುತ್ತದೆ. ವೀಕ್ಷಕರ ಉಪಸ್ಥಿತಿ ವರ್ತನೆಯನ್ನು ಬದಲಿಸುತ್ತದೆ; ತರಗತಿ ನಿಮಗೆ ಒಗ್ಗಿಕೊಳ್ಳುವಂತೆ ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಭೇಟಿ ನೀಡಿ."]},{title:"ಮಕ್ಕಳ ಕೆಲಸ ಮತ್ತು ಮೌಲ್ಯಮಾಪನ ದತ್ತಾಂಶ",body:["ನೋಟ್‌ಪುಸ್ತಕಗಳು, ಕಾರ್ಯಹಾಳೆಗಳು, ಚಿತ್ರಗಳು ಮತ್ತು ಕಲಿಕಾ ಕಡತಗಳು ಮಕ್ಕಳು ಹೇಗೆ ಯೋಚಿಸುತ್ತಾರೆ ಎಂದು ತೋರಿಸುತ್ತವೆ. LBA ಮತ್ತು ಸಮಗ್ರ ಪ್ರಗತಿ ಪತ್ರ (HPC) ನಂತಹ ರಚನಾತ್ಮಕ ದಾಖಲೆಗಳು ದೀರ್ಘಾವಧಿಯ ದತ್ತಾಂಶ ನೀಡುತ್ತವೆ. ಅಂಕಗಳನ್ನು ಮಾತ್ರವಲ್ಲ, ದೋಷ ಮಾದರಿಗಳನ್ನು ಹುಡುಕಿ."]}],karnataka:[{title:"ನಲಿ-ಕಲಿ ತರಗತಿಯ ವೀಕ್ಷಣೆ",text:["ನಲಿ-ಕಲಿಯಲ್ಲಿ ಮಕ್ಕಳು ಮೈಲಿಗಲ್ಲಿನ ಆಧಾರದಲ್ಲಿ ಗುಂಪುಗಳಲ್ಲಿ ಕಲಿಕಾ ಕಾರ್ಡ್‌ಗಳನ್ನು ಬಳಸಿ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ ಮತ್ತು ಏಣಿಯ ಮೇಲೆ ತಮ್ಮ ಪ್ರಗತಿಯನ್ನು ಗುರುತಿಸುತ್ತಾರೆ. ವೀಕ್ಷಣಾ ವೇಳಾಪಟ್ಟಿ ಪ್ರತಿ 5 ನಿಮಿಷಕ್ಕೆ ದಾಖಲಿಸಬಹುದು: ಯಾವ ಗುಂಪುಗಳು ಶಿಕ್ಷಕ ಬೆಂಬಲಿತ, ಭಾಗಶಃ ಬೆಂಬಲಿತ ಅಥವಾ ಸ್ವಕಲಿಕೆಯಲ್ಲಿವೆ, ಮತ್ತು ಪ್ರತಿ ಮಗು ಏನು ಮಾಡುತ್ತಿದೆ. ಸ್ವಕಲಿಕಾ ಗುಂಪುಗಳು ನಿಜವಾಗಿ ತೊಡಗಿವೆಯೇ ಎಂಬುದನ್ನು ಇದು ತೋರಿಸುತ್ತದೆ."]},{title:"7ನೇ ತರಗತಿ ಭಿನ್ನರಾಶಿಗಳಲ್ಲಿ ದೋಷ ವಿಶ್ಲೇಷಣೆ",text:["ಹಾಸನದ ಒಬ್ಬ ಡಯಟ್ ಉಪನ್ಯಾಸಕರು ಮತ್ತು ನಾಲ್ವರು ಶಿಕ್ಷಕರು 120 ಭಿನ್ನರಾಶಿ ಕಾರ್ಯಹಾಳೆಗಳನ್ನು ಸಂಗ್ರಹಿಸುತ್ತಾರೆ. ದೋಷಗಳಿಗೆ ಸಂಕೇತ ನೀಡಿದಾಗ ಬಹುತೇಕ ಮಕ್ಕಳು ಅಂಶ ಮತ್ತು ಛೇದಗಳನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಕೂಡಿಸುತ್ತಾರೆ (1/2 + 1/3 = 2/5) ಎಂದು ತಿಳಿಯುತ್ತದೆ. ಈ ಫಲಿತಾಂಶ ವಿಸ್ತೀರ್ಣ ಮಾದರಿಗಳ ಕುರಿತ ಸಿಆರ್‌ಸಿ ಕಾರ್ಯಾಗಾರಕ್ಕೆ ಆಧಾರವಾಗುತ್ತದೆ."]}],activity:{title:"ಸಮಯಬದ್ಧ ವೀಕ್ಷಣೆ ನಡೆಸಿ",prompt:"20 ನಿಮಿಷಗಳ ಪಾಠದ (ನೇರ ಅಥವಾ ವಿಡಿಯೋ) ವೇಳೆ ವೀಕ್ಷಣಾ ಸಾಧನ ಬಳಸಿ ತರಗತಿ ಮಾತುಕತೆಯ ಮಾದರಿಯನ್ನು ಸಂಕ್ಷೇಪಿಸಿ."},quiz:[{q:"ಪ್ರತಿ 30 ಸೆಕೆಂಡಿಗೆ ಒಂದು ವರ್ಗವನ್ನು ದಾಖಲಿಸುವುದು…",options:["ಅಂತರ ಆಧಾರಿತ ರಚಿತ ವೀಕ್ಷಣೆ","ನಿರೂಪಣಾ ಸಂದರ್ಶನ","ದಾಖಲೆ ವಿಶ್ಲೇಷಣೆ","ಸಮೀಕ್ಷೆ"],why:"ನಿಗದಿತ ಅಂತರದ ವರ್ಗ ಸಂಕೇತೀಕರಣ."},{q:"ದಾಖಲಿಸುವ ಮೊದಲು ತರಗತಿಗೆ ಹಲವು ಬಾರಿ ಏಕೆ ಭೇಟಿ ನೀಡಬೇಕು?",options:["ವೀಕ್ಷಕ ಪರಿಣಾಮ ಕಡಿಮೆ ಮಾಡಲು","ಮಾದರಿ ಗಾತ್ರ ಹೆಚ್ಚಿಸಲು","ಸಂಭಾವನೆಗಾಗಿ","ಅಗತ್ಯವಿಲ್ಲ"],why:"ತರಗತಿ ವೀಕ್ಷಕರಿಗೆ ಒಗ್ಗಿಕೊಳ್ಳುತ್ತದೆ."},{q:"ನೋಟ್‌ಪುಸ್ತಕದ ದೋಷಗಳ ವಿಶ್ಲೇಷಣೆ ಉಪಯುಕ್ತ ಏಕೆಂದರೆ…",options:["ಅದು ಚಿಂತನಾ ಮಾದರಿಗಳನ್ನು ತೋರಿಸುತ್ತದೆ","ಅದು ಬೋಧನೆಗೆ ಬದಲಿ","ಅದು ಶಿಕ್ಷಕರಿಗೆ ಶ್ರೇಣಿ ನೀಡುತ್ತದೆ","ಅದು ಪರೀಕ್ಷೆಗಿಂತ ವೇಗ"],why:"ದೋಷಗಳು ತಪ್ಪುಗ್ರಹಿಕೆಗಳನ್ನು ಬಹಿರಂಗಪಡಿಸುತ್ತವೆ."},{q:"ನಲಿ-ಕಲಿ ತರಗತಿಯಲ್ಲಿ ಸಂಶೋಧಕರು ವೀಕ್ಷಿಸಬೇಕಾದದ್ದು…",options:["ಶಿಕ್ಷಕರನ್ನು ಮಾತ್ರ","ಸ್ವಕಲಿಕಾ ಗುಂಪುಗಳೂ ಸೇರಿ ಎಲ್ಲ ಗುಂಪುಗಳನ್ನು","ಅತ್ಯಂತ ಜಾಣ ಮಗುವನ್ನು ಮಾತ್ರ","ಕಪ್ಪುಹಲಗೆಯನ್ನು ಮಾತ್ರ"],why:"ಬಹುವರ್ಗ ಚಲನಶೀಲತೆ ಎಲ್ಲ ಗುಂಪುಗಳನ್ನು ಒಳಗೊಳ್ಳುತ್ತದೆ."}]},m9:{objectives:["ಪಾಲುದಾರರನ್ನು ಮತ್ತು ಅವರ ಆಸಕ್ತಿಗಳನ್ನು ನಕ್ಷೆ ಮಾಡುವುದು.","ಸಮುದಾಯಗಳನ್ನು ಕೇವಲ ಉತ್ತರದಾತರಾಗಿ ಅಲ್ಲ, ಪಾಲುದಾರರಾಗಿ ತೊಡಗಿಸುವುದು.","ಸಮುದಾಯ ಪರಿಸರದಲ್ಲಿ ನೈತಿಕತೆಯನ್ನು ನಿರ್ವಹಿಸುವುದು."],lessons:[{title:"ತತ್ವಗಳು",body:["ಸಮುದಾಯ ಆಧಾರಿತ ಸಹಭಾಗಿತ್ವ ಸಂಶೋಧನೆ ಸಮುದಾಯದ ಸದಸ್ಯರನ್ನು ಸಹ-ಸಂಶೋಧಕರಾಗಿ ಕಾಣುತ್ತದೆ: ಅವರು ಪ್ರಶ್ನೆಗಳನ್ನು ನಿರ್ಧರಿಸಲು, ದತ್ತಾಂಶ ಸಂಗ್ರಹಿಸಲು ಮತ್ತು ಫಲಿತಾಂಶಗಳನ್ನು ವ್ಯಾಖ್ಯಾನಿಸಲು ನೆರವಾಗುತ್ತಾರೆ. ಇದು ನಂಬಿಕೆ ಬೆಳೆಸುತ್ತದೆ ಮತ್ತು ಫಲಿತಾಂಶಗಳ ಬಳಕೆಯ ಸಾಧ್ಯತೆ ಹೆಚ್ಚಿಸುತ್ತದೆ."]},{title:"ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ ಮತ್ತು ನೈತಿಕತೆ",body:["ಪರಿಚಿತ ಸ್ಥಳಗಳಲ್ಲಿ, ಕೃಷಿ ಮತ್ತು ಕೆಲಸದ ವೇಳಾಪಟ್ಟಿಗೆ ಹೊಂದುವ ಸಮಯದಲ್ಲಿ ಭೇಟಿಯಾಗಿ. ಸ್ಥಳೀಯ ಭಾಷೆ ಬಳಸಿ. ಅಧ್ಯಯನ ಏನು ನೀಡಬಹುದು ಮತ್ತು ಏನು ನೀಡಲಾರದು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ. ಫಲಿತಾಂಶಗಳನ್ನು ಗ್ರಾಮಸಭೆ ಅಥವಾ ಎಸ್‌ಡಿಎಂಸಿ ಸಭೆಯಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳಿ."]}],karnataka:[{title:"ಸಂಶೋಧನಾ ಪಾಲುದಾರರಾಗಿ ಎಸ್‌ಡಿಎಂಸಿಗಳು",text:["ಶಾಲಾಭಿವೃದ್ಧಿ ಮತ್ತು ಮೇಲುಸ್ತುವಾರಿ ಸಮಿತಿಗಳು (ಎಸ್‌ಡಿಎಂಸಿ) ಪೋಷಕರು ಮತ್ತು ಸ್ಥಳೀಯ ನಾಯಕರನ್ನು ಶಾಲಾ ಆಡಳಿತಕ್ಕೆ ತರುತ್ತವೆ. 8ನೇ ತರಗತಿಯಲ್ಲಿ ಬಾಲಕಿಯರ ಹಾಜರಾತಿ ಏಕೆ ಕುಸಿಯುತ್ತದೆ ಎಂಬುದನ್ನು ಅಧ್ಯಯನ ಮಾಡಲು ತುಮಕೂರಿನ ಡಯಟ್ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರೊಂದಿಗೆ ಕೆಲಸ ಮಾಡಬಹುದು; ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ಒಂದು ಕಿರು ಮಾರ್ಗದರ್ಶಿ ಬಳಸಿ ಮನೆ-ಮನೆ ಮಾತುಕತೆ ನಡೆಸುತ್ತಾರೆ."]},{title:"ಶಾಲೆಯಿಂದ ಹೊರಗುಳಿದ ಮಕ್ಕಳು",text:["ಕಲಬುರಗಿಯ ವಲಸೆ ಕಾರ್ಮಿಕರ ತಾಲ್ಲೂಕಿನಲ್ಲಿ, ಋತುಮಾನದ ಕೆಲಸಕ್ಕೆ ಹೊರಡುವ ಕುಟುಂಬಗಳನ್ನು ನಕ್ಷೆ ಮಾಡುವುದರಿಂದ ಚಿಣ್ಣರ ಅಂಗಳ ಸೇತುಬಂಧ ತರಗತಿಗಳು ಮತ್ತು ಋತುಮಾನದ ವಸತಿನಿಲಯಗಳನ್ನು ಯೋಜಿಸಲು ನೆರವಾಗುತ್ತದೆ. ಪಾಲುದಾರರು: ಅಂಗನವಾಡಿ ಕಾರ್ಯಕರ್ತೆಯರು, ಗ್ರಾಮ ಪಂಚಾಯಿತಿ, ಎಸ್‌ಡಿಎಂಸಿಗಳು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳು."]}],activity:{title:"ನಿಮ್ಮ ಪಾಲುದಾರರ ನಕ್ಷೆ ಮಾಡಿ",prompt:"ಪಾಲುದಾರ ನಕ್ಷೆ ಬಳಸಿ ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನದಿಂದ ಪ್ರಭಾವಿತರಾಗುವ ಎಲ್ಲರನ್ನೂ ಪಟ್ಟಿ ಮಾಡಿ ಮತ್ತು ಪ್ರತಿಯೊಬ್ಬರನ್ನು ಹೇಗೆ ತೊಡಗಿಸಬೇಕು ಎಂದು ನಿರ್ಧರಿಸಿ."},quiz:[{q:"ಸಹಭಾಗಿತ್ವ ಸಂಶೋಧನೆಯಲ್ಲಿ ಸಮುದಾಯ ಸದಸ್ಯರು…",options:["ಕೇವಲ ಉತ್ತರದಾತರು","ಸಹ-ಸಂಶೋಧಕರು","ವಿಶ್ಲೇಷಣೆಯಿಂದ ಹೊರಗು","ಕೇವಲ ಸಂಭಾವನೆ ಪಡೆಯುವ ಗಣತಿದಾರರು"],why:"ಅವರು ನಿರ್ಧಾರಗಳಲ್ಲಿ ಪಾಲು ಪಡೆಯುತ್ತಾರೆ."},{q:"ಹಳ್ಳಿಯಲ್ಲಿ ಫಲಿತಾಂಶಗಳನ್ನು ಮರಳಿಸಲು ಸೂಕ್ತ ಸ್ಥಳ…",options:["ಕೇವಲ ನಿಯತಕಾಲಿಕ","ಎಸ್‌ಡಿಎಂಸಿ ಅಥವಾ ಗ್ರಾಮಸಭೆ","ಖಾಸಗಿ ಇಮೇಲ್","ಎಲ್ಲಿಯೂ ಇಲ್ಲ"],why:"ಫಲಿತಾಂಶಗಳು ಸಮುದಾಯಕ್ಕೆ ಮರಳಬೇಕು."},{q:"ಬಾಲಕಿಯರ ಹಾಜರಾತಿ ಕುರಿತ ಅಧ್ಯಯನದಲ್ಲಿ ಪಾಲುದಾರರು ಯಾರು?",options:["ಪೋಷಕರು","ಎಸ್‌ಡಿಎಂಸಿ","ಅಂಗನವಾಡಿ ಕಾರ್ಯಕರ್ತೆ","ಇವರೆಲ್ಲರೂ"],why:"ಎಲ್ಲರಿಗೂ ಆಸಕ್ತಿ ಮತ್ತು ಪ್ರಭಾವವಿದೆ."},{q:"ಸುಗ್ಗಿಯ ಸಮಯದಲ್ಲಿ ಸಭೆ ನಿಗದಿಪಡಿಸುವುದು…",options:["ಗೌರವಪೂರ್ಣ","ಕೃಷಿಕ ಕುಟುಂಬಗಳನ್ನು ಹೊರಗಿಡುವ ಸಾಧ್ಯತೆ","ಕಡ್ಡಾಯ","ಅಪ್ರಸ್ತುತ"],why:"ಸಮಯ ಯಾರು ಭಾಗವಹಿಸಬಹುದು ಎಂಬುದನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ."}]},m10:{objectives:["ದೋಷ ಕಡಿಮೆ ಮಾಡುವ ನಮೂನೆಗಳನ್ನು ವಿನ್ಯಾಸಗೊಳಿಸುವುದು.","ಕ್ಷೇತ್ರ ತನಿಖಾಧಿಕಾರಿಗಳಿಗೆ ತರಬೇತಿ ನೀಡಿ ಗುಣಮಟ್ಟದ ಮೇಲುಸ್ತುವಾರಿ ಮಾಡುವುದು.","ದತ್ತಾಂಶವನ್ನು ಶುದ್ಧೀಕರಿಸಿ, ಸಂಕೇತಿಸಿ, ನಿರ್ವಹಿಸುವುದು.","ವರ್ಣನಾತ್ಮಕ ಮತ್ತು ಅನುಮಾನಾತ್ಮಕ ವಿಶ್ಲೇಷಣೆ ನಡೆಸಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು."],lessons:[{title:"ಕ್ಷೇತ್ರಕಾರ್ಯ ಯೋಜನೆ",body:["ಪ್ರತಿ ಸಾಧನವನ್ನು ಮಾದರಿಯಲ್ಲಿಲ್ಲದ 2–3 ಶಾಲೆಗಳಲ್ಲಿ ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿಸಿ. ತನಿಖಾಧಿಕಾರಿ ಕೈಪಿಡಿ ಬರೆಯಿರಿ. ದತ್ತಾಂಶ ಸಂಗ್ರಹಿಸುವ ಸಿಆರ್‌ಪಿ ಅಥವಾ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳಿಗೆ ಅಣಕು ಸಂದರ್ಶನಗಳೊಂದಿಗೆ ತರಬೇತಿ ನೀಡಿ. ಪರೀಕ್ಷೆ ಅಥವಾ ಹಬ್ಬದ ದಿನಗಳಲ್ಲಿ ಶಾಲಾ ಭೇಟಿ ಆಗದಂತೆ ಯೋಜಿಸಿ."]},{title:"ದತ್ತಾಂಶ ನಿರ್ವಹಣೆ",body:["ಸಂಕೇತ ಪುಸ್ತಕ (codebook) ರಚಿಸಿ: ಚರಾಂಶದ ಹೆಸರು, ಶೀರ್ಷಿಕೆ, ಮೌಲ್ಯಗಳು, ಕಾಣೆಯಾದ ದತ್ತಾಂಶದ ಸಂಕೇತಗಳು. ದತ್ತಾಂಶವನ್ನು ಎರಡು ಬಾರಿ ನಮೂದಿಸಿ ಅಥವಾ ಶೇ. 10 ನಮೂನೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ದಿನಾಂಕಿತ ಆವೃತ್ತಿಗಳೊಂದಿಗೆ ಕಡತಗಳನ್ನು ಉಳಿಸಿ, ಮುಖ್ಯ ಪ್ರತಿಯನ್ನು ಓದಲು-ಮಾತ್ರ ಇಡಿ ಮತ್ತು ಬ್ಯಾಕಪ್ ಮಾಡಿ."]},{title:"ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ವ್ಯಾಖ್ಯಾನ",body:['ವರ್ಣನಾತ್ಮಕ ಅಂಕಿಅಂಶಗಳಿಂದ ಆರಂಭಿಸಿ: n, ಸರಾಸರಿ, ಮಧ್ಯಾಂಕ, ಪ್ರಮಾಣಿತ ವಿಚಲನೆ, ಆವರ್ತನಗಳು. ನಂತರ ಊಹೆಗಳನ್ನು ಪರೀಕ್ಷಿಸಿ. ಪರೀಕ್ಷೆ, ಅಂಕಿಅಂಶ, ಸ್ವಾತಂತ್ರ್ಯ ಮಟ್ಟ, p-ಮೌಲ್ಯ ಮತ್ತು ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು ವರದಿ ಮಾಡಿ: "t(38) = 2.41, p = .021, d = 0.76". ಸಾಂಖ್ಯಿಕ ಮಹತ್ವ ಪ್ರಾಯೋಗಿಕ ಮಹತ್ವಕ್ಕೆ ಸಮವಲ್ಲ.',"ಗುಣಾತ್ಮಕ ದತ್ತಾಂಶಕ್ಕೆ ಘಟಕ 5ರ ಸಂಕೇತೀಕರಣ ಮತ್ತು ವಿಷಯವಸ್ತು ಹಂತಗಳನ್ನು ಬಳಸಿ. ಬಹುತೇಕ ಡಯಟ್ ಅಧ್ಯಯನಗಳಿಗೆ ಲಿಬ್ರೆಆಫೀಸ್ ಕ್ಯಾಲ್ಕ್‌ನಂತಹ ಸ್ಪ್ರೆಡ್‌ಶೀಟ್ ತಂತ್ರಾಂಶ ಸಾಕು; ಮುಂದುವರಿದ ಕೆಲಸಕ್ಕೆ JASP ಮತ್ತು R ಉಚಿತವಾಗಿ ಲಭ್ಯ."]}],karnataka:[{title:"ಉದಾಹರಣೆ: ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆಯುವಿಕೆಯ ಮೇಲೆ ಕೈ-ವರ್ಗ",text:["ಮಂಡ್ಯ ಜಿಲ್ಲೆಯ 200 ಮಂದಿ 7ನೇ ತರಗತಿ ಮಕ್ಕಳ ಉದಾಹರಣಾ ದತ್ತಾಂಶ: 100 ಬಾಲಕಿಯರಲ್ಲಿ 62 ಮಂದಿ ಕಳೆದ ತಿಂಗಳು ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆದರು; 100 ಬಾಲಕರಲ್ಲಿ 45 ಮಂದಿ. ಪುಸ್ತಕ ಪಡೆಯುವಿಕೆ ಲಿಂಗದೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದೆಯೇ? 2×2 ಕೋಷ್ಟಕವನ್ನು (62, 38 / 45, 55) ಕೈ-ವರ್ಗ ಸಾಧನದಲ್ಲಿ ನಮೂದಿಸಿ. ಫಲಿತಾಂಶ (χ² ≈ 5.8, p ≈ .016) ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕಾರಣ ತಿಳಿಯಲು ಸಂದರ್ಶನಗಳನ್ನು ನಡೆಸಿ."]},{title:"ಉದಾಹರಣೆ: ಮಾಧ್ಯಮಗಳ ನಡುವೆ ANOVA",text:["ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮದ ತಲಾ ಮೂರು ಶಾಲೆಗಳ ಉದಾಹರಣಾ LBA ಗಣಿತ ಅಂಕಗಳು (20ಕ್ಕೆ). ಏಕಮುಖ ANOVA ನಡೆಸಿ; ಮಹತ್ವದ್ದಾಗಿದ್ದರೆ ಯಾವ ಜೋಡಿಗಳು ಭಿನ್ನ ಎಂದು ಪರಿಶೀಲಿಸಿ ಮತ್ತು ಮಾಧ್ಯಮದ ಆಚೆಗಿನ ವಿವರಣೆಗಳನ್ನು (ಶಿಕ್ಷಕರ ಖಾಲಿ ಹುದ್ದೆಗಳು, ದಾಖಲಾತಿ ಗಾತ್ರ) ಹುಡುಕಿ."]}],activity:{title:"ಉದಾಹರಣಾ ದತ್ತಾಂಶ ವಿಶ್ಲೇಷಿಸಿ",prompt:"ಸಾಂಖ್ಯಿಕ ಸಾಧನದಲ್ಲಿ ಕೈ-ವರ್ಗ ಉದಾಹರಣೆ ಮತ್ತು ಒಂದು ANOVA ನಡೆಸಿ. APA ಶೈಲಿಯಲ್ಲಿ ಫಲಿತಾಂಶ ಪರಿಚ್ಛೇದ ಬರೆಯಿರಿ."},quiz:[{q:"ಸಂಕೇತ ಪುಸ್ತಕ ದಾಖಲಿಸುವುದು…",options:["ಪಾಸ್‌ವರ್ಡ್‌ಗಳು","ಚರಾಂಶಗಳ ಹೆಸರು, ಶೀರ್ಷಿಕೆ ಮತ್ತು ಮೌಲ್ಯ ಸಂಕೇತಗಳು","ಶಿಕ್ಷಕರ ವೇತನ","ಕಾಣೆಯಾದ ದತ್ತಾಂಶ ಮಾತ್ರ"],why:"ದತ್ತಾಂಶವನ್ನು ಹೇಗೆ ಸಂಕೇತಿಸಲಾಗಿದೆ ಎಂದು ದಾಖಲಿಸುತ್ತದೆ."},{q:"p = .03 ಎಂದರೆ…",options:["ಪರಿಣಾಮ ದೊಡ್ಡದು","ನಿಜವಾದ ಪರಿಣಾಮ ಇಲ್ಲದಿದ್ದರೆ, ಇಷ್ಟು ತೀವ್ರ ಫಲಿತಾಂಶ ಸುಮಾರು ಶೇ. 3 ಬಾರಿ ಬರುತ್ತದೆ","ಊಹೆ ಶೇ. 97 ಸತ್ಯ","ದತ್ತಾಂಶ ತಪ್ಪು"],why:"p ಶೂನ್ಯ ಊಹೆಯ ಅಡಿಯಲ್ಲಿ ದತ್ತಾಂಶದ ಬಗ್ಗೆ ಹೇಳುತ್ತದೆ."},{q:"ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು ವರದಿ ಮಾಡುವುದು ಏಕೆಂದರೆ…",options:["ಅದು ವ್ಯತ್ಯಾಸದ ಪ್ರಾಯೋಗಿಕ ಗಾತ್ರ ತೋರಿಸುತ್ತದೆ","ನಿಯತಕಾಲಿಕಗಳಿಗೆ ಅಂಕಿ ಬೇಕು","ಅದು ಸರಾಸರಿಗೆ ಬದಲಿ","ಅದೇ p-ಮೌಲ್ಯ"],why:"ಮಹತ್ವ ≠ ಪ್ರಾಮುಖ್ಯತೆ."},{q:"ಸಾಧನಗಳನ್ನು ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿಸಬೇಕಾದದ್ದು…",options:["ಮಾದರಿ ಶಾಲೆಗಳಲ್ಲಿ","ಮಾದರಿಯ ಹೊರಗಿನ ಆದರೆ ಹೋಲುವ ಶಾಲೆಗಳಲ್ಲಿ","ಡಯಟ್ ಕಚೇರಿಯಲ್ಲಿ","ಯಾವ ಶಾಲೆಯಲ್ಲೂ ಇಲ್ಲ"],why:"ಮಾದರಿ ಕಲುಷಿತವಾಗದಂತೆ."}]},m11:{objectives:["ಪ್ರಮಾಣಿತ ರಚನೆಯೊಂದಿಗೆ ಸಂಶೋಧನಾ ವರದಿ ಬರೆಯುವುದು.","APA ಶೈಲಿಯಲ್ಲಿ ಮೂಲಗಳನ್ನು ಉಲ್ಲೇಖಿಸುವುದು.","ಶಿಕ್ಷಕರು, ಅಧಿಕಾರಿಗಳು ಮತ್ತು ಸಮುದಾಯಗಳಿಗೆ ಫಲಿತಾಂಶಗಳನ್ನು ಪ್ರಸ್ತುತಪಡಿಸುವುದು.","ನೀತಿ ಸಂಕ್ಷೇಪ ಮತ್ತು ಭಿತ್ತಿಪತ್ರ ಸಿದ್ಧಪಡಿಸುವುದು."],lessons:[{title:"ವರದಿಯ ರಚನೆ",body:["ಶೀರ್ಷಿಕೆ, ಸಾರಾಂಶ (150–250 ಪದಗಳು), ಪೀಠಿಕೆ ಮತ್ತು ಸಮಸ್ಯೆ, ಸಂಬಂಧಿತ ಸಾಹಿತ್ಯ ಅವಲೋಕನ, ಉದ್ದೇಶಗಳು ಮತ್ತು ಪ್ರಶ್ನೆಗಳು, ವಿಧಾನ (ವಿನ್ಯಾಸ, ಮಾದರಿ, ಸಾಧನಗಳು, ಕಾರ್ಯವಿಧಾನ, ನೈತಿಕತೆ), ಫಲಿತಾಂಶಗಳು, ಚರ್ಚೆ, ಶಿಫಾರಸುಗಳು, ಮಿತಿಗಳು, ಉಲ್ಲೇಖಗಳು, ಅನುಬಂಧಗಳು (ಸಾಧನಗಳು, ಒಪ್ಪಿಗೆ ಪತ್ರಗಳು)."]},{title:"ವಿವಿಧ ಓದುಗರಿಗಾಗಿ ಬರವಣಿಗೆ",body:["ಅಧಿಕಾರಿಗಳಿಗೆ ಎರಡು ಪುಟಗಳ ನೀತಿ ಸಂಕ್ಷೇಪ ಬೇಕು: ಸಮಸ್ಯೆ, ಮೂರು ಮುಖ್ಯ ಫಲಿತಾಂಶಗಳು, ಮೂರು ಕ್ರಮಗಳು ಮತ್ತು ವೆಚ್ಚ ಅಥವಾ ಕಾರ್ಯಸಾಧ್ಯತೆ. ಶಿಕ್ಷಕರಿಗೆ ವ್ಯಾವಹಾರಿಕ ತರಗತಿ ಸೂಚನೆಗಳು ಬೇಕು. ಸಮುದಾಯಗಳಿಗೆ ಚಿತ್ರಗಳೊಂದಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಕಿರು ಮಾತು ಬೇಕು. ವಿದ್ವಾಂಸರಿಗೆ ಪೂರ್ಣ ವರದಿ ಅಥವಾ ನಿಯತಕಾಲಿಕ ಲೇಖನ ಬೇಕು."]},{title:"ಉಲ್ಲೇಖ ಮತ್ತು ಪ್ರಕಟಣೆ",body:["APA 7ನೇ ಆವೃತ್ತಿ ಬಳಸಿ: ಲೇಖಕ, ಅ. ಅ. (ವರ್ಷ). ಶೀರ್ಷಿಕೆ. ಪ್ರಕಾಶಕ. ನಿಯತಕಾಲಿಕಗಳನ್ನು UGC-CARE ಪಟ್ಟಿಯೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ; ನಿಜವಾದ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆಯಿಲ್ಲದೆ ಶುಲ್ಕ ವಿಧಿಸುವ ಶೋಷಕ ನಿಯತಕಾಲಿಕಗಳನ್ನು ತಪ್ಪಿಸಿ. ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಸಂಶೋಧನಾ ಸಮ್ಮೇಳನಗಳು ಮತ್ತು ಜಿಲ್ಲಾ ಪ್ರಗತಿ ಪರಿಶೀಲನಾ ಸಭೆಗಳಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳಿ."]}],karnataka:[{title:"ವರದಿಯಿಂದ ನಿರ್ಧಾರದವರೆಗೆ",text:["ಕೆಲವೇ ಪ್ರೌಢಶಾಲೆಗಳು ತಮ್ಮ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯವನ್ನು ವಾರಕ್ಕೊಮ್ಮೆ ಬಳಸುತ್ತವೆ ಎಂದು ಡಯಟ್ ಅಧ್ಯಯನ ಕಂಡುಕೊಳ್ಳುತ್ತದೆ (ಉದಾಹರಣೆ). ಉಪನಿರ್ದೇಶಕರು (ಆಡಳಿತ) ಮತ್ತು ಡಯಟ್ ಪ್ರಾಂಶುಪಾಲರಿಗೆ ಉತ್ತಮ ನೀತಿ ಸಂಕ್ಷೇಪ ಹೀಗೆ ಶಿಫಾರಸು ಮಾಡುತ್ತದೆ: ವೇಳಾಪಟ್ಟಿಯಲ್ಲಿ ವಾರದ ಪ್ರಯೋಗಾಲಯ ಅವಧಿ, ಕಡಿಮೆ ವೆಚ್ಚದ ಪ್ರಯೋಗಗಳ ಕುರಿತು ಸಿಆರ್‌ಸಿ ಕಿರು ತರಬೇತಿ, ಮತ್ತು ಮುಂದಿನ ಶೈಕ್ಷಣಿಕ ವರ್ಷದಲ್ಲಿ ಅನುಸರಣಾ ಪರಿಶೀಲನೆ."]}],activity:{title:"ನಿಮ್ಮ ಪ್ರಸ್ತಾವನೆ ರಚಿಸಿ",prompt:"ಪ್ರಸ್ತಾವನಾ ರಚನಾ ಸಾಧನ ಬಳಸಿ ಸಂಪೂರ್ಣ ಸಂಶೋಧನಾ ಪ್ರಸ್ತಾವನೆಯ ಕರಡು ಸಿದ್ಧಪಡಿಸಿ. ರಫ್ತು ಮಾಡಿ ಸಂಪನ್ಮೂಲ ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಿ."},quiz:[{q:"ಅಧಿಕಾರಿಗಳಿಗಾಗಿ ನೀತಿ ಸಂಕ್ಷೇಪ ಹೀಗಿರಬೇಕು…",options:["100 ಪುಟಗಳು","ಸ್ಪಷ್ಟ ಕ್ರಮಗಳಿರುವ ಸುಮಾರು ಎರಡು ಪುಟಗಳು","ಕೋಷ್ಟಕಗಳು ಮಾತ್ರ","ಶೈಕ್ಷಣಿಕ ಪರಿಭಾಷೆಯಲ್ಲಿ"],why:"ಕಾರ್ಯನಿರತ ನಿರ್ಧಾರಕರಿಗೆ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಕ್ರಮ ಬೇಕು."},{q:"ನೈತಿಕ ಕಾರ್ಯವಿಧಾನವನ್ನು ಎಲ್ಲಿ ವಿವರಿಸಬೇಕು?",options:["ಸಾರಾಂಶದಲ್ಲಿ ಮಾತ್ರ","ವಿಧಾನ ವಿಭಾಗದಲ್ಲಿ","ಉಲ್ಲೇಖಗಳಲ್ಲಿ","ಎಲ್ಲಿಯೂ ಇಲ್ಲ"],why:"ನೈತಿಕತೆ ವಿಧಾನದ ಭಾಗ."},{q:"ಶೋಷಕ ನಿಯತಕಾಲಿಕಗಳು ಎಂದರೆ…",options:["ನಿಜವಾದ ಪರಿಶೀಲನೆಯ ನಂತರ ಬೇಗ ಪ್ರಕಟಿಸುವವು","ನಿಜವಾದ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆಯಿಲ್ಲದೆ ಶುಲ್ಕ ವಿಧಿಸುವವು","ಕನ್ನಡದಲ್ಲಿರುವವು","UGC-CARE ಪಟ್ಟಿಯಲ್ಲಿರುವವು"],why:"ಅವುಗಳಲ್ಲಿ ನಿಜವಾದ ಪರಿಶೀಲನೆ ಇಲ್ಲ."},{q:"APA ಉಲ್ಲೇಖದ ಕ್ರಮ…",options:["ಶೀರ್ಷಿಕೆ, ವರ್ಷ, ಲೇಖಕ","ಲೇಖಕ, ವರ್ಷ, ಶೀರ್ಷಿಕೆ, ಮೂಲ","ವರ್ಷ, ಪ್ರಕಾಶಕ, ಲೇಖಕ","ಯಾವುದೇ ಕ್ರಮ"],why:"ಲೇಖಕ–ದಿನಾಂಕ ಪದ್ಧತಿ."}]},m12:{objectives:["ಪ್ರತಿ ಹಂತದಲ್ಲಿ ಗುಣಮಟ್ಟದ ಮಾನದಂಡಗಳ ಆಧಾರದಲ್ಲಿ ಅಧ್ಯಯನವನ್ನು ಪರಿಶೀಲಿಸುವುದು.","ರಚನಾತ್ಮಕ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆ ನಡೆಸುವುದು ಮತ್ತು ಸ್ವೀಕರಿಸುವುದು.","ಜಿಲ್ಲಾ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಸಿಂಧುತ್ವಕ್ಕೆ ಸಾಮಾನ್ಯ ಅಪಾಯಗಳನ್ನು ಗುರುತಿಸುವುದು."],lessons:[{title:"ಚಕ್ರದುದ್ದಕ್ಕೂ ಗುಣಮಟ್ಟ",body:["ಪ್ರಶ್ನೆ: ಸ್ಪಷ್ಟ, ಕೇಂದ್ರೀಕೃತ, ಸಮರ್ಥಿತ. ವಿನ್ಯಾಸ: ಪ್ರಶ್ನೆಗೆ ಹೊಂದುತ್ತದೆ. ಮಾದರಿ: ಸಾಕಷ್ಟು ಮತ್ತು ಚೆನ್ನಾಗಿ ವಿವರಿಸಲಾಗಿದೆ. ಸಾಧನಗಳು: ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿತ, ವಿಶ್ವಸನೀಯ, ಸಿಂಧು. ವಿಶ್ಲೇಷಣೆ: ಸೂಕ್ತ ಪರೀಕ್ಷೆಗಳು, ಪರಿಣಾಮ ಗಾತ್ರಗಳು, ಮಹತ್ವವಿಲ್ಲದ ಫಲಿತಾಂಶಗಳ ಪ್ರಾಮಾಣಿಕ ವರದಿ. ತೀರ್ಮಾನಗಳು: ಪುರಾವೆಯಿಂದ ಹೊರಹೊಮ್ಮುತ್ತವೆ; ಮಿತಿಗಳನ್ನು ಹೇಳಲಾಗಿದೆ."]},{title:"ಸಿಂಧುತ್ವಕ್ಕೆ ಅಪಾಯಗಳು",body:['ಆಯ್ಕೆ ಪಕ್ಷಪಾತ ("ಉತ್ತಮ" ಶಾಲೆಗಳನ್ನು ಮಾತ್ರ ಆರಿಸುವುದು), ಇತಿಹಾಸ (ಅದೇ ಸಮಯದಲ್ಲಿ ಬೇರೆ ಕಾರ್ಯಕ್ರಮ ಆರಂಭವಾದುದು), ಪಕ್ವತೆ (ಮಕ್ಕಳು ಹೇಗಿದ್ದರೂ ಬೆಳೆಯುತ್ತಾರೆ), ಪರೀಕ್ಷಾ ಪರಿಣಾಮ (ಅದೇ ಪರೀಕ್ಷೆ ಎರಡು ಬಾರಿ), ಕ್ಷಯ (ಉತ್ತರ ಪರೀಕ್ಷೆಯ ದಿನ ಮಕ್ಕಳ ಗೈರು), ಮತ್ತು ಹಾಥಾರ್ನ್ ಪರಿಣಾಮ (ಗಮನಿಸಲಾಗುತ್ತಿದೆ ಎಂದು ಜನರು ಬದಲಾಗುವುದು).']},{title:"ಸಹವರ್ತಿ ಪರಿಶೀಲನೆ",body:["ವ್ಯಕ್ತಿಯನ್ನಲ್ಲ, ಕೆಲಸವನ್ನು ಪರಿಶೀಲಿಸಿ. ಸಾಮರ್ಥ್ಯಗಳಿಂದ ಆರಂಭಿಸಿ, ನಂತರ ಮುಖ್ಯ ಸಮಸ್ಯೆಗಳು, ನಂತರ ಸಣ್ಣ ಅಂಶಗಳು. ನಿರ್ದಿಷ್ಟ ಸುಧಾರಣೆಗಳನ್ನು ಸೂಚಿಸಿ. ಪ್ರತಿ ಡಯಟ್ ಅಧ್ಯಯನವನ್ನು ಸಲ್ಲಿಕೆಗೆ ಮುನ್ನ ಒಬ್ಬ ಆಂತರಿಕ ಮತ್ತು ಒಬ್ಬ ಹೊರಗಿನ ಸಹೋದ್ಯೋಗಿ ಪರಿಶೀಲಿಸಬಹುದು."]}],karnataka:[{title:"ಪರಿಶೀಲನಾ ಅಭ್ಯಾಸ: ದುರ್ಬಲ ವಿನ್ಯಾಸ",text:['ಪ್ರಸ್ತಾವನೆ: ಬಿಇಒ ಆರಿಸಿದ 5 ಶಾಲೆಗಳ ಉತ್ತರ-ಪರೀಕ್ಷಾ ಅಂಕಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ "ಕಲಿಕಾ ಚೇತರಿಕೆಯ ಪರಿಣಾಮ". ಸಮಸ್ಯೆಗಳು: ಮೂಲರೇಖೆ ಇಲ್ಲ, ಹೋಲಿಕೆ ಇಲ್ಲ, ಆಯ್ಕೆ ಪಕ್ಷಪಾತ. ಸುಧಾರಣೆ: ಸೇತುಬಂಧ ಮೂಲರೇಖೆಯನ್ನು ಪೂರ್ವ-ಪರೀಕ್ಷೆಯಾಗಿ ಬಳಸಿ, ಹೊಂದಾಣಿಕೆಯ ಹೋಲಿಕೆ ಶಾಲೆಗಳನ್ನು ಸೇರಿಸಿ, ಬ್ಲಾಕ್‌ಗಳೊಳಗೆ ಯಾದೃಚ್ಛಿಕವಾಗಿ ಶಾಲೆಗಳನ್ನು ಆರಿಸಿ.']},{title:"ಹಂಚಿಕೊಂಡ ರಾಜ್ಯ ಕಾರ್ಯಸೂಚಿ",text:["ಕೆಲವು ರಾಜ್ಯವ್ಯಾಪಿ ಪ್ರಶ್ನೆಗಳಿರುವ ವಾರ್ಷಿಕ ರಾಜ್ಯ ಸಂಶೋಧನಾ ಕಾರ್ಯಸೂಚಿಯನ್ನು ರಾಜ್ಯದ ಸಂಶೋಧನಾ ಟಿಪ್ಪಣಿಗಳು ಸೂಚಿಸುತ್ತವೆ — ಉದಾ: FLN ಲಾಭಗಳು 3ನೇ ತರಗತಿಯ ಆಚೆಗೂ ಉಳಿಯುತ್ತವೆಯೇ — ಇದರಿಂದ ಜಿಲ್ಲೆಗಳು ಸಾಮಾನ್ಯ ಸಾಧನಗಳೊಂದಿಗೆ ಮಾದರಿಗಳನ್ನು ಒಗ್ಗೂಡಿಸಬಹುದು. ಡಯಟ್‌ಗಳು ಒಂಟಿಯಾಗಿ ಆರಂಭಿಸುವ ಬದಲು ವಿನ್ಯಾಸ ಮತ್ತು ಸಾಧನಗಳನ್ನು ಹಂಚಿಕೊಂಡಾಗ ಗುಣಮಟ್ಟ ಸುಧಾರಿಸುತ್ತದೆ."]}],activity:{title:"ಪ್ರಸ್ತಾವನೆಯ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆ",prompt:"ಗುಣಮಟ್ಟ ಪರಿಶೀಲನಾ ಪಟ್ಟಿಯನ್ನು ನಿಮ್ಮ ಮತ್ತು ಸಹೋದ್ಯೋಗಿಯ ಪ್ರಸ್ತಾವನೆಗೆ ಅನ್ವಯಿಸಿ. ಮೂರು ಸಾಮರ್ಥ್ಯಗಳು ಮತ್ತು ಮೂರು ನಿರ್ದಿಷ್ಟ ಸುಧಾರಣೆಗಳನ್ನು ದಾಖಲಿಸಿ."},quiz:[{q:'"ಉತ್ತಮ ಸಾಧನೆ" ಎಂಬ ಕಾರಣಕ್ಕೆ ಅಧಿಕಾರಿ ಆರಿಸಿದ ಶಾಲೆಗಳು ಪರಿಚಯಿಸುವುದು…',options:["ಪಕ್ವತೆ","ಆಯ್ಕೆ ಪಕ್ಷಪಾತ","ವಿಶ್ವಸನೀಯತೆ","ತ್ರಿಕೋನೀಕರಣ"],why:"ಯಾದೃಚ್ಛಿಕವಲ್ಲದ ಆಯ್ಕೆ ಫಲಿತಾಂಶಗಳನ್ನು ಪಕ್ಷಪಾತಗೊಳಿಸುತ್ತದೆ."},{q:"ವರ್ಷದಲ್ಲಿ ವಯಸ್ಸು ಹೆಚ್ಚಿದ ಕಾರಣ ಮಾತ್ರ ಮಕ್ಕಳು ಸುಧಾರಿಸುವುದು…",options:["ಪಕ್ವತೆ","ಇತಿಹಾಸ","ಕ್ಷಯ","ಸಾಧನ ಬದಲಾವಣೆ"],why:"ಕಾಲಾನಂತರದ ಸಹಜ ಬೆಳವಣಿಗೆ."},{q:"ಉತ್ತಮ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆ ಆರಂಭವಾಗುವುದು…",options:["ವೈಯಕ್ತಿಕ ಟೀಕೆಯಿಂದ","ಕೆಲಸದ ಸಾಮರ್ಥ್ಯಗಳಿಂದ","ತಿರಸ್ಕಾರದಿಂದ","ಕಾಗುಣಿತ ದೋಷಗಳಿಂದ ಮಾತ್ರ"],why:"ರ
