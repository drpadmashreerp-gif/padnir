ಕಲಿಕಾ ಉದ್ದೇಶಗಳು",karnataka:"ಕರ್ನಾಟಕದ ತರಗತಿಗಳಿಂದ",activity:"ಚಟುವಟಿಕೆ",quiz:"ನಿಮ್ಮ ತಿಳುವಳಿಕೆ ಪರೀಕ್ಷಿಸಿ",submit:"ಸಲ್ಲಿಸಿ",notes:"ನನ್ನ ಟಿಪ್ಪಣಿಗಳು",bookmark:"ಗುರುತು ಹಾಕಿ",bookmarked:"ಗುರುತಿಸಲಾಗಿದೆ",openTool:"ಸಾಧನ ತೆರೆಯಿರಿ",chapter:"ಅಧ್ಯಾಯ",page:"ಪುಟ",account:"ನನ್ನ ಖಾತೆ",of:"/",complete:"ಪೂರ್ಣ",search:"ಪುಸ್ತಕದಲ್ಲಿ ಹುಡುಕಿ…"},oe={en:Yf,kn:Xf},Jf=[{id:"m13",no:13,hours:4,part:2,title:"Research Design, Proposal Development and AI Assistance",titleKn:"ಸಂಶೋಧನಾ ವಿನ್ಯಾಸ, ಪ್ರಸ್ತಾವನೆ ರಚನೆ ಮತ್ತು ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆಯ ನೆರವು",objectives:["Identify and state a research gap precisely.","Align problem, questions, objectives, hypotheses, design and analysis in one matrix.","Structure a fundable, reviewable research proposal with a conceptual framework.","Use AI tools to assist proposal development while protecting integrity and data."],lessons:[{title:"From research gap to research questions",body:["A gap is what the existing evidence does not yet tell us. Six common kinds: an evidence gap (findings disagree), a knowledge gap (the topic is unstudied), a practical gap (what works in practice is not documented), a methodological gap (earlier studies used weak designs or tools), a population gap (the topic is unstudied for a group or place), and a theoretical gap (no framework explains the pattern).",'Write the gap in one sentence: "Although [what is known], [what is not known] for [population, place], because [reason earlier studies fall short]." Test the question with FINER: Feasible, Interesting, Novel, Ethical, Relevant.',"Alignment is the backbone of a strong proposal. Each research question needs a matching objective, a hypothesis where relevant, a named data source or tool, and an analysis. If a question has no analysis, or an analysis answers no question, the proposal is misaligned."]},{title:"Choosing a design and structuring the proposal",body:["Choose the design from the question, not from habit: describe → survey; relate → correlational or SEM; compare existing groups → causal-comparative; test an intervention → experimental or quasi-experimental; understand meanings → qualitative; explain numbers → explanatory sequential mixed methods.","A conceptual framework is a diagram of the constructs and the relationships the study will test, each arrow backed by theory or earlier evidence. It becomes the measurement model (constructs and items) and the structural model (paths) in Chapters 15 and 16.","Reviewers most often reject proposals for a vague problem, an unjustified sample size, tools with no evidence of reliability or validity, analysis that does not match the questions, missing ethics, and an unrealistic timeline."]},{title:"AI-assisted proposal development",body:["AI tools can help at several stages: literature discovery (Semantic Scholar, Elicit, Consensus, Research Rabbit, Connected Papers), reference management (Zotero), brainstorming research questions, outlining a review, improving clarity of language, and explaining statistical procedures or code.","AI tools can also invent references, misquote findings and state errors with confidence. Every citation an AI suggests must be opened and checked at the source. Never paste identifiable data — SATS records, names, phone numbers, unpublished interview transcripts — into a public AI tool.","Integrity rules: an AI tool cannot be an author, because it cannot take responsibility for the work (COPE position statement, 2023). Disclose the tool, version and purpose in the methods or acknowledgements, as most journals now require. The researcher remains responsible for every sentence and number."]}],karnataka:[{title:"An alignment matrix for a Sethubandha study",text:['Gap: "Although Sethubandha is run at the start of every year, no district study has followed whether Grade 4 gains last until the end of Grade 5 in Kalyana Karnataka." RQ1: What is the change in Kannada reading scores from June (Grade 4) to March (Grade 5)? → Objective: to estimate retention of gains → H1: scores at the end of Grade 5 remain above the June baseline → Data: LBA reading scores and a graded reading test → Analysis: paired t-test and effect size.',"RQ2: Which school factors are associated with retention? → Data: head-teacher survey on library periods, teacher vacancies and attendance → Analysis: multiple regression (or SEM in Chapter 16)."]},{title:"Using an AI assistant safely for a review outline",text:['A DIET lecturer asks an AI assistant: "Suggest an outline for a literature review on multigrade teaching in Indian government primary schools, with headings and the kinds of studies to look for. Do not invent citations." She then searches Shodhganga, ERIC and the DSERT compendia herself for each heading, keeps only studies she has opened, and records in her methods note which tool she used and for what.']}],activity:{title:"Build your alignment matrix",prompt:"Use the alignment matrix to link each research question to an objective, hypothesis, data source and analysis. Then use the AI prompt planner to draft one safe prompt for your literature search and write your AI-use disclosure statement.",tool:"align"},tools:["align","aiprompt","proposal"],quiz:[{q:'"Earlier studies of LBA used only post-tests without a baseline." This is mainly a…',options:["Population gap","Methodological gap","Theoretical gap","Practical gap"],answer:1,why:"The weakness lies in how earlier studies were designed."},{q:"An AI assistant gives you five references. What must you do?",options:["Cite them as given","Open and verify each one at the source before citing","List the AI as co-author","Cite only the first one"],answer:1,why:"AI tools can fabricate or misreport references."},{q:"Which may be pasted into a public AI tool?",options:["A spreadsheet of SATS numbers and marks","Unpublished interview transcripts with names","Your own draft paragraph with no personal data","Parents' phone numbers"],answer:2,why:"Identifiable or confidential data must never be shared."},{q:"In an alignment matrix, an analysis that answers no research question shows…",options:["Thoroughness","Misalignment to be removed or justified","Strong design","Mixed methods"],answer:1,why:"Every analysis should answer a stated question."}]},{id:"m14",no:14,hours:4,part:2,title:"Measurement, Scales and Data Preparation",titleKn:"ಮಾಪನ, ಮಾಪಕಗಳು ಮತ್ತು ದತ್ತಾಂಶ ಸಿದ್ಧತೆ",objectives:["Distinguish levels of measurement and reflective from formative constructs.","Develop and translate a Likert scale using sound psychometric steps.","Choose the right statistical technique for a question and data type.","Screen, clean and prepare data in R or Python."],lessons:[{title:"Constructs, scales and instrument development",body:["Levels of measurement decide which statistics are allowed: nominal (medium of instruction), ordinal (ranks, single Likert items), interval (summed scale scores, treated as interval in practice) and ratio (words correct per minute, attendance days).",'A construct is an unobserved quality such as "research self-efficacy". Reflective constructs cause their items, so items should correlate highly and are interchangeable (most attitude scales). Formative constructs are formed by their indicators, like a school facilities index built from library, laboratory and toilets; their indicators need not correlate.',"Scale development steps: define the construct and its dimensions → write an item pool (3–4 times the final number) → expert review for content validity (item-level CVI ≥ .78) → cognitive interviews with a few teachers → pilot (n ≥ 100) → item analysis (corrected item–total r ≥ .30) → factor analysis (Chapter 15). Write short, single-idea items; avoid double-barrelled and leading items; add a few reverse-worded items and recode them before analysis.","For Kannada versions use forward translation by two translators, reconciliation, back-translation by an independent translator, and review by a committee; then pilot both language versions."]},{title:"Choosing the statistical technique",body:["Decide from four questions: What is the aim (compare, relate, predict, explore structure, confirm structure, test a model)? What level is the outcome? How many groups, and are they independent or paired? Are parametric assumptions reasonable?","Common pairs (parametric → non-parametric): independent t-test → Mann–Whitney U; paired t-test → Wilcoxon signed-rank; one-way ANOVA → Kruskal–Wallis; Pearson r → Spearman ρ. For prediction use multiple regression (logistic regression for a yes/no outcome). For the structure of a scale use EFA, then CFA; for relationships among constructs use SEM."]},{title:"Data screening, cleaning and preparation",body:["Screen in this order: (1) out-of-range values and entry errors; (2) missing data — describe the amount and pattern; under 5% scattered missingness is usually harmless, otherwise use multiple imputation or full-information maximum likelihood rather than deleting cases; (3) careless responding such as straight-lining (the same answer to every item); (4) outliers — univariate |z| > 3.29, multivariate by Mahalanobis distance (p < .001); (5) normality — skewness within ±2 and excess kurtosis within ±7 is usually acceptable for SEM with maximum likelihood; (6) multicollinearity — VIF below 5.","With a single self-report questionnaire, check common method bias: if one unrotated factor explains more than 50% of the variance (Harman's single-factor test), interpret relationships with caution. Better still, design it out: separate sections, assure anonymity, mix item order.","Keep a cleaning log: what was changed, why, and how many cases were affected. Never overwrite the raw file; save a cleaned copy with a new name."],code:[{label:"Screening in R",lang:"R",src:`library(psych)
d <- read.csv("trse.csv")
d[d < 1 | d > 5] <- NA                      # out-of-range values become missing
colMeans(is.na(d)) * 100                    # % missing per item
d$sd_row <- apply(d[, 1:12], 1, sd, na.rm = TRUE)
d <- subset(d, sd_row > 0)                  # drop straight-liners
describe(d[, 1:12])                         # mean, sd, skew, kurtosis
z <- scale(d[, 1:12]); which(abs(z) > 3.29, arr.ind = TRUE)
md <- mahalanobis(na.omit(d[, 1:12]), colMeans(na.omit(d[, 1:12])), cov(na.omit(d[, 1:12])))
which(md > qchisq(.999, df = 12))           # multivariate outliers
alpha(d[, c("PF1","PF2","PF3","PF4")])      # Cronbach's alpha`},{label:"Screening in Python",lang:"Python",src:`import pandas as pd, numpy as np
from scipy import stats
d = pd.read_csv("trse.csv")
items = d.columns[:12]
d[items] = d[items].where(d[items].between(1, 5))   # out-of-range -> NaN
print(d[items].isna().mean() * 100)                  # % missing per item
d = d[d[items].std(axis=1) > 0]                       # drop straight-liners
print(d[items].agg(["mean", "std", "skew", "kurt"]).T)
z = np.abs(stats.zscore(d[items], nan_policy="omit"))
print((z > 3.29).sum())                               # univariate outliers per item`}]}],karnataka:[{title:"A bilingual research self-efficacy scale for DIET faculty",text:['A DSERT working group drafts 36 items on three dimensions — problem framing, data analysis and research communication — for DIET lecturers and CRPs. Six experts rate relevance; items with I-CVI below .78 are dropped. The remaining 18 items are translated into Kannada and back-translated; a cognitive interview reveals that "hypothesis" needs the Kannada term ಊಹೆ with the English word in brackets. After piloting with 120 lecturers, 12 items are kept for factor analysis.']},{title:"Cleaning an SDMC survey",text:["In an illustrative survey of 400 SDMC members in Bidar district, 6% of answers to an income question are missing, while other items have under 2% missing. The researcher reports the pattern, keeps all cases, and uses multiple imputation rather than deleting 24 respondents — most of whom were women members, whose views would otherwise be under-represented."]}],activity:{title:"Screen a dataset and choose a technique",prompt:"Load the sample data in the screening tool. Identify the missing values, out-of-range entry, straight-liners and outliers, and note what you would do with each. Then use the technique chooser for your own research question.",tool:"screen"},tools:["screen","chooser","survey","stats"],quiz:[{q:"A school facilities index built from library, laboratory and toilets is best treated as…",options:["A reflective construct","A formative construct","A nominal variable","An outlier"],answer:1,why:"The indicators form the index; they need not correlate."},{q:"The non-parametric alternative to a paired t-test is…",options:["Mann–Whitney U","Wilcoxon signed-rank","Kruskal–Wallis","Chi-square"],answer:1,why:"Wilcoxon signed-rank compares paired observations."},{q:'A respondent answers "5" to all 40 items. This is…',options:["Excellent data","Possible straight-lining (careless responding)","A formative indicator","A missing value"],answer:1,why:"Identical answers throughout suggest careless responding."},{q:"Back-translation is used to…",options:["Increase sample size","Check that a translated instrument keeps the original meaning","Remove outliers","Test hypotheses"],answer:1,why:"An independent translator reverses the translation to reveal drift in meaning."}]},{id:"m15",no:15,hours:4,part:2,title:"Construct Exploration and Validation: EFA and CFA",titleKn:"ರಚನೆಗಳ ಅನ್ವೇಷಣೆ ಮತ್ತು ದೃಢೀಕರಣ: EFA ಮತ್ತು CFA",objectives:["Check whether data are suitable for factor analysis (KMO, Bartlett).","Run and interpret an exploratory factor analysis in SPSS, R or Python.","Specify and assess a measurement model with confirmatory factor analysis in AMOS or lavaan.","Establish reliability, convergent validity and discriminant validity."],lessons:[{title:"Exploratory factor analysis (EFA)",body:["EFA asks: how many underlying factors explain the correlations among items, and which items belong to which factor? Use it when a scale is new or used in a new population.","Suitability: at least 5–10 respondents per item and preferably 200 or more; KMO ≥ .60 (≥ .80 is good) and each item's KMO ≥ .50; Bartlett's test of sphericity significant (p < .05).","Extraction: principal axis factoring or maximum likelihood estimate common factors; principal components analysis summarises total variance and is not strictly factor analysis. How many factors: eigenvalues > 1 (Kaiser), the elbow of the scree plot, and — most reliable — parallel analysis; the solution must also make theoretical sense.","Rotation: varimax (orthogonal) when factors are expected to be unrelated; promax or oblimin (oblique) when they are expected to correlate, which is usual in education. Keep items with loadings ≥ .50 on their own factor and cross-loadings below .30 (or at least .20 lower); communalities ideally ≥ .40. Remove weak items one at a time and re-run.","SPSS: Analyze → Dimension Reduction → Factor → Descriptives: KMO and Bartlett's test; Extraction: Principal axis factoring, Scree plot; Rotation: Promax (or Varimax); Options: Sorted by size, suppress small coefficients below .30."],code:[{label:"EFA in R (psych)",lang:"R",src:`library(psych)
items <- d[, 1:12]
KMO(items); cortest.bartlett(cor(items), n = nrow(items))
fa.parallel(items, fa = "fa")                 # how many factors?
efa <- fa(items, nfactors = 3, fm = "pa", rotate = "promax")
print(efa$loadings, cutoff = .30, sort = TRUE)`},{label:"EFA in Python (factor_analyzer)",lang:"Python",src:`from factor_analyzer import FactorAnalyzer, calculate_kmo, calculate_bartlett_sphericity
items = d.iloc[:, :12].dropna()
print(calculate_kmo(items)[1], calculate_bartlett_sphericity(items))
fa = FactorAnalyzer(n_factors=3, method="principal", rotation="promax")
fa.fit(items)
print(pd.DataFrame(fa.loadings_, index=items.columns).round(2))`}]},{title:"Confirmatory factor analysis (CFA)",body:["CFA tests a measurement model specified in advance: which items load on which factor, with no cross-loadings. Use a different sample from the EFA (split the data randomly, or collect a second sample).","In AMOS: draw each latent factor as an ellipse, its items as rectangles, add an error term to every item, fix the first loading of each factor to 1 (or the factor variance to 1), connect factors with two-headed arrows (covariances), choose Maximum likelihood, and tick Standardized estimates and Modification indices in Analysis Properties. Report model fit (Chapter 16) before interpreting loadings.","Assessment: standardised loadings ≥ .70 are ideal (≥ .50 acceptable if reliability holds); composite reliability (CR) ≥ .70; average variance extracted (AVE) ≥ .50 for convergent validity. Discriminant validity: the square root of each factor's AVE should exceed its correlations with other factors (Fornell & Larcker, 1981), and the heterotrait–monotrait ratio (HTMT) should be below .85 (or .90 for similar concepts; Henseler et al., 2015)."],code:[{label:"CFA in R (lavaan)",lang:"R",src:`library(lavaan); library(semTools)
model <- '
  ProblemFraming =~ PF1 + PF2 + PF3 + PF4
  DataAnalysis   =~ DA1 + DA2 + DA3 + DA4
  Communication  =~ RC1 + RC2 + RC3 + RC4
'
fit <- cfa(model, data = d, estimator = "MLR")
summary(fit, fit.measures = TRUE, standardized = TRUE)
reliability(fit)          # composite reliability (omega) and AVE
htmt(model, data = d)     # discriminant validity`},{label:"CFA in Python (semopy)",lang:"Python",src:`import semopy
desc = """
ProblemFraming =~ PF1 + PF2 + PF3 + PF4
DataAnalysis   =~ DA1 + DA2 + DA3 + DA4
Communication  =~ RC1 + RC2 + RC3 + RC4
"""
m = semopy.Model(desc); m.fit(d)
print(m.inspect(std_est=True))
print(semopy.calc_stats(m).T)   # chi2, CFI, TLI, RMSEA`}]},{title:"Reliability and validity: putting it together",body:["Report Cronbach's alpha and composite reliability for each factor, loadings with their significance, CR and AVE in one table, and a Fornell–Larcker or HTMT table for discriminant validity.","If AVE is below .50 but CR is above .60, convergent validity can still be considered adequate (Fornell & Larcker, 1981) — state this explicitly. Never delete items only to improve fit without considering what the item measures; content validity matters as much as numbers."]}],karnataka:[{title:"EFA of the research self-efficacy scale",text:["Illustrative results from 220 DIET lecturers and CRPs on the 12-item scale: KMO = .85, Bartlett's χ²(66) = 1121, p < .001. Three factors have eigenvalues above 1 (4.47, 1.99, 1.72) and together account for about 68% of the total variance (initial eigenvalues; about 58% after principal axis extraction). After rotation, the four problem-framing, four data-analysis and four communication items each load on their own factor. Run this yourself in the EFA tool."]},{title:"CFA on a second sample",text:["A second, independent sample of 240 teachers from Kalaburagi and Raichur is used for CFA. Illustrative standardised loadings range from .68 to .86. CR is above .80 and AVE above .55 for all three factors, and each √AVE exceeds the correlations between factors, supporting discriminant validity. The scale can now be used in the SEM in Chapter 16."]}],activity:{title:"Run an EFA and assess the measurement model",prompt:"Run the EFA tool on the sample data with three factors. Name each factor and decide whether any item should be dropped. Then enter loadings and factor correlations in the CFA calculator and judge reliability and validity.",tool:"efa"},tools:["efa","cfa","screen"],quiz:[{q:"KMO = .52 for your data means…",options:["Excellent suitability","Barely suitable; consider more data or removing weak items","The model fits","Reliability is high"],answer:1,why:"Values below .60 indicate poor sampling adequacy."},{q:"When factors are expected to correlate, use…",options:["Varimax","An oblique rotation such as promax or oblimin","No rotation","Bartlett's test"],answer:1,why:"Oblique rotations allow factors to correlate."},{q:"AVE = .58 and CR = .84 indicate…",options:["Poor reliability","Adequate convergent validity and reliability","Discriminant validity failure","Overfitting"],answer:1,why:"AVE ≥ .50 and CR ≥ .70 are the usual thresholds."},{q:"Why run CFA on a different sample from the EFA?",options:["To save time","To confirm the structure rather than re-describe the same data","Because AMOS needs it","To increase alpha"],answer:1,why:"Using the same data capitalises on chance."}]},{id:"m16",no:16,hours:4,part:2,title:"Structural Equation Modelling (SEM)",titleKn:"ರಚನಾತ್ಮಕ ಸಮೀಕರಣ ಮಾದರೀಕರಣ (SEM)",objectives:["Explain latent and observed variables, measurement and structural models.","Draw and estimate a structural path model in AMOS or lavaan.","Assess model fit and validate the model responsibly.","Test mediation, moderation and group differences (multi-group SEM)."],lessons:[{title:"Understanding SEM and building path models",body:["SEM tests a network of relationships among constructs while accounting for measurement error. It combines a measurement model (CFA: constructs and their items) and a structural model (paths between constructs). Exogenous constructs have no arrows pointing to them; endogenous constructs are predicted by others.","Use the two-step approach (Anderson & Gerbing, 1988): first establish a good measurement model (Chapter 15), then add the structural paths. Every path needs a theoretical reason. Sample size: 200 or more is a common minimum, more for complex models; aim for at least 10 cases per estimated parameter where possible.","Covariance-based SEM (AMOS, lavaan) tests theory and gives fit indices. Partial least squares SEM (for example SmartPLS) suits prediction, small samples and formative constructs, but does not test overall model fit in the same way. Choose by aim, not by convenience.","In AMOS: start from the validated CFA diagram, replace covariances between constructs with single-headed arrows where the theory predicts an effect, add a residual (disturbance) to every endogenous construct, and estimate with maximum likelihood. Report standardised path coefficients (β), their significance, and R² for each endogenous construct."],code:[{label:"Structural model in R (lavaan)",lang:"R",src:`model <- '
  # measurement model
  Support     =~ S1 + S2 + S3
  Efficacy    =~ PF1 + PF2 + DA1 + DA2
  Engagement  =~ E1 + E2 + E3
  # structural model
  Efficacy   ~ a * Support
  Engagement ~ b * Efficacy + c * Support
  indirect := a * b
  total    := c + a * b
'
fit <- sem(model, data = d, estimator = "ML", se = "bootstrap", bootstrap = 5000)
summary(fit, fit.measures = TRUE, standardized = TRUE, rsquare = TRUE)
parameterEstimates(fit, boot.ci.type = "perc", standardized = TRUE)`}]},{title:"Model fit, assessment and validation",body:["Report several fit indices together: χ² with df and p (sensitive to large samples, so not used alone), χ²/df (≤ 3 good), CFI and TLI (≥ .95 good, ≥ .90 acceptable), RMSEA with its 90% confidence interval (≤ .06 good, ≤ .08 acceptable) and SRMR (≤ .08). These are guidelines (Hu & Bentler, 1999), not laws.","Modification indices suggest changes that would improve fit. Accept only changes with a clear theoretical reason (for example, correlated errors between two items with near-identical wording), make them one at a time, and report every change. A model modified to fit one sample must be cross-validated on another.","Validate by comparing the model with plausible alternatives (for example, with and without a direct path), checking that estimates are sensible (no negative error variances, standardised values within ±1), and testing on a hold-out sample."]},{title:"Advanced applications",body:["Mediation: an indirect effect (a × b) shows that X affects Y through M. Test it with bootstrapped confidence intervals (5,000 resamples); if the 95% interval excludes zero, the indirect effect is significant. Report the direct, indirect and total effects. In AMOS: Analysis Properties → Bootstrap → Perform bootstrap (5000), Bias-corrected confidence intervals; request Indirect, direct and total effects.","Moderation: the effect of X on Y depends on W. With observed variables, add an X × W interaction (mean-centred); with latent variables use latent interaction methods or multi-group analysis.","Multi-group SEM: compare groups such as Kalyana Karnataka and other districts, or men and women teachers. First test measurement invariance in steps — configural (same structure), metric (equal loadings), scalar (equal intercepts) — accepting each step if CFI drops by no more than .01. Only then compare paths or means across groups.","Higher-order models represent a general factor above first-order factors (for example, overall research self-efficacy above its three dimensions)."]}],karnataka:[{title:"Does DIET support build research engagement?",text:["Illustrative model with 260 teachers: DIET support (mentoring, workshops, feedback) → research self-efficacy → research engagement (action research projects, presentations at cluster meetings). Fit: χ²(87) = 141.6, χ²/df = 1.63, CFI = .97, TLI = .96, RMSEA = .049, SRMR = .046. Support → self-efficacy β = .48; self-efficacy → engagement β = .44; the direct path from support to engagement is small (β = .12). The bootstrapped indirect effect is significant, suggesting that DIET support works mainly by building teachers' confidence."]},{title:"Comparing regions with multi-group SEM",text:["The same model is tested separately for Kalyana Karnataka districts and other districts. Configural and metric invariance hold (ΔCFI < .01), so the paths can be compared. If the support → self-efficacy path is stronger in Kalyana Karnataka, the DIET can argue for prioritising mentoring there."]}],activity:{title:"Assess fit and test mediation",prompt:"Enter the fit indices from the worked example (or your own output) in the fit checker and copy the generated sentence. Then run the mediation tool on the sample data and report the indirect effect with its confidence interval.",tool:"fit"},tools:["fit","mediation","cfa"],quiz:[{q:"In the two-step approach you first…",options:["Add all structural paths","Validate the measurement model","Run multi-group analysis","Delete items with low loadings"],answer:1,why:"A sound measurement model comes before structural paths."},{q:"CFI = .96, RMSEA = .05, SRMR = .04 indicate…",options:["Poor fit","Good fit","Overfitting only","Nothing without χ²"],answer:1,why:"All three meet commonly used good-fit guidelines."},{q:"A mediation effect is supported when…",options:["The direct path is zero","The bootstrapped 95% CI of a × b excludes zero","R² is above .50","χ² is non-significant"],answer:1,why:"The indirect effect is tested with bootstrapped intervals."},{q:"Before comparing paths across two groups you must establish…",options:["Equal sample sizes","Measurement invariance (at least metric)","Identical means","A higher-order factor"],answer:1,why:"Constructs must be measured the same way in both groups."}]},{id:"m17",no:17,hours:4,part:2,title:"Academic Writing, Publication and AI-Enabled Research",titleKn:"ಶೈಕ್ಷಣಿಕ ಬರವಣಿಗೆ, ಪ್ರಕಟಣೆ ಮತ್ತು ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆ ಆಧಾರಿತ ಸಂಶೋಧನೆ",objectives:["Report EFA, CFA and SEM results to journal standard.","Choose a suitable journal, respond to reviewers and avoid predatory outlets.","Use generative and agentic AI tools responsibly across the research process.","Recognise opportunities and risks of big data and interdisciplinary research in education."],lessons:[{title:"From findings to a publishable manuscript",body:["Most empirical articles follow IMRaD: Introduction (problem, gap, aim), Method (participants, instruments, procedure, ethics, analysis), Results, and Discussion (meaning, comparison with earlier studies, implications, limitations, future research). Write the methods so another researcher could repeat the study.","What to report for multivariate analysis: software and version; estimator; how missing data were handled; KMO, Bartlett, extraction, rotation and loadings for EFA; a CFA table with loadings, CR, AVE and discriminant validity; fit indices with RMSEA confidence interval; standardised path coefficients with standard errors, p-values and confidence intervals; R²; and indirect effects with bootstrapped intervals. A clear path diagram with standardised estimates helps readers.",'In the discussion, interpret effect sizes in practical terms ("a one standard deviation increase in DIET support is associated with…"), separate association from causation in cross-sectional data, and link recommendations to specific findings.']},{title:"Publishing: choosing journals and working with reviewers",body:["Choose a journal by fit of scope, audience, indexing (Scopus, Web of Science, UGC-CARE list), review time and cost. Read recent issues and author guidelines. Check for cloned or predatory journals: verify the journal's website from the indexing database itself, be wary of guaranteed acceptance or very fast review, and do not pay fees before a genuine peer review.","Write a short cover letter stating the contribution and why it suits the journal. Treat reviewer comments as free expert advice: reply point by point in a table, say what you changed and where, and explain politely when you disagree with evidence.","Strengthen visibility and integrity with an ORCID iD, sharing data and code where ethics allow, preprints where the journal permits, and open-access options such as institutional repositories."]},{title:"AI-enabled research: from generative to agentic AI",body:["Generative AI (chat assistants such as ChatGPT, Claude or Gemini) can draft text, summarise papers you supply, suggest code for R or Python, explain statistical output, and support first-pass coding of qualitative data. Agentic AI goes further: agents plan multi-step tasks, search sources, run code and revise their own work, with the researcher supervising.","Opportunities: faster literature mapping, reproducible analysis scripts, translation support for bilingual instruments, accessibility. Risks: fabricated facts and citations, hidden bias, loss of the researcher's own judgement, privacy breaches, and over-reliance on outputs nobody has checked. Agents that act on their own need clear limits, logs and human approval of every important step.","A responsible-use routine: decide what the tool may and may not do; never upload personal data; verify every fact, citation and number at the source; keep prompts and outputs as part of the audit trail; disclose use in the paper; and keep the interpretation and conclusions your own.","Big data and interdisciplinary research: large administrative datasets (UDISE+, SATS aggregates, assessment portals, learning-app logs) allow population-level analysis and learning analytics, but need permission, de-identification and care under India's Digital Personal Data Protection Act, 2023. Many education questions — nutrition and learning, migration and dropout, technology and equity — are best studied with colleagues from public health, economics, data science and sociology."]}],karnataka:[{title:"A results paragraph for the self-efficacy CFA",text:['"A three-factor CFA (maximum likelihood, AMOS; N = 240) showed good fit, χ²(51) = 85.2, p = .002, CFI = .97, TLI = .96, RMSEA = .053 [90% CI .031, .073], SRMR = .045. All standardised loadings were significant (.68–.86). Composite reliability ranged from .82 to .88 and AVE from .55 to .64; the square root of each AVE exceeded the inter-factor correlations (.41–.58), supporting discriminant validity." (Illustrative values.)']},{title:"Big data with care: SATS aggregates",text:["A DIET wants to study whether attendance patterns predict Grade 7 LBA scores across 1,200 schools. It requests school-level aggregates rather than child-level records, works on a departmental computer, documents its code, and uses an AI assistant only to help write and debug the analysis script on dummy data — never on the real file. The policy brief reports patterns by block, not by individual school, to avoid naming small schools."]}],activity:{title:"Write it up and plan responsible AI use",prompt:"Using your fit checker or CFA calculator output, write a results paragraph in APA style. Then complete the responsible AI checklist in the AI prompt planner and download your AI-use disclosure statement for your next paper.",tool:"aiprompt"},tools:["aiprompt","fit","literature","proposal"],quiz:[{q:"Which belongs in the Method section of a SEM paper?",options:["Only the hypotheses","Estimator, software, missing-data handling and fit criteria","Implications for policy","The cover letter"],answer:1,why:"Method reports how the analysis was done so others can repeat it."},{q:"A journal promises acceptance within 72 hours for a fee. You should…",options:["Submit quickly","Treat it as a likely predatory journal and verify it through indexing databases","Pay first and ask later","Cite it in your review"],answer:1,why:"Guaranteed fast acceptance is a common sign of predatory practice."},{q:"What distinguishes agentic AI from a basic chat assistant?",options:["It cannot use tools","It plans and carries out multi-step tasks such as searching and running code","It never makes errors","It can be listed as an author"],answer:1,why:"Agents act over several steps, so they need limits and human oversight."},{q:"Under responsible AI use, the researcher should…",options:["Upload SATS data for faster analysis","Verify every AI-supplied fact and disclose AI use","Let the AI write the conclusions","Hide AI use"],answer:1,why:"Verification and disclosure protect integrity."}]}],D=[{id:"m1",no:1,hours:5,title:"Foundations of Educational Research",titleKn:"ಶೈಕ್ಷಣಿಕ ಸಂಶೋಧನೆಯ ಅಡಿಪಾಯ",objectives:['Explain what makes an inquiry "research" rather than opinion or reporting.',"Distinguish basic, applied, evaluation and action research.","Relate research paradigms (positivist, interpretivist, critical, pragmatic) to questions DIETs ask.","Describe the research mandate of DIETs, DSERT and the State research ecosystem."],lessons:[{title:"What is educational research?",body:["Educational research is systematic, transparent inquiry into teaching, learning and the systems around them. It starts with a question, gathers evidence in a planned way, analyses it openly, and reports so that others can check and use the findings.","Three tests help separate research from routine reporting: (1) Is there a clear question? (2) Is the method planned before data are collected? (3) Can another person follow the steps and judge the conclusion?"]},{title:"Types and paradigms",body:["Basic research builds theory (e.g. how children acquire reading in a second script). Applied research solves a known problem (why Grade 6 mathematics scores dip). Evaluation research judges a programme against its goals. Action research is done by practitioners to improve their own practice in cycles.","Paradigms are beliefs about knowledge. Positivist studies measure and test; interpretivist studies seek meanings people give to experience; critical studies examine power and equity; pragmatic studies use whatever method answers the question best. Most DIET studies are pragmatic."]},{title:"The research cycle",body:["Identify a problem → review literature → frame questions or hypotheses → choose design and sample → build and pilot tools → seek ethical clearance → collect data → analyse → interpret → report and share → use findings.","A study is only as strong as its weakest step. The commonest weakness in district studies is a vague question, which then produces a tool that measures everything and answers nothing."]}],karnataka:[{title:"The research mandate in Karnataka",text:["DSERT is the State academic authority for school education in Karnataka. It sets the research agenda, trains DIET faculty and publishes research compendia. Each DIET is expected to carry out district-level studies that inform teacher education and classroom practice, often with CRPs and BRPs as field partners.","Ask: of the studies your DIET completed in the last three years, how many changed a training module, a district plan or a classroom practice? That is the real test of research use."]},{title:"Classifying real district questions",text:['"Does Sethubandha (the start-of-year bridge programme) close learning gaps in Grade 4?" — evaluation research.','"How do teachers in Lambani tandas in Vijayapura use the home language during Kannada lessons?" — interpretivist, qualitative.',`"Can I raise my D.El.Ed. trainees' questioning skills through micro-teaching?" — action research by a DIET lecturer.`]}],activity:{title:"Sort the studies",prompt:"List three studies done at your DIET. For each, note its type (basic / applied / evaluation / action), its paradigm, and one decision it informed (or could have)."},tools:["rq"],quiz:[{q:"A DIET studies whether Kalika Chetarike learning-recovery materials met their stated goals. This is best called…",options:["Basic research","Evaluation research","Historical research","Action research"],answer:1,why:"It judges a programme against its own objectives."},{q:"Which feature most separates research from a monitoring report?",options:["Use of tables","A planned method to answer a stated question","Length of the report","Signature of an officer"],answer:1,why:"Research begins from a question and a method fixed before data collection."},{q:'A study of the meanings SDMC members give to "a good school" sits mainly in which paradigm?',options:["Positivist","Interpretivist","Experimental","Econometric"],answer:1,why:"It seeks participants' meanings, not measurement."},{q:"The pragmatic paradigm means…",options:["Only surveys are allowed","The question decides the method","Qualitative data are ignored","No theory is needed"],answer:1,why:"Pragmatists choose methods for fitness to the question."}]},{id:"m2",no:2,hours:3,title:"Research Ethics and Integrity",titleKn:"ಸಂಶೋಧನಾ ನೈತಿಕತೆ ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆ",objectives:["Apply respect, beneficence and justice to studies with children and teachers.","Obtain informed consent from parents and assent from children.","Protect identity and data, including SATS identifiers.","Recognise plagiarism, fabrication and falsification."],lessons:[{title:"Core principles",body:['Respect for persons: people decide freely whether to take part. Beneficence: maximise benefit, minimise harm. Justice: the burden and benefit of research are shared fairly — the same few "convenient" schools should not be studied every year.',"Children cannot consent on their own. Seek written consent from a parent or guardian and simple oral or pictorial assent from the child, in the language the child speaks at home."]},{title:"Ethics review",body:["An ethics (institutional review) process checks the protocol before fieldwork: purpose, risks, consent forms, data storage and how findings return to the community. A DIET can form a small ethics committee with a senior lecturer, an external academic and a community member.","Permission from the Block Education Officer to enter schools is administrative permission. It does not replace informed consent from participants."]},{title:"Integrity",body:["Fabrication (inventing data), falsification (altering data) and plagiarism (using others' words or ideas without credit) are the three serious breaches. Copying a questionnaire from another study is acceptable only with citation and, where required, permission.","Keep raw data, field notes and analysis files so another person can trace any reported figure back to its source."]}],karnataka:[{title:"Using SATS data responsibly",text:["The Student Achievement Tracking System (SATS) holds identifiable records of every child in Karnataka's schools. A DIET may use SATS or LBA portal data for research only with departmental permission, and should replace SATS IDs with study codes before analysis. Never publish a child's name, SATS number or school with a small enrolment that makes children identifiable."]},{title:"Case: photographs in a Nali Kali classroom",text:["A researcher photographs children in a Nali Kali (multigrade, activity-based, Classes 1–3) classroom for a report. Parents were not asked. Is this acceptable? No: images identify children. Seek parental consent, avoid faces where possible, and do not post on social media."]}],activity:{title:"Ethics decision tree",prompt:"Run your planned study through the ethics decision tree. Record which safeguards you need and draft a two-line consent statement in Kannada for parents.",tool:"ethics"},tools:["ethics"],quiz:[{q:"A BEO has approved school visits. Do you still need parental consent to test children?",options:["No, BEO approval is enough","Yes, consent is separate from administrative permission","Only for private schools","Only in urban areas"],answer:1,why:"Administrative permission does not replace individual consent."},{q:"Before analysing SATS records you should…",options:["Publish IDs for transparency","Replace SATS IDs with study codes","Share the file on WhatsApp for team access","Delete all records after one day"],answer:1,why:"Pseudonymisation protects children."},{q:"Changing a few post-test scores so a programme looks effective is…",options:["Fabrication","Falsification","Plagiarism","Triangulation"],answer:1,why:"Altering real data is falsification."},{q:"Assent means…",options:["A child's own agreement in age-appropriate form","A teacher's signature","Approval of the ethics committee","Parental consent"],answer:0,why:"Assent is the child's agreement alongside parental consent."}]},{id:"m3",no:3,hours:4,title:"Identifying Research Problems",titleKn:"ಸಂಶೋಧನಾ ಸಮಸ್ಯೆಗಳ ಗುರುತಿಸುವಿಕೆ",objectives:["Move from a felt difficulty to a researchable problem.","Use existing evidence (NAS, PARAKH, SATS, LBA, earlier DSERT studies) to justify a problem.","Write focused research questions and testable hypotheses.","Define variables operationally."],lessons:[{title:"From concern to problem",body:['A felt difficulty ("children are weak in English") is not yet a problem. Narrow it: who (Grade 5 children in bilingual KPS sections), what (oral comprehension), where (Kalaburagi district), compared with what (Kannada-medium sections), and why it matters (equity for first-generation learners).',"A good problem is significant, researchable with the time and resources you have, ethical, and new enough to add something."]},{title:"Reviewing literature",body:["Search earlier DSERT and DIET compendia, NCERT studies, Shodhganga theses, ERIC and Google Scholar. Read for what is known, how it was measured, and what is still missing (the gap). Keep a reference list from the first day."]},{title:"Questions, hypotheses, variables",body:['Research questions are specific and answerable: "What is the difference in oral reading fluency between Grade 3 children in Nali Kali and non-Nali Kali classrooms in Mysuru district?"','A hypothesis predicts an answer that data can contradict: "Children in classrooms with a functioning library corner will read more words correct per minute than those without." Operational definitions say exactly how each variable is measured (e.g. words correct per minute on a graded Kannada passage).']}],karnataka:[{title:"Finding a gap in State evidence",text:["The State's research background notes (in this repository) report that foundational literacy and numeracy gains made by Grade 3 tend to fade by Grades 6 and 9, especially in mathematics and science. The same notes record that no completed study yet evaluates the LBA portal. Both are ready-made gaps for DIET research.",'Possible question: "Do children who received Sethubandha bridge support in Grade 4 retain their gains at the end of Grade 5?"']},{title:"Narrowing a broad concern",text:['Broad: "Library use is poor." Focused: "How often do Grade 6–8 children in government higher primary schools of Chikkamagaluru district borrow library books, and what school factors are associated with borrowing?"']}],activity:{title:"Build your research question",prompt:"Use the question builder to turn one concern from your district into a focused research question and a hypothesis.",tool:"rq"},tools:["rq","literature"],quiz:[{q:"Which is the most researchable question?",options:["Is education improving in Karnataka?","What is the effect of LBA on Grade 7 mathematics scores in two blocks of Raichur district?","Why are teachers not motivated?","Should English be taught?"],answer:1,why:"It names the population, variable, place and comparison."},{q:'"Reading fluency will be higher where library periods are held weekly" is a…',options:["Research question","Hypothesis","Objective","Limitation"],answer:1,why:"It predicts a testable relationship."},{q:'An operational definition of "reading fluency" would be…',options:["Love of reading","Words correct per minute on a graded passage","Teacher's impression","Number of books in the library"],answer:1,why:"It states exactly how the variable is measured."},{q:'The "gap" in a literature review is…',options:["Missing pages","What is not yet known or not studied in your context","Time between surveys","Difference between boys and girls"],answer:1,why:"The gap justifies the new study."}]},{id:"m4",no:4,hours:6,title:"Quantitative Research Methods",titleKn:"ಪರಿಮಾಣಾತ್ಮಕ ಸಂಶೋಧನಾ ವಿಧಾನಗಳು",objectives:["Choose among survey, correlational, causal-comparative and experimental designs.","Select a sample and calculate its size.","Build reliable and valid tests and questionnaires.","Pick the right statistical test for a question."],lessons:[{title:"Designs",body:["Survey: describes a population (e.g. availability of science labs in high schools). Correlational: examines association (teacher attendance and pupil scores). Causal-comparative: compares existing groups (KPS vs non-KPS schools). Experimental and quasi-experimental: the researcher introduces an intervention and compares with a control or comparison group, ideally with pre- and post-tests.","Correlation is not causation. Schools with libraries may also have better-resourced communities."]},{title:"Sampling",body:["Probability samples (simple random, stratified, cluster, multistage) allow generalisation. Stratify when sub-groups matter — for example by region (Kalyana Karnataka vs others), medium of instruction, or rural/urban. Cluster sampling (choose clusters, then all or some schools within) suits CRC-based fieldwork.","Sample size depends on the confidence level, the margin of error you can accept, and the variability in the population. Use the sample size calculator."]},{title:"Tools and analysis",body:["Reliability is consistency (test–retest, Cronbach's alpha ≥ 0.70 for most scales). Validity is whether a tool measures what it claims (content validity through expert review; construct validity through pattern of results). Always pilot.","Choosing a test: compare two group means → t-test; same group before and after → paired t-test; three or more groups → ANOVA; two categorical variables → chi-square; relationship between two scores → correlation."]}],karnataka:[{title:"Quasi-experiment: Sethubandha in Yadgir",text:["Illustrative design: 20 government lower primary schools in Yadgir district run the Sethubandha bridge programme with an added daily 20-minute reading period (treatment); 20 matched schools run Sethubandha alone (comparison). Grade 4 children take a Kannada reading test in June and again in September. Analyse gain scores with an independent-samples t-test and report effect size (Cohen's d)."]},{title:"Stratified sample of high schools",text:["To survey use of science laboratories across a district with 180 government high schools, stratify by Kannada, English and Urdu medium, then sample randomly within each stratum in proportion to its size."]}],activity:{title:"Plan a sample and a test",prompt:"For a district survey of your choice, calculate the sample size, then enter the illustrative pre/post data in the statistics tool and interpret the result in two sentences.",tool:"sample"},tools:["sample","stats","survey"],quiz:[{q:"You compare SSLC mathematics scores of the same students in a pre-test and post-test. Use…",options:["Chi-square","Paired t-test","Independent t-test","ANOVA"],answer:1,why:"Same students measured twice."},{q:"Comparing mean scores of Kannada, English and Urdu medium schools needs…",options:["Paired t-test","One-way ANOVA","Correlation","Content analysis"],answer:1,why:"Three independent groups."},{q:"Cronbach's alpha tells you about…",options:["Validity","Internal consistency reliability","Sample size","Effect size"],answer:1,why:"Alpha estimates internal consistency."},{q:"A strong correlation between library periods and reading scores proves…",options:["Libraries cause better reading","An association that may have other explanations","Nothing at all","Reading causes libraries"],answer:1,why:"Correlation alone does not establish cause."}]},{id:"m5",no:5,hours:6,title:"Qualitative Research Methods",titleKn:"ಗುಣಾತ್ಮಕ ಸಂಶೋಧನಾ ವಿಧಾನಗಳು",objectives:["Choose among case study, ethnography, phenomenology, narrative and grounded theory.","Conduct semi-structured interviews and focus groups.","Code transcripts and develop themes.","Establish trustworthiness."],lessons:[{title:"Approaches",body:["Case study: in-depth study of a bounded case (one KPS campus). Ethnography: extended observation of a culture (life in an ashram school). Phenomenology: shared lived experience (first-year teachers in single-teacher schools). Narrative: life stories (women head teachers). Grounded theory: building a theory from data."]},{title:"Data collection",body:["Semi-structured interviews use a guide of open questions with probes. Focus groups of 6–8 people suit SDMC members or parents. Observation uses field notes that separate description from interpretation. Record only with consent; transcribe in the original language and translate carefully."]},{title:"Analysis and trustworthiness",body:["Thematic analysis: familiarise → generate initial codes → search for themes → review → define and name themes → write up with quotations. Trustworthiness rests on credibility (member checks, triangulation), transferability (thick description), dependability (audit trail) and confirmability (reflexive notes)."]}],karnataka:[{title:"Case study: a single-teacher school in Uttara Kannada",text:["How does one teacher manage five classes in a hilly-area school? Observe a full week, interview the teacher, SDMC president and three parents, and collect lesson plans. Expect themes such as time-sharing, peer tutoring and use of Nali Kali materials beyond Class 3."]},{title:"Interviews on bilingual sections",text:["The State's notes record that over 60% of tribal students struggled when the medium of instruction differed from their home language. A DIET in Chamarajanagara could interview Soliga parents and teachers about bilingual KPS sections to learn what bridge support children actually need."]}],activity:{title:"Code an interview excerpt",prompt:"Read the teacher interview excerpts in the coding tool, assign codes, and group them into two or three themes.",tool:"coding"},tools:["coding"],quiz:[{q:"Studying one KPS campus in depth over a term is a…",options:["Survey","Case study","Experiment","Meta-analysis"],answer:1,why:"A bounded case studied in depth."},{q:"Member checking means…",options:["Checking attendance","Returning findings to participants to confirm accuracy","Counting codes","Random sampling"],answer:1,why:"Participants confirm interpretations."},{q:"An ideal focus group size is about…",options:["2","6–8","25","50"],answer:1,why:"Large enough for range, small enough for everyone to speak."},{q:"An audit trail supports…",options:["Dependability","Statistical power","Random selection","Generalisation to all States"],answer:0,why:"It lets others follow your decisions."}]},{id:"m6",no:6,hours:4,title:"Mixed Methods Research",titleKn:"ಮಿಶ್ರ ವಿಧಾನ ಸಂಶೋಧನೆ",objectives:["Explain convergent, explanatory sequential and exploratory sequential designs.","Plan the point at which quantitative and qualitative strands meet.","Build a joint display that integrates findings."],lessons:[{title:"Three core designs",body:["Convergent: collect both strands at the same time and compare. Explanatory sequential: quantitative first, then qualitative to explain surprising results. Exploratory sequential: qualitative first to build a tool or hypotheses, then quantitative to test them."]},{title:"Integration",body:["Mixing must happen somewhere — in sampling (choosing interviewees from survey results), in analysis (a joint display table that puts numbers and themes side by side), or in interpretation. Two separate reports stapled together are not mixed methods."]}],karnataka:[{title:"Explanatory sequential: Grade 6 dip",text:['Phase 1: analyse LBA scores for Grades 5 and 6 in a district to find schools where mathematics scores drop sharply. Phase 2: interview teachers and children in four high-drop and four low-drop schools to learn why. Integrate in a joint display: "score pattern | teacher explanation | child explanation".']},{title:"Exploratory sequential: SDMC engagement scale",text:['Focus groups with SDMC members in Bidar identify what "active participation" means locally; those themes become items in a questionnaire that is then administered to SDMCs across the district.']}],activity:{title:"Select your design",prompt:"Answer the design selector questions for your planned study and sketch a joint display with at least three rows.",tool:"mixed"},tools:["mixed"],quiz:[{q:"Interviews are used to explain unexpected survey results. The design is…",options:["Convergent","Explanatory sequential","Exploratory sequential","Embedded experimental"],answer:1,why:"Quantitative first, qualitative explains."},{q:"A joint display is…",options:["A poster","A table placing quantitative and qualitative findings side by side","A bar chart","A consent form"],answer:1,why:"It shows integration visibly."},{q:"Building a questionnaire from focus group themes is…",options:["Exploratory sequential","Explanatory sequential","Convergent","Not mixed methods"],answer:0,why:"Qualitative first informs the quantitative tool."},{q:"Which is NOT genuine mixing?",options:["Joint display","Choosing interviewees from survey results","Two unrelated reports in one cover","Comparing themes with scores"],answer:2,why:"Integration must occur."}]},{id:"m7",no:7,hours:5,title:"Action Research for Education",titleKn:"ಶಿಕ್ಷಣದಲ್ಲಿ ಕ್ರಿಯಾ ಸಂಶೋಧನೆ",objectives:["Run plan–act–observe–reflect cycles on one's own practice.","Collect simple, usable evidence in the classroom or training hall.","Mentor teachers and CRPs in action research."],lessons:[{title:"The cycle",body:["Plan: name a specific problem in your practice and a change to try. Act: carry out the change for a fixed period. Observe: collect evidence (work samples, short tests, observation notes, reflections). Reflect: what changed, for whom, and why? Then plan the next cycle.","Action research is small, local and practical. Its findings are for improving your own setting first; generalisation is not its aim."]},{title:"Evidence that teachers can manage",body:["Use what already exists: notebooks, LBA records, attendance registers. Add one simple tool such as a weekly 5-item quiz or an exit slip. Keep a reflective journal with date, what was done, what happened, and what you think it means."]}],karnataka:[{title:"A D.El.Ed. lecturer's cycle",text:['Problem: trainees ask only recall questions during practice teaching. Action: model "why" and "what if" questions and use peer observation with a question-type checklist for four weeks. Evidence: count of higher-order questions per lesson before and after. Reflection: gains were larger for trainees who saw a video of their own lesson — next cycle adds video review.']},{title:"A teacher in a Kalika Chetarike classroom",text:["A Grade 5 teacher in Koppal notices that children skip the learning-sheet activities in mathematics. She introduces paired work with one stronger and one weaker reader to read the instructions aloud. After three weeks completion rates rise; she records this in her journal and shares it at the cluster meeting."]}],activity:{title:"Plan your first cycle",prompt:"Use the action research journal to write a full plan for one cycle and make your first reflective entry.",tool:"journal"},tools:["journal"],quiz:[{q:"The correct order of an action research cycle is…",options:["Act–plan–reflect–observe","Plan–act–observe–reflect","Observe–publish–plan–act","Reflect–act–plan–publish"],answer:1,why:"Plan, act, observe, reflect, then repeat."},{q:"The main aim of action research is…",options:["Generalising to all schools","Improving one's own practice","Testing theories in labs","Ranking schools"],answer:1,why:"It is practitioner inquiry for improvement."},{q:"Which is a suitable low-burden evidence source for a teacher?",options:["A national survey","Exit slips","MRI scans","Census data"],answer:1,why:"Simple, quick, and close to practice."},{q:"After reflection, the researcher should…",options:["Stop","Plan the next cycle","Delete data","Change the topic"],answer:1,why:"Action research is cyclical."}]},{id:"m8",no:8,hours:4,title:"Classroom Research",titleKn:"ತರಗತಿ ಸಂಶೋಧನೆ",objectives:["Use structured and unstructured classroom observation.","Analyse children's work and assessment data.","Study multigrade and monograde classrooms fairly."],lessons:[{title:"Observation",body:["Structured observation uses a schedule with defined categories (e.g. teacher talk, child talk, group work, silence) recorded at fixed intervals. Unstructured observation uses running notes. Observer presence changes behaviour; visit more than once so the class gets used to you."]},{title:"Children's work and assessment data",body:["Notebooks, worksheets, drawings and portfolios show how children think. Formative records such as LBA and the Holistic Progress Card (HPC) give longitudinal data. Look for error patterns, not just scores."]}],karnataka:[{title:"Observing a Nali Kali classroom",text:["In Nali Kali, children work in groups by milestone using learning cards and track their progress on a ladder. An observation schedule can record every 5 minutes: which groups are teacher-supported, partly supported or self-learning, and what each child is doing. This shows whether self-learning groups are truly engaged."]},{title:"Error analysis in Grade 7 fractions",text:["A DIET lecturer and four teachers in Hassan collect 120 fraction worksheets. Coding the errors shows that most children add numerators and denominators separately (1/2 + 1/3 = 2/5). The finding feeds a CRC workshop on area models."]}],activity:{title:"Run a timed observation",prompt:"Use the observation tool during a 20-minute lesson (real or video) and summarise the pattern of classroom talk.",tool:"observation"},tools:["observation"],quiz:[{q:"Recording a category every 30 seconds is…",options:["Interval-based structured observation","Narrative interview","Document analysis","Survey"],answer:0,why:"Fixed-interval category coding."},{q:"Why visit a classroom several times before recording?",options:["To reduce observer effect","To increase sample size","For payment","It is not needed"],answer:0,why:"The class adapts to the observer."},{q:"Analysing notebook errors is useful because…",options:["It shows thinking patterns","It replaces teaching","It ranks teachers","It is quicker than tests"],answer:0,why:"Errors reveal misconceptions."},{q:"In a Nali Kali class a researcher should observe…",options:["Only the teacher","All groups, including self-learning groups","Only the brightest child","Only the blackboard"],answer:1,why:"Multigrade dynamics involve every group."}]},{id:"m9",no:9,hours:3,title:"Community-Based Research",titleKn:"ಸಮುದಾಯ ಆಧಾರಿತ ಸಂಶೋಧನೆ",objectives:["Map stakeholders and their interests.","Engage communities as partners, not only respondents.","Handle ethics in community settings."],lessons:[{title:"Principles",body:["Community-based participatory research treats community members as co-researchers: they help decide questions, collect data and interpret findings. It builds trust and makes findings more likely to be used."]},{title:"Engagement and ethics",body:["Meet in familiar spaces at times that suit farm and work schedules. Use the local language. Be clear about what the study can and cannot offer. Share results back at a Gram Sabha or SDMC meeting."]}],karnataka:[{title:"SDMCs as research partners",text:["School Development and Monitoring Committees (SDMCs) bring parents and local leaders into school governance. A DIET in Tumakuru can work with SDMC members to study why girls' attendance drops in Grade 8, with SDMC members conducting door-to-door conversations using a short guide."]},{title:"Out-of-school children",text:["In a migrant-labour taluk of Kalaburagi, mapping families who leave for seasonal work helps plan Chinnara Angala bridge courses and seasonal hostels. Partners: anganwadi workers, gram panchayat, SDMCs and CRPs."]}],activity:{title:"Map your stakeholders",prompt:"Use the stakeholder map to list everyone affected by your planned study and decide how each will be involved.",tool:"stakeholder"},tools:["stakeholder"],quiz:[{q:"In participatory research, community members are…",options:["Only respondents","Co-researchers","Excluded from analysis","Paid enumerators only"],answer:1,why:"They share in decisions."},{q:"A good place to return findings in a village is…",options:["A journal only","An SDMC or Gram Sabha meeting","A private email","Nowhere"],answer:1,why:"Findings should return to the community."},{q:"Which is a stakeholder in a study on girls' attendance?",options:["Parents","SDMC","Anganwadi worker","All of these"],answer:3,why:"All have interests and influence."},{q:"Scheduling meetings during harvest is…",options:["Respectful","Likely to exclude farming families","Required","Irrelevant"],answer:1,why:"Timing affects who can take part."}]},{id:"m10",no:10,hours:8,title:"Data Collection and Analysis",titleKn:"ದತ್ತಾಂಶ ಸಂಗ್ರಹ ಮತ್ತು ವಿಶ್ಲೇಷಣೆ",objectives:["Design forms that reduce error.","Train field investigators and monitor quality.","Clean, code and manage data.","Run descriptive and inferential analyses and interpret them."],lessons:[{title:"Planning fieldwork",body:["Pilot every tool in 2–3 schools not in the sample. Write an investigator manual. Train CRPs or student-teachers who will collect data, including mock interviews. Plan visits so that schools are not visited on exam days or festival days."]},{title:"Data management",body:["Create a codebook: variable name, label, values, missing-data codes. Enter data twice or check 10% of forms. Store files with dated versions, keep a master copy read-only, and back up."]},{title:"Analysis and interpretation",body:['Start with descriptives: n, mean, median, SD, frequencies. Then test hypotheses. Report the test, statistic, degrees of freedom, p-value and effect size: "t(38) = 2.41, p = .021, d = 0.76". Statistical significance is not the same as practical importance.',"For qualitative data, use the coding and thematic steps from Module 5. Spreadsheet software such as LibreOffice Calc is enough for most DIET studies; JASP and R are free for more advanced work."]}],karnataka:[{title:"Worked example: chi-square on library borrowing",text:["Illustrative data from 200 Grade 7 children in Mandya district: of 100 girls, 62 borrowed a library book in the past month; of 100 boys, 45 did. Is borrowing associated with gender? Enter the 2×2 table (62, 38 / 45, 55) in the chi-square tool. The result (χ² ≈ 5.8, p ≈ .016) suggests an association; follow up with interviews to understand why."]},{title:"Worked example: ANOVA across mediums",text:["Illustrative LBA mathematics scores (out of 20) from three schools each of Kannada, English and Urdu medium. Run one-way ANOVA; if significant, examine which pairs differ and look for explanations beyond medium (teacher vacancies, enrolment size)."]}],activity:{title:"Analyse the worked data",prompt:"Run the chi-square example and one ANOVA in the statistics tool. Write a results paragraph in APA style.",tool:"stats"},tools:["stats","survey","coding"],quiz:[{q:"A codebook records…",options:["Passwords","Variable names, labels and value codes","Teacher salaries","Only missing data"],answer:1,why:"It documents how data are coded."},{q:"p = .03 means…",options:["The effect is large","If there were no real effect, a result this extreme would occur about 3% of the time","The hypothesis is 97% true","The data are wrong"],answer:1,why:"p is about data under the null hypothesis."},{q:"Effect size is reported because…",options:["It shows practical size of a difference","Journals need numbers","It replaces the mean","It is the p-value"],answer:0,why:"Significance ≠ importance."},{q:"Tools should be piloted in…",options:["Sample schools","Schools similar to but outside the sample","The DIET office","No schools"],answer:1,why:"Avoid contaminating the sample."}]},{id:"m11",no:11,hours:6,title:"Research Communication",titleKn:"ಸಂಶೋಧನಾ ಸಂವಹನ",objectives:["Write a research report with a standard structure.","Cite sources in APA style.","Present findings to teachers, officers and communities.","Prepare a policy brief and a poster."],lessons:[{title:"Report structure",body:["Title, abstract (150–250 words), introduction and problem, review of literature, objectives and questions, method (design, sample, tools, procedure, ethics), results, discussion, recommendations, limitations, references, appendices (tools, consent forms)."]},{title:"Writing for different readers",body:["Officers need a two-page policy brief: the problem, three key findings, three actions, and cost or feasibility. Teachers need practical classroom implications. Communities need a short talk in Kannada with pictures. Academics need the full report or a journal article."]},{title:"Citing and publishing",body:["Use APA 7th edition: Author, A. A. (Year). Title. Publisher. Check journals against the UGC-CARE list and avoid predatory journals that charge fees without real peer review. Share at DSERT research conferences and district review meetings."]}],karnataka:[{title:"From report to decision",text:["A DIET study finds that only a minority of high schools use their science laboratory weekly (illustrative). A good policy brief to the Deputy Director (Administration) and the DIET Principal would recommend: a weekly lab period in the timetable, a short CRC training on low-cost experiments, and a follow-up check in the next academic year."]}],activity:{title:"Draft your proposal",prompt:"Use the proposal builder to draft a complete research proposal. Export it and share it with your facilitator.",tool:"proposal"},tools:["proposal","literature"],quiz:[{q:"A policy brief for officers should be…",options:["100 pages","About two pages with clear actions","Only tables","In academic jargon"],answer:1,why:"Busy decision-makers need brevity and action."},{q:"Where should the ethics procedure be described?",options:["Abstract only","Method section","References","Not at all"],answer:1,why:"Ethics is part of method."},{q:"Predatory journals are those that…",options:["Publish quickly after real peer review","Charge fees without genuine peer review","Are in Kannada","Are on UGC-CARE"],answer:1,why:"They lack genuine review."},{q:"APA reference order is…",options:["Title, Year, Author","Author, Year, Title, Source","Year, Publisher, Author","Any order"],answer:1,why:"Author–date system."}]},{id:"m12",no:12,hours:6,title:"Quality Assurance in Research",titleKn:"ಸಂಶೋಧನೆಯಲ್ಲಿ ಗುಣಮಟ್ಟ ಭರವಸೆ",objectives:["Review a study against quality criteria at each stage.","Conduct and receive constructive peer review.","Identify common threats to validity in district studies."],lessons:[{title:"Quality across the cycle",body:["Question: clear, focused, justified. Design: matches the question. Sample: adequate and well described. Tools: piloted, reliable, valid. Analysis: appropriate tests, effect sizes, honest reporting of non-significant results. Conclusions: follow from evidence; limitations stated."]},{title:"Threats to validity",body:['Selection bias (only "good" schools chosen), history (another programme started at the same time), maturation (children grow anyway), testing effects (same test twice), attrition (children absent at post-test), and Hawthorne effect (people change because they are watched).']},{title:"Peer review",body:["Review the work, not the person. Start with strengths, then the most important problems, then minor points. Suggest specific improvements. Every DIET study can be reviewed by one internal and one external colleague before submission."]}],karnataka:[{title:"Review practice: a weak design",text:['Proposal: "Effect of Kalika Chetarike on learning" using only post-test scores from 5 schools chosen by the BEO. Problems: no baseline, no comparison, selection bias. Improvement: use the Sethubandha baseline as pre-test, add matched comparison schools, select schools randomly within blocks.']},{title:"A shared State agenda",text:["The State's research notes suggest a yearly State research agenda with a few statewide questions — for example, whether FLN gains last beyond Grade 3 — so that districts can pool samples using common tools. Quality improves when DIETs share designs and tools rather than each starting alone."]}],activity:{title:"Peer-review a proposal",prompt:"Apply the quality checklist to your own proposal and to a colleague's. Record three strengths and three specific improvements.",tool:"quality"},tools:["quality"],quiz:[{q:'Schools chosen by an officer because they "perform well" introduce…',options:["Maturation","Selection bias","Reliability","Triangulation"],answer:1,why:"Non-random choice biases results."},{q:"Children improving simply because they grew older over the year is…",options:["Maturation","History","Attrition","Instrumentation"],answer:0,why:"Natural development over time."},{q:"A good peer review begins with…",options:["Personal criticism","Strengths of the work","Rejection","Spelling errors only"],answer:1,why:"Constructive review acknowledges strengths first."},{q:"Reporting non-significant results is…",options:["Dishonest","Part of honest research","Forbidden","Unnecessary"],answer:1,why:"Hiding them biases the evidence base."}]}];D.push(...Jf);const sr=e=>e.part??1,ps=e=>D.filter(t=>sr(t)===e),Qa=e=>ps(e).reduce((t,n)=>t+n.hours,0),Go=D.reduce((e,t)=>e+t.hours,0),$n={1:{en:"Part I · Research Methodology Orien
