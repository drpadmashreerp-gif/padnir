 ಕಾಪಾಡುತ್ತಾ ಪ್ರಸ್ತಾವನೆ ರಚನೆಗೆ ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆ (AI) ಸಾಧನಗಳನ್ನು ಬಳಸುವುದು."],lessons:[{title:"ಸಂಶೋಧನಾ ಅಂತರದಿಂದ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳವರೆಗೆ",body:["ಅಂತರ ಎಂದರೆ ಲಭ್ಯ ಪುರಾವೆ ಇನ್ನೂ ತಿಳಿಸದಿರುವ ವಿಷಯ. ಆರು ಸಾಮಾನ್ಯ ಪ್ರಕಾರಗಳು: ಪುರಾವೆ ಅಂತರ (ಫಲಿತಾಂಶಗಳು ಒಂದಕ್ಕೊಂದು ಹೊಂದುವುದಿಲ್ಲ), ಜ್ಞಾನ ಅಂತರ (ವಿಷಯ ಅಧ್ಯಯನವಾಗಿಲ್ಲ), ವ್ಯಾವಹಾರಿಕ ಅಂತರ (ಅಭ್ಯಾಸದಲ್ಲಿ ಯಶಸ್ವಿಯಾದುದು ದಾಖಲಾಗಿಲ್ಲ), ವಿಧಾನ ಅಂತರ (ಹಿಂದಿನ ಅಧ್ಯಯನಗಳ ವಿನ್ಯಾಸ ಅಥವಾ ಸಾಧನಗಳು ದುರ್ಬಲ), ಜನಸಂಖ್ಯಾ ಅಂತರ (ಒಂದು ಗುಂಪು ಅಥವಾ ಸ್ಥಳಕ್ಕೆ ಅಧ್ಯಯನವಾಗಿಲ್ಲ), ಮತ್ತು ಸೈದ್ಧಾಂತಿಕ ಅಂತರ (ಮಾದರಿಯನ್ನು ವಿವರಿಸುವ ಚೌಕಟ್ಟು ಇಲ್ಲ).",'ಅಂತರವನ್ನು ಒಂದೇ ವಾಕ್ಯದಲ್ಲಿ ಬರೆಯಿರಿ: "[ತಿಳಿದಿರುವುದು] ಇದ್ದರೂ, [ಜನಸಂಖ್ಯೆ, ಸ್ಥಳ]ಕ್ಕೆ [ತಿಳಿಯದಿರುವುದು] ಇನ್ನೂ ತಿಳಿದಿಲ್ಲ, ಏಕೆಂದರೆ [ಹಿಂದಿನ ಅಧ್ಯಯನಗಳ ಕೊರತೆ]." ಪ್ರಶ್ನೆಯನ್ನು FINER ಮೂಲಕ ಪರೀಕ್ಷಿಸಿ: ಕಾರ್ಯಸಾಧ್ಯ, ಆಸಕ್ತಿದಾಯಕ, ನವೀನ, ನೈತಿಕ, ಪ್ರಸ್ತುತ.',"ಹೊಂದಾಣಿಕೆ (alignment) ಉತ್ತಮ ಪ್ರಸ್ತಾವನೆಯ ಬೆನ್ನೆಲುಬು. ಪ್ರತಿ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗೆ ಹೊಂದುವ ಉದ್ದೇಶ, ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಊಹೆ, ದತ್ತಾಂಶ ಮೂಲ ಅಥವಾ ಸಾಧನ, ಮತ್ತು ವಿಶ್ಲೇಷಣೆ ಇರಬೇಕು. ವಿಶ್ಲೇಷಣೆಯಿಲ್ಲದ ಪ್ರಶ್ನೆ ಅಥವಾ ಯಾವ ಪ್ರಶ್ನೆಗೂ ಉತ್ತರಿಸದ ವಿಶ್ಲೇಷಣೆ ಇದ್ದರೆ ಪ್ರಸ್ತಾವನೆ ಹೊಂದಾಣಿಕೆಯಲ್ಲಿಲ್ಲ."]},{title:"ವಿನ್ಯಾಸ ಆಯ್ಕೆ ಮತ್ತು ಪ್ರಸ್ತಾವನೆಯ ರಚನೆ",body:["ವಿನ್ಯಾಸವನ್ನು ಅಭ್ಯಾಸದಿಂದಲ್ಲ, ಪ್ರಶ್ನೆಯಿಂದ ಆರಿಸಿ: ವರ್ಣನೆ → ಸಮೀಕ್ಷೆ; ಸಂಬಂಧ → ಸಹಸಂಬಂಧ ಅಥವಾ SEM; ಈಗಿರುವ ಗುಂಪುಗಳ ಹೋಲಿಕೆ → ಕಾರಣ-ತುಲನಾತ್ಮಕ; ಮಧ್ಯಪ್ರವೇಶದ ಪರೀಕ್ಷೆ → ಪ್ರಾಯೋಗಿಕ ಅಥವಾ ಅರೆ-ಪ್ರಾಯೋಗಿಕ; ಅರ್ಥಗಳ ಗ್ರಹಿಕೆ → ಗುಣಾತ್ಮಕ; ಅಂಕಿಗಳ ವಿವರಣೆ → ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ ಮಿಶ್ರ ವಿಧಾನ.","ಪರಿಕಲ್ಪನಾ ಚೌಕಟ್ಟು ಎಂದರೆ ಅಧ್ಯಯನ ಪರೀಕ್ಷಿಸುವ ರಚನೆಗಳು (constructs) ಮತ್ತು ಸಂಬಂಧಗಳ ರೇಖಾಚಿತ್ರ; ಪ್ರತಿ ಬಾಣಕ್ಕೆ ಸಿದ್ಧಾಂತ ಅಥವಾ ಹಿಂದಿನ ಪುರಾವೆಯ ಬೆಂಬಲವಿರಬೇಕು. ಇದೇ ಅಧ್ಯಾಯ 15 ಮತ್ತು 16ರಲ್ಲಿ ಮಾಪನ ಮಾದರಿ (ರಚನೆಗಳು ಮತ್ತು ಅಂಶಗಳು) ಹಾಗೂ ರಚನಾತ್ಮಕ ಮಾದರಿ (ಮಾರ್ಗಗಳು) ಆಗುತ್ತದೆ.","ಪರಿಶೀಲಕರು ಹೆಚ್ಚಾಗಿ ತಿರಸ್ಕರಿಸುವ ಕಾರಣಗಳು: ಅಸ್ಪಷ್ಟ ಸಮಸ್ಯೆ, ಸಮರ್ಥನೆಯಿಲ್ಲದ ಮಾದರಿ ಗಾತ್ರ, ವಿಶ್ವಸನೀಯತೆ ಅಥವಾ ಸಿಂಧುತ್ವದ ಪುರಾವೆಯಿಲ್ಲದ ಸಾಧನಗಳು, ಪ್ರಶ್ನೆಗಳಿಗೆ ಹೊಂದದ ವಿಶ್ಲೇಷಣೆ, ನೈತಿಕ ಅಂಶಗಳ ಕೊರತೆ ಮತ್ತು ಅವಾಸ್ತವಿಕ ಕಾಲಮಿತಿ."]},{title:"ಕೃತಕ ಬುದ್ಧಿಮತ್ತೆಯ ನೆರವಿನೊಂದಿಗೆ ಪ್ರಸ್ತಾವನೆ ರಚನೆ",body:["AI ಸಾಧನಗಳು ಹಲವು ಹಂತಗಳಲ್ಲಿ ನೆರವಾಗಬಹುದು: ಸಾಹಿತ್ಯ ಶೋಧ (Semantic Scholar, Elicit, Consensus, Research Rabbit, Connected Papers), ಉಲ್ಲೇಖ ನಿರ್ವಹಣೆ (Zotero), ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳ ಚಿಂತನ ಮಂಥನ, ಅವಲೋಕನದ ರೂಪರೇಖೆ, ಭಾಷೆಯ ಸ್ಪಷ್ಟತೆ ಸುಧಾರಣೆ ಮತ್ತು ಸಾಂಖ್ಯಿಕ ಕ್ರಮಗಳು ಅಥವಾ ಕೋಡ್‌ನ ವಿವರಣೆ.","AI ಸಾಧನಗಳು ಉಲ್ಲೇಖಗಳನ್ನು ಕಲ್ಪಿಸಬಹುದು, ಫಲಿತಾಂಶಗಳನ್ನು ತಪ್ಪಾಗಿ ಹೇಳಬಹುದು ಮತ್ತು ತಪ್ಪುಗಳನ್ನು ಆತ್ಮವಿಶ್ವಾಸದಿಂದ ಹೇಳಬಹುದು. AI ಸೂಚಿಸುವ ಪ್ರತಿ ಉಲ್ಲೇಖವನ್ನು ಮೂಲದಲ್ಲಿ ತೆರೆದು ಪರಿಶೀಲಿಸಲೇಬೇಕು. ಗುರುತಿಸಬಹುದಾದ ದತ್ತಾಂಶವನ್ನು — SATS ದಾಖಲೆಗಳು, ಹೆಸರುಗಳು, ದೂರವಾಣಿ ಸಂಖ್ಯೆಗಳು, ಪ್ರಕಟವಾಗದ ಸಂದರ್ಶನ ಪ್ರತಿಲಿಪಿಗಳು — ಸಾರ್ವಜನಿಕ AI ಸಾಧನಕ್ಕೆ ಎಂದಿಗೂ ಹಾಕಬೇಡಿ.","ಪ್ರಾಮಾಣಿಕತೆಯ ನಿಯಮಗಳು: AI ಸಾಧನ ಲೇಖಕನಾಗಲಾರದು, ಏಕೆಂದರೆ ಅದು ಕೆಲಸದ ಹೊಣೆ ಹೊರಲಾರದು (COPE ನಿಲುವು ಹೇಳಿಕೆ, 2023). ಬಹುತೇಕ ನಿಯತಕಾಲಿಕಗಳು ಈಗ ಕೇಳುವಂತೆ, ಸಾಧನ, ಆವೃತ್ತಿ ಮತ್ತು ಉದ್ದೇಶವನ್ನು ವಿಧಾನ ಅಥವಾ ಕೃತಜ್ಞತೆ ವಿಭಾಗದಲ್ಲಿ ಘೋಷಿಸಿ. ಪ್ರತಿ ವಾಕ್ಯ ಮತ್ತು ಅಂಕಿಗೆ ಸಂಶೋಧಕರೇ ಹೊಣೆಗಾರರು."]}],karnataka:[{title:"ಸೇತುಬಂಧ ಅಧ್ಯಯನಕ್ಕೆ ಹೊಂದಾಣಿಕೆ ಕೋಷ್ಟಕ",text:['ಅಂತರ: "ಸೇತುಬಂಧ ಪ್ರತಿವರ್ಷದ ಆರಂಭದಲ್ಲಿ ನಡೆದರೂ, ಕಲ್ಯಾಣ ಕರ್ನಾಟಕದಲ್ಲಿ 4ನೇ ತರಗತಿಯ ಲಾಭಗಳು 5ನೇ ತರಗತಿಯ ಕೊನೆಯವರೆಗೆ ಉಳಿಯುತ್ತವೆಯೇ ಎಂದು ಯಾವ ಜಿಲ್ಲಾ ಅಧ್ಯಯನವೂ ಅನುಸರಿಸಿಲ್ಲ." ಸಂ.ಪ್ರ.1: ಜೂನ್ (4ನೇ ತರಗತಿ) ಯಿಂದ ಮಾರ್ಚ್ (5ನೇ ತರಗತಿ) ವರೆಗೆ ಕನ್ನಡ ಓದಿನ ಅಂಕಗಳಲ್ಲಿ ಬದಲಾವಣೆ ಏನು? → ಉದ್ದೇಶ: ಲಾಭಗಳ ಉಳಿಕೆಯನ್ನು ಅಂದಾಜಿಸುವುದು → ಊಹೆ 1: 5ನೇ ತರಗತಿಯ ಕೊನೆಯ ಅಂಕಗಳು ಜೂನ್ ಮೂಲರೇಖೆಗಿಂತ ಮೇಲಿರುತ್ತವೆ → ದತ್ತಾಂಶ: LBA ಓದಿನ ಅಂಕಗಳು ಮತ್ತು ಶ್ರೇಣೀಕೃತ ಓದಿನ ಪರೀಕ್ಷೆ → ವಿಶ್ಲೇಷಣೆ: ಜೋಡಿ t-ಪರೀಕ್ಷೆ ಮತ್ತು ಪರಿಣಾಮ ಗಾತ್ರ.',"ಸಂ.ಪ್ರ.2: ಉಳಿಕೆಗೆ ಯಾವ ಶಾಲಾ ಅಂಶಗಳು ಸಂಬಂಧಿಸಿವೆ? → ದತ್ತಾಂಶ: ಗ್ರಂಥಾಲಯ ಅವಧಿ, ಶಿಕ್ಷಕರ ಖಾಲಿ ಹುದ್ದೆಗಳು ಮತ್ತು ಹಾಜರಾತಿ ಕುರಿತು ಮುಖ್ಯ ಶಿಕ್ಷಕರ ಸಮೀಕ್ಷೆ → ವಿಶ್ಲೇಷಣೆ: ಬಹು ಹಿಂಚಲನೆ (multiple regression) ಅಥವಾ ಅಧ್ಯಾಯ 16ರ SEM."]},{title:"ಅವಲೋಕನದ ರೂಪರೇಖೆಗೆ AI ಸಹಾಯಕನ ಸುರಕ್ಷಿತ ಬಳಕೆ",text:['ಒಬ್ಬ ಡಯಟ್ ಉಪನ್ಯಾಸಕಿ AI ಸಹಾಯಕನನ್ನು ಕೇಳುತ್ತಾರೆ: "ಭಾರತದ ಸರ್ಕಾರಿ ಪ್ರಾಥಮಿಕ ಶಾಲೆಗಳಲ್ಲಿ ಬಹುವರ್ಗ ಬೋಧನೆ ಕುರಿತ ಸಾಹಿತ್ಯ ಅವಲೋಕನಕ್ಕೆ ಶೀರ್ಷಿಕೆಗಳು ಮತ್ತು ಹುಡುಕಬೇಕಾದ ಅಧ್ಯಯನಗಳ ಬಗೆಯೊಂದಿಗೆ ರೂಪರೇಖೆ ಸೂಚಿಸಿ. ಉಲ್ಲೇಖಗಳನ್ನು ಕಲ್ಪಿಸಬೇಡಿ." ನಂತರ ಅವರು ಪ್ರತಿ ಶೀರ್ಷಿಕೆಗೆ ಶೋಧಗಂಗಾ, ERIC ಮತ್ತು ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಸಂಗ್ರಹಗಳಲ್ಲಿ ತಾವೇ ಹುಡುಕುತ್ತಾರೆ, ತಾವು ತೆರೆದು ಓದಿದ ಅಧ್ಯಯನಗಳನ್ನು ಮಾತ್ರ ಉಳಿಸುತ್ತಾರೆ, ಮತ್ತು ಯಾವ ಸಾಧನವನ್ನು ಯಾವುದಕ್ಕೆ ಬಳಸಿದರು ಎಂದು ವಿಧಾನ ಟಿಪ್ಪಣಿಯಲ್ಲಿ ದಾಖಲಿಸುತ್ತಾರೆ.']}],activity:{title:"ನಿಮ್ಮ ಹೊಂದಾಣಿಕೆ ಕೋಷ್ಟಕ ರಚಿಸಿ",prompt:"ಹೊಂದಾಣಿಕೆ ಕೋಷ್ಟಕ ಬಳಸಿ ಪ್ರತಿ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಯನ್ನು ಉದ್ದೇಶ, ಊಹೆ, ದತ್ತಾಂಶ ಮೂಲ ಮತ್ತು ವಿಶ್ಲೇಷಣೆಗೆ ಜೋಡಿಸಿ. ನಂತರ AI ಪ್ರಾಂಪ್ಟ್ ಯೋಜಕ ಬಳಸಿ ಸಾಹಿತ್ಯ ಶೋಧಕ್ಕೆ ಒಂದು ಸುರಕ್ಷಿತ ಪ್ರಾಂಪ್ಟ್ ರಚಿಸಿ ಮತ್ತು ನಿಮ್ಮ AI ಬಳಕೆ ಘೋಷಣೆ ಬರೆಯಿರಿ."},quiz:[{q:'"LBA ಕುರಿತ ಹಿಂದಿನ ಅಧ್ಯಯನಗಳು ಮೂಲರೇಖೆ ಇಲ್ಲದೆ ಉತ್ತರ-ಪರೀಕ್ಷೆಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿದವು." ಇದು ಮುಖ್ಯವಾಗಿ…',options:["ಜನಸಂಖ್ಯಾ ಅಂತರ","ವಿಧಾನ ಅಂತರ","ಸೈದ್ಧಾಂತಿಕ ಅಂತರ","ವ್ಯಾವಹಾರಿಕ ಅಂತರ"],why:"ದೌರ್ಬಲ್ಯ ಹಿಂದಿನ ಅಧ್ಯಯನಗಳ ವಿನ್ಯಾಸದಲ್ಲಿದೆ."},{q:"AI ಸಹಾಯಕ ನಿಮಗೆ ಐದು ಉಲ್ಲೇಖಗಳನ್ನು ನೀಡುತ್ತದೆ. ನೀವು ಏನು ಮಾಡಬೇಕು?",options:["ಹಾಗೆಯೇ ಉಲ್ಲೇಖಿಸಿ","ಉಲ್ಲೇಖಿಸುವ ಮೊದಲು ಪ್ರತಿಯೊಂದನ್ನೂ ಮೂಲದಲ್ಲಿ ತೆರೆದು ಪರಿಶೀಲಿಸಿ","AI ಅನ್ನು ಸಹ-ಲೇಖಕರನ್ನಾಗಿ ಸೇರಿಸಿ","ಮೊದಲನೆಯದನ್ನು ಮಾತ್ರ ಉಲ್ಲೇಖಿಸಿ"],why:"AI ಸಾಧನಗಳು ಉಲ್ಲೇಖಗಳನ್ನು ಕಲ್ಪಿಸಬಹುದು ಅಥವಾ ತಪ್ಪಾಗಿ ಹೇಳಬಹುದು."},{q:"ಸಾರ್ವಜನಿಕ AI ಸಾಧನಕ್ಕೆ ಯಾವುದನ್ನು ಹಾಕಬಹುದು?",options:["SATS ಸಂಖ್ಯೆ ಮತ್ತು ಅಂಕಗಳ ಸ್ಪ್ರೆಡ್‌ಶೀಟ್","ಹೆಸರುಗಳಿರುವ ಪ್ರಕಟವಾಗದ ಸಂದರ್ಶನ ಪ್ರತಿಲಿಪಿಗಳು","ವೈಯಕ್ತಿಕ ದತ್ತಾಂಶವಿಲ್ಲದ ನಿಮ್ಮದೇ ಕರಡು ಪರಿಚ್ಛೇದ","ಪೋಷಕರ ದೂರವಾಣಿ ಸಂಖ್ಯೆಗಳು"],why:"ಗುರುತಿಸಬಹುದಾದ ಅಥವಾ ಗೌಪ್ಯ ದತ್ತಾಂಶವನ್ನು ಎಂದಿಗೂ ಹಂಚಬಾರದು."},{q:"ಹೊಂದಾಣಿಕೆ ಕೋಷ್ಟಕದಲ್ಲಿ ಯಾವ ಪ್ರಶ್ನೆಗೂ ಉತ್ತರಿಸದ ವಿಶ್ಲೇಷಣೆ ತೋರಿಸುವುದು…",options:["ಸಂಪೂರ್ಣತೆ","ತೆಗೆಯಬೇಕಾದ ಅಥವಾ ಸಮರ್ಥಿಸಬೇಕಾದ ಹೊಂದಾಣಿಕೆಯ ಕೊರತೆ","ಬಲವಾದ ವಿನ್ಯಾಸ","ಮಿಶ್ರ ವಿಧಾನ"],why:"ಪ್ರತಿ ವಿಶ್ಲೇಷಣೆ ಒಂದು ನಿರ್ದಿಷ್ಟ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸಬೇಕು."}]},m14:{objectives:["ಮಾಪನ ಮಟ್ಟಗಳನ್ನು ಮತ್ತು ಪ್ರತಿಫಲಿತ (reflective) ಹಾಗೂ ರೂಪಾತ್ಮಕ (formative) ರಚನೆಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸುವುದು.","ಸಮರ್ಪಕ ಮನೋಮಾಪನ ಹಂತಗಳೊಂದಿಗೆ ಲಿಕರ್ಟ್ ಮಾಪಕವನ್ನು ರಚಿಸಿ ಅನುವಾದಿಸುವುದು.","ಪ್ರಶ್ನೆ ಮತ್ತು ದತ್ತಾಂಶದ ಬಗೆಗೆ ಸರಿಯಾದ ಸಾಂಖ್ಯಿಕ ತಂತ್ರವನ್ನು ಆರಿಸುವುದು.","R ಅಥವಾ Pythonನಲ್ಲಿ ದತ್ತಾಂಶವನ್ನು ಪರಿಶೀಲಿಸಿ, ಶುದ್ಧೀಕರಿಸಿ, ಸಿದ್ಧಪಡಿಸುವುದು."],lessons:[{title:"ರಚನೆಗಳು, ಮಾಪಕಗಳು ಮತ್ತು ಸಾಧನ ರಚನೆ",body:["ಮಾಪನ ಮಟ್ಟಗಳು ಯಾವ ಅಂಕಿಅಂಶಗಳು ಸಾಧ್ಯ ಎಂದು ನಿರ್ಧರಿಸುತ್ತವೆ: ನಾಮಸೂಚಕ (ಬೋಧನಾ ಮಾಧ್ಯಮ), ಕ್ರಮಸೂಚಕ (ಶ್ರೇಣಿಗಳು, ಒಂದೊಂದು ಲಿಕರ್ಟ್ ಅಂಶ), ಅಂತರ (ಮಾಪಕದ ಒಟ್ಟು ಅಂಕಗಳು, ವ್ಯವಹಾರದಲ್ಲಿ ಅಂತರವೆಂದು ಪರಿಗಣನೆ) ಮತ್ತು ಅನುಪಾತ (ನಿಮಿಷಕ್ಕೆ ಸರಿಯಾಗಿ ಓದಿದ ಪದಗಳು, ಹಾಜರಾತಿ ದಿನಗಳು).",'ರಚನೆ ಎಂದರೆ "ಸಂಶೋಧನಾ ಸ್ವ-ಸಾಮರ್ಥ್ಯ" ದಂತಹ ನೇರವಾಗಿ ಕಾಣದ ಗುಣ. ಪ್ರತಿಫಲಿತ ರಚನೆಗಳು ತಮ್ಮ ಅಂಶಗಳಿಗೆ ಕಾರಣವಾಗುತ್ತವೆ; ಆದ್ದರಿಂದ ಅಂಶಗಳು ಹೆಚ್ಚು ಸಹಸಂಬಂಧಿಸಿರಬೇಕು ಮತ್ತು ಪರಸ್ಪರ ಬದಲಿಸಬಹುದಾದವು (ಬಹುತೇಕ ಮನೋಭಾವ ಮಾಪಕಗಳು). ರೂಪಾತ್ಮಕ ರಚನೆಗಳು ಸೂಚಕಗಳಿಂದ ರೂಪುಗೊಳ್ಳುತ್ತವೆ — ಗ್ರಂಥಾಲಯ, ಪ್ರಯೋಗಾಲಯ ಮತ್ತು ಶೌಚಾಲಯಗಳಿಂದ ರೂಪಿಸಿದ ಶಾಲಾ ಸೌಲಭ್ಯ ಸೂಚ್ಯಂಕದಂತೆ; ಅವುಗಳ ಸೂಚಕಗಳು ಸಹಸಂಬಂಧಿಸಬೇಕಿಲ್ಲ.',"ಮಾಪಕ ರಚನೆಯ ಹಂತಗಳು: ರಚನೆ ಮತ್ತು ಆಯಾಮಗಳ ವ್ಯಾಖ್ಯಾನ → ಅಂಶಗಳ ಸಂಗ್ರಹ (ಅಂತಿಮ ಸಂಖ್ಯೆಯ 3–4 ಪಟ್ಟು) → ವಿಷಯ ಸಿಂಧುತ್ವಕ್ಕೆ ತಜ್ಞರ ಪರಿಶೀಲನೆ (ಅಂಶ ಮಟ್ಟದ CVI ≥ .78) → ಕೆಲವು ಶಿಕ್ಷಕರೊಂದಿಗೆ ಅರಿವಿನ ಸಂದರ್ಶನಗಳು → ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆ (n ≥ 100) → ಅಂಶ ವಿಶ್ಲೇಷಣೆ (ತಿದ್ದಿದ ಅಂಶ–ಒಟ್ಟು r ≥ .30) → ಅಂಶ ವಿಶ್ಲೇಷಣೆ (ಅಧ್ಯಾಯ 15). ಚಿಕ್ಕ, ಒಂದೇ ವಿಚಾರದ ಅಂಶಗಳನ್ನು ಬರೆಯಿರಿ; ಎರಡು ವಿಚಾರಗಳ ಮತ್ತು ಪ್ರೇರೇಪಿಸುವ ಅಂಶಗಳನ್ನು ತಪ್ಪಿಸಿ; ಕೆಲವು ವಿರುದ್ಧ ಪದರಚನೆಯ ಅಂಶಗಳನ್ನು ಸೇರಿಸಿ ವಿಶ್ಲೇಷಣೆಗೆ ಮುನ್ನ ಮರುಸಂಕೇತಿಸಿ.","ಕನ್ನಡ ಆವೃತ್ತಿಗಳಿಗೆ ಇಬ್ಬರು ಅನುವಾದಕರಿಂದ ಮುಂದುವರಿದ ಅನುವಾದ, ಹೊಂದಾಣಿಕೆ, ಸ್ವತಂತ್ರ ಅನುವಾದಕರಿಂದ ಹಿಮ್ಮುಖ ಅನುವಾದ (back-translation) ಮತ್ತು ಸಮಿತಿಯ ಪರಿಶೀಲನೆ ಬಳಸಿ; ನಂತರ ಎರಡೂ ಭಾಷಾ ಆವೃತ್ತಿಗಳನ್ನು ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿಸಿ."]},{title:"ಸಾಂಖ್ಯಿಕ ತಂತ್ರದ ಆಯ್ಕೆ",body:["ನಾಲ್ಕು ಪ್ರಶ್ನೆಗಳಿಂದ ನಿರ್ಧರಿಸಿ: ಗುರಿ ಏನು (ಹೋಲಿಕೆ, ಸಂಬಂಧ, ಮುನ್ಸೂಚನೆ, ರಚನೆಯ ಅನ್ವೇಷಣೆ, ರಚನೆಯ ದೃಢೀಕರಣ, ಮಾದರಿ ಪರೀಕ್ಷೆ)? ಫಲಿತಾಂಶ ಚರಾಂಶದ ಮಟ್ಟ ಯಾವುದು? ಎಷ್ಟು ಗುಂಪುಗಳು, ಅವು ಸ್ವತಂತ್ರವೇ ಜೋಡಿಯೇ? ಪ್ರಾಚಲ (parametric) ಊಹೆಗಳು ಸಮಂಜಸವೇ?","ಸಾಮಾನ್ಯ ಜೋಡಿಗಳು (ಪ್ರಾಚಲ → ಅಪ್ರಾಚಲ): ಸ್ವತಂತ್ರ t-ಪರೀಕ್ಷೆ → Mann–Whitney U; ಜೋಡಿ t-ಪರೀಕ್ಷೆ → Wilcoxon signed-rank; ಏಕಮುಖ ANOVA → Kruskal–Wallis; Pearson r → Spearman ρ. ಮುನ್ಸೂಚನೆಗೆ ಬಹು ಹಿಂಚಲನೆ (ಹೌದು/ಇಲ್ಲ ಫಲಿತಾಂಶಕ್ಕೆ logistic regression). ಮಾಪಕದ ರಚನೆಗೆ EFA, ನಂತರ CFA; ರಚನೆಗಳ ನಡುವಿನ ಸಂಬಂಧಗಳಿಗೆ SEM."]},{title:"ದತ್ತಾಂಶ ಪರಿಶೀಲನೆ, ಶುದ್ಧೀಕರಣ ಮತ್ತು ಸಿದ್ಧತೆ",body:["ಈ ಕ್ರಮದಲ್ಲಿ ಪರಿಶೀಲಿಸಿ: (1) ವ್ಯಾಪ್ತಿಯ ಹೊರಗಿನ ಮೌಲ್ಯಗಳು ಮತ್ತು ನಮೂದು ದೋಷಗಳು; (2) ಕಾಣೆಯಾದ ದತ್ತಾಂಶ — ಪ್ರಮಾಣ ಮತ್ತು ಮಾದರಿಯನ್ನು ವರ್ಣಿಸಿ; ಶೇ. 5ಕ್ಕಿಂತ ಕಡಿಮೆ ಚದುರಿದ ಕೊರತೆ ಸಾಮಾನ್ಯವಾಗಿ ಹಾನಿಕರವಲ್ಲ, ಇಲ್ಲದಿದ್ದರೆ ಪ್ರಕರಣಗಳನ್ನು ಅಳಿಸುವ ಬದಲು ಬಹು ಆರೋಪಣೆ (multiple imputation) ಅಥವಾ FIML ಬಳಸಿ; (3) ಎಲ್ಲಾ ಅಂಶಗಳಿಗೆ ಒಂದೇ ಉತ್ತರ (straight-lining) ನಂತಹ ನಿರ್ಲಕ್ಷ್ಯದ ಉತ್ತರ; (4) ಹೊರಗಿನ ಮೌಲ್ಯಗಳು (outliers) — ಏಕಚರ |z| > 3.29, ಬಹುಚರ Mahalanobis ಅಂತರದಿಂದ (p < .001); (5) ಸಾಮಾನ್ಯತೆ — ವಕ್ರತೆ ±2 ಮತ್ತು ಹೆಚ್ಚುವರಿ ಕಕುದತೆ ±7 ಒಳಗಿದ್ದರೆ ML ಆಧಾರಿತ SEMಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಸ್ವೀಕಾರಾರ್ಹ; (6) ಬಹುಸಹರೇಖೀಯತೆ — VIF 5ಕ್ಕಿಂತ ಕಡಿಮೆ.","ಒಂದೇ ಸ್ವ-ವರದಿ ಪ್ರಶ್ನಾವಳಿಯಿದ್ದರೆ ಸಾಮಾನ್ಯ ವಿಧಾನ ಪಕ್ಷಪಾತ (common method bias) ಪರಿಶೀಲಿಸಿ: ಒಂದೇ ತಿರುಗಿಸದ ಅಂಶ ಶೇ. 50ಕ್ಕಿಂತ ಹೆಚ್ಚು ವ್ಯತ್ಯಾಸವನ್ನು ವಿವರಿಸಿದರೆ (Harman ಏಕ-ಅಂಶ ಪರೀಕ್ಷೆ) ಸಂಬಂಧಗಳನ್ನು ಎಚ್ಚರಿಕೆಯಿಂದ ವ್ಯಾಖ್ಯಾನಿಸಿ. ಇನ್ನೂ ಉತ್ತಮ — ವಿನ್ಯಾಸದಲ್ಲೇ ತಡೆಯಿರಿ: ಪ್ರತ್ಯೇಕ ವಿಭಾಗಗಳು, ಅನಾಮಧೇಯತೆಯ ಭರವಸೆ, ಅಂಶಗಳ ಕ್ರಮದ ಬದಲಾವಣೆ.","ಶುದ್ಧೀಕರಣ ದಾಖಲೆ ಇಡಿ: ಏನು ಬದಲಿಸಲಾಯಿತು, ಏಕೆ, ಎಷ್ಟು ಪ್ರಕರಣಗಳು ಪ್ರಭಾವಿತವಾದವು. ಕಚ್ಚಾ ಕಡತವನ್ನು ಎಂದಿಗೂ ಮೇಲ್ಬರಹ ಮಾಡಬೇಡಿ; ಶುದ್ಧೀಕರಿಸಿದ ಪ್ರತಿಯನ್ನು ಹೊಸ ಹೆಸರಿನಲ್ಲಿ ಉಳಿಸಿ."]}],karnataka:[{title:"ಡಯಟ್ ಉಪನ್ಯಾಸಕರಿಗೆ ದ್ವಿಭಾಷಾ ಸಂಶೋಧನಾ ಸ್ವ-ಸಾಮರ್ಥ್ಯ ಮಾಪಕ",text:['ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಕಾರ್ಯತಂಡವೊಂದು ಡಯಟ್ ಉಪನ್ಯಾಸಕರು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳಿಗಾಗಿ ಮೂರು ಆಯಾಮಗಳ — ಸಮಸ್ಯೆ ರೂಪಿಸುವಿಕೆ, ದತ್ತಾಂಶ ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಸಂಶೋಧನಾ ಸಂವಹನ — 36 ಅಂಶಗಳನ್ನು ರಚಿಸುತ್ತದೆ. ಆರು ತಜ್ಞರು ಪ್ರಸ್ತುತತೆಯನ್ನು ಅಳೆಯುತ್ತಾರೆ; I-CVI .78ಕ್ಕಿಂತ ಕಡಿಮೆ ಇರುವ ಅಂಶಗಳನ್ನು ಕೈಬಿಡಲಾಗುತ್ತದೆ. ಉಳಿದ 18 ಅಂಶಗಳನ್ನು ಕನ್ನಡಕ್ಕೆ ಅನುವಾದಿಸಿ ಹಿಮ್ಮುಖ ಅನುವಾದ ಮಾಡಲಾಗುತ್ತದೆ; "hypothesis" ಪದಕ್ಕೆ ಕನ್ನಡ ಪದ ಊಹೆ ಜೊತೆಗೆ ಆವರಣದಲ್ಲಿ ಇಂಗ್ಲಿಷ್ ಪದ ಬೇಕು ಎಂದು ಅರಿವಿನ ಸಂದರ್ಶನ ತೋರಿಸುತ್ತದೆ. 120 ಉಪನ್ಯಾಸಕರೊಂದಿಗೆ ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆಯ ನಂತರ ಅಂಶ ವಿಶ್ಲೇಷಣೆಗೆ 12 ಅಂಶಗಳನ್ನು ಉಳಿಸಲಾಗುತ್ತದೆ.']},{title:"ಎಸ್‌ಡಿಎಂಸಿ ಸಮೀಕ್ಷೆಯ ಶುದ್ಧೀಕರಣ",text:["ಬೀದರ್ ಜಿಲ್ಲೆಯ 400 ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರ ಉದಾಹರಣಾ ಸಮೀಕ್ಷೆಯಲ್ಲಿ ಆದಾಯ ಪ್ರಶ್ನೆಗೆ ಶೇ. 6 ಉತ್ತರಗಳು ಕಾಣೆಯಾಗಿವೆ; ಇತರ ಅಂಶಗಳಲ್ಲಿ ಶೇ. 2ಕ್ಕಿಂತ ಕಡಿಮೆ. ಸಂಶೋಧಕರು ಮಾದರಿಯನ್ನು ವರದಿ ಮಾಡಿ, ಎಲ್ಲಾ ಪ್ರಕರಣಗಳನ್ನು ಉಳಿಸಿ, 24 ಉತ್ತರದಾತರನ್ನು ಅಳಿಸುವ ಬದಲು ಬಹು ಆರೋಪಣೆ ಬಳಸುತ್ತಾರೆ — ಅವರಲ್ಲಿ ಬಹುತೇಕರು ಮಹಿಳಾ ಸದಸ್ಯರು; ಇಲ್ಲದಿದ್ದರೆ ಅವರ ಅಭಿಪ್ರಾಯಗಳು ಕಡಿಮೆ ಪ್ರತಿನಿಧಿಸಲ್ಪಡುತ್ತಿದ್ದವು."]}],activity:{title:"ದತ್ತಾಂಶ ಪರಿಶೀಲಿಸಿ ಮತ್ತು ತಂತ್ರ ಆರಿಸಿ",prompt:"ಪರಿಶೀಲನಾ ಸಾಧನದಲ್ಲಿ ಮಾದರಿ ದತ್ತಾಂಶವನ್ನು ತೆರೆಯಿರಿ. ಕಾಣೆಯಾದ ಮೌಲ್ಯಗಳು, ವ್ಯಾಪ್ತಿ ಮೀರಿದ ನಮೂದು, ಒಂದೇ ಉತ್ತರ ನೀಡಿದವರು ಮತ್ತು ಹೊರಗಿನ ಮೌಲ್ಯಗಳನ್ನು ಗುರುತಿಸಿ, ಪ್ರತಿಯೊಂದಕ್ಕೂ ಏನು ಮಾಡುತ್ತೀರಿ ಎಂದು ಬರೆಯಿರಿ. ನಂತರ ನಿಮ್ಮದೇ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗೆ ತಂತ್ರ ಆಯ್ಕೆಗಾರ ಬಳಸಿ."},quiz:[{q:"ಗ್ರಂಥಾಲಯ, ಪ್ರಯೋಗಾಲಯ ಮತ್ತು ಶೌಚಾಲಯಗಳಿಂದ ರೂಪಿಸಿದ ಶಾಲಾ ಸೌಲಭ್ಯ ಸೂಚ್ಯಂಕವನ್ನು ಹೀಗೆ ಪರಿಗಣಿಸುವುದು ಸೂಕ್ತ…",options:["ಪ್ರತಿಫಲಿತ ರಚನೆ","ರೂಪಾತ್ಮಕ ರಚನೆ","ನಾಮಸೂಚಕ ಚರಾಂಶ","ಹೊರಗಿನ ಮೌಲ್ಯ"],why:"ಸೂಚಕಗಳು ಸೂಚ್ಯಂಕವನ್ನು ರೂಪಿಸುತ್ತವೆ; ಅವು ಸಹಸಂಬಂಧಿಸಬೇಕಿಲ್ಲ."},{q:"ಜೋಡಿ t-ಪರೀಕ್ಷೆಗೆ ಅಪ್ರಾಚಲ ಪರ್ಯಾಯ…",options:["Mann–Whitney U","Wilcoxon signed-rank","Kruskal–Wallis","ಕೈ-ವರ್ಗ"],why:"Wilcoxon signed-rank ಜೋಡಿ ವೀಕ್ಷಣೆಗಳನ್ನು ಹೋಲಿಸುತ್ತದೆ."},{q:'ಒಬ್ಬ ಉತ್ತರದಾತ ಎಲ್ಲಾ 40 ಅಂಶಗಳಿಗೂ "5" ಉತ್ತರಿಸುತ್ತಾರೆ. ಇದು…',options:["ಅತ್ಯುತ್ತಮ ದತ್ತಾಂಶ","ಸಂಭಾವ್ಯ ಒಂದೇ ಉತ್ತರ (ನಿರ್ಲಕ್ಷ್ಯದ ಉತ್ತರ)","ರೂಪಾತ್ಮಕ ಸೂಚಕ","ಕಾಣೆಯಾದ ಮೌಲ್ಯ"],why:"ಎಲ್ಲೆಡೆ ಒಂದೇ ಉತ್ತರ ನಿರ್ಲಕ್ಷ್ಯವನ್ನು ಸೂಚಿಸುತ್ತದೆ."},{q:"ಹಿಮ್ಮುಖ ಅನುವಾದವನ್ನು ಬಳಸುವುದು…",options:["ಮಾದರಿ ಗಾತ್ರ ಹೆಚ್ಚಿಸಲು","ಅನುವಾದಿತ ಸಾಧನ ಮೂಲ ಅರ್ಥ ಉಳಿಸಿಕೊಂಡಿದೆಯೇ ಎಂದು ಪರಿಶೀಲಿಸಲು","ಹೊರಗಿನ ಮೌಲ್ಯಗಳನ್ನು ತೆಗೆಯಲು","ಊಹೆಗಳನ್ನು ಪರೀಕ್ಷಿಸಲು"],why:"ಸ್ವತಂತ್ರ ಅನುವಾದಕರು ಹಿಮ್ಮುಖವಾಗಿ ಅನುವಾದಿಸಿ ಅರ್ಥದ ವ್ಯತ್ಯಾಸವನ್ನು ಬಯಲುಮಾಡುತ್ತಾರೆ."}]},m15:{objectives:["ದತ್ತಾಂಶ ಅಂಶ ವಿಶ್ಲೇಷಣೆಗೆ ಸೂಕ್ತವೇ ಎಂದು ಪರಿಶೀಲಿಸುವುದು (KMO, Bartlett).","SPSS, R ಅಥವಾ Pythonನಲ್ಲಿ ಅನ್ವೇಷಣಾತ್ಮಕ ಅಂಶ ವಿಶ್ಲೇಷಣೆ (EFA) ನಡೆಸಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು.","AMOS ಅಥವಾ lavaanನಲ್ಲಿ ದೃಢೀಕರಣ ಅಂಶ ವಿಶ್ಲೇಷಣೆ (CFA) ಮೂಲಕ ಮಾಪನ ಮಾದರಿಯನ್ನು ರೂಪಿಸಿ ಮೌಲ್ಯಮಾಪನ ಮಾಡುವುದು.","ವಿಶ್ವಸನೀಯತೆ, ಒಮ್ಮುಖ ಸಿಂಧುತ್ವ ಮತ್ತು ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವವನ್ನು ಸ್ಥಾಪಿಸುವುದು."],lessons:[{title:"ಅನ್ವೇಷಣಾತ್ಮಕ ಅಂಶ ವಿಶ್ಲೇಷಣೆ (EFA)",body:["EFA ಕೇಳುವುದು: ಅಂಶಗಳ ನಡುವಿನ ಸಹಸಂಬಂಧಗಳನ್ನು ಎಷ್ಟು ಆಧಾರ ಅಂಶಗಳು (factors) ವಿವರಿಸುತ್ತವೆ, ಮತ್ತು ಯಾವ ಅಂಶ ಯಾವ ಅಂಶಕ್ಕೆ ಸೇರುತ್ತದೆ? ಮಾಪಕ ಹೊಸದಾಗಿದ್ದಾಗ ಅಥವಾ ಹೊಸ ಜನಸಂಖ್ಯೆಯಲ್ಲಿ ಬಳಸುವಾಗ ಇದನ್ನು ಬಳಸಿ.","ಸೂಕ್ತತೆ: ಪ್ರತಿ ಅಂಶಕ್ಕೆ ಕನಿಷ್ಠ 5–10 ಉತ್ತರದಾತರು, ಸಾಧ್ಯವಾದರೆ 200 ಅಥವಾ ಹೆಚ್ಚು; KMO ≥ .60 (≥ .80 ಉತ್ತಮ) ಮತ್ತು ಪ್ರತಿ ಅಂಶದ KMO ≥ .50; Bartlett ಗೋಳೀಯತಾ ಪರೀಕ್ಷೆ ಮಹತ್ವದ್ದು (p < .05).","ಹೊರತೆಗೆಯುವಿಕೆ: principal axis factoring ಅಥವಾ maximum likelihood ಸಾಮಾನ್ಯ ಅಂಶಗಳನ್ನು ಅಂದಾಜಿಸುತ್ತವೆ; principal components analysis ಒಟ್ಟು ವ್ಯತ್ಯಾಸವನ್ನು ಸಂಕ್ಷೇಪಿಸುತ್ತದೆ, ಕಟ್ಟುನಿಟ್ಟಾಗಿ ಅಂಶ ವಿಶ್ಲೇಷಣೆಯಲ್ಲ. ಎಷ್ಟು ಅಂಶಗಳು: eigenvalue > 1 (Kaiser), scree ಚಿತ್ರದ ಮೊಣಕೈ, ಮತ್ತು — ಹೆಚ್ಚು ವಿಶ್ವಸನೀಯ — parallel analysis; ಪರಿಹಾರ ಸೈದ್ಧಾಂತಿಕವಾಗಿಯೂ ಅರ್ಥಪೂರ್ಣವಾಗಿರಬೇಕು.","ತಿರುಗಿಸುವಿಕೆ (rotation): ಅಂಶಗಳು ಸಂಬಂಧರಹಿತವೆಂದು ನಿರೀಕ್ಷಿಸಿದಾಗ varimax (ಲಂಬಕೋನೀಯ); ಸಂಬಂಧಿಸುತ್ತವೆಂದು ನಿರೀಕ್ಷಿಸಿದಾಗ promax ಅಥವಾ oblimin (ಓರೆ) — ಶಿಕ್ಷಣದಲ್ಲಿ ಇದು ಸಾಮಾನ್ಯ. ತಮ್ಮ ಅಂಶದ ಮೇಲೆ ಭಾರ (loading) ≥ .50 ಮತ್ತು ಅಡ್ಡ-ಭಾರ .30ಕ್ಕಿಂತ ಕಡಿಮೆ (ಅಥವಾ ಕನಿಷ್ಠ .20 ಕಡಿಮೆ) ಇರುವ ಅಂಶಗಳನ್ನು ಉಳಿಸಿ; ಸಾಮಾನ್ಯತೆ (communality) ≥ .40 ಆದರ್ಶ. ದುರ್ಬಲ ಅಂಶಗಳನ್ನು ಒಂದೊಂದಾಗಿ ತೆಗೆದು ಮರುನಡೆಸಿ.","SPSS: Analyze → Dimension Reduction → Factor → Descriptives: KMO and Bartlett's test; Extraction: Principal axis factoring, Scree plot; Rotation: Promax (ಅಥವಾ Varimax); Options: Sorted by size, .30ಕ್ಕಿಂತ ಕಡಿಮೆ ಗುಣಾಂಕಗಳನ್ನು ಮರೆಮಾಡಿ."]},{title:"ದೃಢೀಕರಣ ಅಂಶ ವಿಶ್ಲೇಷಣೆ (CFA)",body:["CFA ಮೊದಲೇ ನಿರ್ದಿಷ್ಟಪಡಿಸಿದ ಮಾಪನ ಮಾದರಿಯನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ: ಯಾವ ಅಂಶ ಯಾವ ಅಂಶದ ಮೇಲೆ ಭಾರ ಹೊಂದಿದೆ, ಅಡ್ಡ-ಭಾರಗಳಿಲ್ಲದೆ. EFAಗಿಂತ ಬೇರೆ ಮಾದರಿಯನ್ನು ಬಳಸಿ (ದತ್ತಾಂಶವನ್ನು ಯಾದೃಚ್ಛಿಕವಾಗಿ ವಿಭಜಿಸಿ ಅಥವಾ ಎರಡನೇ ಮಾದರಿ ಸಂಗ್ರಹಿಸಿ).","AMOSನಲ್ಲಿ: ಪ್ರತಿ ಗುಪ್ತ ಅಂಶವನ್ನು ದೀರ್ಘವೃತ್ತವಾಗಿ, ಅದರ ಅಂಶಗಳನ್ನು ಆಯತಗಳಾಗಿ ಬರೆಯಿರಿ, ಪ್ರತಿ ಅಂಶಕ್ಕೆ ದೋಷ ಪದ ಸೇರಿಸಿ, ಪ್ರತಿ ಅಂಶದ ಮೊದಲ ಭಾರವನ್ನು 1ಕ್ಕೆ ನಿಗದಿಪಡಿಸಿ (ಅಥವಾ ಅಂಶ ವ್ಯತ್ಯಾಸವನ್ನು 1ಕ್ಕೆ), ಅಂಶಗಳನ್ನು ಎರಡು ತಲೆಯ ಬಾಣಗಳಿಂದ (ಸಹವ್ಯತ್ಯಾಸ) ಜೋಡಿಸಿ, Maximum likelihood ಆರಿಸಿ, Analysis Propertiesನಲ್ಲಿ Standardized estimates ಮತ್ತು Modification indices ಗುರುತಿಸಿ. ಭಾರಗಳನ್ನು ವ್ಯಾಖ್ಯಾನಿಸುವ ಮೊದಲು ಮಾದರಿ ಹೊಂದಾಣಿಕೆ (ಅಧ್ಯಾಯ 16) ವರದಿ ಮಾಡಿ.","ಮೌಲ್ಯಮಾಪನ: ಪ್ರಮಾಣೀಕೃತ ಭಾರಗಳು ≥ .70 ಆದರ್ಶ (ವಿಶ್ವಸನೀಯತೆ ಇದ್ದರೆ ≥ .50 ಸ್ವೀಕಾರಾರ್ಹ); ಸಂಯೋಜಿತ ವಿಶ್ವಸನೀಯತೆ (CR) ≥ .70; ಒಮ್ಮುಖ ಸಿಂಧುತ್ವಕ್ಕೆ ಸರಾಸರಿ ಹೊರತೆಗೆದ ವ್ಯತ್ಯಾಸ (AVE) ≥ .50. ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವ: ಪ್ರತಿ ಅಂಶದ AVEಯ ವರ್ಗಮೂಲ ಇತರ ಅಂಶಗಳೊಂದಿಗಿನ ಸಹಸಂಬಂಧಕ್ಕಿಂತ ಹೆಚ್ಚಿರಬೇಕು (Fornell & Larcker, 1981), ಮತ್ತು HTMT ಅನುಪಾತ .85ಕ್ಕಿಂತ ಕಡಿಮೆ (ಸಮಾನ ಪರಿಕಲ್ಪನೆಗಳಿಗೆ .90; Henseler ಮತ್ತು ಇತರರು, 2015)."]},{title:"ವಿಶ್ವಸನೀಯತೆ ಮತ್ತು ಸಿಂಧುತ್ವ: ಒಟ್ಟುಗೂಡಿಸಿ",body:["ಪ್ರತಿ ಅಂಶಕ್ಕೆ Cronbach ಆಲ್ಫಾ ಮತ್ತು ಸಂಯೋಜಿತ ವಿಶ್ವಸನೀಯತೆ, ಮಹತ್ವದೊಂದಿಗೆ ಭಾರಗಳು, CR ಮತ್ತು AVE ಒಂದೇ ಕೋಷ್ಟಕದಲ್ಲಿ, ಮತ್ತು ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವಕ್ಕೆ Fornell–Larcker ಅಥವಾ HTMT ಕೋಷ್ಟಕ ವರದಿ ಮಾಡಿ.","AVE .50ಕ್ಕಿಂತ ಕಡಿಮೆಯಿದ್ದು CR .60ಕ್ಕಿಂತ ಹೆಚ್ಚಿದ್ದರೆ ಒಮ್ಮುಖ ಸಿಂಧುತ್ವವನ್ನು ಸಮರ್ಪಕವೆಂದು ಪರಿಗಣಿಸಬಹುದು (Fornell & Larcker, 1981) — ಇದನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಿ. ಅಂಶ ಏನನ್ನು ಅಳೆಯುತ್ತದೆ ಎಂದು ಯೋಚಿಸದೆ ಕೇವಲ ಹೊಂದಾಣಿಕೆ ಸುಧಾರಿಸಲು ಅಂಶಗಳನ್ನು ಅಳಿಸಬೇಡಿ; ಅಂಕಿಗಳಷ್ಟೇ ವಿಷಯ ಸಿಂಧುತ್ವವೂ ಮುಖ್ಯ."]}],karnataka:[{title:"ಸಂಶೋಧನಾ ಸ್ವ-ಸಾಮರ್ಥ್ಯ ಮಾಪಕದ EFA",text:["12-ಅಂಶಗಳ ಮಾಪಕದಲ್ಲಿ 220 ಡಯಟ್ ಉಪನ್ಯಾಸಕರು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳ ಉದಾಹರಣಾ ಫಲಿತಾಂಶಗಳು: KMO = .85, Bartlett χ²(66) = 1121, p < .001. ಮೂರು ಅಂಶಗಳ eigenvalue 1ಕ್ಕಿಂತ ಹೆಚ್ಚು (4.47, 1.99, 1.72) ಮತ್ತು ಒಟ್ಟಾಗಿ ಸುಮಾರು ಶೇ. 68 ಒಟ್ಟು ವ್ಯತ್ಯಾಸವನ್ನು ವಿವರಿಸುತ್ತವೆ (ಆರಂಭಿಕ eigenvalueಗಳು; principal axis ಹೊರತೆಗೆಯುವಿಕೆಯ ನಂತರ ಸುಮಾರು ಶೇ. 58). ತಿರುಗಿಸಿದ ನಂತರ ಸಮಸ್ಯೆ ರೂಪಿಸುವಿಕೆ, ದತ್ತಾಂಶ ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಸಂವಹನದ ತಲಾ ನಾಲ್ಕು ಅಂಶಗಳು ತಮ್ಮದೇ ಅಂಶದ ಮೇಲೆ ಭಾರ ಹೊಂದುತ್ತವೆ. EFA ಸಾಧನದಲ್ಲಿ ಇದನ್ನು ನೀವೇ ನಡೆಸಿ."]},{title:"ಎರಡನೇ ಮಾದರಿಯಲ್ಲಿ CFA",text:["ಕಲಬುರಗಿ ಮತ್ತು ರಾಯಚೂರಿನ 240 ಶಿಕ್ಷಕರ ಎರಡನೇ ಸ್ವತಂತ್ರ ಮಾದರಿಯನ್ನು CFAಗೆ ಬಳಸಲಾಗುತ್ತದೆ. ಉದಾಹರಣಾ ಪ್ರಮಾಣೀಕೃತ ಭಾರಗಳು .68 ರಿಂದ .86. ಮೂರೂ ಅಂಶಗಳಿಗೆ CR .80ಕ್ಕಿಂತ ಮತ್ತು AVE .55ಕ್ಕಿಂತ ಹೆಚ್ಚು; ಪ್ರತಿ √AVE ಅಂಶಗಳ ನಡುವಿನ ಸಹಸಂಬಂಧಗಳನ್ನು ಮೀರುತ್ತದೆ — ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವಕ್ಕೆ ಬೆಂಬಲ. ಈಗ ಮಾಪಕವನ್ನು ಅಧ್ಯಾಯ 16ರ SEMನಲ್ಲಿ ಬಳಸಬಹುದು."]}],activity:{title:"EFA ನಡೆಸಿ ಮಾಪನ ಮಾದರಿಯನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡಿ",prompt:"ಮೂರು ಅಂಶಗಳೊಂದಿಗೆ ಮಾದರಿ ದತ್ತಾಂಶದ ಮೇಲೆ EFA ಸಾಧನ ನಡೆಸಿ. ಪ್ರತಿ ಅಂಶಕ್ಕೆ ಹೆಸರಿಡಿ ಮತ್ತು ಯಾವುದಾದರೂ ಅಂಶ ಕೈಬಿಡಬೇಕೇ ಎಂದು ನಿರ್ಧರಿಸಿ. ನಂತರ CFA ಗಣಕದಲ್ಲಿ ಭಾರಗಳು ಮತ್ತು ಅಂಶ ಸಹಸಂಬಂಧಗಳನ್ನು ನಮೂದಿಸಿ ವಿಶ್ವಸನೀಯತೆ ಮತ್ತು ಸಿಂಧುತ್ವವನ್ನು ನಿರ್ಣಯಿಸಿ."},quiz:[{q:"ನಿಮ್ಮ ದತ್ತಾಂಶಕ್ಕೆ KMO = .52 ಎಂದರೆ…",options:["ಅತ್ಯುತ್ತಮ ಸೂಕ್ತತೆ","ಕೇವಲ ಸೂಕ್ತ; ಹೆಚ್ಚು ದತ್ತಾಂಶ ಅಥವಾ ದುರ್ಬಲ ಅಂಶಗಳ ತೆಗೆಯುವಿಕೆ ಪರಿಗಣಿಸಿ","ಮಾದರಿ ಹೊಂದುತ್ತದೆ","ವಿಶ್ವಸನೀಯತೆ ಹೆಚ್ಚು"],why:".60ಕ್ಕಿಂತ ಕಡಿಮೆ ಮೌಲ್ಯಗಳು ದುರ್ಬಲ ಮಾದರಿ ಸಮರ್ಪಕತೆ ಸೂಚಿಸುತ್ತವೆ."},{q:"ಅಂಶಗಳು ಸಹಸಂಬಂಧಿಸುತ್ತವೆಂದು ನಿರೀಕ್ಷಿಸಿದಾಗ ಬಳಸಬೇಕಾದದ್ದು…",options:["Varimax","promax ಅಥವಾ oblimin ನಂತಹ ಓರೆ ತಿರುಗಿಸುವಿಕೆ","ತಿರುಗಿಸುವಿಕೆ ಬೇಡ","Bartlett ಪರೀಕ್ಷೆ"],why:"ಓರೆ ತಿರುಗಿಸುವಿಕೆ ಅಂಶಗಳ ಸಹಸಂಬಂಧಕ್ಕೆ ಅವಕಾಶ ನೀಡುತ್ತದೆ."},{q:"AVE = .58 ಮತ್ತು CR = .84 ಸೂಚಿಸುವುದು…",options:["ದುರ್ಬಲ ವಿಶ್ವಸನೀಯತೆ","ಸಮರ್ಪಕ ಒಮ್ಮುಖ ಸಿಂಧುತ್ವ ಮತ್ತು ವಿಶ್ವಸನೀಯತೆ","ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವದ ವೈಫಲ್ಯ","ಅತಿ ಹೊಂದಾಣಿಕೆ"],why:"AVE ≥ .50 ಮತ್ತು CR ≥ .70 ಸಾಮಾನ್ಯ ಮಿತಿಗಳು."},{q:"EFAಗಿಂತ ಬೇರೆ ಮಾದರಿಯಲ್ಲಿ CFA ಏಕೆ?",options:["ಸಮಯ ಉಳಿಸಲು","ಅದೇ ದತ್ತಾಂಶವನ್ನು ಮರುವರ್ಣಿಸುವ ಬದಲು ರಚನೆಯನ್ನು ದೃಢೀಕರಿಸಲು","AMOSಗೆ ಬೇಕಾದ್ದರಿಂದ","ಆಲ್ಫಾ ಹೆಚ್ಚಿಸಲು"],why:"ಅದೇ ದತ್ತಾಂಶ ಬಳಸಿದರೆ ಆಕಸ್ಮಿಕತೆಯ ಲಾಭ ಪಡೆದಂತಾಗುತ್ತದೆ."}]},m16:{objectives:["ಗುಪ್ತ ಮತ್ತು ವೀಕ್ಷಿತ ಚರಾಂಶಗಳು, ಮಾಪನ ಮತ್ತು ರಚನಾತ್ಮಕ ಮಾದರಿಗಳನ್ನು ವಿವರಿಸುವುದು.","AMOS ಅಥವಾ lavaanನಲ್ಲಿ ರಚನಾತ್ಮಕ ಮಾರ್ಗ ಮಾದರಿಯನ್ನು ರಚಿಸಿ ಅಂದಾಜಿಸುವುದು.","ಮಾದರಿ ಹೊಂದಾಣಿಕೆಯನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡಿ ಮಾದರಿಯನ್ನು ಜವಾಬ್ದಾರಿಯಿಂದ ದೃಢೀಕರಿಸುವುದು.","ಮಧ್ಯಸ್ಥಿಕೆ, ನಿಯಂತ್ರಣ ಮತ್ತು ಗುಂಪು ವ್ಯತ್ಯಾಸಗಳನ್ನು (ಬಹು-ಗುಂಪು SEM) ಪರೀಕ್ಷಿಸುವುದು."],lessons:[{title:"SEM ಅರಿವು ಮತ್ತು ಮಾರ್ಗ ಮಾದರಿಗಳ ರಚನೆ",body:["SEM ಮಾಪನ ದೋಷವನ್ನು ಲೆಕ್ಕಿಸುತ್ತಾ ರಚನೆಗಳ ನಡುವಿನ ಸಂಬಂಧಗಳ ಜಾಲವನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ. ಇದು ಮಾಪನ ಮಾದರಿ (CFA: ರಚನೆಗಳು ಮತ್ತು ಅವುಗಳ ಅಂಶಗಳು) ಮತ್ತು ರಚನಾತ್ಮಕ ಮಾದರಿ (ರಚನೆಗಳ ನಡುವಿನ ಮಾರ್ಗಗಳು) ಸೇರಿದ್ದು. ಬಾಹ್ಯ (exogenous) ರಚನೆಗಳತ್ತ ಯಾವ ಬಾಣವೂ ಬರುವುದಿಲ್ಲ; ಆಂತರಿಕ (endogenous) ರಚನೆಗಳನ್ನು ಇತರರು ಮುನ್ಸೂಚಿಸುತ್ತಾರೆ.","ಎರಡು-ಹಂತದ ವಿಧಾನ ಬಳಸಿ (Anderson & Gerbing, 1988): ಮೊದಲು ಉತ್ತಮ ಮಾಪನ ಮಾದರಿ ಸ್ಥಾಪಿಸಿ (ಅಧ್ಯಾಯ 15), ನಂತರ ರಚನಾತ್ಮಕ ಮಾರ್ಗಗಳನ್ನು ಸೇರಿಸಿ. ಪ್ರತಿ ಮಾರ್ಗಕ್ಕೆ ಸೈದ್ಧಾಂತಿಕ ಕಾರಣ ಬೇಕು. ಮಾದರಿ ಗಾತ್ರ: 200 ಅಥವಾ ಹೆಚ್ಚು ಸಾಮಾನ್ಯ ಕನಿಷ್ಠ, ಸಂಕೀರ್ಣ ಮಾದರಿಗಳಿಗೆ ಹೆಚ್ಚು; ಸಾಧ್ಯವಾದಲ್ಲಿ ಪ್ರತಿ ಅಂದಾಜಿತ ಪ್ರಾಚಲಕ್ಕೆ ಕನಿಷ್ಠ 10 ಪ್ರಕರಣಗಳು.","ಸಹವ್ಯತ್ಯಾಸ-ಆಧಾರಿತ SEM (AMOS, lavaan) ಸಿದ್ಧಾಂತವನ್ನು ಪರೀಕ್ಷಿಸಿ ಹೊಂದಾಣಿಕೆ ಸೂಚ್ಯಂಕಗಳನ್ನು ನೀಡುತ್ತದೆ. ಆಂಶಿಕ ಕನಿಷ್ಠ ವರ್ಗ SEM (ಉದಾ: SmartPLS) ಮುನ್ಸೂಚನೆ, ಸಣ್ಣ ಮಾದರಿಗಳು ಮತ್ತು ರೂಪಾತ್ಮಕ ರಚನೆಗಳಿಗೆ ಸೂಕ್ತ, ಆದರೆ ಒಟ್ಟು ಮಾದರಿ ಹೊಂದಾಣಿಕೆಯನ್ನು ಅದೇ ರೀತಿ ಪರೀಕ್ಷಿಸುವುದಿಲ್ಲ. ಅನುಕೂಲದಿಂದಲ್ಲ, ಗುರಿಯಿಂದ ಆರಿಸಿ.","AMOSನಲ್ಲಿ: ದೃಢೀಕೃತ CFA ಚಿತ್ರದಿಂದ ಆರಂಭಿಸಿ, ಸಿದ್ಧಾಂತ ಪರಿಣಾಮವನ್ನು ಮುನ್ಸೂಚಿಸುವಲ್ಲಿ ರಚನೆಗಳ ನಡುವಿನ ಸಹವ್ಯತ್ಯಾಸಗಳನ್ನು ಒಂದೇ ತಲೆಯ ಬಾಣಗಳಿಂದ ಬದಲಿಸಿ, ಪ್ರತಿ ಆಂತರಿಕ ರಚನೆಗೆ ಉಳಿಕೆ ಪದ ಸೇರಿಸಿ, maximum likelihoodನಿಂದ ಅಂದಾಜಿಸಿ. ಪ್ರಮಾಣೀಕೃತ ಮಾರ್ಗ ಗುಣಾಂಕಗಳು (β), ಅವುಗಳ ಮಹತ್ವ ಮತ್ತು ಪ್ರತಿ ಆಂತರಿಕ ರಚನೆಯ R² ವರದಿ ಮಾಡಿ."]},{title:"ಮಾದರಿ ಹೊಂದಾಣಿಕೆ, ಮೌಲ್ಯಮಾಪನ ಮತ್ತು ದೃಢೀಕರಣ",body:["ಹಲವು ಹೊಂದಾಣಿಕೆ ಸೂಚ್ಯಂಕಗಳನ್ನು ಒಟ್ಟಿಗೆ ವರದಿ ಮಾಡಿ: df ಮತ್ತು p ಸಹಿತ χ² (ದೊಡ್ಡ ಮಾದರಿಗಳಿಗೆ ಸೂಕ್ಷ್ಮ, ಆದ್ದರಿಂದ ಏಕಾಂಗಿಯಾಗಿ ಬಳಸಬೇಡಿ), χ²/df (≤ 3 ಉತ್ತಮ), CFI ಮತ್ತು TLI (≥ .95 ಉತ್ತಮ, ≥ .90 ಸ್ವೀಕಾರಾರ್ಹ), 90% ವಿಶ್ವಾಸ ಅಂತರದೊಂದಿಗೆ RMSEA (≤ .06 ಉತ್ತಮ, ≤ .08 ಸ್ವೀಕಾರಾರ್ಹ) ಮತ್ತು SRMR (≤ .08). ಇವು ಮಾರ್ಗಸೂಚಿಗಳು (Hu & Bentler, 1999), ಕಾನೂನುಗಳಲ್ಲ.","ಮಾರ್ಪಾಡು ಸೂಚ್ಯಂಕಗಳು (modification indices) ಹೊಂದಾಣಿಕೆ ಸುಧಾರಿಸುವ ಬದಲಾವಣೆಗಳನ್ನು ಸೂಚಿಸುತ್ತವೆ. ಸ್ಪಷ್ಟ ಸೈದ್ಧಾಂತಿಕ ಕಾರಣವಿರುವ ಬದಲಾವಣೆಗಳನ್ನು ಮಾತ್ರ ಒಪ್ಪಿ (ಉದಾ: ಬಹುತೇಕ ಒಂದೇ ಪದರಚನೆಯ ಎರಡು ಅಂಶಗಳ ದೋಷಗಳ ಸಹಸಂಬಂಧ), ಒಂದೊಂದಾಗಿ ಮಾಡಿ, ಪ್ರತಿ ಬದಲಾವಣೆಯನ್ನು ವರದಿ ಮಾಡಿ. ಒಂದು ಮಾದರಿಗೆ ಹೊಂದಿಸಲು ಮಾರ್ಪಡಿಸಿದ ಮಾದರಿಯನ್ನು ಇನ್ನೊಂದರಲ್ಲಿ ಅಡ್ಡ-ದೃಢೀಕರಿಸಬೇಕು.","ಸಂಭಾವ್ಯ ಪರ್ಯಾಯಗಳೊಂದಿಗೆ ಹೋಲಿಸಿ (ಉದಾ: ನೇರ ಮಾರ್ಗ ಸಹಿತ ಮತ್ತು ರಹಿತ), ಅಂದಾಜುಗಳು ಸಮಂಜಸವೇ ಎಂದು ಪರಿಶೀಲಿಸಿ (ಋಣಾತ್ಮಕ ದೋಷ ವ್ಯತ್ಯಾಸಗಳಿಲ್ಲ, ಪ್ರಮಾಣೀಕೃತ ಮೌಲ್ಯಗಳು ±1 ಒಳಗೆ), ಮತ್ತು ಪ್ರತ್ಯೇಕ ಮಾದರಿಯಲ್ಲಿ ಪರೀಕ್ಷಿಸಿ ದೃಢೀಕರಿಸಿ."]},{title:"ಮುಂದುವರಿದ ಅನ್ವಯಗಳು",body:["ಮಧ್ಯಸ್ಥಿಕೆ (mediation): ಪರೋಕ್ಷ ಪರಿಣಾಮ (a × b) X, M ಮೂಲಕ Y ಮೇಲೆ ಪ್ರಭಾವ ಬೀರುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ. ಬೂಟ್‌ಸ್ಟ್ರ್ಯಾಪ್ ವಿಶ್ವಾಸ ಅಂತರಗಳಿಂದ (5,000 ಮರುಮಾದರಿಗಳು) ಪರೀಕ್ಷಿಸಿ; 95% ಅಂತರ ಶೂನ್ಯವನ್ನು ಒಳಗೊಳ್ಳದಿದ್ದರೆ ಪರೋಕ್ಷ ಪರಿಣಾಮ ಮಹತ್ವದ್ದು. ನೇರ, ಪರೋಕ್ಷ ಮತ್ತು ಒಟ್ಟು ಪರಿಣಾಮಗಳನ್ನು ವರದಿ ಮಾಡಿ. AMOSನಲ್ಲಿ: Analysis Properties → Bootstrap → Perform bootstrap (5000), Bias-corrected confidence intervals; Indirect, direct and total effects ಕೇಳಿ.","ನಿಯಂತ್ರಣ (moderation): X ಮೇಲೆ Y ಪರಿಣಾಮ W ಮೇಲೆ ಅವಲಂಬಿತ. ವೀಕ್ಷಿತ ಚರಾಂಶಗಳಿಗೆ X × W ಪರಸ್ಪರ ಕ್ರಿಯೆ (ಸರಾಸರಿ-ಕೇಂದ್ರಿತ) ಸೇರಿಸಿ; ಗುಪ್ತ ಚರಾಂಶಗಳಿಗೆ ಗುಪ್ತ ಪರಸ್ಪರ ಕ್ರಿಯೆ ವಿಧಾನಗಳು ಅಥವಾ ಬಹು-ಗುಂಪು ವಿಶ್ಲೇಷಣೆ ಬಳಸಿ.","ಬಹು-ಗುಂಪು SEM: ಕಲ್ಯಾಣ ಕರ್ನಾಟಕ ಮತ್ತು ಇತರ ಜಿಲ್ಲೆಗಳು, ಅಥವಾ ಪುರುಷ ಮತ್ತು ಮಹಿಳಾ ಶಿಕ್ಷಕರಂತಹ ಗುಂಪುಗಳನ್ನು ಹೋಲಿಸಿ. ಮೊದಲು ಮಾಪನ ಅಚರತೆ (measurement invariance) ಹಂತಗಳಲ್ಲಿ ಪರೀಕ್ಷಿಸಿ — ರೂಪ (configural), ಮಾಪಕ (metric: ಸಮ ಭಾರಗಳು), ಅಳತೆ (scalar: ಸಮ ಛೇದಕಗಳು) — CFI .01ಕ್ಕಿಂತ ಹೆಚ್ಚು ಇಳಿಯದಿದ್ದರೆ ಪ್ರತಿ ಹಂತವನ್ನು ಒಪ್ಪಿ. ನಂತರವೇ ಗುಂಪುಗಳ ನಡುವೆ ಮಾರ್ಗಗಳು ಅಥವಾ ಸರಾಸರಿಗಳನ್ನು ಹೋಲಿಸಿ.","ಉನ್ನತ-ಕ್ರಮದ ಮಾದರಿಗಳು ಮೊದಲ-ಕ್ರಮದ ಅಂಶಗಳ ಮೇಲೆ ಸಾಮಾನ್ಯ ಅಂಶವನ್ನು ಪ್ರತಿನಿಧಿಸುತ್ತವೆ (ಉದಾ: ಮೂರು ಆಯಾಮಗಳ ಮೇಲಿನ ಒಟ್ಟು ಸಂಶೋಧನಾ ಸ್ವ-ಸಾಮರ್ಥ್ಯ)."]}],karnataka:[{title:"ಡಯಟ್ ಬೆಂಬಲ ಸಂಶೋಧನಾ ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆಯನ್ನು ಬೆಳೆಸುತ್ತದೆಯೇ?",text:["260 ಶಿಕ್ಷಕರ ಉದಾಹರಣಾ ಮಾದರಿ: ಡಯಟ್ ಬೆಂಬಲ (ಮಾರ್ಗದರ್ಶನ, ಕಾರ್ಯಾಗಾರಗಳು, ಪ್ರತಿಕ್ರಿಯೆ) → ಸಂಶೋಧನಾ ಸ್ವ-ಸಾಮರ್ಥ್ಯ → ಸಂಶೋಧನಾ ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ (ಕ್ರಿಯಾ ಸಂಶೋಧನಾ ಯೋಜನೆಗಳು, ಕ್ಲಸ್ಟರ್ ಸಭೆಗಳಲ್ಲಿ ಪ್ರಸ್ತುತಿಗಳು). ಹೊಂದಾಣಿಕೆ: χ²(87) = 141.6, χ²/df = 1.63, CFI = .97, TLI = .96, RMSEA = .049, SRMR = .046. ಬೆಂಬಲ → ಸ್ವ-ಸಾಮರ್ಥ್ಯ β = .48; ಸ್ವ-ಸಾಮರ್ಥ್ಯ → ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ β = .44; ಬೆಂಬಲದಿಂದ ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆಗೆ ನೇರ ಮಾರ್ಗ ಚಿಕ್ಕದು (β = .12). ಬೂಟ್‌ಸ್ಟ್ರ್ಯಾಪ್ ಪರೋಕ್ಷ ಪರಿಣಾಮ ಮಹತ್ವದ್ದು — ಡಯಟ್ ಬೆಂಬಲ ಮುಖ್ಯವಾಗಿ ಶಿಕ್ಷಕರ ಆತ್ಮವಿಶ್ವಾಸ ಬೆಳೆಸುವ ಮೂಲಕ ಕೆಲಸ ಮಾಡುತ್ತದೆ ಎಂದು ಸೂಚಿಸುತ್ತದೆ."]},{title:"ಬಹು-ಗುಂಪು SEM ಮೂಲಕ ಪ್ರದೇಶಗಳ ಹೋಲಿಕೆ",text:["ಅದೇ ಮಾದರಿಯನ್ನು ಕಲ್ಯಾಣ ಕರ್ನಾಟಕ ಜಿಲ್ಲೆಗಳು ಮತ್ತು ಇತರ ಜಿಲ್ಲೆಗಳಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ಪರೀಕ್ಷಿಸಲಾಗುತ್ತದೆ. ರೂಪ ಮತ್ತು ಮಾಪಕ ಅಚರತೆ ಉಳಿಯುತ್ತದೆ (ΔCFI < .01), ಆದ್ದರಿಂದ ಮಾರ್ಗಗಳನ್ನು ಹೋಲಿಸಬಹುದು. ಕಲ್ಯಾಣ ಕರ್ನಾಟಕದಲ್ಲಿ ಬೆಂಬಲ → ಸ್ವ-ಸಾಮರ್ಥ್ಯ ಮಾರ್ಗ ಹೆಚ್ಚು ಬಲವಾಗಿದ್ದರೆ, ಅಲ್ಲಿ ಮಾರ್ಗದರ್ಶನಕ್ಕೆ ಆದ್ಯತೆ ನೀಡಬೇಕೆಂದು ಡಯಟ್ ವಾದಿಸಬಹುದು."]}],activity:{title:"ಹೊಂದಾಣಿಕೆ ಮೌಲ್ಯಮಾಪನ ಮತ್ತು ಮಧ್ಯಸ್ಥಿಕೆ ಪರೀಕ್ಷೆ",prompt:"ಉದಾಹರಣೆಯ (ಅಥವಾ ನಿಮ್ಮದೇ ಫಲಿತಾಂಶದ) ಹೊಂದಾಣಿಕೆ ಸೂಚ್ಯಂಕಗಳನ್ನು ಹೊಂದಾಣಿಕೆ ಪರಿಶೀಲಕದಲ್ಲಿ ನಮೂದಿಸಿ, ರಚಿತ ವಾಕ್ಯವನ್ನು ನಕಲಿಸಿ. ನಂತರ ಮಾದರಿ ದತ್ತಾಂಶದ ಮೇಲೆ ಮಧ್ಯಸ್ಥಿಕೆ ಸಾಧನ ನಡೆಸಿ, ವಿಶ್ವಾಸ ಅಂತರದೊಂದಿಗೆ ಪರೋಕ್ಷ ಪರಿಣಾಮವನ್ನು ವರದಿ ಮಾಡಿ."},quiz:[{q:"ಎರಡು-ಹಂತದ ವಿಧಾನದಲ್ಲಿ ನೀವು ಮೊದಲು…",options:["ಎಲ್ಲಾ ರಚನಾತ್ಮಕ ಮಾರ್ಗಗಳನ್ನು ಸೇರಿಸುತ್ತೀರಿ","ಮಾಪನ ಮಾದರಿಯನ್ನು ದೃಢೀಕರಿಸುತ್ತೀರಿ","ಬಹು-ಗುಂಪು ವಿಶ್ಲೇಷಣೆ ನಡೆಸುತ್ತೀರಿ","ಕಡಿಮೆ ಭಾರದ ಅಂಶಗಳನ್ನು ಅಳಿಸುತ್ತೀರಿ"],why:"ರಚನಾತ್ಮಕ ಮಾರ್ಗಗಳಿಗೆ ಮುನ್ನ ಸಮರ್ಪಕ ಮಾಪನ ಮಾದರಿ ಬೇಕು."},{q:"CFI = .96, RMSEA = .05, SRMR = .04 ಸೂಚಿಸುವುದು…",options:["ದುರ್ಬಲ ಹೊಂದಾಣಿಕೆ","ಉತ್ತಮ ಹೊಂದಾಣಿಕೆ","ಕೇವಲ ಅತಿ ಹೊಂದಾಣಿಕೆ","χ² ಇಲ್ಲದೆ ಏನೂ ಇಲ್ಲ"],why:"ಮೂರೂ ಸಾಮಾನ್ಯ ಉತ್ತಮ-ಹೊಂದಾಣಿಕೆ ಮಾರ್ಗಸೂಚಿಗಳನ್ನು ಪೂರೈಸುತ್ತವೆ."},{q:"ಮಧ್ಯಸ್ಥಿಕೆ ಪರಿಣಾಮಕ್ಕೆ ಬೆಂಬಲ ಸಿಗುವುದು…",options:["ನೇರ ಮಾರ್ಗ ಶೂನ್ಯವಾದಾಗ","a × b ಯ ಬೂಟ್‌ಸ್ಟ್ರ್ಯಾಪ್ 95% ವಿಶ್ವಾಸ ಅಂತರ ಶೂನ್ಯವನ್ನು ಒಳಗೊಳ್ಳದಿದ್ದಾಗ","R² .50ಕ್ಕಿಂತ ಹೆಚ್ಚಿದ್ದಾಗ","χ² ಮಹತ್ವದ್ದಲ್ಲದಿದ್ದಾಗ"],why:"ಪರೋಕ್ಷ ಪರಿಣಾಮವನ್ನು ಬೂಟ್‌ಸ್ಟ್ರ್ಯಾಪ್ ಅಂತರಗಳಿಂದ ಪರೀಕ್ಷಿಸಲಾಗುತ್ತದೆ."},{q:"ಎರಡು ಗುಂಪುಗಳ ನಡುವೆ ಮಾರ್ಗಗಳನ್ನು ಹೋಲಿಸುವ ಮೊದಲು ಸ್ಥಾಪಿಸಬೇಕಾದದ್ದು…",options:["ಸಮಾನ ಮಾದರಿ ಗಾತ್ರ","ಮಾಪನ ಅಚರತೆ (ಕನಿಷ್ಠ metric)","ಒಂದೇ ಸರಾಸರಿಗಳು","ಉನ್ನತ-ಕ್ರಮದ ಅಂಶ"],why:"ಎರಡೂ ಗುಂಪುಗಳಲ್ಲಿ ರಚನೆಗಳನ್ನು ಒಂದೇ ರೀತಿ ಅಳೆಯಬೇಕು."}]},m17:{objectives:["EFA, CFA ಮತ್ತು SEM ಫಲಿತಾಂಶಗಳನ್ನು ನಿಯತಕಾಲಿಕ ಮಟ್ಟದಲ್ಲಿ ವರದಿ ಮಾಡುವುದು.","ಸೂಕ್ತ ನಿಯತಕಾಲಿಕ ಆರಿಸುವುದು, ಪರಿಶೀಲಕರಿಗೆ ಉತ್ತರಿಸುವುದು ಮತ್ತು ಶೋಷಕ ಪ್ರಕಟಣೆಗಳನ್ನು ತಪ್ಪಿಸುವುದು.","ಸಂಶೋಧನಾ ಪ್ರಕ್ರಿಯೆಯುದ್ದಕ್ಕೂ ಉತ್ಪಾದಕ ಮತ್ತು ಏಜೆಂಟಿಕ್ AI ಸಾಧನಗಳನ್ನು ಜವಾಬ್ದಾರಿಯಿಂದ ಬಳಸುವುದು.","ಶಿಕ್ಷಣದಲ್ಲಿ ಬೃಹತ್ ದತ್ತಾಂಶ (big data) ಮತ್ತು ಅಂತರಶಿಸ್ತೀಯ ಸಂಶೋಧನೆಯ ಅವಕಾಶಗಳು ಹಾಗೂ ಅಪಾಯಗಳನ್ನು ಗುರುತಿಸುವುದು."],lessons:[{title:"ಫಲಿತಾಂಶಗಳಿಂದ ಪ್ರಕಟಣೆಯೋಗ್ಯ ಹಸ್ತಪ್ರತಿಯವರೆಗೆ",body:["ಬಹುತೇಕ ಅನುಭವಜನ್ಯ ಲೇಖನಗಳು IMRaD ಅನುಸರಿಸುತ್ತವೆ: ಪೀಠಿಕೆ (ಸಮಸ್ಯೆ, ಅಂತರ, ಗುರಿ), ವಿಧಾನ (ಭಾಗವಹಿಸಿದವರು, ಸಾಧನಗಳು, ಕಾರ್ಯವಿಧಾನ, ನೈತಿಕತೆ, ವಿಶ್ಲೇಷಣೆ), ಫಲಿತಾಂಶಗಳು, ಮತ್ತು ಚರ್ಚೆ (ಅರ್ಥ, ಹಿಂದಿನ ಅಧ್ಯಯನಗಳೊಂದಿಗೆ ಹೋಲಿಕೆ, ಪರಿಣಾಮಗಳು, ಮಿತಿಗಳು, ಮುಂದಿನ ಸಂಶೋಧನೆ). ಮತ್ತೊಬ್ಬ ಸಂಶೋಧಕ ಅಧ್ಯಯನವನ್ನು ಪುನರಾವರ್ತಿಸುವಂತೆ ವಿಧಾನ ಬರೆಯಿರಿ.","ಬಹುಚರ ವಿಶ್ಲೇಷಣೆಗೆ ವರದಿ ಮಾಡಬೇಕಾದವು: ತಂತ್ರಾಂಶ ಮತ್ತು ಆವೃತ್ತಿ; ಅಂದಾಜುಗಾರ; ಕಾಣೆಯಾದ ದತ್ತಾಂಶ ನಿರ್ವಹಣೆ; EFAಗೆ KMO, Bartlett, ಹೊರತೆಗೆಯುವಿಕೆ, ತಿರುಗಿಸುವಿಕೆ ಮತ್ತು ಭಾರಗಳು; ಭಾರಗಳು, CR, AVE ಮತ್ತು ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವದೊಂದಿಗೆ CFA ಕೋಷ್ಟಕ; RMSEA ವಿಶ್ವಾಸ ಅಂತರ ಸಹಿತ ಹೊಂದಾಣಿಕೆ ಸೂಚ್ಯಂಕಗಳು; ಪ್ರಮಾಣಿತ ದೋಷ, p-ಮೌಲ್ಯ ಮತ್ತು ವಿಶ್ವಾಸ ಅಂತರಗಳೊಂದಿಗೆ ಪ್ರಮಾಣೀಕೃತ ಮಾರ್ಗ ಗುಣಾಂಕಗಳು; R²; ಮತ್ತು ಬೂಟ್‌ಸ್ಟ್ರ್ಯಾಪ್ ಅಂತರಗಳೊಂದಿಗೆ ಪರೋಕ್ಷ ಪರಿಣಾಮಗಳು. ಪ್ರಮಾಣೀಕೃತ ಅಂದಾಜುಗಳಿರುವ ಸ್ಪಷ್ಟ ಮಾರ್ಗ ಚಿತ್ರ ಓದುಗರಿಗೆ ನೆರವಾಗುತ್ತದೆ.",'ಚರ್ಚೆಯಲ್ಲಿ ಪರಿಣಾಮ ಗಾತ್ರಗಳನ್ನು ವ್ಯಾವಹಾರಿಕವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸಿ ("ಡಯಟ್ ಬೆಂಬಲದಲ್ಲಿ ಒಂದು ಪ್ರಮಾಣಿತ ವಿಚಲನೆ ಹೆಚ್ಚಳ…ಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ"), ಅಡ್ಡ-ವಿಭಾಗೀಯ ದತ್ತಾಂಶದಲ್ಲಿ ಸಂಬಂಧ ಮತ್ತು ಕಾರಣವನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ, ಶಿಫಾರಸುಗಳನ್ನು ನಿರ್ದಿಷ್ಟ ಫಲಿತಾಂಶಗಳಿಗೆ ಜೋಡಿಸಿ.']},{title:"ಪ್ರಕಟಣೆ: ನಿಯತಕಾಲಿಕ ಆಯ್ಕೆ ಮತ್ತು ಪರಿಶೀಲಕರೊಂದಿಗೆ ಕೆಲಸ",body:["ವ್ಯಾಪ್ತಿ, ಓದುಗರು, ಸೂಚೀಕರಣ (Scopus, Web of Science, UGC-CARE ಪಟ್ಟಿ), ಪರಿಶೀಲನಾ ಅವಧಿ ಮತ್ತು ವೆಚ್ಚದ ಹೊಂದಾಣಿಕೆಯಿಂದ ನಿಯತಕಾಲಿಕ ಆರಿಸಿ. ಇತ್ತೀಚಿನ ಸಂಚಿಕೆಗಳು ಮತ್ತು ಲೇಖಕರ ಮಾರ್ಗಸೂಚಿಗಳನ್ನು ಓದಿ. ನಕಲಿ ಅಥವಾ ಶೋಷಕ ನಿಯತಕಾಲಿಕಗಳನ್ನು ಪರಿಶೀಲಿಸಿ: ಸೂಚೀಕರಣ ದತ್ತಸಂಚಯದಿಂದಲೇ ನಿಯತಕಾಲಿಕದ ಜಾಲತಾಣವನ್ನು ದೃಢಪಡಿಸಿ, ಖಚಿತ ಸ್ವೀಕಾರ ಅಥವಾ ಅತಿ ವೇಗದ ಪರಿಶೀಲನೆಯ ಬಗ್ಗೆ ಎಚ್ಚರವಿರಲಿ, ನಿಜವಾದ ಪರಿಶೀಲನೆಗೆ ಮುನ್ನ ಶುಲ್ಕ ಕಟ್ಟಬೇಡಿ.","ಕೊಡುಗೆ ಮತ್ತು ನಿಯತಕಾಲಿಕಕ್ಕೆ ಏಕೆ ಸೂಕ್ತ ಎಂದು ತಿಳಿಸುವ ಚಿಕ್ಕ ಮುಖಪತ್ರ ಬರೆಯಿರಿ. ಪರಿಶೀಲಕರ ಟಿಪ್ಪಣಿಗಳನ್ನು ಉಚಿತ ತಜ್ಞ ಸಲಹೆಯೆಂದು ಪರಿಗಣಿಸಿ: ಕೋಷ್ಟಕದಲ್ಲಿ ಅಂಶವಾರು ಉತ್ತರಿಸಿ, ಏನು ಬದಲಿಸಿದಿರಿ ಮತ್ತು ಎಲ್ಲಿ ಎಂದು ಹೇಳಿ, ಒಪ್ಪದಿದ್ದಾಗ ಪುರಾವೆಯೊಂದಿಗೆ ವಿನಯದಿಂದ ವಿವರಿಸಿ.","ORCID ಗುರುತು, ನೈತಿಕತೆ ಅನುಮತಿಸುವಲ್ಲಿ ದತ್ತಾಂಶ ಮತ್ತು ಕೋಡ್ ಹಂಚಿಕೆ, ನಿಯತಕಾಲಿಕ ಅನುಮತಿಸುವಲ್ಲಿ ಪೂರ್ವಮುದ್ರಣಗಳು, ಮತ್ತು ಸಾಂಸ್ಥಿಕ ಭಂಡಾರಗಳಂತಹ ಮುಕ್ತ-ಪ್ರವೇಶ ಆಯ್ಕೆಗಳಿಂದ ಗೋಚರತೆ ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆ ಬಲಪಡಿಸಿ."]},{title:"AI ಆಧಾರಿತ ಸಂಶೋಧನೆ: ಉತ್ಪಾದಕದಿಂದ ಏಜೆಂಟಿಕ್ AIವರೆಗೆ",body:["ಉತ್ಪಾದಕ AI (ChatGPT, Claude ಅಥವಾ Gemini ನಂತಹ ಸಂವಾದ ಸಹಾಯಕರು) ಪಠ್ಯ ಕರಡು, ನೀವು ನೀಡುವ ಲೇಖನಗಳ ಸಾರಾಂಶ, R ಅಥವಾ Pythonಗೆ ಕೋಡ್ ಸಲಹೆ, ಸಾಂಖ್ಯಿಕ ಫಲಿತಾಂಶಗಳ ವಿವರಣೆ ಮತ್ತು ಗುಣಾತ್ಮಕ ದತ್ತಾಂಶದ ಮೊದಲ ಹಂತದ ಸಂಕೇತೀಕರಣಕ್ಕೆ ನೆರವಾಗಬಹುದು. ಏಜೆಂಟಿಕ್ AI ಇನ್ನೂ ಮುಂದೆ ಹೋಗುತ್ತದೆ: ಏಜೆಂಟ್‌ಗಳು ಬಹು-ಹಂತದ ಕಾರ್ಯಗಳನ್ನು ಯೋಜಿಸಿ, ಮೂಲಗಳನ್ನು ಹುಡುಕಿ, ಕೋಡ್ ನಡೆಸಿ, ತಮ್ಮದೇ ಕೆಲಸವನ್ನು ಪರಿಷ್ಕರಿಸುತ್ತವೆ — ಸಂಶೋಧಕರ ಮೇಲ್ವಿಚಾರಣೆಯಲ್ಲಿ.","ಅವಕಾಶಗಳು: ವೇಗದ ಸಾಹಿತ್ಯ ನಕ್ಷೆ, ಪುನರುತ್ಪಾದಿಸಬಹುದಾದ ವಿಶ್ಲೇಷಣಾ ಸ್ಕ್ರಿಪ್ಟ್‌ಗಳು, ದ್ವಿಭಾಷಾ ಸಾಧನಗಳಿಗೆ ಅನುವಾದ ನೆರವು, ಪ್ರವೇಶಸಾಧ್ಯತೆ. ಅಪಾಯಗಳು: ಕಲ್ಪಿತ ಸತ್ಯಗಳು ಮತ್ತು ಉಲ್ಲೇಖಗಳು, ಗುಪ್ತ ಪಕ್ಷಪಾತ, ಸಂಶೋಧಕರ ಸ್ವಂತ ವಿವೇಚನೆಯ ನಷ್ಟ, ಗೌಪ್ಯತಾ ಉಲ್ಲಂಘನೆ, ಮತ್ತು ಯಾರೂ ಪರಿಶೀಲಿಸದ ಫಲಿತಾಂಶಗಳ ಮೇಲಿನ ಅತಿ ಅವಲಂಬನೆ. ತಾವಾಗಿ ಕ್ರಿಯೆ ನಡೆಸುವ ಏಜೆಂಟ್‌ಗಳಿಗೆ ಸ್ಪಷ್ಟ ಮಿತಿಗಳು, ದಾಖಲೆಗಳು ಮತ್ತು ಪ್ರತಿ ಮುಖ್ಯ ಹಂತಕ್ಕೆ ಮಾನವ ಅನುಮೋದನೆ ಬೇಕು.","ಜವಾಬ್ದಾರಿಯುತ ಬಳಕೆಯ ಕ್ರಮ: ಸಾಧನ ಏನು ಮಾಡಬಹುದು ಮತ್ತು ಮಾಡಬಾರದು ಎಂದು ನಿರ್ಧರಿಸಿ; ವೈಯಕ್ತಿಕ ದತ್ತಾಂಶವನ್ನು ಎಂದಿಗೂ ಅಪ್‌ಲೋಡ್ ಮಾಡಬೇಡಿ; ಪ್ರತಿ ಸತ್ಯ, ಉಲ್ಲೇಖ ಮತ್ತು ಅಂಕಿಯನ್ನು ಮೂಲದಲ್ಲಿ ಪರಿಶೀಲಿಸಿ; ಪ್ರಾಂಪ್ಟ್‌ಗಳು ಮತ್ತು ಫಲಿತಾಂಶಗಳನ್ನು ಲೆಕ್ಕಪರಿಶೋಧನಾ ಜಾಡಿನ ಭಾಗವಾಗಿ ಉಳಿಸಿ; ಲೇಖನದಲ್ಲಿ ಬಳಕೆಯನ್ನು ಘೋಷಿಸಿ; ವ್ಯಾಖ್ಯಾನ ಮತ್ತು ತೀರ್ಮಾನಗಳು ನಿಮ್ಮದೇ ಆಗಿರಲಿ.","ಬೃಹತ್ ದತ್ತಾಂಶ ಮತ್ತು ಅಂತರಶಿಸ್ತೀಯ ಸಂಶೋಧನೆ: ದೊಡ್ಡ ಆಡಳಿತಾತ್ಮಕ ದತ್ತಾಂಶಗಳು (UDISE+, SATS ಒಟ್ಟು ಅಂಕಿಗಳು, ಮೌಲ್ಯಮಾಪನ ಪೋರ್ಟಲ್‌ಗಳು, ಕಲಿಕಾ-ಆ್ಯಪ್ ದಾಖಲೆಗಳು) ಜನಸಂಖ್ಯಾ ಮಟ್ಟದ ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ಕಲಿಕಾ ವಿಶ್ಲೇಷಣೆಗೆ ಅವಕಾಶ ನೀಡುತ್ತವೆ, ಆದರೆ ಅನುಮತಿ, ಗುರುತು ತೆಗೆಯುವಿಕೆ ಮತ್ತು ಭಾರತದ ಡಿಜಿಟಲ್ ವೈಯಕ್ತಿಕ ದತ್ತಾಂಶ ಸಂರಕ್ಷಣಾ ಕಾಯ್ದೆ, 2023ರ ಅಡಿಯಲ್ಲಿ ಎಚ್ಚರಿಕೆ ಬೇಕು. ಪೋಷಣೆ ಮತ್ತು ಕಲಿಕೆ, ವಲಸೆ ಮತ್ತು ಶಾಲೆ ಬಿಡುವಿಕೆ, ತಂತ್ರಜ್ಞಾನ ಮತ್ತು ಸಮಾನತೆಯಂತಹ ಅನೇಕ ಶೈಕ್ಷಣಿಕ ಪ್ರಶ್ನೆಗಳನ್ನು ಸಾರ್ವಜನಿಕ ಆರೋಗ್ಯ, ಅರ್ಥಶಾಸ್ತ್ರ, ದತ್ತಾಂಶ ವಿಜ್ಞಾನ ಮತ್ತು ಸಮಾಜಶಾಸ್ತ್ರದ ಸಹೋದ್ಯೋಗಿಗಳೊಂದಿಗೆ ಅಧ್ಯಯನ ಮಾಡುವುದು ಉತ್ತಮ."]}],karnataka:[{title:"ಸ್ವ-ಸಾಮರ್ಥ್ಯ CFAಗೆ ಫಲಿತಾಂಶ ಪರಿಚ್ಛೇದ",text:['"ಮೂರು-ಅಂಶಗಳ CFA (maximum likelihood, AMOS; N = 240) ಉತ್ತಮ ಹೊಂದಾಣಿಕೆ ತೋರಿಸಿತು, χ²(51) = 85.2, p = .002, CFI = .97, TLI = .96, RMSEA = .053 [90% CI .031, .073], SRMR = .045. ಎಲ್ಲಾ ಪ್ರಮಾಣೀಕೃತ ಭಾರಗಳು ಮಹತ್ವದ್ದಾಗಿದ್ದವು (.68–.86). ಸಂಯೋಜಿತ ವಿಶ್ವಸನೀಯತೆ .82 ರಿಂದ .88 ಮತ್ತು AVE .55 ರಿಂದ .64; ಪ್ರತಿ AVEಯ ವರ್ಗಮೂಲ ಅಂಶಗಳ ನಡುವಿನ ಸಹಸಂಬಂಧಗಳನ್ನು (.41–.58) ಮೀರಿತು — ಭೇದಾತ್ಮಕ ಸಿಂಧುತ್ವಕ್ಕೆ ಬೆಂಬಲ." (ಉದಾಹರಣಾ ಮೌಲ್ಯಗಳು.)']},{title:"ಎಚ್ಚರಿಕೆಯೊಂದಿಗೆ ಬೃಹತ್ ದತ್ತಾಂಶ: SATS ಒಟ್ಟು ಅಂಕಿಗಳು",text:["1,200 ಶಾಲೆಗಳಲ್ಲಿ ಹಾಜರಾತಿ ಮಾದರಿಗಳು 7ನೇ ತರಗತಿ LBA ಅಂಕಗಳನ್ನು ಮುನ್ಸೂಚಿಸುತ್ತವೆಯೇ ಎಂದು ಡಯಟ್ ಅಧ್ಯಯನ ಮಾಡಲು ಬಯಸುತ್ತದೆ. ಅದು ಮಗು-ಮಟ್ಟದ ದಾಖಲೆಗಳ ಬದಲು ಶಾಲಾ-ಮಟ್ಟದ ಒಟ್ಟು ಅಂಕಿಗಳನ್ನು ಕೇಳುತ್ತದೆ, ಇಲಾಖೆಯ ಕಂಪ್ಯೂಟರ್‌ನಲ್ಲಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ, ತನ್ನ ಕೋಡ್ ದಾಖಲಿಸುತ್ತದೆ, ಮತ್ತು AI ಸಹಾಯಕವನ್ನು ಕೇವಲ ನಕಲಿ ದತ್ತಾಂಶದ ಮೇಲೆ ವಿಶ್ಲೇಷಣಾ ಸ್ಕ್ರಿಪ್ಟ್ ಬರೆಯಲು ಮತ್ತು ದೋಷ ಸರಿಪಡಿಸಲು ಬಳಸುತ್ತದೆ — ನಿಜವಾದ ಕಡತದ ಮೇಲೆ ಎಂದಿಗೂ ಅಲ್ಲ. ಸಣ್ಣ ಶಾಲೆಗಳನ್ನು ಹೆಸರಿಸದಂತೆ ನೀತಿ ಸಂಕ್ಷೇಪ ಮಾದರಿಗಳನ್ನು ಬ್ಲಾಕ್‌ವಾರು ವರದಿ ಮಾಡುತ್ತದೆ, ಶಾಲಾವಾರು ಅಲ್ಲ."]}],activity:{title:"ಬರೆಯಿರಿ ಮತ್ತು ಜವಾಬ್ದಾರಿಯುತ AI ಬಳಕೆ ಯೋಜಿಸಿ",prompt:"ಹೊಂದಾಣಿಕೆ ಪರಿಶೀಲಕ ಅಥವಾ CFA ಗಣಕದ ಫಲಿತಾಂಶ ಬಳಸಿ APA ಶೈಲಿಯಲ್ಲಿ ಫಲಿತಾಂಶ ಪರಿಚ್ಛೇದ ಬರೆಯಿರಿ. ನಂತರ AI ಪ್ರಾಂಪ್ಟ್ ಯೋಜಕದಲ್ಲಿ ಜವಾಬ್ದಾರಿಯುತ AI ಪರಿಶೀಲನಾ ಪಟ್ಟಿ ಪೂರ್ಣಗೊಳಿಸಿ, ನಿಮ್ಮ ಮುಂದಿನ ಲೇಖನಕ್ಕೆ AI ಬಳಕೆ ಘೋಷಣೆಯನ್ನು ಡೌನ್‌ಲೋಡ್ ಮಾಡಿ."},quiz:[{q:"SEM ಲೇಖನದ ವಿಧಾನ ವಿಭಾಗದಲ್ಲಿ ಇರಬೇಕಾದದ್ದು ಯಾವುದು?",options:["ಊಹೆಗಳು ಮಾತ್ರ","ಅಂದಾಜುಗಾರ, ತಂತ್ರಾಂಶ, ಕಾಣೆಯಾದ ದತ್ತಾಂಶ ನಿರ್ವಹಣೆ ಮತ್ತು ಹೊಂದಾಣಿಕೆ ಮಾನದಂಡಗಳು","ನೀತಿ ಪರಿಣಾಮಗಳು","ಮುಖಪತ್ರ"],why:"ಇತರರು ಪುನರಾವರ್ತಿಸುವಂತೆ ವಿಶ್ಲೇಷಣೆ ಹೇಗೆ ನಡೆಯಿತು ಎಂದು ವಿಧಾನ ತಿಳಿಸುತ್ತದೆ."},{q:"ಶುಲ್ಕಕ್ಕೆ 72 ಗಂಟೆಗಳಲ್ಲಿ ಸ್ವೀಕಾರ ಭರವಸೆ ನೀಡುವ ನಿಯತಕಾಲಿಕ. ನೀವು…",options:["ಬೇಗ ಸಲ್ಲಿಸಿ","ಶೋಷಕ ನಿಯತಕಾಲಿಕವೆಂದು ಪರಿಗಣಿಸಿ ಸೂಚೀಕರಣ ದತ್ತಸಂಚಯಗಳಲ್ಲಿ ಪರಿಶೀಲಿಸಿ","ಮೊದಲು ಹಣ ಕಟ್ಟಿ ನಂತರ ಕೇಳಿ","ನಿಮ್ಮ ಅವಲೋಕನದಲ್ಲಿ ಉಲ್ಲೇಖಿಸಿ"],why:"ಖಚಿತ ವೇಗದ ಸ್ವೀಕಾರ ಶೋಷಕ ಅಭ್ಯಾಸದ ಸಾಮಾನ್ಯ ಲಕ್ಷಣ."},{q:"ಸಾಮಾನ್ಯ ಸಂವಾದ ಸಹಾಯಕನಿಂದ ಏಜೆಂಟಿಕ್ AI ಹೇಗೆ ಭಿನ್ನ?",options:["ಅದು ಸಾಧನಗಳನ್ನು ಬಳಸಲಾರದು","ಅದು ಹುಡುಕಾಟ ಮತ್ತು ಕೋಡ್ ನಡೆಸುವಂತಹ ಬಹು-ಹಂತದ ಕಾರ್ಯಗಳನ್ನು ಯೋಜಿಸಿ ನಡೆಸುತ್ತದೆ","ಅದು ಎಂದಿಗೂ ತಪ್ಪು ಮಾಡುವುದಿಲ್ಲ","ಅದನ್ನು ಲೇಖಕರನ್ನಾಗಿ ಸೇರಿಸಬಹುದು"],why:"ಏಜೆಂಟ್‌ಗಳು ಹಲವು ಹಂತಗಳಲ್ಲಿ ಕ್ರಿಯೆ ನಡೆಸುವುದರಿಂದ ಮಿತಿಗಳು ಮತ್ತು ಮಾನವ ಮೇಲ್ವಿಚಾರಣೆ ಬೇಕು."},{q:"ಜವಾಬ್ದಾರಿಯುತ AI ಬಳಕೆಯಲ್ಲಿ ಸಂಶೋಧಕರು…",options:["ವೇಗದ ವಿಶ್ಲೇಷಣೆಗೆ SATS ದತ್ತಾಂಶ ಅಪ್‌ಲೋಡ್ ಮಾಡಬೇಕು","AI ನೀಡಿದ ಪ್ರತಿ ಸತ್ಯವನ್ನು ಪರಿಶೀಲಿಸಿ AI ಬಳಕೆಯನ್ನು ಘೋಷಿಸಬೇಕು","ತೀರ್ಮಾನಗಳನ್ನು AI ಬರೆಯಲು ಬಿಡಬೇಕು","AI ಬಳಕೆಯನ್ನು ಮರೆಮಾಚಬೇಕು"],why:"ಪರಿಶೀಲನೆ ಮತ್ತು ಘೋಷಣೆ ಪ್ರಾಮಾಣಿಕತೆಯನ್ನು ಕಾಪಾಡುತ್ತವೆ."}]}},Ur={m1:{objectives:['ಅಭಿಪ್ರಾಯ ಅಥವಾ ವರದಿಗಿಂತ "ಸಂಶೋಧನೆ" ಹೇಗೆ ಭಿನ್ನ ಎಂಬುದನ್ನು ವಿವರಿಸುವುದು.',"ಮೂಲ, ಅನ್ವಯಿಕ, ಮೌಲ್ಯಮಾಪನ ಮತ್ತು ಕ್ರಿಯಾ ಸಂಶೋಧನೆಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸುವುದು.","ಸಂಶೋಧನಾ ದೃಷ್ಟಿಕೋನಗಳನ್ನು (ಪ್ರತ್ಯಕ್ಷವಾದಿ, ವ್ಯಾಖ್ಯಾನವಾದಿ, ವಿಮರ್ಶಾತ್ಮಕ, ವ್ಯಾವಹಾರಿಕ) ಡಯಟ್‌ಗಳು ಕೇಳುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಜೋಡಿಸುವುದು.","ಡಯಟ್, ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಮತ್ತು ರಾಜ್ಯದ ಸಂಶೋಧನಾ ವ್ಯವಸ್ಥೆಯ ಹೊಣೆಗಾರಿಕೆಯನ್ನು ವಿವರಿಸುವುದು."],lessons:[{title:"ಶೈಕ್ಷಣಿಕ ಸಂಶೋಧನೆ ಎಂದರೇನು?",body:["ಶೈಕ್ಷಣಿಕ ಸಂಶೋಧನೆ ಎಂದರೆ ಬೋಧನೆ, ಕಲಿಕೆ ಮತ್ತು ಅವುಗಳ ಸುತ್ತಲಿನ ವ್ಯವಸ್ಥೆಗಳ ಬಗ್ಗೆ ಕ್ರಮಬದ್ಧ ಹಾಗೂ ಪಾರದರ್ಶಕ ಅನ್ವೇಷಣೆ. ಅದು ಒಂದು ಪ್ರಶ್ನೆಯಿಂದ ಆರಂಭವಾಗುತ್ತದೆ, ಯೋಜಿತ ರೀತಿಯಲ್ಲಿ ಪುರಾವೆ ಸಂಗ್ರಹಿಸುತ್ತದೆ, ಮುಕ್ತವಾಗಿ ವಿಶ್ಲೇಷಿಸುತ್ತದೆ ಮತ್ತು ಇತರರು ಪರಿಶೀಲಿಸಿ ಬಳಸಲು ಸಾಧ್ಯವಾಗುವಂತೆ ವರದಿ ಮಾಡುತ್ತದೆ.","ಸಂಶೋಧನೆಯನ್ನು ದೈನಂದಿನ ವರದಿಯಿಂದ ಬೇರ್ಪಡಿಸಲು ಮೂರು ಪರೀಕ್ಷೆಗಳು: (1) ಸ್ಪಷ್ಟ ಪ್ರಶ್ನೆ ಇದೆಯೇ? (2) ದತ್ತಾಂಶ ಸಂಗ್ರಹಕ್ಕೆ ಮೊದಲೇ ವಿಧಾನ ಯೋಜಿತವಾಗಿದೆಯೇ? (3) ಮತ್ತೊಬ್ಬರು ಹಂತಗಳನ್ನು ಅನುಸರಿಸಿ ತೀರ್ಮಾನವನ್ನು ಪರಿಶೀಲಿಸಬಹುದೇ?"]},{title:"ಪ್ರಕಾರಗಳು ಮತ್ತು ದೃಷ್ಟಿಕೋನಗಳು",body:["ಮೂಲ ಸಂಶೋಧನೆ ಸಿದ್ಧಾಂತವನ್ನು ಕಟ್ಟುತ್ತದೆ (ಉದಾ: ಎರಡನೇ ಲಿಪಿಯಲ್ಲಿ ಮಕ್ಕಳು ಓದು ಕಲಿಯುವ ಬಗೆ). ಅನ್ವಯಿಕ ಸಂಶೋಧನೆ ತಿಳಿದ ಸಮಸ್ಯೆಯನ್ನು ಪರಿಹರಿಸುತ್ತದೆ (6ನೇ ತರಗತಿಯಲ್ಲಿ ಗಣಿತ ಅಂಕಗಳು ಏಕೆ ಕುಸಿಯುತ್ತವೆ). ಮೌಲ್ಯಮಾಪನ ಸಂಶೋಧನೆ ಒಂದು ಕಾರ್ಯಕ್ರಮವನ್ನು ಅದರ ಗುರಿಗಳ ಆಧಾರದಲ್ಲಿ ಅಳೆಯುತ್ತದೆ. ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯನ್ನು ವೃತ್ತಿನಿರತರು ತಮ್ಮದೇ ಅಭ್ಯಾಸವನ್ನು ಚಕ್ರಗಳಲ್ಲಿ ಸುಧಾರಿಸಲು ಮಾಡುತ್ತಾರೆ.","ದೃಷ್ಟಿಕೋನಗಳು (paradigms) ಜ್ಞಾನದ ಬಗೆಗಿನ ನಂಬಿಕೆಗಳು. ಪ್ರತ್ಯಕ್ಷವಾದಿ ಅಧ್ಯಯನಗಳು ಅಳೆಯುತ್ತವೆ ಮತ್ತು ಪರೀಕ್ಷಿಸುತ್ತವೆ; ವ್ಯಾಖ್ಯಾನವಾದಿ ಅಧ್ಯಯನಗಳು ಜನರು ತಮ್ಮ ಅನುಭವಕ್ಕೆ ನೀಡುವ ಅರ್ಥಗಳನ್ನು ಹುಡುಕುತ್ತವೆ; ವಿಮರ್ಶಾತ್ಮಕ ಅಧ್ಯಯನಗಳು ಅಧಿಕಾರ ಮತ್ತು ಸಮಾನತೆಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತವೆ; ವ್ಯಾವಹಾರಿಕ ಅಧ್ಯಯನಗಳು ಪ್ರಶ್ನೆಗೆ ಉತ್ತಮವಾಗಿ ಉತ್ತರಿಸುವ ಯಾವುದೇ ವಿಧಾನವನ್ನು ಬಳಸುತ್ತವೆ. ಬಹುತೇಕ ಡಯಟ್ ಅಧ್ಯಯನಗಳು ವ್ಯಾವಹಾರಿಕವಾಗಿವೆ."]},{title:"ಸಂಶೋಧನಾ ಚಕ್ರ",body:["ಸಮಸ್ಯೆ ಗುರುತಿಸುವಿಕೆ → ಸಾಹಿತ್ಯ ಅವಲೋಕನ → ಪ್ರಶ್ನೆಗಳು ಅಥವಾ ಊಹೆಗಳ ರಚನೆ → ವಿನ್ಯಾಸ ಮತ್ತು ಮಾದರಿ ಆಯ್ಕೆ → ಸಾಧನಗಳ ರಚನೆ ಮತ್ತು ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆ → ನೈತಿಕ ಅನುಮತಿ → ದತ್ತಾಂಶ ಸಂಗ್ರಹ → ವಿಶ್ಲೇಷಣೆ → ವ್ಯಾಖ್ಯಾನ → ವರದಿ ಮತ್ತು ಹಂಚಿಕೆ → ಫಲಿತಾಂಶಗಳ ಬಳಕೆ.","ಒಂದು ಅಧ್ಯಯನ ಅದರ ಅತ್ಯಂತ ದುರ್ಬಲ ಹಂತದಷ್ಟೇ ಬಲಿಷ್ಠ. ಜಿಲ್ಲಾ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಸಾಮಾನ್ಯ ದೌರ್ಬಲ್ಯ ಅಸ್ಪಷ್ಟ ಪ್ರಶ್ನೆ; ಅದರಿಂದ ಎಲ್ಲವನ್ನೂ ಅಳೆಯುವ ಆದರೆ ಯಾವುದಕ್ಕೂ ಉತ್ತರಿಸದ ಸಾಧನ ಹುಟ್ಟುತ್ತದೆ."]}],karnataka:[{title:"ಕರ್ನಾಟಕದಲ್ಲಿ ಸಂಶೋಧನಾ ಹೊಣೆಗಾರಿಕೆ",text:["ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಕರ್ನಾಟಕದ ಶಾಲಾ ಶಿಕ್ಷಣದ ರಾಜ್ಯ ಶೈಕ್ಷಣಿಕ ಪ್ರಾಧಿಕಾರ. ಅದು ಸಂಶೋಧನಾ ಕಾರ್ಯಸೂಚಿಯನ್ನು ರೂಪಿಸುತ್ತದೆ, ಡಯಟ್ ಉಪನ್ಯಾಸಕರಿಗೆ ತರಬೇತಿ ನೀಡುತ್ತದೆ ಮತ್ತು ಸಂಶೋಧನಾ ಸಂಗ್ರಹಗಳನ್ನು ಪ್ರಕಟಿಸುತ್ತದೆ. ಪ್ರತಿ ಡಯಟ್ ಶಿಕ್ಷಕ ಶಿಕ್ಷಣ ಮತ್ತು ತರಗತಿ ಅಭ್ಯಾಸಕ್ಕೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುವ ಜಿಲ್ಲಾ ಮಟ್ಟದ ಅಧ್ಯಯನಗಳನ್ನು ನಡೆಸಬೇಕು; ಸಿಆರ್‌ಪಿ ಮತ್ತು ಬಿಆರ್‌ಪಿಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಕ್ಷೇತ್ರ ಪಾಲುದಾರರು.","ಕೇಳಿಕೊಳ್ಳಿ: ಕಳೆದ ಮೂರು ವರ್ಷಗಳಲ್ಲಿ ನಿಮ್ಮ ಡಯಟ್ ಪೂರ್ಣಗೊಳಿಸಿದ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಎಷ್ಟು ತರಬೇತಿ ಘಟಕ, ಜಿಲ್ಲಾ ಯೋಜನೆ ಅಥವಾ ತರಗತಿ ಅಭ್ಯಾಸವನ್ನು ಬದಲಾಯಿಸಿದವು? ಸಂಶೋಧನೆಯ ಬಳಕೆಗೆ ಇದೇ ನಿಜವಾದ ಪರೀಕ್ಷೆ."]},{title:"ನಿಜವಾದ ಜಿಲ್ಲಾ ಪ್ರಶ್ನೆಗಳ ವರ್ಗೀಕರಣ",text:['"4ನೇ ತರಗತಿಯಲ್ಲಿ ಸೇತುಬಂಧ (ವರ್ಷಾರಂಭದ ಸೇತುಬಂಧ ಕಾರ್ಯಕ್ರಮ) ಕಲಿಕಾ ಅಂತರವನ್ನು ತುಂಬುತ್ತದೆಯೇ?" — ಮೌಲ್ಯಮಾಪನ ಸಂಶೋಧನೆ.','"ವಿಜಯಪುರದ ಲಂಬಾಣಿ ತಾಂಡಾಗಳ ಶಿಕ್ಷಕರು ಕನ್ನಡ ಪಾಠಗಳಲ್ಲಿ ಮನೆಮಾತನ್ನು ಹೇಗೆ ಬಳಸುತ್ತಾರೆ?" — ವ್ಯಾಖ್ಯಾನವಾದಿ, ಗುಣಾತ್ಮಕ.','"ಸೂಕ್ಷ್ಮ ಬೋಧನೆಯ (micro-teaching) ಮೂಲಕ ನನ್ನ ಡಿ.ಇಎಲ್.ಇಡಿ. ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳ ಪ್ರಶ್ನಿಸುವ ಕೌಶಲವನ್ನು ಹೆಚ್ಚಿಸಬಹುದೇ?" — ಡಯಟ್ ಉಪನ್ಯಾಸಕರ ಕ್ರಿಯಾ ಸಂಶೋಧನೆ.']}],activity:{title:"ಅಧ್ಯಯನಗಳನ್ನು ವರ್ಗೀಕರಿಸಿ",prompt:"ನಿಮ್ಮ ಡಯಟ್‌ನಲ್ಲಿ ನಡೆದ ಮೂರು ಅಧ್ಯಯನಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡಿ. ಪ್ರತಿಯೊಂದರ ಪ್ರಕಾರ (ಮೂಲ / ಅನ್ವಯಿಕ / ಮೌಲ್ಯಮಾಪನ / ಕ್ರಿಯಾ), ದೃಷ್ಟಿಕೋನ ಮತ್ತು ಅದು ಪ್ರಭಾವಿಸಿದ (ಅಥವಾ ಪ್ರಭಾವಿಸಬಹುದಾಗಿದ್ದ) ಒಂದು ನಿರ್ಧಾರವನ್ನು ಬರೆಯಿರಿ."},quiz:[{q:"ಕಲಿಕಾ ಚೇತರಿಕೆ ಸಾಮಗ್ರಿಗಳು ತಮ್ಮ ಘೋಷಿತ ಗುರಿಗಳನ್ನು ತಲುಪಿದವೇ ಎಂದು ಡಯಟ್ ಅಧ್ಯಯನ ಮಾಡುತ್ತದೆ. ಇದನ್ನು ಹೀಗೆ ಕರೆಯುವುದು ಸೂಕ್ತ…",options:["ಮೂಲ ಸಂಶೋಧನೆ","ಮೌಲ್ಯಮಾಪನ ಸಂಶೋಧನೆ","ಐತಿಹಾಸಿಕ ಸಂಶೋಧನೆ","ಕ್ರಿಯಾ ಸಂಶೋಧನೆ"],why:"ಇದು ಕಾರ್ಯಕ್ರಮವನ್ನು ಅದರದೇ ಉದ್ದೇಶಗಳ ಆಧಾರದಲ್ಲಿ ಅಳೆಯುತ್ತದೆ."},{q:"ಸಂಶೋಧನೆಯನ್ನು ಮೇಲ್ವಿಚಾರಣಾ ವರದಿಯಿಂದ ಹೆಚ್ಚು ಬೇರ್ಪಡಿಸುವ ಲಕ್ಷಣ ಯಾವುದು?",options:["ಕೋಷ್ಟಕಗಳ ಬಳಕೆ","ನಿರ್ದಿಷ್ಟ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸಲು ಯೋಜಿತ ವಿಧಾನ","ವರದಿಯ ಉದ್ದ","ಅಧಿಕಾರಿಯ ಸಹಿ"],why:"ಸಂಶೋಧನೆ ಪ್ರಶ್ನೆಯಿಂದ ಆರಂಭವಾಗುತ್ತದೆ; ವಿಧಾನವನ್ನು ದತ್ತಾಂಶ ಸಂಗ್ರಹಕ್ಕೆ ಮೊದಲೇ ನಿಗದಿಪಡಿಸಲಾಗುತ್ತದೆ."},{q:'"ಉತ್ತಮ ಶಾಲೆ" ಎಂಬುದಕ್ಕೆ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ನೀಡುವ ಅರ್ಥಗಳ ಅಧ್ಯಯನ ಮುಖ್ಯವಾಗಿ ಯಾವ ದೃಷ್ಟಿಕೋನಕ್ಕೆ ಸೇರುತ್ತದೆ?',options:["ಪ್ರತ್ಯಕ್ಷವಾದಿ","ವ್ಯಾಖ್ಯಾನವಾದಿ","ಪ್ರಾಯೋಗಿಕ","ಅರ್ಥಮಾಪನ"],why:"ಇದು ಅಳತೆಯಲ್ಲ, ಭಾಗವಹಿಸುವವರ ಅರ್ಥಗಳನ್ನು ಹುಡುಕುತ್ತದೆ."},{q:"ವ್ಯಾವಹಾರಿಕ ದೃಷ್ಟಿಕೋನ ಎಂದರೆ…",options:["ಸಮೀಕ್ಷೆಗಳಿಗೆ ಮಾತ್ರ ಅವಕಾಶ","ಪ್ರಶ್ನೆಯೇ ವಿಧಾನವನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ","ಗುಣಾತ್ಮಕ ದತ್ತಾಂಶ ನಿರ್ಲಕ್ಷಿತ","ಸಿದ್ಧಾಂತ ಬೇಕಿಲ್ಲ"],why:"ಪ್ರಶ್ನೆಗೆ ಸೂಕ್ತವಾದ ವಿಧಾನವನ್ನೇ ಆಯ್ಕೆ ಮಾಡಲಾಗುತ್ತದೆ."}]},m2:{objectives:["ಮಕ್ಕಳು ಮತ್ತು ಶಿಕ್ಷಕರೊಂದಿಗಿನ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಗೌರವ, ಹಿತಸಾಧನೆ ಮತ್ತು ನ್ಯಾಯದ ತತ್ವಗಳನ್ನು ಅನ್ವಯಿಸುವುದು.","ಪೋಷಕರಿಂದ ತಿಳುವಳಿಕೆಯುಳ್ಳ ಒಪ್ಪಿಗೆ ಮತ್ತು ಮಕ್ಕಳಿಂದ ಸಮ್ಮತಿ ಪಡೆಯುವುದು.","ಗುರುತು ಮತ್ತು ದತ್ತಾಂಶವನ್ನು, SATS ಗುರುತುಸಂಖ್ಯೆಗಳನ್ನೂ ಸೇರಿ, ರಕ್ಷಿಸುವುದು.","ಕೃತಿಚೌರ್ಯ, ಕಟ್ಟುಕಥೆ ಮತ್ತು ತಿರುಚುವಿಕೆಯನ್ನು ಗುರುತಿಸುವುದು."],lessons:[{title:"ಮೂಲ ತತ್ವಗಳು",body:['ವ್ಯಕ್ತಿಗಳಿಗೆ ಗೌರವ: ಭಾಗವಹಿಸಬೇಕೇ ಬೇಡವೇ ಎಂಬುದನ್ನು ಜನರು ಸ್ವತಂತ್ರವಾಗಿ ನಿರ್ಧರಿಸುತ್ತಾರೆ. ಹಿತಸಾಧನೆ: ಪ್ರಯೋಜನ ಹೆಚ್ಚಿಸಿ, ಹಾನಿ ಕಡಿಮೆ ಮಾಡಿ. ನ್ಯಾಯ: ಸಂಶೋಧನೆಯ ಹೊರೆ ಮತ್ತು ಲಾಭ ನ್ಯಾಯಯುತವಾಗಿ ಹಂಚಿಕೆಯಾಗಬೇಕು — ಪ್ರತಿವರ್ಷ ಅದೇ ಕೆಲವು "ಅನುಕೂಲಕರ" ಶಾಲೆಗಳನ್ನು ಅಧ್ಯಯನ ಮಾಡಬಾರದು.',"ಮಕ್ಕಳು ತಾವಾಗಿಯೇ ಒಪ್ಪಿಗೆ ನೀಡಲಾರರು. ಪೋಷಕರು ಅಥವಾ ಪಾಲಕರಿಂದ ಲಿಖಿತ ಒಪ್ಪಿಗೆ ಪಡೆಯಿರಿ; ಮಗುವಿನಿಂದ ಅದರ ಮನೆಮಾತಿನಲ್ಲಿ ಸರಳ ಮೌಖಿಕ ಅಥವಾ ಚಿತ್ರ ರೂಪದ ಸಮ್ಮತಿ ಪಡೆಯಿರಿ."]},{title:"ನೈತಿಕ ಪರಿಶೀಲನೆ",body:["ನೈತಿಕ ಪರಿಶೀಲನಾ ಪ್ರಕ್ರಿಯೆ ಕ್ಷೇತ್ರಕಾರ್ಯಕ್ಕೆ ಮುನ್ನ ಯೋಜನೆಯನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ: ಉದ್ದೇಶ, ಅಪಾಯಗಳು, ಒಪ್ಪಿಗೆ ಪತ್ರಗಳು, ದತ್ತಾಂಶ ಸಂಗ್ರಹಣೆ ಮತ್ತು ಫಲಿತಾಂಶಗಳು ಸಮುದಾಯಕ್ಕೆ ಹೇಗೆ ಮರಳುತ್ತವೆ ಎಂಬುದು. ಡಯಟ್ ಒಬ್ಬ ಹಿರಿಯ ಉಪನ್ಯಾಸಕರು, ಒಬ್ಬ ಹೊರಗಿನ ವಿದ್ವಾಂಸರು ಮತ್ತು ಒಬ್ಬ ಸಮುದಾಯ ಸದಸ್ಯರಿರುವ ಸಣ್ಣ ನೈತಿಕ ಸಮಿತಿಯನ್ನು ರಚಿಸಬಹುದು.","ಶಾಲೆಗಳಿಗೆ ಭೇಟಿ ನೀಡಲು ಕ್ಷೇತ್ರ ಶಿಕ್ಷಣಾಧಿಕಾರಿಗಳ ಅನುಮತಿ ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿ ಮಾತ್ರ. ಅದು ಭಾಗವಹಿಸುವವರ ತಿಳುವಳಿಕೆಯುಳ್ಳ ಒಪ್ಪಿಗೆಗೆ ಬದಲಿಯಲ್ಲ."]},{title:"ಪ್ರಾಮಾಣಿಕತೆ",body:["ಕಟ್ಟುಕಥೆ (ದತ್ತಾಂಶ ಸೃಷ್ಟಿಸುವುದು), ತಿರುಚುವಿಕೆ (ದತ್ತಾಂಶ ಬದಲಿಸುವುದು) ಮತ್ತು ಕೃತಿಚೌರ್ಯ (ಇತರರ ಪದಗಳು ಅಥವಾ ವಿಚಾರಗಳನ್ನು ಉಲ್ಲೇಖವಿಲ್ಲದೆ ಬಳಸುವುದು) — ಇವು ಮೂರು ಗಂಭೀರ ಉಲ್ಲಂಘನೆಗಳು. ಮತ್ತೊಂದು ಅಧ್ಯಯನದ ಪ್ರಶ್ನಾವಳಿಯನ್ನು ಉಲ್ಲೇಖದೊಂದಿಗೆ ಮತ್ತು ಅಗತ್ಯವಿದ್ದಲ್ಲಿ ಅನುಮತಿಯೊಂದಿಗೆ ಮಾತ್ರ ಬಳಸಬಹುದು.","ಕಚ್ಚಾ ದತ್ತಾಂಶ, ಕ್ಷೇತ್ರ ಟಿಪ್ಪಣಿಗಳು ಮತ್ತು ವಿಶ್ಲೇಷಣಾ ಕಡತಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳಿ; ವರದಿಯ ಯಾವುದೇ ಅಂಕಿಯನ್ನು ಅದರ ಮೂಲದವರೆಗೆ ಮತ್ತೊಬ್ಬರು ಪತ್ತೆಹಚ್ಚುವಂತಿರಬೇಕು."]}],karnataka:[{title:"SATS ದತ್ತಾಂಶದ ಜವಾಬ್ದಾರಿಯುತ ಬಳಕೆ",text:["ವಿದ್ಯಾರ್ಥಿ ಸಾಧನಾ ಟ್ರ್ಯಾಕಿಂಗ್ ವ್ಯವಸ್ಥೆ (SATS) ಕರ್ನಾಟಕದ ಶಾಲೆಗಳ ಪ್ರತಿ ಮಗುವಿನ ಗುರುತಿಸಬಹುದಾದ ದಾಖಲೆಗಳನ್ನು ಹೊಂದಿದೆ. ಡಯಟ್ SATS ಅಥವಾ LBA ಪೋರ್ಟಲ್ ದತ್ತಾಂಶವನ್ನು ಇಲಾಖೆಯ ಅನುಮತಿಯೊಂದಿಗೆ ಮಾತ್ರ ಸಂಶೋಧನೆಗೆ ಬಳಸಬೇಕು ಮತ್ತು ವಿಶ್ಲೇಷಣೆಗೆ ಮುನ್ನ SATS ಸಂಖ್ಯೆಗಳ ಬದಲಿಗೆ ಅಧ್ಯಯನ ಸಂಕೇತಗಳನ್ನು ಬಳಸಬೇಕು. ಮಗುವಿನ ಹೆಸರು, SATS ಸಂಖ್ಯೆ ಅಥವಾ ಮಕ್ಕಳನ್ನು ಗುರುತಿಸಬಹುದಾದಷ್ಟು ಕಡಿಮೆ ದಾಖಲಾತಿಯ ಶಾಲೆಯ ಹೆಸರನ್ನು ಎಂದಿಗೂ ಪ್ರಕಟಿಸಬೇಡಿ."]},{title:"ಪ್ರಕರಣ: ನಲಿ-ಕಲಿ ತರಗತಿಯಲ್ಲಿ ಛಾಯಾಚಿತ್ರಗಳು",text:["ಒಬ್ಬ ಸಂಶೋಧಕರು ವರದಿಗಾಗಿ ನಲಿ-ಕಲಿ (1–3ನೇ ತರಗತಿಯ ಬಹುವರ್ಗ, ಚಟುವಟಿಕೆ ಆಧಾರಿತ) ತರಗತಿಯ ಮಕ್ಕಳ ಫೋಟೋ ತೆಗೆಯುತ್ತಾರೆ. ಪೋಷಕರನ್ನು ಕೇಳಿಲ್ಲ. ಇದು ಸರಿಯೇ? ಇಲ್ಲ: ಚಿತ್ರಗಳು ಮಕ್ಕಳನ್ನು ಗುರುತಿಸುತ್ತವೆ. ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಪಡೆಯಿರಿ, ಸಾಧ್ಯವಾದಲ್ಲಿ ಮುಖಗಳನ್ನು ತಪ್ಪಿಸಿ, ಸಾಮಾಜಿಕ ಜಾಲತಾಣಗಳಲ್ಲಿ ಹಂಚಬೇಡಿ."]}],activity:{title:"ನೈತಿಕ ನಿರ್ಧಾರ ವೃಕ್ಷ",prompt:"ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನವನ್ನು ನೈತಿಕ ನಿರ್ಧಾರ ವೃಕ್ಷದ ಮೂಲಕ ಹಾಯಿಸಿ. ಬೇಕಾದ ಸುರಕ್ಷತಾ ಕ್ರಮಗಳನ್ನು ದಾಖಲಿಸಿ ಮತ್ತು ಪೋಷಕರಿಗಾಗಿ ಕನ್ನಡದಲ್ಲಿ ಎರಡು ಸಾಲಿನ ಒಪ್ಪಿಗೆ ಹೇಳಿಕೆ ರಚಿಸಿ."},quiz:[{q:"ಶಾಲಾ ಭೇಟಿಗೆ ಬಿಇಒ ಅನುಮತಿ ನೀಡಿದ್ದಾರೆ. ಮಕ್ಕಳಿಗೆ ಪರೀಕ್ಷೆ ನಡೆಸಲು ಪೋಷಕರ ಒಪ್ಪಿಗೆ ಇನ್ನೂ ಬೇಕೇ?",options:["ಬೇಡ, ಬಿಇಒ ಅನುಮತಿ ಸಾಕು","ಬೇಕು, ಒಪ್ಪಿಗೆ ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿಗಿಂತ ಪ್ರತ್ಯೇಕ","ಖಾಸಗಿ ಶಾಲೆಗಳಿಗೆ ಮಾತ್ರ","ನಗರ ಪ್ರದೇಶಗಳಲ್ಲಿ ಮಾತ್ರ"],why:"ಆಡಳಿತಾತ್ಮಕ ಅನುಮತಿ ವೈಯಕ್ತಿಕ ಒಪ್ಪಿಗೆಗೆ ಬದಲಿಯಲ್ಲ."},{q:"SATS ದಾಖಲೆಗಳನ್ನು ವಿಶ್ಲೇಷಿಸುವ ಮೊದಲು ನೀವು…",options:["ಪಾರದರ್ಶಕತೆಗಾಗಿ ಸಂಖ್ಯೆಗಳನ್ನು ಪ್ರಕಟಿಸಬೇಕು","SATS ಸಂಖ್ಯೆಗಳ ಬದಲಿಗೆ ಅಧ್ಯಯನ ಸಂಕೇತಗಳನ್ನು ಬಳಸಬೇಕು","ತಂಡಕ್ಕಾಗಿ ಕಡತವನ್ನು ವಾಟ್ಸಾಪ್‌ನಲ್ಲಿ ಹಂಚಬೇಕು","ಒಂದೇ ದಿನದಲ್ಲಿ ಎಲ್ಲ ದಾಖಲೆ ಅಳಿಸಬೇಕು"],why:"ಹುಸಿನಾಮೀಕರಣ ಮಕ್ಕಳನ್ನು ರಕ್ಷಿಸುತ್ತದೆ."},{q:"ಕಾರ್ಯಕ್ರಮ ಪರಿಣಾಮಕಾರಿ ಎಂದು ತೋರಿಸಲು ಕೆಲವು ಉತ್ತರ-ಪರೀಕ್ಷಾ ಅಂಕಗಳನ್ನು ಬದಲಿಸುವುದು…",options:["ಕಟ್ಟುಕಥೆ","ತಿರುಚುವಿಕೆ","ಕೃತಿಚೌರ್ಯ","ತ್ರಿಕೋನೀಕರಣ"],why:"ನಿಜವಾದ ದತ್ತಾಂಶವನ್ನು ಬದಲಿಸುವುದು ತಿರುಚುವಿಕೆ."},{q:"ಸಮ್ಮತಿ (assent) ಎಂದರೆ…",options:["ವಯಸ್ಸಿಗೆ ತಕ್ಕ ರೂಪದಲ್ಲಿ ಮಗುವಿನ ಸ್ವಂತ ಒಪ್ಪಿಗೆ","ಶಿಕ್ಷಕರ ಸಹಿ","ನೈತಿಕ ಸಮಿತಿಯ ಅನುಮೋದನೆ","ಪೋಷಕರ ಒಪ್ಪಿಗೆ"],why:"ಪೋಷಕರ ಒಪ್ಪಿಗೆಯ ಜೊತೆಗೆ ಮಗುವಿನ ಸ್ವಂತ ಒಪ್ಪಿಗೆಯೇ ಸಮ್ಮತಿ."}]},m3:{objectives:["ಅನುಭವಿಸಿದ ತೊಂದರೆಯಿಂದ ಸಂಶೋಧಿಸಬಹುದಾದ ಸಮಸ್ಯೆಯತ್ತ ಸಾಗುವುದು.","ಲಭ್ಯ ಪುರಾವೆಗಳನ್ನು (NAS, PARAKH, SATS, LBA, ಹಿಂದಿನ ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಅಧ್ಯಯನಗಳು) ಬಳಸಿ ಸಮಸ್ಯೆಯನ್ನು ಸಮರ್ಥಿಸುವುದು.","ಕೇಂದ್ರೀಕೃತ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಪರೀಕ್ಷಿಸಬಹುದಾದ ಊಹೆಗಳನ್ನು ಬರೆಯುವುದು.","ಚರಾಂಶಗಳನ್ನು ಕಾರ್ಯಾತ್ಮಕವಾಗಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು."],lessons:[{title:"ಕಾಳಜಿಯಿಂದ ಸಮಸ್ಯೆಯವರೆಗೆ",body:['ಅನುಭವಿಸಿದ ತೊಂದರೆ ("ಮಕ್ಕಳು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ದುರ್ಬಲ") ಇನ್ನೂ ಸಮಸ್ಯೆಯಲ್ಲ. ಅದನ್ನು ಸಂಕುಚಿಸಿ: ಯಾರು (ದ್ವಿಭಾಷಾ KPS ವಿಭಾಗಗಳ 5ನೇ ತರಗತಿ ಮಕ್ಕಳು), ಏನು (ಮೌಖಿಕ ಗ್ರಹಿಕೆ), ಎಲ್ಲಿ (ಕಲಬುರಗಿ ಜಿಲ್ಲೆ), ಯಾರೊಂದಿಗೆ ಹೋಲಿಕೆ (ಕನ್ನಡ ಮಾಧ್ಯಮ ವಿಭಾಗಗಳು), ಏಕೆ ಮುಖ್ಯ (ಮೊದಲ ತಲೆಮಾರಿನ ಕಲಿಕಾರ್ಥಿಗಳಿಗೆ ಸಮಾನತೆ).',"ಉತ್ತಮ ಸಮಸ್ಯೆ ಮಹತ್ವದ್ದು, ಲಭ್ಯ ಸಮಯ ಮತ್ತು ಸಂಪನ್ಮೂಲಗಳಲ್ಲಿ ಸಂಶೋಧಿಸಬಹುದಾದದ್ದು, ನೈತಿಕವಾದದ್ದು ಮತ್ತು ಹೊಸದನ್ನು ಸೇರಿಸುವಷ್ಟು ನವೀನವಾದದ್ದು."]},{title:"ಸಾಹಿತ್ಯ ಅವಲೋಕನ",body:["ಹಿಂದಿನ ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಮತ್ತು ಡಯಟ್ ಸಂಗ್ರಹಗಳು, ಎನ್‌ಸಿಇಆರ್‌ಟಿ ಅಧ್ಯಯನಗಳು, ಶೋಧಗಂಗಾ ಪ್ರಬಂಧಗಳು, ERIC ಮತ್ತು ಗೂಗಲ್ ಸ್ಕಾಲರ್‌ನಲ್ಲಿ ಹುಡುಕಿ. ಏನು ತಿಳಿದಿದೆ, ಅದನ್ನು ಹೇಗೆ ಅಳೆಯಲಾಯಿತು ಮತ್ತು ಇನ್ನೂ ಏನು ಉಳಿದಿದೆ (ಅಂತರ) ಎಂಬುದಕ್ಕಾಗಿ ಓದಿ. ಮೊದಲ ದಿನದಿಂದಲೇ ಉಲ್ಲೇಖ ಪಟ್ಟಿ ಇಟ್ಟುಕೊಳ್ಳಿ."]},{title:"ಪ್ರಶ್ನೆಗಳು, ಊಹೆಗಳು, ಚರಾಂಶಗಳು",body:['ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆಗಳು ನಿರ್ದಿಷ್ಟ ಮತ್ತು ಉತ್ತರಿಸಬಹುದಾದವು: "ಮೈಸೂರು ಜಿಲ್ಲೆಯ ನಲಿ-ಕಲಿ ಮತ್ತು ನಲಿ-ಕಲಿಯೇತರ ತರಗತಿಗಳ 3ನೇ ತರಗತಿ ಮಕ್ಕಳ ಮೌಖಿಕ ಓದಿನ ನಿರರ್ಗಳತೆಯಲ್ಲಿ ವ್ಯತ್ಯಾಸವೇನು?"','ಊಹೆ ದತ್ತಾಂಶ ತಳ್ಳಿಹಾಕಬಹುದಾದ ಉತ್ತರವನ್ನು ಮುನ್ನುಡಿಯುತ್ತದೆ: "ಕಾರ್ಯನಿರತ ಗ್ರಂಥಾಲಯ ಮೂಲೆ ಇರುವ ತರಗತಿಗಳ ಮಕ್ಕಳು ಇಲ್ಲದವರಿಗಿಂತ ನಿಮಿಷಕ್ಕೆ ಹೆಚ್ಚು ಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಓದುತ್ತಾರೆ." ಕಾರ್ಯಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನಗಳು ಪ್ರತಿ ಚರಾಂಶವನ್ನು ನಿಖರವಾಗಿ ಹೇಗೆ ಅಳೆಯಲಾಗುತ್ತದೆ ಎಂದು ತಿಳಿಸುತ್ತವೆ (ಉದಾ: ಶ್ರೇಣೀಕೃತ ಕನ್ನಡ ಗದ್ಯಭಾಗದಲ್ಲಿ ನಿಮಿಷಕ್ಕೆ ಸರಿಯಾಗಿ ಓದಿದ ಪದಗಳು).']}],karnataka:[{title:"ರಾಜ್ಯದ ಪುರಾವೆಗಳಲ್ಲಿ ಅಂತರ ಹುಡುಕುವುದು",text:["3ನೇ ತರಗತಿಯ ವೇಳೆಗೆ ಗಳಿಸಿದ ಮೂಲಭೂತ ಸಾಕ್ಷರತೆ ಮತ್ತು ಸಂಖ್ಯಾಜ್ಞಾನದ ಲಾಭಗಳು 6 ಮತ್ತು 9ನೇ ತರಗತಿಗಳ ವೇಳೆಗೆ, ವಿಶೇಷವಾಗಿ ಗಣಿತ ಮತ್ತು ವಿಜ್ಞಾನದಲ್ಲಿ, ಮಸುಕಾಗುತ್ತವೆ ಎಂದು ರಾಜ್ಯದ ಸಂಶೋಧನಾ ಹಿನ್ನೆಲೆ ಟಿಪ್ಪಣಿಗಳು (ಈ ಭಂಡಾರದಲ್ಲಿ) ವರದಿ ಮಾಡುತ್ತವೆ. LBA ಪೋರ್ಟಲ್ ಅನ್ನು ಮೌಲ್ಯಮಾಪನ ಮಾಡಿದ ಯಾವುದೇ ಪೂರ್ಣ ಅಧ್ಯಯನ ಇನ್ನೂ ಇಲ್ಲ ಎಂದೂ ದಾಖಲಿಸುತ್ತವೆ. ಇವೆರಡೂ ಡಯಟ್ ಸಂಶೋಧನೆಗೆ ಸಿದ್ಧ ಅಂತರಗಳು.",'ಸಂಭಾವ್ಯ ಪ್ರಶ್ನೆ: "4ನೇ ತರಗತಿಯಲ್ಲಿ ಸೇತುಬಂಧ ಬೆಂಬಲ ಪಡೆದ ಮಕ್ಕಳು 5ನೇ ತರಗತಿಯ ಕೊನೆಯವರೆಗೆ ತಮ್ಮ ಲಾಭಗಳನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತಾರೆಯೇ?"']},{title:"ವಿಶಾಲ ಕಾಳಜಿಯನ್ನು ಸಂಕುಚಿಸುವುದು",text:['ವಿಶಾಲ: "ಗ್ರಂಥಾಲಯ ಬಳಕೆ ಕಡಿಮೆ." ಕೇಂದ್ರೀಕೃತ: "ಚಿಕ್ಕಮಗಳೂರು ಜಿಲ್ಲೆಯ ಸರ್ಕಾರಿ ಹಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆಗಳ 6–8ನೇ ತರಗತಿ ಮಕ್ಕಳು ಎಷ್ಟು ಬಾರಿ ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆಯುತ್ತಾರೆ, ಮತ್ತು ಯಾವ ಶಾಲಾ ಅಂಶಗಳು ಇದಕ್ಕೆ ಸಂಬಂಧಿಸಿವೆ?"']}],activity:{title:"ನಿಮ್ಮ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ ರಚಿಸಿ",prompt:"ಪ್ರಶ್ನೆ ರಚನಾ ಸಾಧನ ಬಳಸಿ ನಿಮ್ಮ ಜಿಲ್ಲೆಯ ಒಂದು ಕಾಳಜಿಯನ್ನು ಕೇಂದ್ರೀಕೃತ ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ ಮತ್ತು ಊಹೆಯಾಗಿ ಪರಿವರ್ತಿಸಿ."},quiz:[{q:"ಯಾವುದು ಹೆಚ್ಚು ಸಂಶೋಧಿಸಬಹುದಾದ ಪ್ರಶ್ನೆ?",options:["ಕರ್ನಾಟಕದಲ್ಲಿ ಶಿಕ್ಷಣ ಸುಧಾರಿಸುತ್ತಿದೆಯೇ?","ರಾಯಚೂರು ಜಿಲ್ಲೆಯ ಎರಡು ಬ್ಲಾಕ್‌ಗಳಲ್ಲಿ 7ನೇ ತರಗತಿ ಗಣಿತ ಅಂಕಗಳ ಮೇಲೆ LBA ಪರಿಣಾಮವೇನು?","ಶಿಕ್ಷಕರು ಏಕೆ ಪ್ರೇರಿತರಾಗಿಲ್ಲ?","ಇಂಗ್ಲಿಷ್ ಕಲಿಸಬೇಕೇ?"],why:"ಇದು ಜನಸಂಖ್ಯೆ, ಚರಾಂಶ, ಸ್ಥಳ ಮತ್ತು ಹೋಲಿಕೆಯನ್ನು ಹೆಸರಿಸುತ್ತದೆ."},{q:'"ವಾರಕ್ಕೊಮ್ಮೆ ಗ್ರಂಥಾಲಯ ಅವಧಿ ಇರುವಲ್ಲಿ ಓದಿನ ನಿರರ್ಗಳತೆ ಹೆಚ್ಚಿರುತ್ತದೆ" — ಇದು ಒಂದು…',options:["ಸಂಶೋಧನಾ ಪ್ರಶ್ನೆ","ಊಹೆ","ಉದ್ದೇಶ","ಮಿತಿ"],why:"ಇದು ಪರೀಕ್ಷಿಸಬಹುದಾದ ಸಂಬಂಧವನ್ನು ಮುನ್ನುಡಿಯುತ್ತದೆ."},{q:'"ಓದಿನ ನಿರರ್ಗಳತೆ"ಯ ಕಾರ್ಯಾತ್ಮಕ ವ್ಯಾಖ್ಯಾನ…',options:["ಓದಿನ ಮೇಲಿನ ಪ್ರೀತಿ","ಶ್ರೇಣೀಕೃತ ಗದ್ಯಭಾಗದಲ್ಲಿ ನಿಮಿಷಕ್ಕೆ ಸರಿಯಾಗಿ ಓದಿದ ಪದಗಳು","ಶಿಕ್ಷಕರ ಅನಿಸಿಕೆ","ಗ್ರಂಥಾಲಯದ ಪುಸ್ತಕಗಳ ಸಂಖ್ಯೆ"],why:"ಚರಾಂಶವನ್ನು ನಿಖರವಾಗಿ ಹೇಗೆ ಅಳೆಯಲಾಗುತ್ತದೆ ಎಂದು ತಿಳಿಸುತ್ತದೆ."},{q:'ಸಾಹಿತ್ಯ ಅವಲೋಕನದಲ್ಲಿ "ಅಂತರ" ಎಂದರೆ…',options:["ಕಾಣೆಯಾದ ಪುಟಗಳು","ನಿಮ್ಮ ಸಂದರ್ಭದಲ್ಲಿ ಇನ್ನೂ ತಿಳಿಯದ ಅಥವಾ ಅಧ್ಯಯನವಾಗದ ವಿಷಯ","ಸಮೀಕ್ಷೆಗಳ ನಡುವಿನ ಸಮಯ","ಬಾಲಕ-ಬಾಲಕಿಯರ ವ್ಯತ್ಯಾಸ"],why:"ಅಂತರವೇ ಹೊಸ ಅಧ್ಯಯನವನ್ನು ಸಮರ್ಥಿಸುತ್ತದೆ."}]},m4:{objectives:["ಸಮೀಕ್ಷೆ, ಸಹಸಂಬಂಧ, ಕಾರಣ-ತುಲನಾತ್ಮಕ ಮತ್ತು ಪ್ರಾಯೋಗಿಕ ವಿನ್ಯಾಸಗಳಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡುವುದು.","ಮಾದರಿಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಅದರ ಗಾತ್ರವನ್ನು ಲೆಕ್ಕಹಾಕುವುದು.","ವಿಶ್ವಸನೀಯ ಮತ್ತು ಸಿಂಧುವಾದ ಪರೀಕ್ಷೆಗಳು ಹಾಗೂ ಪ್ರಶ್ನಾವಳಿಗಳನ್ನು ರಚಿಸುವುದು.","ಪ್ರಶ್ನೆಗೆ ಸರಿಯಾದ ಸಾಂಖ್ಯಿಕ ಪರೀಕ್ಷೆಯನ್ನು ಆರಿಸುವುದು."],lessons:[{title:"ವಿನ್ಯಾಸಗಳು",body:["ಸಮೀಕ್ಷೆ: ಜನಸಂಖ್ಯೆಯನ್ನು ವರ್ಣಿಸುತ್ತದೆ (ಉದಾ: ಪ್ರೌಢಶಾಲೆಗಳಲ್ಲಿ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯಗಳ ಲಭ್ಯತೆ). ಸಹಸಂಬಂಧ: ಸಂಬಂಧವನ್ನು ಪರಿಶೀಲಿಸುತ್ತದೆ (ಶಿಕ್ಷಕರ ಹಾಜರಾತಿ ಮತ್ತು ವಿದ್ಯಾರ್ಥಿ ಅಂಕಗಳು). ಕಾರಣ-ತುಲನಾತ್ಮಕ: ಈಗಿರುವ ಗುಂಪುಗಳನ್ನು ಹೋಲಿಸುತ್ತದೆ (KPS ಮತ್ತು KPS ಅಲ್ಲದ ಶಾಲೆಗಳು). ಪ್ರಾಯೋಗಿಕ ಮತ್ತು ಅರೆ-ಪ್ರಾಯೋಗಿಕ: ಸಂಶೋಧಕರು ಮಧ್ಯಪ್ರವೇಶವನ್ನು ಪರಿಚಯಿಸಿ, ನಿಯಂತ್ರಣ ಅಥವಾ ಹೋಲಿಕೆ ಗುಂಪಿನೊಂದಿಗೆ, ಸಾಧ್ಯವಾದರೆ ಪೂರ್ವ ಮತ್ತು ಉತ್ತರ ಪರೀಕ್ಷೆಗಳೊಂದಿಗೆ ಹೋಲಿಸುತ್ತಾರೆ.","ಸಹಸಂಬಂಧ ಕಾರಣವಲ್ಲ. ಗ್ರಂಥಾಲಯವಿರುವ ಶಾಲೆಗಳ ಸಮುದಾಯಗಳೂ ಹೆಚ್ಚು ಸಂಪನ್ಮೂಲ ಹೊಂದಿರಬಹುದು."]},{title:"ಮಾದರಿ ಆಯ್ಕೆ",body:["ಸಂಭವನೀಯತಾ ಮಾದರಿಗಳು (ಸರಳ ಯಾದೃಚ್ಛಿಕ, ಸ್ತರೀಕೃತ, ಗುಚ್ಛ, ಬಹುಹಂತ) ಸಾಮಾನ್ಯೀಕರಣಕ್ಕೆ ಅವಕಾಶ ನೀಡುತ್ತವೆ. ಉಪಗುಂಪುಗಳು ಮುಖ್ಯವಾದಾಗ ಸ್ತರೀಕರಿಸಿ — ಉದಾ: ಪ್ರದೇಶ (ಕಲ್ಯಾಣ ಕರ್ನಾಟಕ ಮತ್ತು ಇತರೆ), ಬೋಧನಾ ಮಾಧ್ಯಮ ಅಥವಾ ಗ್ರಾಮೀಣ/ನಗರ. ಗುಚ್ಛ ಮಾದರಿ (ಕ್ಲಸ್ಟರ್‌ಗಳನ್ನು ಆರಿಸಿ ನಂತರ ಅವುಗಳೊಳಗಿನ ಶಾಲೆಗಳು) ಸಿಆರ್‌ಸಿ ಆಧಾರಿತ ಕ್ಷೇತ್ರಕಾರ್ಯಕ್ಕೆ ಸೂಕ್ತ.","ಮಾದರಿ ಗಾತ್ರ ವಿಶ್ವಾಸ ಮಟ್ಟ, ನೀವು ಒಪ್ಪಬಹುದಾದ ದೋಷದ ಅಂಚು ಮತ್ತು ಜನಸಂಖ್ಯೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಅವಲಂಬಿಸಿದೆ. ಮಾದರಿ ಗಾತ್ರ ಗಣಕವನ್ನು ಬಳಸಿ."]},{title:"ಸಾಧನಗಳು ಮತ್ತು ವಿಶ್ಲೇಷಣೆ",body:["ವಿಶ್ವಸನೀಯತೆ ಎಂದರೆ ಸ್ಥಿರತೆ (ಪರೀಕ್ಷೆ–ಮರುಪರೀಕ್ಷೆ; ಬಹುತೇಕ ಮಾಪಕಗಳಿಗೆ ಕ್ರಾನ್‌ಬ್ಯಾಕ್ ಆಲ್ಫಾ ≥ 0.70). ಸಿಂಧುತ್ವ ಎಂದರೆ ಸಾಧನವು ಹೇಳಿಕೊಂಡದ್ದನ್ನೇ ಅಳೆಯುತ್ತದೆಯೇ (ತಜ್ಞರ ಪರಿಶೀಲನೆಯ ಮೂಲಕ ವಿಷಯ ಸಿಂಧುತ್ವ; ಫಲಿತಾಂಶಗಳ ಮಾದರಿಯ ಮೂಲಕ ರಚನಾ ಸಿಂಧುತ್ವ). ಯಾವಾಗಲೂ ಪ್ರಾಯೋಗಿಕ ಪರೀಕ್ಷೆ (pilot) ಮಾಡಿ.","ಪರೀಕ್ಷೆ ಆಯ್ಕೆ: ಎರಡು ಗುಂಪುಗಳ ಸರಾಸರಿ ಹೋಲಿಕೆ → t-ಪರೀಕ್ಷೆ; ಅದೇ ಗುಂಪು ಮೊದಲು ಮತ್ತು ನಂತರ → ಜೋಡಿ t-ಪರೀಕ್ಷೆ; ಮೂರು ಅಥವಾ ಹೆಚ್ಚು ಗುಂಪುಗಳು → ANOVA; ಎರಡು ವರ್ಗೀಯ ಚರಾಂಶಗಳು → ಕೈ-ವರ್ಗ; ಎರಡು ಅಂಕಗಳ ನಡುವಿನ ಸಂಬಂಧ → ಸಹಸಂಬಂಧ."]}],karnataka:[{title:"ಅರೆ-ಪ್ರಯೋಗ: ಯಾದಗಿರಿಯಲ್ಲಿ ಸೇತುಬಂಧ",text:["ಉದಾಹರಣಾ ವಿನ್ಯಾಸ: ಯಾದಗಿರಿ ಜಿಲ್ಲೆಯ 20 ಸರ್ಕಾರಿ ಕಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆಗಳು ದಿನಕ್ಕೆ 20 ನಿಮಿಷಗಳ ಹೆಚ್ಚುವರಿ ಓದಿನ ಅವಧಿಯೊಂದಿಗೆ ಸೇತುಬಂಧ ನಡೆಸುತ್ತವೆ (ಚಿಕಿತ್ಸಾ ಗುಂಪು); 20 ಹೊಂದಾಣಿಕೆಯ ಶಾಲೆಗಳು ಸೇತುಬಂಧ ಮಾತ್ರ ನಡೆಸುತ್ತವೆ (ಹೋಲಿಕೆ ಗುಂಪು). 4ನೇ ತರಗತಿ ಮಕ್ಕಳು ಜೂನ್ ಮತ್ತು ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ಕನ್ನಡ ಓದಿನ ಪರೀಕ್ಷೆ ತೆಗೆದುಕೊಳ್ಳುತ್ತಾರೆ. ಗಳಿಕೆ ಅಂಕಗಳನ್ನು ಸ್ವತಂತ್ರ ಮಾದರಿ t-ಪರೀಕ್ಷೆಯಿಂದ ವಿಶ್ಲೇಷಿಸಿ, ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು (Cohen's d) ವರದಿ ಮಾಡಿ."]},{title:"ಪ್ರೌಢಶಾಲೆಗಳ ಸ್ತರೀಕೃತ ಮಾದರಿ",text:["180 ಸರ್ಕಾರಿ ಪ್ರೌಢಶಾಲೆಗಳಿರುವ ಜಿಲ್ಲೆಯಲ್ಲಿ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯ ಬಳಕೆಯನ್ನು ಸಮೀಕ್ಷಿಸಲು, ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮಗಳ ಆಧಾರದಲ್ಲಿ ಸ್ತರೀಕರಿಸಿ, ಪ್ರತಿ ಸ್ತರದ ಗಾತ್ರಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಯಾದೃಚ್ಛಿಕವಾಗಿ ಆಯ್ಕೆ ಮಾಡಿ."]}],activity:{title:"ಮಾದರಿ ಮತ್ತು ಪರೀಕ್ಷೆಯನ್ನು ಯೋಜಿಸಿ",prompt:"ನಿಮ್ಮ ಆಯ್ಕೆಯ ಜಿಲ್ಲಾ ಸಮೀಕ್ಷೆಗೆ ಮಾದರಿ ಗಾತ್ರವನ್ನು ಲೆಕ್ಕಹಾಕಿ, ನಂತರ ಉದಾಹರಣಾ ಪೂರ್ವ/ಉತ್ತರ ದತ್ತಾಂಶವನ್ನು ಸಾಂಖ್ಯಿಕ ಸಾಧನದಲ್ಲಿ ನಮೂದಿಸಿ ಫಲಿತಾಂಶವನ್ನು ಎರಡು ವಾಕ್ಯಗಳಲ್ಲಿ ವ್ಯಾಖ್ಯಾನಿಸಿ."},quiz:[{q:"ಅದೇ ವಿದ್ಯಾರ್ಥಿಗಳ SSLC ಗಣಿತ ಅಂಕಗಳನ್ನು ಪೂರ್ವ ಮತ್ತು ಉತ್ತರ ಪರೀಕ್ಷೆಗಳಲ್ಲಿ ಹೋಲಿಸುತ್ತೀರಿ. ಬಳಸಬೇಕಾದದ್ದು…",options:["ಕೈ-ವರ್ಗ","ಜೋಡಿ t-ಪರೀಕ್ಷೆ","ಸ್ವತಂತ್ರ t-ಪರೀಕ್ಷೆ","ANOVA"],why:"ಅದೇ ವಿದ್ಯಾರ್ಥಿಗಳನ್ನು ಎರಡು ಬಾರಿ ಅಳೆಯಲಾಗಿದೆ."},{q:"ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮ ಶಾಲೆಗಳ ಸರಾಸರಿ ಅಂಕಗಳ ಹೋಲಿಕೆಗೆ ಬೇಕಾದದ್ದು…",options:["ಜೋಡಿ t-ಪರೀಕ್ಷೆ","ಏಕಮುಖ ANOVA","ಸಹಸಂಬಂಧ","ವಿಷಯ ವಿಶ್ಲೇಷಣೆ"],why:"ಮೂರು ಸ್ವತಂತ್ರ ಗುಂಪುಗಳು."},{q:"ಕ್ರಾನ್‌ಬ್ಯಾಕ್ ಆಲ್ಫಾ ತಿಳಿಸುವುದು…",options:["ಸಿಂಧುತ್ವ","ಆಂತರಿಕ ಸ್ಥಿರತೆಯ ವಿಶ್ವಸನೀಯತೆ","ಮಾದರಿ ಗಾತ್ರ","ಪರಿಣಾಮ ಗಾತ್ರ"],why:"ಆಲ್ಫಾ ಆಂತರಿಕ ಸ್ಥಿರತೆಯನ್ನು ಅಂದಾಜಿಸುತ್ತದೆ."},{q:"ಗ್ರಂಥಾಲಯ ಅವಧಿ ಮತ್ತು ಓದಿನ ಅಂಕಗಳ ನಡುವಿನ ಬಲವಾದ ಸಹಸಂಬಂಧ ಸಾಬೀತುಪಡಿಸುವುದು…",options:["ಗ್ರಂಥಾಲಯಗಳೇ ಉತ್ತಮ ಓದಿಗೆ ಕಾರಣ","ಬೇರೆ ವಿವರಣೆಗಳೂ ಇರಬಹುದಾದ ಒಂದು ಸಂಬಂಧ","ಏನನ್ನೂ ಇಲ್ಲ","ಓದು ಗ್ರಂಥಾಲಯಗಳಿಗೆ ಕಾರಣ"],why:"ಸಹಸಂಬಂಧ ಮಾತ್ರ ಕಾರಣವನ್ನು ಸ್ಥಾಪಿಸುವುದಿಲ್ಲ."}]},m5:{objectives:["ಪ್ರಕರಣ ಅಧ್ಯಯನ, ಜನಾಂಗ ವರ್ಣನೆ, ಅನುಭವ ವಿಜ್ಞಾನ, ನಿರೂಪಣೆ ಮತ್ತು ಆಧಾರಿತ ಸಿದ್ಧಾಂತಗಳಲ್ಲಿ ಆಯ್ಕೆ ಮಾಡುವುದು.","ಅರೆ-ರಚಿತ ಸಂದರ್ಶನಗಳು ಮತ್ತು ಕೇಂದ್ರೀಕೃತ ಗುಂಪು ಚರ್ಚೆಗಳನ್ನು ನಡೆಸುವುದು.","ಪ್ರತಿಲಿಪಿಗಳಿಗೆ ಸಂಕೇತ ನೀಡಿ ವಿಷಯವಸ್ತುಗಳನ್ನು ರೂಪಿಸುವುದು.","ವಿಶ್ವಾಸಾರ್ಹತೆಯನ್ನು ಸ್ಥಾಪಿಸುವುದು."],lessons:[{title:"ಮಾರ್ಗಗಳು",body:["ಪ್ರಕರಣ ಅಧ್ಯಯನ: ಸೀಮಿತ ಪ್ರಕರಣದ ಆಳವಾದ ಅಧ್ಯಯನ (ಒಂದು KPS ಆವರಣ). ಜನಾಂಗ ವರ್ಣನೆ: ಒಂದು ಸಂಸ್ಕೃತಿಯ ದೀರ್ಘಕಾಲದ ವೀಕ್ಷಣೆ (ಆಶ್ರಮ ಶಾಲೆಯ ಜೀವನ). ಅನುಭವ ವಿಜ್ಞಾನ (phenomenology): ಹಂಚಿಕೊಂಡ ಜೀವನಾನುಭವ (ಏಕೋಪಾಧ್ಯಾಯ ಶಾಲೆಗಳ ಮೊದಲ ವರ್ಷದ ಶಿಕ್ಷಕರು). ನಿರೂಪಣೆ: ಜೀವನ ಕಥೆಗಳು (ಮಹಿಳಾ ಮುಖ್ಯ ಶಿಕ್ಷಕರು). ಆಧಾರಿತ ಸಿದ್ಧಾಂತ (grounded theory): ದತ್ತಾಂಶದಿಂದ ಸಿದ್ಧಾಂತ ಕಟ್ಟುವುದು."]},{title:"ದತ್ತಾಂಶ ಸಂಗ್ರಹ",body:["ಅರೆ-ರಚಿತ ಸಂದರ್ಶನಗಳು ಮುಕ್ತ ಪ್ರಶ್ನೆಗಳು ಮತ್ತು ಉಪಪ್ರಶ್ನೆಗಳಿರುವ ಮಾರ್ಗದರ್ಶಿಯನ್ನು ಬಳಸುತ್ತವೆ. 6–8 ಜನರ ಕೇಂದ್ರೀಕೃತ ಗುಂಪುಗಳು ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ಅಥವಾ ಪೋಷಕರಿಗೆ ಸೂಕ್ತ. ವೀಕ್ಷಣೆಯಲ್ಲಿ ವರ್ಣನೆ ಮತ್ತು ವ್ಯಾಖ್ಯಾನವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿಡುವ ಕ್ಷೇತ್ರ ಟಿಪ್ಪಣಿಗಳನ್ನು ಬರೆಯಿರಿ. ಒಪ್ಪಿಗೆಯೊಂದಿಗೆ ಮಾತ್ರ ಧ್ವನಿಮುದ್ರಿಸಿ; ಮೂಲ ಭಾಷೆಯಲ್ಲಿ ಪ್ರತಿಲಿಪಿ ಮಾಡಿ ಎಚ್ಚರಿಕೆಯಿಂದ ಅನುವಾದಿಸಿ."]},{title:"ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ವಿಶ್ವಾಸಾರ್ಹತೆ",body:["ವಿಷಯವಸ್ತು ವಿಶ್ಲೇಷಣೆ: ಪರಿಚಯ ಮಾಡಿಕೊಳ್ಳಿ → ಆರಂಭಿಕ ಸಂಕೇತಗಳನ್ನು ರಚಿಸಿ → ವಿಷಯವಸ್ತುಗಳನ್ನು ಹುಡುಕಿ → ಪರಿಶೀಲಿಸಿ → ವ್ಯಾಖ್ಯಾನಿಸಿ ಹೆಸರಿಸಿ → ಉಲ್ಲೇಖಗಳೊಂದಿಗೆ ಬರೆಯಿರಿ. ವಿಶ್ವಾಸಾರ್ಹತೆ ನಂಬಲರ್ಹತೆ (ಸದಸ್ಯ ಪರಿಶೀಲನೆ, ತ್ರಿಕೋನೀಕರಣ), ವರ್ಗಾವಣೀಯತೆ (ಸಮೃದ್ಧ ವರ್ಣನೆ), ಅವಲಂಬನೀಯತೆ (ಲೆಕ್ಕಪರಿಶೋಧನಾ ಜಾಡು) ಮತ್ತು ದೃಢೀಕರಣೀಯತೆ (ಆತ್ಮಾವಲೋಕನ ಟಿಪ್ಪಣಿಗಳು) ಮೇಲೆ ನಿಂತಿದೆ."]}],karnataka:[{title:"ಪ್ರಕರಣ ಅಧ್ಯಯನ: ಉತ್ತರ ಕನ್ನಡದ ಏಕೋಪಾಧ್ಯಾಯ ಶಾಲೆ",text:["ಗುಡ್ಡಗಾಡು ಪ್ರದೇಶದ ಶಾಲೆಯಲ್ಲಿ ಒಬ್ಬ ಶಿಕ್ಷಕರು ಐದು ತರಗತಿಗಳನ್ನು ಹೇಗೆ ನಿರ್ವಹಿಸುತ್ತಾರೆ? ಒಂದು ವಾರ ಪೂರ್ತಿ ವೀಕ್ಷಿಸಿ, ಶಿಕ್ಷಕರು, ಎಸ್‌ಡಿಎಂಸಿ ಅಧ್ಯಕ್ಷರು ಮತ್ತು ಮೂವರು ಪೋಷಕರನ್ನು ಸಂದರ್ಶಿಸಿ, ಪಾಠ ಯೋಜನೆಗಳನ್ನು ಸಂಗ್ರಹಿಸಿ. ಸಮಯ ಹಂಚಿಕೆ, ಸಹಪಾಠಿ ಬೋಧನೆ ಮತ್ತು 3ನೇ ತರಗತಿಯ ಆಚೆಗೂ ನಲಿ-ಕಲಿ ಸಾಮಗ್ರಿಗಳ ಬಳಕೆಯಂತಹ ವಿಷಯವಸ್ತುಗಳನ್ನು ನಿರೀಕ್ಷಿಸಿ."]},{title:"ದ್ವಿಭಾಷಾ ವಿಭಾಗಗಳ ಬಗ್ಗೆ ಸಂದರ್ಶನಗಳು",text:["ಬೋಧನಾ ಮಾಧ್ಯಮ ಮನೆಮಾತಿಗಿಂತ ಭಿನ್ನವಾದಾಗ ಶೇ. 60ಕ್ಕೂ ಹೆಚ್ಚು ಬುಡಕಟ್ಟು ವಿದ್ಯಾರ್ಥಿಗಳು ಕಷ್ಟಪಟ್ಟರು ಎಂದು ರಾಜ್ಯದ ಟಿಪ್ಪಣಿಗಳು ದಾಖಲಿಸುತ್ತವೆ. ಚಾಮರಾಜನಗರದ ಡಯಟ್ ದ್ವಿಭಾಷಾ KPS ವಿಭಾಗಗಳ ಬಗ್ಗೆ ಸೋಲಿಗ ಪೋಷಕರು ಮತ್ತು ಶಿಕ್ಷಕರನ್ನು ಸಂದರ್ಶಿಸಿ ಮಕ್ಕಳಿಗೆ ನಿಜವಾಗಿ ಯಾವ ಸೇತು ಬೆಂಬಲ ಬೇಕು ಎಂದು ತಿಳಿಯಬಹುದು."]}],activity:{title:"ಸಂದರ್ಶನ ಭಾಗಕ್ಕೆ ಸಂಕೇತ ನೀಡಿ",prompt:"ಸಂಕೇತೀಕರಣ ಸಾಧನದಲ್ಲಿನ ಶಿಕ್ಷಕರ ಸಂದರ್ಶನ ಭಾಗಗಳನ್ನು ಓದಿ, ಸಂಕೇತಗಳನ್ನು ನೀಡಿ, ಅವುಗಳನ್ನು ಎರಡು ಅಥವಾ ಮೂರು ವಿಷಯವಸ್ತುಗಳಾಗಿ ಗುಂಪು ಮಾಡಿ."},quiz:[{q:"ಒಂದು KPS ಆವರಣವನ್ನು ಒಂದು ಅವಧಿಯಲ್ಲಿ ಆಳವಾಗಿ ಅಧ್ಯಯನ ಮಾಡುವುದು…",options:["ಸಮೀಕ್ಷೆ","ಪ್ರಕರಣ ಅಧ್ಯಯನ","ಪ್ರಯೋಗ","ಮೆಟಾ-ವಿಶ್ಲೇಷಣೆ"],why:"ಸೀಮಿತ ಪ್ರಕರಣದ ಆಳವಾದ ಅಧ್ಯಯನ."},{q:"ಸದಸ್ಯ ಪರಿಶೀಲನೆ (member checking) ಎಂದರೆ…",options:["ಹಾಜರಾತಿ ಪರಿಶೀಲನೆ","ನಿಖರತೆ ದೃಢಪಡಿಸಲು ಫಲಿತಾಂಶಗಳನ್ನು ಭಾಗವಹಿಸಿದವರಿಗೆ ಮರಳಿಸುವುದು","ಸಂಕೇತಗಳನ್ನು ಎಣಿಸುವುದು","ಯಾದೃಚ್ಛಿಕ ಮಾದರಿ"],why:"ಭಾಗವಹಿಸಿದವರು ವ್ಯಾಖ್ಯಾನಗಳನ್ನು ದೃಢಪಡಿಸುತ್ತಾರೆ."},{q:"ಕೇಂದ್ರೀಕೃತ ಗುಂಪಿನ ಆದರ್ಶ ಗಾತ್ರ ಸುಮಾರು…",options:["2","6–8","25","50"],why:"ವೈವಿಧ್ಯಕ್ಕೆ ಸಾಕಷ್ಟು ದೊಡ್ಡದು, ಎಲ್ಲರೂ ಮಾತನಾಡುವಷ್ಟು ಚಿಕ್ಕದು."},{q:"ಲೆಕ್ಕಪರಿಶೋಧನಾ ಜಾಡು (audit trail) ಬೆಂಬಲಿಸುವುದು…",options:["ಅವಲಂಬನೀಯತೆ","ಸಾಂಖ್ಯಿಕ ಶಕ್ತಿ","ಯಾದೃಚ್ಛಿಕ ಆಯ್ಕೆ","ಎಲ್ಲ ರಾಜ್ಯಗಳಿಗೆ ಸಾಮಾನ್ಯೀಕರಣ"],why:"ನಿಮ್ಮ ನಿರ್ಧಾರಗಳನ್ನು ಇತರರು ಅನುಸರಿಸಲು ಸಾಧ್ಯವಾಗುತ್ತದೆ."}]},m6:{objectives:["ಸಮಕೇಂದ್ರಿತ, ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ ಮತ್ತು ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ ವಿನ್ಯಾಸಗಳನ್ನು ವಿವರಿಸುವುದು.","ಪರಿಮಾಣಾತ್ಮಕ ಮತ್ತು ಗುಣಾತ್ಮಕ ಎಳೆಗಳು ಸೇರುವ ಹಂತವನ್ನು ಯೋಜಿಸುವುದು.","ಫಲಿತಾಂಶಗಳನ್ನು ಏಕೀಕರಿಸುವ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ ರಚಿಸುವುದು."],lessons:[{title:"ಮೂರು ಮುಖ್ಯ ವಿನ್ಯಾಸಗಳು",body:["ಸಮಕೇಂದ್ರಿತ: ಎರಡೂ ಎಳೆಗಳನ್ನು ಒಂದೇ ಸಮಯದಲ್ಲಿ ಸಂಗ್ರಹಿಸಿ ಹೋಲಿಸಿ. ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಮೊದಲು ಪರಿಮಾಣಾತ್ಮಕ, ನಂತರ ಅನಿರೀಕ್ಷಿತ ಫಲಿತಾಂಶಗಳನ್ನು ವಿವರಿಸಲು ಗುಣಾತ್ಮಕ. ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಸಾಧನ ಅಥವಾ ಊಹೆಗಳನ್ನು ರೂಪಿಸಲು ಮೊದಲು ಗುಣಾತ್ಮಕ, ನಂತರ ಪರೀಕ್ಷಿಸಲು ಪರಿಮಾಣಾತ್ಮಕ."]},{title:"ಏಕೀಕರಣ",body:["ಮಿಶ್ರಣ ಎಲ್ಲಾದರೂ ನಡೆಯಲೇಬೇಕು — ಮಾದರಿ ಆಯ್ಕೆಯಲ್ಲಿ (ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳಿಂದ ಸಂದರ್ಶಿತರನ್ನು ಆರಿಸುವುದು), ವಿಶ್ಲೇಷಣೆಯಲ್ಲಿ (ಅಂಕಿಗಳು ಮತ್ತು ವಿಷಯವಸ್ತುಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ಇಡುವ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ) ಅಥವಾ ವ್ಯಾಖ್ಯಾನದಲ್ಲಿ. ಎರಡು ಪ್ರತ್ಯೇಕ ವರದಿಗಳನ್ನು ಒಟ್ಟಿಗೆ ಹೊಲಿದರೆ ಅದು ಮಿಶ್ರ ವಿಧಾನವಲ್ಲ."]}],karnataka:[{title:"ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ: 6ನೇ ತರಗತಿಯ ಕುಸಿತ",text:['ಹಂತ 1: ಗಣಿತ ಅಂಕಗಳು ತೀವ್ರವಾಗಿ ಕುಸಿಯುವ ಶಾಲೆಗಳನ್ನು ಕಂಡುಹಿಡಿಯಲು ಜಿಲ್ಲೆಯ 5 ಮತ್ತು 6ನೇ ತರಗತಿಗಳ LBA ಅಂಕಗಳನ್ನು ವಿಶ್ಲೇಷಿಸಿ. ಹಂತ 2: ಕಾರಣ ತಿಳಿಯಲು ತೀವ್ರ ಕುಸಿತದ ನಾಲ್ಕು ಮತ್ತು ಕಡಿಮೆ ಕುಸಿತದ ನಾಲ್ಕು ಶಾಲೆಗಳ ಶಿಕ್ಷಕರು ಮತ್ತು ಮಕ್ಕಳನ್ನು ಸಂದರ್ಶಿಸಿ. ಜಂಟಿ ಪ್ರದರ್ಶನದಲ್ಲಿ ಏಕೀಕರಿಸಿ: "ಅಂಕ ಮಾದರಿ | ಶಿಕ್ಷಕರ ವಿವರಣೆ | ಮಕ್ಕಳ ವಿವರಣೆ".']},{title:"ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ: ಎಸ್‌ಡಿಎಂಸಿ ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ ಮಾಪಕ",text:['ಬೀದರ್‌ನ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರೊಂದಿಗಿನ ಕೇಂದ್ರೀಕೃತ ಗುಂಪುಗಳು ಸ್ಥಳೀಯವಾಗಿ "ಸಕ್ರಿಯ ಭಾಗವಹಿಸುವಿಕೆ" ಎಂದರೇನು ಎಂದು ಗುರುತಿಸುತ್ತವೆ; ಆ ವಿಷಯವಸ್ತುಗಳು ಪ್ರಶ್ನಾವಳಿಯ ಅಂಶಗಳಾಗಿ ಜಿಲ್ಲೆಯಾದ್ಯಂತ ಎಸ್‌ಡಿಎಂಸಿಗಳಿಗೆ ನೀಡಲ್ಪಡುತ್ತವೆ.']}],activity:{title:"ನಿಮ್ಮ ವಿನ್ಯಾಸ ಆರಿಸಿ",prompt:"ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನಕ್ಕಾಗಿ ವಿನ್ಯಾಸ ಆಯ್ಕೆ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ ಮತ್ತು ಕನಿಷ್ಠ ಮೂರು ಸಾಲುಗಳ ಜಂಟಿ ಪ್ರದರ್ಶನ ಕೋಷ್ಟಕ ರಚಿಸಿ."},quiz:[{q:"ಅನಿರೀಕ್ಷಿತ ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳನ್ನು ವಿವರಿಸಲು ಸಂದರ್ಶನಗಳನ್ನು ಬಳಸಲಾಗಿದೆ. ವಿನ್ಯಾಸ…",options:["ಸಮಕೇಂದ್ರಿತ","ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಅಂತರ್ಗತ ಪ್ರಾಯೋಗಿಕ"],why:"ಮೊದಲು ಪರಿಮಾಣಾತ್ಮಕ, ನಂತರ ಗುಣಾತ್ಮಕ ವಿವರಿಸುತ್ತದೆ."},{q:"ಜಂಟಿ ಪ್ರದರ್ಶನ (joint display) ಎಂದರೆ…",options:["ಒಂದು ಭಿತ್ತಿಪತ್ರ","ಪರಿಮಾಣಾತ್ಮಕ ಮತ್ತು ಗುಣಾತ್ಮಕ ಫಲಿತಾಂಶಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ಇಡುವ ಕೋಷ್ಟಕ","ಸ್ತಂಭ ನಕ್ಷೆ","ಒಪ್ಪಿಗೆ ಪತ್ರ"],why:"ಇದು ಏಕೀಕರಣವನ್ನು ಕಣ್ಣಿಗೆ ಕಾಣುವಂತೆ ತೋರಿಸುತ್ತದೆ."},{q:"ಕೇಂದ್ರೀಕೃತ ಗುಂಪಿನ ವಿಷಯವಸ್ತುಗಳಿಂದ ಪ್ರಶ್ನಾವಳಿ ರಚಿಸುವುದು…",options:["ಅನ್ವೇಷಣಾತ್ಮಕ ಅನುಕ್ರಮ","ವಿವರಣಾತ್ಮಕ ಅನುಕ್ರಮ","ಸಮಕೇಂದ್ರಿತ","ಮಿಶ್ರ ವಿಧಾನವಲ್ಲ"],why:"ಮೊದಲ ಗುಣಾತ್ಮಕ ಹಂತ ಪರಿಮಾಣಾತ್ಮಕ ಸಾಧನಕ್ಕೆ ಆಧಾರ."},{q:"ಯಾವುದು ನಿಜವಾದ ಮಿಶ್ರಣವಲ್ಲ?",options:["ಜಂಟಿ ಪ್ರದರ್ಶನ","ಸಮೀಕ್ಷಾ ಫಲಿತಾಂಶಗಳಿಂದ ಸಂದರ್ಶಿತರ ಆಯ್ಕೆ","ಒಂದೇ ಹೊದಿಕೆಯಲ್ಲಿ ಸಂಬಂಧವಿಲ್ಲದ ಎರಡು ವರದಿಗಳು","ವಿಷಯವಸ್ತುಗಳನ್ನು ಅಂಕಗಳೊಂದಿಗೆ ಹೋಲಿಸುವುದು"],why:"ಏಕೀಕರಣ ನಡೆಯಲೇಬೇಕು."}]},m7:{objectives:["ತಮ್ಮದೇ ಅಭ್ಯಾಸದ ಮೇಲೆ ಯೋಜನೆ–ಕ್ರಿಯೆ–ವೀಕ್ಷಣೆ–ಚಿಂತನೆ ಚಕ್ರಗಳನ್ನು ನಡೆಸುವುದು.","ತರಗತಿ ಅಥವಾ ತರಬೇತಿ ಸಭಾಂಗಣದಲ್ಲಿ ಸರಳ, ಬಳಸಬಹುದಾದ ಪುರಾವೆ ಸಂಗ್ರಹಿಸುವುದು.","ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯಲ್ಲಿ ಶಿಕ್ಷಕರು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳಿಗೆ ಮಾರ್ಗದರ್ಶನ ನೀಡುವುದು."],lessons:[{title:"ಚಕ್ರ",body:["ಯೋಜನೆ: ನಿಮ್ಮ ಅಭ್ಯಾಸದ ನಿರ್ದಿಷ್ಟ ಸಮಸ್ಯೆ ಮತ್ತು ಪ್ರಯತ್ನಿಸಬೇಕಾದ ಬದಲಾವಣೆಯನ್ನು ಹೆಸರಿಸಿ. ಕ್ರಿಯೆ: ನಿಗದಿತ ಅವಧಿಗೆ ಬದಲಾವಣೆಯನ್ನು ಜಾರಿಗೊಳಿಸಿ. ವೀಕ್ಷಣೆ: ಪುರಾವೆ ಸಂಗ್ರಹಿಸಿ (ಕಲಿಕಾ ಮಾದರಿಗಳು, ಕಿರು ಪರೀಕ್ಷೆಗಳು, ವೀಕ್ಷಣಾ ಟಿಪ್ಪಣಿಗಳು, ಚಿಂತನೆಗಳು). ಚಿಂತನೆ: ಏನು ಬದಲಾಯಿತು, ಯಾರಿಗೆ, ಏಕೆ? ನಂತರ ಮುಂದಿನ ಚಕ್ರವನ್ನು ಯೋಜಿಸಿ.","ಕ್ರಿಯಾ ಸಂಶೋಧನೆ ಸಣ್ಣ, ಸ್ಥಳೀಯ ಮತ್ತು ವ್ಯಾವಹಾರಿಕ. ಅದರ ಫಲಿತಾಂಶಗಳು ಮೊದಲು ನಿಮ್ಮದೇ ಪರಿಸರವನ್ನು ಸುಧಾರಿಸಲು; ಸಾಮಾನ್ಯೀಕರಣ ಅದರ ಗುರಿಯಲ್ಲ."]},{title:"ಶಿಕ್ಷಕರು ನಿರ್ವಹಿಸಬಹುದಾದ ಪುರಾವೆ",body:["ಈಗಾಗಲೇ ಇರುವುದನ್ನು ಬಳಸಿ: ನೋಟ್‌ಪುಸ್ತಕಗಳು, LBA ದಾಖಲೆಗಳು, ಹಾಜರಾತಿ ವಹಿಗಳು. ವಾರದ 5-ಅಂಶದ ಕಿರುಪರೀಕ್ಷೆ ಅಥವಾ ನಿರ್ಗಮನ ಚೀಟಿಯಂತಹ ಒಂದು ಸರಳ ಸಾಧನ ಸೇರಿಸಿ. ದಿನಾಂಕ, ಏನು ಮಾಡಲಾಯಿತು, ಏನಾಯಿತು ಮತ್ತು ಅದರ ಅರ್ಥವೇನು ಎಂದು ಬರೆಯುವ ಚಿಂತನಾ ದಿನಚರಿ ಇಟ್ಟುಕೊಳ್ಳಿ."]}],karnataka:[{title:"ಡಿ.ಇಎಲ್.ಇಡಿ. ಉಪನ್ಯಾಸಕರ ಚಕ್ರ",text:['ಸಮಸ್ಯೆ: ಅಭ್ಯಾಸ ಬೋಧನೆಯ ವೇಳೆ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳು ಸ್ಮರಣೆಯ ಪ್ರಶ್ನೆಗಳನ್ನು ಮಾತ್ರ ಕೇಳುತ್ತಾರೆ. ಕ್ರಿಯೆ: ನಾಲ್ಕು ವಾರಗಳ ಕಾಲ "ಏಕೆ" ಮತ್ತು "ಹಾಗಾದರೆ ಏನು" ಪ್ರಶ್ನೆಗಳನ್ನು ಮಾದರಿಯಾಗಿ ತೋರಿಸಿ, ಪ್ರಶ್ನಾ-ಪ್ರಕಾರದ ಪರಿಶೀಲನಾ ಪಟ್ಟಿಯೊಂದಿಗೆ ಸಹಪಾಠಿ ವೀಕ್ಷಣೆ ಬಳಸಿ. ಪುರಾವೆ: ಮೊದಲು ಮತ್ತು ನಂತರ ಪ್ರತಿ ಪಾಠದಲ್ಲಿನ ಉನ್ನತ ಹಂತದ ಪ್ರಶ್ನೆಗಳ ಎಣಿಕೆ. ಚಿಂತನೆ: ತಮ್ಮ ಪಾಠದ ವಿಡಿಯೋ ನೋಡಿದ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳಲ್ಲಿ ಲಾಭ ಹೆಚ್ಚು — ಮುಂದಿನ ಚಕ್ರದಲ್ಲಿ ವಿಡಿಯೋ ಪರಿಶೀಲನೆ ಸೇರುತ್ತದೆ.']},{title:"ಕಲಿಕಾ ಚೇತರಿಕೆ ತರಗತಿಯಲ್ಲಿ ಒಬ್ಬ ಶಿಕ್ಷಕಿ",text:["ಕೊಪ್ಪಳದ 5ನೇ ತರಗತಿ ಶಿಕ್ಷಕಿಯೊಬ್ಬರು ಮಕ್ಕಳು ಗಣಿತದ ಕಲಿಕಾ ಹಾಳೆ ಚಟುವಟಿಕೆಗಳನ್ನು ಬಿಟ್ಟುಬಿಡುತ್ತಿರುವುದನ್ನು ಗಮನಿಸುತ್ತಾರೆ. ಸೂಚನೆಗಳನ್ನು ಗಟ್ಟಿಯಾಗಿ ಓದಲು ಒಬ್ಬ ಉತ್ತಮ ಮತ್ತು ಒಬ್ಬ ದುರ್ಬಲ ಓದುಗರ ಜೋಡಿ ಕೆಲಸ ಪರಿಚಯಿಸುತ್ತಾರೆ. ಮೂರು ವಾರಗಳಲ್ಲಿ ಪೂರ್ಣಗೊಳಿಸುವಿಕೆ ಹೆಚ್ಚುತ್ತದೆ; ಅವರು ಇದನ್ನು ದಿನಚರಿಯಲ್ಲಿ ದಾಖಲಿಸಿ ಕ್ಲಸ್ಟರ್ ಸಭೆಯಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳುತ್ತಾರೆ."]}],activity:{title:"ನಿಮ್ಮ ಮೊದಲ ಚಕ್ರ ಯೋಜಿಸಿ",prompt:"ಕ್ರಿಯಾ ಸಂಶೋಧನಾ ದಿನಚರಿ ಬಳಸಿ ಒಂದು ಚಕ್ರದ ಪೂರ್ಣ ಯೋಜನೆ ಬರೆಯಿರಿ ಮತ್ತು ಮೊದಲ ಚಿಂತನಾ ನಮೂದನ್ನು ಮಾಡಿ."},quiz:[{q:"ಕ್ರಿಯಾ ಸಂಶೋಧನಾ ಚಕ್ರದ ಸರಿಯಾದ ಕ್ರಮ…",options:["ಕ್ರಿಯೆ–ಯೋಜನೆ–ಚಿಂತನೆ–ವೀಕ್ಷಣೆ","ಯೋಜನೆ–ಕ್ರಿಯೆ–ವೀಕ್ಷಣೆ–ಚಿಂತನೆ","ವೀಕ್ಷಣೆ–ಪ್ರಕಟಣೆ–ಯೋಜನೆ–ಕ್ರಿಯೆ","ಚಿಂತನೆ–ಕ್ರಿಯೆ–ಯೋಜನೆ–ಪ್ರಕಟಣೆ"],why:"ಯೋಜನೆ, ಕ್ರಿಯೆ, ವೀಕ್ಷಣೆ, ಚಿಂತನೆ, ನಂತರ ಪುನರಾವರ್ತನೆ."},{q:"ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯ ಮುಖ್ಯ ಗುರಿ…",options:["ಎಲ್ಲ ಶಾಲೆಗಳಿಗೆ ಸಾಮಾನ್ಯೀಕರಣ","ತಮ್ಮದೇ ಅಭ್ಯಾಸದ ಸುಧಾರಣೆ","ಪ್ರಯೋಗಾಲಯದಲ್ಲಿ ಸಿದ್ಧಾಂತ ಪರೀಕ್ಷೆ","ಶಾಲೆಗಳಿಗೆ ಶ್ರೇಣಿ ನೀಡುವುದು"],why:"ಇದು ಸುಧಾರಣೆಗಾಗಿ ವೃತ್ತಿನಿರತರ ಅನ್ವೇಷಣೆ."},{q:"ಶಿಕ್ಷಕರಿಗೆ ಸೂಕ್ತವಾದ ಕಡಿಮೆ ಹೊರೆಯ ಪುರಾವೆ ಮೂಲ ಯಾವುದು?",options:["ರಾಷ್ಟ್ರೀಯ ಸಮೀಕ್ಷೆ","ನಿರ್ಗಮನ ಚೀಟಿಗಳು","ಎಂಆರ್‌ಐ ಸ್ಕ್ಯಾನ್","ಜನಗಣತಿ ದತ್ತಾಂಶ"],why:"ಸರಳ, ತ್ವರಿತ ಮತ್ತು ಅಭ್ಯಾಸಕ್ಕೆ ಹತ್ತಿರ."},{q:"ಚಿಂತನೆಯ ನಂತರ ಸಂಶೋಧಕರು…",options:["ನಿಲ್ಲಿಸಬೇಕು","ಮುಂದಿನ ಚಕ್ರ ಯೋಜಿಸಬೇಕು","ದತ್ತಾಂಶ ಅಳಿಸಬೇಕು","ವಿಷಯ ಬದಲಿಸಬೇಕು"],why:"ಕ್ರಿಯಾ ಸಂಶೋಧನೆ ಚಕ್ರೀಯ."}]},m8:{objectives:["ರಚಿತ ಮತ್ತು ಅರಚಿತ ತರಗತಿ ವೀಕ್ಷಣೆಯನ್ನು ಬಳಸುವುದು.","ಮಕ್ಕಳ ಕೆಲಸ ಮತ್ತು ಮೌಲ್ಯಮಾಪನ ದತ್ತಾಂಶವನ್ನು ವಿಶ್ಲೇಷಿಸುವುದು.","ಬಹುವರ್ಗ ಮತ್ತು ಏಕವರ್ಗ ತರಗತಿಗಳನ್ನು ನ್ಯಾಯಯುತವಾಗಿ ಅಧ್ಯಯನ ಮಾಡುವುದು."],lessons:[{title:"ವೀಕ್ಷಣೆ",body:["ರಚಿತ ವೀಕ್ಷಣೆ ನಿಗದಿತ ವರ್ಗಗಳಿರುವ ವೇಳಾಪಟ್ಟಿಯನ್ನು ಬಳಸುತ್ತದೆ (ಉದಾ: ಶಿಕ್ಷಕರ ಮಾತು, ಮಕ್ಕಳ ಮಾತು, ಗುಂಪು ಕೆಲಸ, ಮೌನ), ನಿಗದಿತ ಅಂತರಗಳಲ್ಲಿ ದಾಖಲಿಸಲಾಗುತ್ತದೆ. ಅರಚಿತ ವೀಕ್ಷಣೆ ನಿರಂತರ ಟಿಪ್ಪಣಿಗಳನ್ನು ಬಳಸುತ್ತದೆ. ವೀಕ್ಷಕರ ಉಪಸ್ಥಿತಿ ವರ್ತನೆಯನ್ನು ಬದಲಿಸುತ್ತದೆ; ತರಗತಿ ನಿಮಗೆ ಒಗ್ಗಿಕೊಳ್ಳುವಂತೆ ಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾರಿ ಭೇಟಿ ನೀಡಿ."]},{title:"ಮಕ್ಕಳ ಕೆಲಸ ಮತ್ತು ಮೌಲ್ಯಮಾಪನ ದತ್ತಾಂಶ",body:["ನೋಟ್‌ಪುಸ್ತಕಗಳು, ಕಾರ್ಯಹಾಳೆಗಳು, ಚಿತ್ರಗಳು ಮತ್ತು ಕಲಿಕಾ ಕಡತಗಳು ಮಕ್ಕಳು ಹೇಗೆ ಯೋಚಿಸುತ್ತಾರೆ ಎಂದು ತೋರಿಸುತ್ತವೆ. LBA ಮತ್ತು ಸಮಗ್ರ ಪ್ರಗತಿ ಪತ್ರ (HPC) ನಂತಹ ರಚನಾತ್ಮಕ ದಾಖಲೆಗಳು ದೀರ್ಘಾವಧಿಯ ದತ್ತಾಂಶ ನೀಡುತ್ತವೆ. ಅಂಕಗಳನ್ನು ಮಾತ್ರವಲ್ಲ, ದೋಷ ಮಾದರಿಗಳನ್ನು ಹುಡುಕಿ."]}],karnataka:[{title:"ನಲಿ-ಕಲಿ ತರಗತಿಯ ವೀಕ್ಷಣೆ",text:["ನಲಿ-ಕಲಿಯಲ್ಲಿ ಮಕ್ಕಳು ಮೈಲಿಗಲ್ಲಿನ ಆಧಾರದಲ್ಲಿ ಗುಂಪುಗಳಲ್ಲಿ ಕಲಿಕಾ ಕಾರ್ಡ್‌ಗಳನ್ನು ಬಳಸಿ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ ಮತ್ತು ಏಣಿಯ ಮೇಲೆ ತಮ್ಮ ಪ್ರಗತಿಯನ್ನು ಗುರುತಿಸುತ್ತಾರೆ. ವೀಕ್ಷಣಾ ವೇಳಾಪಟ್ಟಿ ಪ್ರತಿ 5 ನಿಮಿಷಕ್ಕೆ ದಾಖಲಿಸಬಹುದು: ಯಾವ ಗುಂಪುಗಳು ಶಿಕ್ಷಕ ಬೆಂಬಲಿತ, ಭಾಗಶಃ ಬೆಂಬಲಿತ ಅಥವಾ ಸ್ವಕಲಿಕೆಯಲ್ಲಿವೆ, ಮತ್ತು ಪ್ರತಿ ಮಗು ಏನು ಮಾಡುತ್ತಿದೆ. ಸ್ವಕಲಿಕಾ ಗುಂಪುಗಳು ನಿಜವಾಗಿ ತೊಡಗಿವೆಯೇ ಎಂಬುದನ್ನು ಇದು ತೋರಿಸುತ್ತದೆ."]},{title:"7ನೇ ತರಗತಿ ಭಿನ್ನರಾಶಿಗಳಲ್ಲಿ ದೋಷ ವಿಶ್ಲೇಷಣೆ",text:["ಹಾಸನದ ಒಬ್ಬ ಡಯಟ್ ಉಪನ್ಯಾಸಕರು ಮತ್ತು ನಾಲ್ವರು ಶಿಕ್ಷಕರು 120 ಭಿನ್ನರಾಶಿ ಕಾರ್ಯಹಾಳೆಗಳನ್ನು ಸಂಗ್ರಹಿಸುತ್ತಾರೆ. ದೋಷಗಳಿಗೆ ಸಂಕೇತ ನೀಡಿದಾಗ ಬಹುತೇಕ ಮಕ್ಕಳು ಅಂಶ ಮತ್ತು ಛೇದಗಳನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ಕೂಡಿಸುತ್ತಾರೆ (1/2 + 1/3 = 2/5) ಎಂದು ತಿಳಿಯುತ್ತದೆ. ಈ ಫಲಿತಾಂಶ ವಿಸ್ತೀರ್ಣ ಮಾದರಿಗಳ ಕುರಿತ ಸಿಆರ್‌ಸಿ ಕಾರ್ಯಾಗಾರಕ್ಕೆ ಆಧಾರವಾಗುತ್ತದೆ."]}],activity:{title:"ಸಮಯಬದ್ಧ ವೀಕ್ಷಣೆ ನಡೆಸಿ",prompt:"20 ನಿಮಿಷಗಳ ಪಾಠದ (ನೇರ ಅಥವಾ ವಿಡಿಯೋ) ವೇಳೆ ವೀಕ್ಷಣಾ ಸಾಧನ ಬಳಸಿ ತರಗತಿ ಮಾತುಕತೆಯ ಮಾದರಿಯನ್ನು ಸಂಕ್ಷೇಪಿಸಿ."},quiz:[{q:"ಪ್ರತಿ 30 ಸೆಕೆಂಡಿಗೆ ಒಂದು ವರ್ಗವನ್ನು ದಾಖಲಿಸುವುದು…",options:["ಅಂತರ ಆಧಾರಿತ ರಚಿತ ವೀಕ್ಷಣೆ","ನಿರೂಪಣಾ ಸಂದರ್ಶನ","ದಾಖಲೆ ವಿಶ್ಲೇಷಣೆ","ಸಮೀಕ್ಷೆ"],why:"ನಿಗದಿತ ಅಂತರದ ವರ್ಗ ಸಂಕೇತೀಕರಣ."},{q:"ದಾಖಲಿಸುವ ಮೊದಲು ತರಗತಿಗೆ ಹಲವು ಬಾರಿ ಏಕೆ ಭೇಟಿ ನೀಡಬೇಕು?",options:["ವೀಕ್ಷಕ ಪರಿಣಾಮ ಕಡಿಮೆ ಮಾಡಲು","ಮಾದರಿ ಗಾತ್ರ ಹೆಚ್ಚಿಸಲು","ಸಂಭಾವನೆಗಾಗಿ","ಅಗತ್ಯವಿಲ್ಲ"],why:"ತರಗತಿ ವೀಕ್ಷಕರಿಗೆ ಒಗ್ಗಿಕೊಳ್ಳುತ್ತದೆ."},{q:"ನೋಟ್‌ಪುಸ್ತಕದ ದೋಷಗಳ ವಿಶ್ಲೇಷಣೆ ಉಪಯುಕ್ತ ಏಕೆಂದರೆ…",options:["ಅದು ಚಿಂತನಾ ಮಾದರಿಗಳನ್ನು ತೋರಿಸುತ್ತದೆ","ಅದು ಬೋಧನೆಗೆ ಬದಲಿ","ಅದು ಶಿಕ್ಷಕರಿಗೆ ಶ್ರೇಣಿ ನೀಡುತ್ತದೆ","ಅದು ಪರೀಕ್ಷೆಗಿಂತ ವೇಗ"],why:"ದೋಷಗಳು ತಪ್ಪುಗ್ರಹಿಕೆಗಳನ್ನು ಬಹಿರಂಗಪಡಿಸುತ್ತವೆ."},{q:"ನಲಿ-ಕಲಿ ತರಗತಿಯಲ್ಲಿ ಸಂಶೋಧಕರು ವೀಕ್ಷಿಸಬೇಕಾದದ್ದು…",options:["ಶಿಕ್ಷಕರನ್ನು ಮಾತ್ರ","ಸ್ವಕಲಿಕಾ ಗುಂಪುಗಳೂ ಸೇರಿ ಎಲ್ಲ ಗುಂಪುಗಳನ್ನು","ಅತ್ಯಂತ ಜಾಣ ಮಗುವನ್ನು ಮಾತ್ರ","ಕಪ್ಪುಹಲಗೆಯನ್ನು ಮಾತ್ರ"],why:"ಬಹುವರ್ಗ ಚಲನಶೀಲತೆ ಎಲ್ಲ ಗುಂಪುಗಳನ್ನು ಒಳಗೊಳ್ಳುತ್ತದೆ."}]},m9:{objectives:["ಪಾಲುದಾರರನ್ನು ಮತ್ತು ಅವರ ಆಸಕ್ತಿಗಳನ್ನು ನಕ್ಷೆ ಮಾಡುವುದು.","ಸಮುದಾಯಗಳನ್ನು ಕೇವಲ ಉತ್ತರದಾತರಾಗಿ ಅಲ್ಲ, ಪಾಲುದಾರರಾಗಿ ತೊಡಗಿಸುವುದು.","ಸಮುದಾಯ ಪರಿಸರದಲ್ಲಿ ನೈತಿಕತೆಯನ್ನು ನಿರ್ವಹಿಸುವುದು."],lessons:[{title:"ತತ್ವಗಳು",body:["ಸಮುದಾಯ ಆಧಾರಿತ ಸಹಭಾಗಿತ್ವ ಸಂಶೋಧನೆ ಸಮುದಾಯದ ಸದಸ್ಯರನ್ನು ಸಹ-ಸಂಶೋಧಕರಾಗಿ ಕಾಣುತ್ತದೆ: ಅವರು ಪ್ರಶ್ನೆಗಳನ್ನು ನಿರ್ಧರಿಸಲು, ದತ್ತಾಂಶ ಸಂಗ್ರಹಿಸಲು ಮತ್ತು ಫಲಿತಾಂಶಗಳನ್ನು ವ್ಯಾಖ್ಯಾನಿಸಲು ನೆರವಾಗುತ್ತಾರೆ. ಇದು ನಂಬಿಕೆ ಬೆಳೆಸುತ್ತದೆ ಮತ್ತು ಫಲಿತಾಂಶಗಳ ಬಳಕೆಯ ಸಾಧ್ಯತೆ ಹೆಚ್ಚಿಸುತ್ತದೆ."]},{title:"ತೊಡಗಿಸಿಕೊಳ್ಳುವಿಕೆ ಮತ್ತು ನೈತಿಕತೆ",body:["ಪರಿಚಿತ ಸ್ಥಳಗಳಲ್ಲಿ, ಕೃಷಿ ಮತ್ತು ಕೆಲಸದ ವೇಳಾಪಟ್ಟಿಗೆ ಹೊಂದುವ ಸಮಯದಲ್ಲಿ ಭೇಟಿಯಾಗಿ. ಸ್ಥಳೀಯ ಭಾಷೆ ಬಳಸಿ. ಅಧ್ಯಯನ ಏನು ನೀಡಬಹುದು ಮತ್ತು ಏನು ನೀಡಲಾರದು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸಿ. ಫಲಿತಾಂಶಗಳನ್ನು ಗ್ರಾಮಸಭೆ ಅಥವಾ ಎಸ್‌ಡಿಎಂಸಿ ಸಭೆಯಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳಿ."]}],karnataka:[{title:"ಸಂಶೋಧನಾ ಪಾಲುದಾರರಾಗಿ ಎಸ್‌ಡಿಎಂಸಿಗಳು",text:["ಶಾಲಾಭಿವೃದ್ಧಿ ಮತ್ತು ಮೇಲುಸ್ತುವಾರಿ ಸಮಿತಿಗಳು (ಎಸ್‌ಡಿಎಂಸಿ) ಪೋಷಕರು ಮತ್ತು ಸ್ಥಳೀಯ ನಾಯಕರನ್ನು ಶಾಲಾ ಆಡಳಿತಕ್ಕೆ ತರುತ್ತವೆ. 8ನೇ ತರಗತಿಯಲ್ಲಿ ಬಾಲಕಿಯರ ಹಾಜರಾತಿ ಏಕೆ ಕುಸಿಯುತ್ತದೆ ಎಂಬುದನ್ನು ಅಧ್ಯಯನ ಮಾಡಲು ತುಮಕೂರಿನ ಡಯಟ್ ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರೊಂದಿಗೆ ಕೆಲಸ ಮಾಡಬಹುದು; ಎಸ್‌ಡಿಎಂಸಿ ಸದಸ್ಯರು ಒಂದು ಕಿರು ಮಾರ್ಗದರ್ಶಿ ಬಳಸಿ ಮನೆ-ಮನೆ ಮಾತುಕತೆ ನಡೆಸುತ್ತಾರೆ."]},{title:"ಶಾಲೆಯಿಂದ ಹೊರಗುಳಿದ ಮಕ್ಕಳು",text:["ಕಲಬುರಗಿಯ ವಲಸೆ ಕಾರ್ಮಿಕರ ತಾಲ್ಲೂಕಿನಲ್ಲಿ, ಋತುಮಾನದ ಕೆಲಸಕ್ಕೆ ಹೊರಡುವ ಕುಟುಂಬಗಳನ್ನು ನಕ್ಷೆ ಮಾಡುವುದರಿಂದ ಚಿಣ್ಣರ ಅಂಗಳ ಸೇತುಬಂಧ ತರಗತಿಗಳು ಮತ್ತು ಋತುಮಾನದ ವಸತಿನಿಲಯಗಳನ್ನು ಯೋಜಿಸಲು ನೆರವಾಗುತ್ತದೆ. ಪಾಲುದಾರರು: ಅಂಗನವಾಡಿ ಕಾರ್ಯಕರ್ತೆಯರು, ಗ್ರಾಮ ಪಂಚಾಯಿತಿ, ಎಸ್‌ಡಿಎಂಸಿಗಳು ಮತ್ತು ಸಿಆರ್‌ಪಿಗಳು."]}],activity:{title:"ನಿಮ್ಮ ಪಾಲುದಾರರ ನಕ್ಷೆ ಮಾಡಿ",prompt:"ಪಾಲುದಾರ ನಕ್ಷೆ ಬಳಸಿ ನಿಮ್ಮ ಯೋಜಿತ ಅಧ್ಯಯನದಿಂದ ಪ್ರಭಾವಿತರಾಗುವ ಎಲ್ಲರನ್ನೂ ಪಟ್ಟಿ ಮಾಡಿ ಮತ್ತು ಪ್ರತಿಯೊಬ್ಬರನ್ನು ಹೇಗೆ ತೊಡಗಿಸಬೇಕು ಎಂದು ನಿರ್ಧರಿಸಿ."},quiz:[{q:"ಸಹಭಾಗಿತ್ವ ಸಂಶೋಧನೆಯಲ್ಲಿ ಸಮುದಾಯ ಸದಸ್ಯರು…",options:["ಕೇವಲ ಉತ್ತರದಾತರು","ಸಹ-ಸಂಶೋಧಕರು","ವಿಶ್ಲೇಷಣೆಯಿಂದ ಹೊರಗು","ಕೇವಲ ಸಂಭಾವನೆ ಪಡೆಯುವ ಗಣತಿದಾರರು"],why:"ಅವರು ನಿರ್ಧಾರಗಳಲ್ಲಿ ಪಾಲು ಪಡೆಯುತ್ತಾರೆ."},{q:"ಹಳ್ಳಿಯಲ್ಲಿ ಫಲಿತಾಂಶಗಳನ್ನು ಮರಳಿಸಲು ಸೂಕ್ತ ಸ್ಥಳ…",options:["ಕೇವಲ ನಿಯತಕಾಲಿಕ","ಎಸ್‌ಡಿಎಂಸಿ ಅಥವಾ ಗ್ರಾಮಸಭೆ","ಖಾಸಗಿ ಇಮೇಲ್","ಎಲ್ಲಿಯೂ ಇಲ್ಲ"],why:"ಫಲಿತಾಂಶಗಳು ಸಮುದಾಯಕ್ಕೆ ಮರಳಬೇಕು."},{q:"ಬಾಲಕಿಯರ ಹಾಜರಾತಿ ಕುರಿತ ಅಧ್ಯಯನದಲ್ಲಿ ಪಾಲುದಾರರು ಯಾರು?",options:["ಪೋಷಕರು","ಎಸ್‌ಡಿಎಂಸಿ","ಅಂಗನವಾಡಿ ಕಾರ್ಯಕರ್ತೆ","ಇವರೆಲ್ಲರೂ"],why:"ಎಲ್ಲರಿಗೂ ಆಸಕ್ತಿ ಮತ್ತು ಪ್ರಭಾವವಿದೆ."},{q:"ಸುಗ್ಗಿಯ ಸಮಯದಲ್ಲಿ ಸಭೆ ನಿಗದಿಪಡಿಸುವುದು…",options:["ಗೌರವಪೂರ್ಣ","ಕೃಷಿಕ ಕುಟುಂಬಗಳನ್ನು ಹೊರಗಿಡುವ ಸಾಧ್ಯತೆ","ಕಡ್ಡಾಯ","ಅಪ್ರಸ್ತುತ"],why:"ಸಮಯ ಯಾರು ಭಾಗವಹಿಸಬಹುದು ಎಂಬುದನ್ನು ನಿರ್ಧರಿಸುತ್ತದೆ."}]},m10:{objectives:["ದೋಷ ಕಡಿಮೆ ಮಾಡುವ ನಮೂನೆಗಳನ್ನು ವಿನ್ಯಾಸಗೊಳಿಸುವುದು.","ಕ್ಷೇತ್ರ ತನಿಖಾಧಿಕಾರಿಗಳಿಗೆ ತರಬೇತಿ ನೀಡಿ ಗುಣಮಟ್ಟದ ಮೇಲುಸ್ತುವಾರಿ ಮಾಡುವುದು.","ದತ್ತಾಂಶವನ್ನು ಶುದ್ಧೀಕರಿಸಿ, ಸಂಕೇತಿಸಿ, ನಿರ್ವಹಿಸುವುದು.","ವರ್ಣನಾತ್ಮಕ ಮತ್ತು ಅನುಮಾನಾತ್ಮಕ ವಿಶ್ಲೇಷಣೆ ನಡೆಸಿ ವ್ಯಾಖ್ಯಾನಿಸುವುದು."],lessons:[{title:"ಕ್ಷೇತ್ರಕಾರ್ಯ ಯೋಜನೆ",body:["ಪ್ರತಿ ಸಾಧನವನ್ನು ಮಾದರಿಯಲ್ಲಿಲ್ಲದ 2–3 ಶಾಲೆಗಳಲ್ಲಿ ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿಸಿ. ತನಿಖಾಧಿಕಾರಿ ಕೈಪಿಡಿ ಬರೆಯಿರಿ. ದತ್ತಾಂಶ ಸಂಗ್ರಹಿಸುವ ಸಿಆರ್‌ಪಿ ಅಥವಾ ಪ್ರಶಿಕ್ಷಣಾರ್ಥಿಗಳಿಗೆ ಅಣಕು ಸಂದರ್ಶನಗಳೊಂದಿಗೆ ತರಬೇತಿ ನೀಡಿ. ಪರೀಕ್ಷೆ ಅಥವಾ ಹಬ್ಬದ ದಿನಗಳಲ್ಲಿ ಶಾಲಾ ಭೇಟಿ ಆಗದಂತೆ ಯೋಜಿಸಿ."]},{title:"ದತ್ತಾಂಶ ನಿರ್ವಹಣೆ",body:["ಸಂಕೇತ ಪುಸ್ತಕ (codebook) ರಚಿಸಿ: ಚರಾಂಶದ ಹೆಸರು, ಶೀರ್ಷಿಕೆ, ಮೌಲ್ಯಗಳು, ಕಾಣೆಯಾದ ದತ್ತಾಂಶದ ಸಂಕೇತಗಳು. ದತ್ತಾಂಶವನ್ನು ಎರಡು ಬಾರಿ ನಮೂದಿಸಿ ಅಥವಾ ಶೇ. 10 ನಮೂನೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ. ದಿನಾಂಕಿತ ಆವೃತ್ತಿಗಳೊಂದಿಗೆ ಕಡತಗಳನ್ನು ಉಳಿಸಿ, ಮುಖ್ಯ ಪ್ರತಿಯನ್ನು ಓದಲು-ಮಾತ್ರ ಇಡಿ ಮತ್ತು ಬ್ಯಾಕಪ್ ಮಾಡಿ."]},{title:"ವಿಶ್ಲೇಷಣೆ ಮತ್ತು ವ್ಯಾಖ್ಯಾನ",body:['ವರ್ಣನಾತ್ಮಕ ಅಂಕಿಅಂಶಗಳಿಂದ ಆರಂಭಿಸಿ: n, ಸರಾಸರಿ, ಮಧ್ಯಾಂಕ, ಪ್ರಮಾಣಿತ ವಿಚಲನೆ, ಆವರ್ತನಗಳು. ನಂತರ ಊಹೆಗಳನ್ನು ಪರೀಕ್ಷಿಸಿ. ಪರೀಕ್ಷೆ, ಅಂಕಿಅಂಶ, ಸ್ವಾತಂತ್ರ್ಯ ಮಟ್ಟ, p-ಮೌಲ್ಯ ಮತ್ತು ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು ವರದಿ ಮಾಡಿ: "t(38) = 2.41, p = .021, d = 0.76". ಸಾಂಖ್ಯಿಕ ಮಹತ್ವ ಪ್ರಾಯೋಗಿಕ ಮಹತ್ವಕ್ಕೆ ಸಮವಲ್ಲ.',"ಗುಣಾತ್ಮಕ ದತ್ತಾಂಶಕ್ಕೆ ಘಟಕ 5ರ ಸಂಕೇತೀಕರಣ ಮತ್ತು ವಿಷಯವಸ್ತು ಹಂತಗಳನ್ನು ಬಳಸಿ. ಬಹುತೇಕ ಡಯಟ್ ಅಧ್ಯಯನಗಳಿಗೆ ಲಿಬ್ರೆಆಫೀಸ್ ಕ್ಯಾಲ್ಕ್‌ನಂತಹ ಸ್ಪ್ರೆಡ್‌ಶೀಟ್ ತಂತ್ರಾಂಶ ಸಾಕು; ಮುಂದುವರಿದ ಕೆಲಸಕ್ಕೆ JASP ಮತ್ತು R ಉಚಿತವಾಗಿ ಲಭ್ಯ."]}],karnataka:[{title:"ಉದಾಹರಣೆ: ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆಯುವಿಕೆಯ ಮೇಲೆ ಕೈ-ವರ್ಗ",text:["ಮಂಡ್ಯ ಜಿಲ್ಲೆಯ 200 ಮಂದಿ 7ನೇ ತರಗತಿ ಮಕ್ಕಳ ಉದಾಹರಣಾ ದತ್ತಾಂಶ: 100 ಬಾಲಕಿಯರಲ್ಲಿ 62 ಮಂದಿ ಕಳೆದ ತಿಂಗಳು ಗ್ರಂಥಾಲಯ ಪುಸ್ತಕ ಪಡೆದರು; 100 ಬಾಲಕರಲ್ಲಿ 45 ಮಂದಿ. ಪುಸ್ತಕ ಪಡೆಯುವಿಕೆ ಲಿಂಗದೊಂದಿಗೆ ಸಂಬಂಧಿಸಿದೆಯೇ? 2×2 ಕೋಷ್ಟಕವನ್ನು (62, 38 / 45, 55) ಕೈ-ವರ್ಗ ಸಾಧನದಲ್ಲಿ ನಮೂದಿಸಿ. ಫಲಿತಾಂಶ (χ² ≈ 5.8, p ≈ .016) ಸಂಬಂಧವನ್ನು ಸೂಚಿಸುತ್ತದೆ; ಕಾರಣ ತಿಳಿಯಲು ಸಂದರ್ಶನಗಳನ್ನು ನಡೆಸಿ."]},{title:"ಉದಾಹರಣೆ: ಮಾಧ್ಯಮಗಳ ನಡುವೆ ANOVA",text:["ಕನ್ನಡ, ಇಂಗ್ಲಿಷ್ ಮತ್ತು ಉರ್ದು ಮಾಧ್ಯಮದ ತಲಾ ಮೂರು ಶಾಲೆಗಳ ಉದಾಹರಣಾ LBA ಗಣಿತ ಅಂಕಗಳು (20ಕ್ಕೆ). ಏಕಮುಖ ANOVA ನಡೆಸಿ; ಮಹತ್ವದ್ದಾಗಿದ್ದರೆ ಯಾವ ಜೋಡಿಗಳು ಭಿನ್ನ ಎಂದು ಪರಿಶೀಲಿಸಿ ಮತ್ತು ಮಾಧ್ಯಮದ ಆಚೆಗಿನ ವಿವರಣೆಗಳನ್ನು (ಶಿಕ್ಷಕರ ಖಾಲಿ ಹುದ್ದೆಗಳು, ದಾಖಲಾತಿ ಗಾತ್ರ) ಹುಡುಕಿ."]}],activity:{title:"ಉದಾಹರಣಾ ದತ್ತಾಂಶ ವಿಶ್ಲೇಷಿಸಿ",prompt:"ಸಾಂಖ್ಯಿಕ ಸಾಧನದಲ್ಲಿ ಕೈ-ವರ್ಗ ಉದಾಹರಣೆ ಮತ್ತು ಒಂದು ANOVA ನಡೆಸಿ. APA ಶೈಲಿಯಲ್ಲಿ ಫಲಿತಾಂಶ ಪರಿಚ್ಛೇದ ಬರೆಯಿರಿ."},quiz:[{q:"ಸಂಕೇತ ಪುಸ್ತಕ ದಾಖಲಿಸುವುದು…",options:["ಪಾಸ್‌ವರ್ಡ್‌ಗಳು","ಚರಾಂಶಗಳ ಹೆಸರು, ಶೀರ್ಷಿಕೆ ಮತ್ತು ಮೌಲ್ಯ ಸಂಕೇತಗಳು","ಶಿಕ್ಷಕರ ವೇತನ","ಕಾಣೆಯಾದ ದತ್ತಾಂಶ ಮಾತ್ರ"],why:"ದತ್ತಾಂಶವನ್ನು ಹೇಗೆ ಸಂಕೇತಿಸಲಾಗಿದೆ ಎಂದು ದಾಖಲಿಸುತ್ತದೆ."},{q:"p = .03 ಎಂದರೆ…",options:["ಪರಿಣಾಮ ದೊಡ್ಡದು","ನಿಜವಾದ ಪರಿಣಾಮ ಇಲ್ಲದಿದ್ದರೆ, ಇಷ್ಟು ತೀವ್ರ ಫಲಿತಾಂಶ ಸುಮಾರು ಶೇ. 3 ಬಾರಿ ಬರುತ್ತದೆ","ಊಹೆ ಶೇ. 97 ಸತ್ಯ","ದತ್ತಾಂಶ ತಪ್ಪು"],why:"p ಶೂನ್ಯ ಊಹೆಯ ಅಡಿಯಲ್ಲಿ ದತ್ತಾಂಶದ ಬಗ್ಗೆ ಹೇಳುತ್ತದೆ."},{q:"ಪರಿಣಾಮ ಗಾತ್ರವನ್ನು ವರದಿ ಮಾಡುವುದು ಏಕೆಂದರೆ…",options:["ಅದು ವ್ಯತ್ಯಾಸದ ಪ್ರಾಯೋಗಿಕ ಗಾತ್ರ ತೋರಿಸುತ್ತದೆ","ನಿಯತಕಾಲಿಕಗಳಿಗೆ ಅಂಕಿ ಬೇಕು","ಅದು ಸರಾಸರಿಗೆ ಬದಲಿ","ಅದೇ p-ಮೌಲ್ಯ"],why:"ಮಹತ್ವ ≠ ಪ್ರಾಮುಖ್ಯತೆ."},{q:"ಸಾಧನಗಳನ್ನು ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿಸಬೇಕಾದದ್ದು…",options:["ಮಾದರಿ ಶಾಲೆಗಳಲ್ಲಿ","ಮಾದರಿಯ ಹೊರಗಿನ ಆದರೆ ಹೋಲುವ ಶಾಲೆಗಳಲ್ಲಿ","ಡಯಟ್ ಕಚೇರಿಯಲ್ಲಿ","ಯಾವ ಶಾಲೆಯಲ್ಲೂ ಇಲ್ಲ"],why:"ಮಾದರಿ ಕಲುಷಿತವಾಗದಂತೆ."}]},m11:{objectives:["ಪ್ರಮಾಣಿತ ರಚನೆಯೊಂದಿಗೆ ಸಂಶೋಧನಾ ವರದಿ ಬರೆಯುವುದು.","APA ಶೈಲಿಯಲ್ಲಿ ಮೂಲಗಳನ್ನು ಉಲ್ಲೇಖಿಸುವುದು.","ಶಿಕ್ಷಕರು, ಅಧಿಕಾರಿಗಳು ಮತ್ತು ಸಮುದಾಯಗಳಿಗೆ ಫಲಿತಾಂಶಗಳನ್ನು ಪ್ರಸ್ತುತಪಡಿಸುವುದು.","ನೀತಿ ಸಂಕ್ಷೇಪ ಮತ್ತು ಭಿತ್ತಿಪತ್ರ ಸಿದ್ಧಪಡಿಸುವುದು."],lessons:[{title:"ವರದಿಯ ರಚನೆ",body:["ಶೀರ್ಷಿಕೆ, ಸಾರಾಂಶ (150–250 ಪದಗಳು), ಪೀಠಿಕೆ ಮತ್ತು ಸಮಸ್ಯೆ, ಸಂಬಂಧಿತ ಸಾಹಿತ್ಯ ಅವಲೋಕನ, ಉದ್ದೇಶಗಳು ಮತ್ತು ಪ್ರಶ್ನೆಗಳು, ವಿಧಾನ (ವಿನ್ಯಾಸ, ಮಾದರಿ, ಸಾಧನಗಳು, ಕಾರ್ಯವಿಧಾನ, ನೈತಿಕತೆ), ಫಲಿತಾಂಶಗಳು, ಚರ್ಚೆ, ಶಿಫಾರಸುಗಳು, ಮಿತಿಗಳು, ಉಲ್ಲೇಖಗಳು, ಅನುಬಂಧಗಳು (ಸಾಧನಗಳು, ಒಪ್ಪಿಗೆ ಪತ್ರಗಳು)."]},{title:"ವಿವಿಧ ಓದುಗರಿಗಾಗಿ ಬರವಣಿಗೆ",body:["ಅಧಿಕಾರಿಗಳಿಗೆ ಎರಡು ಪುಟಗಳ ನೀತಿ ಸಂಕ್ಷೇಪ ಬೇಕು: ಸಮಸ್ಯೆ, ಮೂರು ಮುಖ್ಯ ಫಲಿತಾಂಶಗಳು, ಮೂರು ಕ್ರಮಗಳು ಮತ್ತು ವೆಚ್ಚ ಅಥವಾ ಕಾರ್ಯಸಾಧ್ಯತೆ. ಶಿಕ್ಷಕರಿಗೆ ವ್ಯಾವಹಾರಿಕ ತರಗತಿ ಸೂಚನೆಗಳು ಬೇಕು. ಸಮುದಾಯಗಳಿಗೆ ಚಿತ್ರಗಳೊಂದಿಗೆ ಕನ್ನಡದಲ್ಲಿ ಕಿರು ಮಾತು ಬೇಕು. ವಿದ್ವಾಂಸರಿಗೆ ಪೂರ್ಣ ವರದಿ ಅಥವಾ ನಿಯತಕಾಲಿಕ ಲೇಖನ ಬೇಕು."]},{title:"ಉಲ್ಲೇಖ ಮತ್ತು ಪ್ರಕಟಣೆ",body:["APA 7ನೇ ಆವೃತ್ತಿ ಬಳಸಿ: ಲೇಖಕ, ಅ. ಅ. (ವರ್ಷ). ಶೀರ್ಷಿಕೆ. ಪ್ರಕಾಶಕ. ನಿಯತಕಾಲಿಕಗಳನ್ನು UGC-CARE ಪಟ್ಟಿಯೊಂದಿಗೆ ಪರಿಶೀಲಿಸಿ; ನಿಜವಾದ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆಯಿಲ್ಲದೆ ಶುಲ್ಕ ವಿಧಿಸುವ ಶೋಷಕ ನಿಯತಕಾಲಿಕಗಳನ್ನು ತಪ್ಪಿಸಿ. ಡಿಎಸ್‌ಇಆರ್‌ಟಿ ಸಂಶೋಧನಾ ಸಮ್ಮೇಳನಗಳು ಮತ್ತು ಜಿಲ್ಲಾ ಪ್ರಗತಿ ಪರಿಶೀಲನಾ ಸಭೆಗಳಲ್ಲಿ ಹಂಚಿಕೊಳ್ಳಿ."]}],karnataka:[{title:"ವರದಿಯಿಂದ ನಿರ್ಧಾರದವರೆಗೆ",text:["ಕೆಲವೇ ಪ್ರೌಢಶಾಲೆಗಳು ತಮ್ಮ ವಿಜ್ಞಾನ ಪ್ರಯೋಗಾಲಯವನ್ನು ವಾರಕ್ಕೊಮ್ಮೆ ಬಳಸುತ್ತವೆ ಎಂದು ಡಯಟ್ ಅಧ್ಯಯನ ಕಂಡುಕೊಳ್ಳುತ್ತದೆ (ಉದಾಹರಣೆ). ಉಪನಿರ್ದೇಶಕರು (ಆಡಳಿತ) ಮತ್ತು ಡಯಟ್ ಪ್ರಾಂಶುಪಾಲರಿಗೆ ಉತ್ತಮ ನೀತಿ ಸಂಕ್ಷೇಪ ಹೀಗೆ ಶಿಫಾರಸು ಮಾಡುತ್ತದೆ: ವೇಳಾಪಟ್ಟಿಯಲ್ಲಿ ವಾರದ ಪ್ರಯೋಗಾಲಯ ಅವಧಿ, ಕಡಿಮೆ ವೆಚ್ಚದ ಪ್ರಯೋಗಗಳ ಕುರಿತು ಸಿಆರ್‌ಸಿ ಕಿರು ತರಬೇತಿ, ಮತ್ತು ಮುಂದಿನ ಶೈಕ್ಷಣಿಕ ವರ್ಷದಲ್ಲಿ ಅನುಸರಣಾ ಪರಿಶೀಲನೆ."]}],activity:{title:"ನಿಮ್ಮ ಪ್ರಸ್ತಾವನೆ ರಚಿಸಿ",prompt:"ಪ್ರಸ್ತಾವನಾ ರಚನಾ ಸಾಧನ ಬಳಸಿ ಸಂಪೂರ್ಣ ಸಂಶೋಧನಾ ಪ್ರಸ್ತಾವನೆಯ ಕರಡು ಸಿದ್ಧಪಡಿಸಿ. ರಫ್ತು ಮಾಡಿ ಸಂಪನ್ಮೂಲ ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳಿ."},quiz:[{q:"ಅಧಿಕಾರಿಗಳಿಗಾಗಿ ನೀತಿ ಸಂಕ್ಷೇಪ ಹೀಗಿರಬೇಕು…",options:["100 ಪುಟಗಳು","ಸ್ಪಷ್ಟ ಕ್ರಮಗಳಿರುವ ಸುಮಾರು ಎರಡು ಪುಟಗಳು","ಕೋಷ್ಟಕಗಳು ಮಾತ್ರ","ಶೈಕ್ಷಣಿಕ ಪರಿಭಾಷೆಯಲ್ಲಿ"],why:"ಕಾರ್ಯನಿರತ ನಿರ್ಧಾರಕರಿಗೆ ಸಂಕ್ಷಿಪ್ತತೆ ಮತ್ತು ಕ್ರಮ ಬೇಕು."},{q:"ನೈತಿಕ ಕಾರ್ಯವಿಧಾನವನ್ನು ಎಲ್ಲಿ ವಿವರಿಸಬೇಕು?",options:["ಸಾರಾಂಶದಲ್ಲಿ ಮಾತ್ರ","ವಿಧಾನ ವಿಭಾಗದಲ್ಲಿ","ಉಲ್ಲೇಖಗಳಲ್ಲಿ","ಎಲ್ಲಿಯೂ ಇಲ್ಲ"],why:"ನೈತಿಕತೆ ವಿಧಾನದ ಭಾಗ."},{q:"ಶೋಷಕ ನಿಯತಕಾಲಿಕಗಳು ಎಂದರೆ…",options:["ನಿಜವಾದ ಪರಿಶೀಲನೆಯ ನಂತರ ಬೇಗ ಪ್ರಕಟಿಸುವವು","ನಿಜವಾದ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆಯಿಲ್ಲದೆ ಶುಲ್ಕ ವಿಧಿಸುವವು","ಕನ್ನಡದಲ್ಲಿರುವವು","UGC-CARE ಪಟ್ಟಿಯಲ್ಲಿರುವವು"],why:"ಅವುಗಳಲ್ಲಿ ನಿಜವಾದ ಪರಿಶೀಲನೆ ಇಲ್ಲ."},{q:"APA ಉಲ್ಲೇಖದ ಕ್ರಮ…",options:["ಶೀರ್ಷಿಕೆ, ವರ್ಷ, ಲೇಖಕ","ಲೇಖಕ, ವರ್ಷ, ಶೀರ್ಷಿಕೆ, ಮೂಲ","ವರ್ಷ, ಪ್ರಕಾಶಕ, ಲೇಖಕ","ಯಾವುದೇ ಕ್ರಮ"],why:"ಲೇಖಕ–ದಿನಾಂಕ ಪದ್ಧತಿ."}]},m12:{objectives:["ಪ್ರತಿ ಹಂತದಲ್ಲಿ ಗುಣಮಟ್ಟದ ಮಾನದಂಡಗಳ ಆಧಾರದಲ್ಲಿ ಅಧ್ಯಯನವನ್ನು ಪರಿಶೀಲಿಸುವುದು.","ರಚನಾತ್ಮಕ ಸಹವರ್ತಿ ಪರಿಶೀಲನೆ ನಡೆಸುವುದು ಮತ್ತು ಸ್ವೀಕರಿಸುವುದು.","ಜಿಲ್ಲಾ ಅಧ್ಯಯನಗಳಲ್ಲಿ ಸಿಂಧುತ್ವಕ್ಕೆ ಸಾಮಾನ್ಯ ಅಪಾಯಗಳನ್ನು ಗುರುತಿಸುವುದು."],lessons:[{title:"ಚಕ್ರದುದ್ದಕ್ಕೂ ಗುಣಮಟ್ಟ",body:["ಪ್ರಶ್ನೆ: ಸ್ಪಷ್ಟ, ಕೇಂದ್ರೀಕೃತ, ಸಮರ್ಥಿತ. ವಿನ್ಯಾಸ: ಪ್ರಶ್ನೆಗೆ ಹೊಂದುತ್ತದೆ. ಮಾದರಿ: ಸಾಕಷ್ಟು ಮತ್ತು ಚೆನ್ನಾಗಿ ವಿವರಿಸಲಾಗಿದೆ. ಸಾಧನಗಳು: ಪ್ರಾಯೋಗಿಕವಾಗಿ ಪರೀಕ್ಷಿತ, ವಿಶ್ವಸನೀಯ, ಸಿಂಧು. ವಿಶ್ಲೇಷಣೆ: ಸೂಕ್ತ ಪರೀಕ್ಷೆಗಳು, ಪರಿಣಾಮ ಗಾತ್ರಗಳು, ಮಹತ್ವವಿಲ್ಲದ ಫಲಿತಾಂಶಗಳ ಪ್ರಾಮಾಣಿಕ ವರದಿ. ತೀರ್ಮಾನಗಳು: ಪುರಾವೆಯಿಂದ ಹೊರಹೊಮ್ಮುತ್ತವೆ; ಮಿತಿಗಳನ್ನು ಹೇಳಲಾಗಿದೆ."]},{title:"ಸಿಂಧುತ್ವಕ್ಕೆ ಅಪಾಯಗಳು",body:['ಆಯ್ಕೆ ಪಕ್ಷಪಾತ ("ಉತ್ತಮ" ಶಾಲೆಗಳನ್ನು ಮಾತ್ರ ಆರಿಸುವುದು), ಇತಿಹಾಸ (ಅದೇ ಸಮಯದಲ್ಲಿ ಬೇರೆ ಕಾರ್ಯಕ್ರಮ ಆರಂಭವಾದುದು), ಪಕ್ವತೆ (ಮಕ್ಕಳು ಹೇಗಿದ್ದರೂ ಬೆಳೆಯುತ್ತಾರೆ), ಪರೀಕ್ಷಾ ಪರಿಣಾಮ (ಅದೇ ಪರೀ
